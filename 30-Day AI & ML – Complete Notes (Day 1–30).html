<title>30-Day AI & Machine Learning – Complete Notes (Day 1 to Day 30)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f5fb;--card:#ffffff;--text:#1b1d2b;--mut:#585c70;--acc:#5b3df5;--acc2:#0b7f9f;--bd:rgba(60,50,140,.22);--good:#0a8a5a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a1e;--card:#171433;--text:#eef0ff;--mut:#aeb1d6;--acc:#a78bfa;--acc2:#5ad1ff;--bd:rgba(167,139,250,.32);--good:#4ade80}}
:root[data-theme="dark"]{--bg:#0c0a1e;--card:#171433;--text:#eef0ff;--mut:#aeb1d6;--acc:#a78bfa;--acc2:#5ad1ff;--bd:rgba(167,139,250,.32);--good:#4ade80}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.top{flex:none;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center}
.top h1{font-size:.95rem;margin:0 8px 0 0;white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px;scrollbar-width:thin}
.c,.nb{border:1px solid var(--bd);background:transparent;color:var(--text);border-radius:999px;padding:5px 12px;font:600 .82rem system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.c.on{background:var(--acc);color:#fff;border-color:transparent}
.c.done:not(.on)::after{content:" ✓";color:var(--good)}
.nb{padding:5px 10px}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
#stage{flex:1;min-height:0;position:relative}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#stage iframe.on{display:block}
#home{position:absolute;inset:0;overflow:auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom,0px));display:none}
#home.on{display:block}
.in{max-width:980px;margin:0 auto}
h2{font-size:1.5rem;margin:.2em 0 .3em}h3{margin:1.2em 0 .4em}
.lead{color:var(--mut)}
.pg{height:14px;border-radius:99px;background:var(--bd);overflow:hidden;margin:8px 0 4px}
.pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:14px 0}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;cursor:pointer;text-align:left;color:var(--text);font:inherit}
.tile b{display:block;color:var(--acc)}.tile span{font-size:.85rem;color:var(--mut)}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0;align-items:start}
.row.d{opacity:.7}
.row .t{font-weight:700}.row small{display:block;color:var(--mut);margin-top:2px}
.row input{width:20px;height:20px;accent-color:var(--acc);margin-top:3px}
.go{border:1px solid var(--bd);background:var(--acc);color:#fff;border-radius:10px;padding:6px 10px;font:600 .8rem system-ui;cursor:pointer;align-self:center}
table{width:100%;border-collapse:collapse;background:var(--card);font-size:.92rem}
td,th{border:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top}
th{background:var(--bd)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:12px 0}
.box li{margin:3px 0}
@media (max-width:640px){.top h1{display:none}.row{grid-template-columns:auto 1fr}.go{grid-column:2;justify-self:start}}
</style>
</head>

 pip · virtual environments", "Read a CSV · find rows/columns · average · maximum/minimum"], [6, "NumPy", "Arrays & dimensions · shape · indexing/slicing · reshape/flatten · vectors & matrices · dot product · matrix multiplication · transpose", "Perform 10–15 NumPy matrix/vector operations"], [7, "Pandas + Mini Project", "Series · DataFrame · read_csv() · head() · info() · describe() · filtering · sorting · GroupBy", "Student Performance Analysis: CSV → clean → analyze → statistics → graphs"], [8, "Statistics Basics", "Mean · median · mode · range · variance · standard deviation · percentile · quartile · IQR", "Manually calculate statistics for a small dataset"], [9, "Probability + Bayes", "Probability · sample space · events · independent/dependent events · conditional probability · Bayes theorem", "Solve 5 probability questions manually"], [10, "Distributions", "Random variable · PMF · PDF · CDF · Bernoulli · Binomial · Normal distribution · mean & variance", "Understand and visualize common distributions"], [11, "Linear Algebra I", "Scalar · vector · matrix · tensor · vector addition · scalar multiplication · dot product · matrix addition/multiplication · transpose", "Implement operations with NumPy"], [12, "Linear Algebra II", "Identity matrix · inverse · determinant · rank · eigenvalues · eigenvectors", "Understand why datasets, weights and predictions use matrices"], [13, "Calculus for ML", "Function · limit · derivative · partial derivative · gradient · gradient descent", "Understand loss → gradient → direction → weight update"], [14, "Linear Regression from Scratch", "Linear regression · cost function · MSE · gradient descent · parameter updates", "Build linear regression using NumPy without sklearn"], [15, "What is Machine Learning?", "AI vs ML vs Deep Learning vs Generative AI · dataset · feature · label · training · validation · testing · model · prediction", "Explain the complete ML learning process"], [16, "Types of ML", "Supervised (regression, classification) · unsupervised (clustering, dimensionality reduction) · reinforcement learning · data leakage", "Create a diagram/examples for each ML type"], [17, "Linear Regression", "Simple & multiple regression · MSE · gradient descent · training & prediction", "Implement from scratch and with sklearn; compare results"], [18, "Logistic Regression", "Classification · probability · sigmoid · decision boundary · log loss · binary & multiclass", "Build a classification model with sklearn"], [19, "KNN + Naive Bayes", "KNN distance · choosing K · classification/regression · Bayes theorem · prior · likelihood · posterior", "Implement KNN and Naive Bayes with sklearn"], [20, "Decision Trees", "Nodes · root · leaf · splitting · entropy · information gain · Gini index", "Train and visualize a Decision Tree"], [21, "Ensemble Learning", "Bagging · boosting · Random Forest · AdaBoost · Gradient Boosting · intro to XGBoost, LightGBM, CatBoost", "Compare Random Forest and boosting models"], [22, "Data Preprocessing", "Missing values · duplicates · outliers · encoding · scaling · normalization · standardization · StandardScaler · MinMaxScaler · OneHotEncoder · LabelEncoder", "Create a preprocessing pipeline"], [23, "Feature Engineering", "Feature selection · feature extraction · numerical/categorical features · interaction & polynomial features · correlation · covariance · multicollinearity", "Engineer useful features for a real dataset"], [24, "Model Evaluation", "Confusion matrix · TP/TN/FP/FN · accuracy · precision · recall · F1 · ROC · AUC · PR curve · MAE · MSE · RMSE · R²", "Choose appropriate metrics for different problems"], [25, "Train/Val/Test + Bias/Variance", "Train, validation, test sets · K-Fold · Stratified K-Fold · overfitting · underfitting · bias · variance · tradeoff", "Run cross-validation and diagnose overfitting"], [26, "Hyperparameter Tuning", "Parameters vs hyperparameters · GridSearchCV · RandomizedSearchCV · Bayesian optimization · Optuna introduction", "Tune Random Forest and/or XGBoost"], [27, "Unsupervised Learning", "K-Means · centroids · distance · clusters · iterations · elbow method · silhouette score · hierarchical clustering · DBSCAN", "Cluster a real dataset and interpret clusters"], [28, "PCA + Dimensionality Reduction", "Dimensionality · curse of dimensionality · PCA · variance · principal components · eigenvectors/eigenvalues", "Implement PCA with NumPy and sklearn"], [29, "Complete ML Project", "Problem definition · EDA · cleaning · feature engineering · train/test split · scaling · model training · evaluation · comparison", "Recommended: Intrusion Detection with Logistic Regression, Decision Tree, Random Forest, XGBoost"], [30, "Final Integration + Revision", "Concept revision · end-to-end ML workflow · model learning · loss & gradient descent · overfitting · evaluation · model selection", "Build one complete ML project independently and explain every step without notes"]],DAYS=["\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Day 1 — Python Basics\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{\n  --bg:#0a0118; --bg2:#140830; --text:#eef0ff; --sub:#b6b8e0; --accent:#9d7bff; --accent2:#5ad1ff;\n  --card:rgba(255,255,255,0.06); --cardBorder:rgba(255,255,255,0.14); --good:#4ade80; --bad:#ff6b6b;\n  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); box-sizing:border-box;\n}\n*{box-sizing:border-box;}\nhtml{scroll-padding-top:70px;}\nbody{margin:0;font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100%;overflow-x:hidden;transition:background .6s,color .4s;}\n#bgcanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;}\n.wrap{position:relative;z-index:1;}\ncode,.mono{font-family:'JetBrains Mono',monospace;}\n\n/* ---- Header ---- */\nheader{position:sticky;top:0;z-index:50;padding:10px 16px calc(10px + env(safe-area-inset-top,0px));\n  backdrop-filter:blur(10px);background:rgba(10,5,25,.55);border-bottom:1px solid var(--cardBorder);\n  display:flex;align-items:center;gap:10px;flex-wrap:wrap;}\n[data-theme=\"light\"] header{background:rgba(255,255,255,.75);}\nheader h1{font-size:15px;margin:0;font-weight:800;flex:1;min-width:140px;}\n.themes{display:flex;gap:6px;flex-wrap:wrap;}\n.themebtn{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;\n  display:flex;align-items:center;justify-content:center;font-size:14px;transition:transform .15s;}\n.themebtn:hover{transform:scale(1.15);}\n.themebtn.active{border-color:#fff;box-shadow:0 0 10px currentColor;}\n\n/* ---- Nav pills ---- */\nnav{position:sticky;top:50px;z-index:40;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;\n  background:rgba(10,5,25,.35);backdrop-filter:blur(6px);}\n[data-theme=\"light\"] nav{background:rgba(255,255,255,.55);}\nnav a{white-space:nowrap;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;color:var(--sub);\n  text-decoration:none;border:1px solid var(--cardBorder);}\nnav a:hover{color:var(--text);border-color:var(--accent);}\n\nmain{max-width:1000px;margin:0 auto;padding:18px 16px 60px;}\nsection{margin-bottom:46px;scroll-margin-top:110px;}\n.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--accent2);\n  background:rgba(255,255,255,.07);padding:4px 10px;border-radius:20px;margin-bottom:8px;text-transform:uppercase;}\nh2{font-size:24px;margin:4px 0 6px;font-weight:800;}\np.lead{color:var(--sub);font-size:14px;margin:0 0 16px;max-width:650px;}\n\n.grid{display:grid;gap:14px;}\n.g2{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));}\n.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}\n\n.card{background:var(--card);border:1px solid var(--cardBorder);border-radius:16px;padding:16px;\n  backdrop-filter:blur(8px);}\n.card h3{margin:0 0 8px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;}\n.card p{font-size:13px;color:var(--sub);margin:4px 0;line-height:1.5;}\n.codebox{background:rgba(0,0,0,.35);border:1px solid var(--cardBorder);border-radius:10px;padding:10px 12px;\n  font-size:13px;margin:8px 0;color:var(--accent2);white-space:pre-wrap;}\n[data-theme=\"light\"] .codebox{background:#0d1021;color:#8de8ff;}\n\n/* ---- Flow diagram ---- */\n.flow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:14px 0;}\n.flow .step{background:var(--card);border:1px solid var(--cardBorder);border-radius:12px;padding:10px 14px;\n  font-size:12.5px;font-weight:600;text-align:center;min-width:90px;}\n.flow .arrow{color:var(--accent2);font-size:18px;}\n\n/* ---- Variable box animation ---- */\n.varbox-demo{display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:18px 0;}\n.varbox{width:120px;height:70px;border-radius:12px;border:2px solid var(--accent2);display:flex;\n  align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;\n  background:rgba(255,255,255,.05);position:relative;animation:pulse 2.4s infinite;}\n.varlabel{position:absolute;top:-24px;font-size:12px;color:var(--accent2);font-weight:700;}\n@keyframes pulse{0%,100%{box-shadow:0 0 0px var(--accent2);}50%{box-shadow:0 0 18px var(--accent2);}}\n.arrow-right{font-size:22px;color:var(--sub);}\n\n/* ---- data type cards ---- */\n.dtcard{text-align:center;}\n.dtcard .icon{font-size:30px;}\n.dtcard .val{margin-top:6px;font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--accent2);font-size:15px;}\n\n/* ---- operator table ---- */\ntable{width:100%;border-collapse:collapse;font-size:13px;}\nth,td{padding:8px 10px;border-bottom:1px solid var(--cardBorder);text-align:left;}\nth{color:var(--accent2);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;}\ntd.mono{color:var(--text);}\n\n/* ---- terminal ---- */\n.terminal{background:#0b0b14;border:1px solid var(--cardBorder);border-radius:12px;padding:14px;\n  font-family:'JetBrains Mono',monospace;font-size:13px;color:#8effa1;min-height:70px;}\n.terminal .prompt{color:#8de8ff;}\n.blink{display:inline-block;width:8px;background:#8effa1;animation:blink 1s step-end infinite;}\n@keyframes blink{50%{opacity:0;}}\n\n/* ---- casting arrows ---- */\n.castbox{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;}\n.pill{padding:10px 16px;border-radius:30px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;\n  border:2px solid var(--accent);background:rgba(255,255,255,.05);}\n\n/* ---- practice widgets ---- */\n.widget input, .widget select{width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--cardBorder);\n  background:rgba(255,255,255,.06);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:14px;margin:6px 0;}\n.widget label{font-size:12px;color:var(--sub);}\n.widget .result{margin-top:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.08);\n  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;text-align:center;min-height:20px;}\n.calcbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;}\n.calcbtns button{padding:10px 0;border-radius:8px;border:1px solid var(--cardBorder);background:rgba(255,255,255,.06);\n  color:var(--text);font-size:15px;cursor:pointer;font-family:'JetBrains Mono',monospace;}\n.calcbtns button:hover{background:var(--accent);color:#120822;}\n.calcdisplay{width:100%;text-align:right;font-size:22px;padding:10px;border-radius:8px;background:rgba(0,0,0,.3);\n  font-family:'JetBrains Mono',monospace;margin-bottom:6px;min-height:34px;overflow-x:auto;}\n\n/* ---- revision ---- */\n.revcard{border-left:3px solid var(--accent2);}\n.revcard b{color:var(--accent2);}\n\nfooter{text-align:center;padding:30px 16px 50px;color:var(--sub);font-size:12px;}\n@media(max-width:480px){h2{font-size:20px;}.calcdisplay{font-size:18px;}}\n\u003c/style>\n\u003c/head>\n\u003cbody data-theme=\"galaxy\">\n\u003ccanvas id=\"bgcanvas\">\u003c/canvas>\n\u003cdiv class=\"wrap\">\n\n\u003cheader>\n  \u003ch1>🐍 Day 1 — Python Basics\u003c/h1>\n  \u003cdiv class=\"themes\" id=\"themepicker\">\u003c/div>\n\u003c/header>\n\n\u003cnav>\n  \u003ca href=\"#install\">⚙️ Install\u003c/a>\n  \u003ca href=\"#variables\">📦 Variables\u003c/a>\n  \u003ca href=\"#datatypes\">🔤 Data Types\u003c/a>\n  \u003ca href=\"#operators\">➕ Operators\u003c/a>\n  \u003ca href=\"#io\">⌨️ input/print\u003c/a>\n  \u003ca href=\"#casting\">🔄 Casting\u003c/a>\n  \u003ca href=\"#practice\">🧪 Practice\u003c/a>\n  \u003ca href=\"#revision\">⚡ Revision\u003c/a>\n\u003c/nav>\n\n\u003cmain>\n\n\u003c!-- INSTALL -->\n\u003csection id=\"install\">\n  \u003cspan class=\"badge\">Step 0\u003c/span>\n  \u003ch2>Python Install & Environment\u003c/h2>\n  \u003cp class=\"lead\">Python code kahan likhna aur chalana hai — bas itna samajhna hai.\u003c/p>\n  \u003cdiv class=\"flow\">\n    \u003cdiv class=\"step\">🌐 python.org se\u003cbr>Python download\u003c/div>\n    \u003cdiv class=\"arrow\">→\u003c/div>\n    \u003cdiv class=\"step\">💻 Install karo\u003cbr>(\"Add to PATH\" ✅ tick karo)\u003c/div>\n    \u003cdiv class=\"arrow\">→\u003c/div>\n    \u003cdiv class=\"step\">📝 Editor kholo\u003cbr>(VS Code / IDLE)\u003c/div>\n    \u003cdiv class=\"arrow\">→\u003c/div>\n    \u003cdiv class=\"step\">▶️ file.py banao\u003cbr>Run karo\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"codebox\">$ python file.py\u003cbr>→ output yaha dikhega\u003c/div>\n\u003c/section>\n\n\u003c!-- VARIABLES -->\n\u003csection id=\"variables\">\n  \u003cspan class=\"badge\">Step 1\u003c/span>\n  \u003ch2>Variables\u003c/h2>\n  \u003cp class=\"lead\">Variable = ek \u003cb>naam-wala box\u003c/b> jisme value store hoti hai. Python me type batana nahi padta — khud samajh leta hai.\u003c/p>\n  \u003cdiv class=\"varbox-demo\">\n    \u003cdiv style=\"position:relative;\">\u003cdiv class=\"varlabel\">name\u003c/div>\u003cdiv class=\"varbox\">\"Zoya\"\u003c/div>\u003c/div>\n    \u003cdiv style=\"position:relative;\">\u003cdiv class=\"varlabel\">age\u003c/div>\u003cdiv class=\"varbox\">20\u003c/div>\u003c/div>\n    \u003cdiv style=\"position:relative;\">\u003cdiv class=\"varlabel\">pi\u003c/div>\u003cdiv class=\"varbox\">3.14\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"codebox\">name = \"Zoya\"\u003cbr>age = 20\u003cbr>pi = 3.14\u003c/div>\n  \u003cp class=\"lead\">Rule: naam letter/underscore se shuru ho, spaces na ho, Python keywords (if, for...) use na karo.\u003c/p>\n\u003c/section>\n\n\u003c!-- DATA TYPES -->\n\u003csection id=\"datatypes\">\n  \u003cspan class=\"badge\">Step 2\u003c/span>\n  \u003ch2>Data Types: int, float, str, bool\u003c/h2>\n  \u003cp class=\"lead\">Har value ka ek \"type\" hota hai — Python khud detect karta hai.\u003c/p>\n  \u003cdiv class=\"grid g4\">\n    \u003cdiv class=\"card dtcard\">\u003cdiv class=\"icon\">🔢\u003c/div>\u003ch3>int\u003c/h3>\u003cp>Poore number\u003c/p>\u003cdiv class=\"val\">25, -8, 0\u003c/div>\u003c/div>\n    \u003cdiv class=\"card dtcard\">\u003cdiv class=\"icon\">💧\u003c/div>\u003ch3>float\u003c/h3>\u003cp>Decimal number\u003c/p>\u003cdiv class=\"val\">3.14, -0.5\u003c/div>\u003c/div>\n    \u003cdiv class=\"card dtcard\">\u003cdiv class=\"icon\">🔤\u003c/div>\u003ch3>str\u003c/h3>\u003cp>Text (quotes me)\u003c/p>\u003cdiv class=\"val\">\"hello\"\u003c/div>\u003c/div>\n    \u003cdiv class=\"card dtcard\">\u003cdiv class=\"icon\">✅\u003c/div>\u003ch3>bool\u003c/h3>\u003cp>True / False\u003c/p>\u003cdiv class=\"val\">True\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"codebox\">type(25)      → &lt;class 'int'&gt;\ntype(3.14)    → &lt;class 'float'&gt;\ntype(\"hi\")    → &lt;class 'str'&gt;\ntype(True)    → &lt;class 'bool'&gt;\u003c/div>\n\u003c/section>\n\n\u003c!-- OPERATORS -->\n\u003csection id=\"operators\">\n  \u003cspan class=\"badge\">Step 3\u003c/span>\n  \u003ch2>Operators\u003c/h2>\n  \u003cp class=\"lead\">Values par calculation/comparison karne ke symbols.\u003c/p>\n  \u003cdiv class=\"card\">\n    \u003ctable>\n      \u003ctr>\u003cth>Type\u003c/th>\u003cth>Symbols\u003c/th>\u003cth>Example\u003c/th>\u003cth>Result\u003c/th>\u003c/tr>\n      \u003ctr>\u003ctd>Arithmetic\u003c/td>\u003ctd class=\"mono\">+ − * / % ** //\u003c/td>\u003ctd class=\"mono\">7 // 2\u003c/td>\u003ctd class=\"mono\">3\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Comparison\u003c/td>\u003ctd class=\"mono\">== != &gt; &lt; &gt;= &lt;=\u003c/td>\u003ctd class=\"mono\">5 &gt; 3\u003c/td>\u003ctd class=\"mono\">True\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Logical\u003c/td>\u003ctd class=\"mono\">and / or / not\u003c/td>\u003ctd class=\"mono\">True and False\u003c/td>\u003ctd class=\"mono\">False\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>Assignment\u003c/td>\u003ctd class=\"mono\">= += -= *=\u003c/td>\u003ctd class=\"mono\">x += 1\u003c/td>\u003ctd class=\"mono\">x = x+1\u003c/td>\u003c/tr>\n    \u003c/table>\n  \u003c/div>\n  \u003cdiv class=\"card\" style=\"margin-top:12px;\">\n    \u003ch3>🔴 Live Try: Arithmetic\u003c/h3>\n    \u003cdiv class=\"widget\">\n      \u003cinput type=\"number\" id=\"opA\" value=\"7\" placeholder=\"A\">\n      \u003cselect id=\"opSym\">\u003coption>+\u003c/option>\u003coption>−\u003c/option>\u003coption>*\u003c/option>\u003coption>/\u003c/option>\u003coption>%\u003c/option>\u003coption>**\u003c/option>\u003coption>//\u003c/option>\u003c/select>\n      \u003cinput type=\"number\" id=\"opB\" value=\"2\" placeholder=\"B\">\n      \u003cdiv class=\"result\" id=\"opResult\">7 + 2 = 9\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- IO -->\n\u003csection id=\"io\">\n  \u003cspan class=\"badge\">Step 4\u003c/span>\n  \u003ch2>input() & print()\u003c/h2>\n  \u003cp class=\"lead\">\u003cb>input()\u003c/b> = user se data lena (hamesha str return karta hai). \u003cb>print()\u003c/b> = screen par dikhana.\u003c/p>\n  \u003cdiv class=\"codebox\">name = input(\"Your name: \")\nprint(\"Hello\", name)\u003c/div>\n  \u003cdiv class=\"card\">\n    \u003ch3>🖥️ Live Terminal\u003c/h3>\n    \u003cdiv class=\"widget\">\n      \u003cinput id=\"ioName\" placeholder=\"Type your name & press Run\">\n      \u003cbutton onclick=\"runIO()\" style=\"margin-top:6px;padding:9px 16px;border-radius:8px;border:none;background:var(--accent);color:#120822;font-weight:700;cursor:pointer;\">▶ Run\u003c/button>\n    \u003c/div>\n    \u003cdiv class=\"terminal\" id=\"ioTerm\" style=\"margin-top:10px;\">\u003cspan class=\"prompt\">&gt;&gt;&gt;\u003c/span> waiting for input...\u003cspan class=\"blink\">&nbsp;\u003c/span>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- CASTING -->\n\u003csection id=\"casting\">\n  \u003cspan class=\"badge\">Step 5\u003c/span>\n  \u003ch2>Type Casting\u003c/h2>\n  \u003cp class=\"lead\">Ek type ko doosre type me convert karna — \u003ccode>int()\u003c/code>, \u003ccode>float()\u003c/code>, \u003ccode>str()\u003c/code>.\u003c/p>\n  \u003cdiv class=\"castbox\">\n    \u003cdiv class=\"pill\">\"25\" (str)\u003c/div>\n    \u003cdiv class=\"arrow-right\">→ int() →\u003c/div>\n    \u003cdiv class=\"pill\">25 (int)\u003c/div>\n  \u003c/div>\n  \u003cdiv class=\"codebox\" style=\"margin-top:12px;\">x = \"25\"\ny = int(x)     # 25  (number)\nz = str(99)    # \"99\" (text)\nf = float(\"3.5\")  # 3.5\u003c/div>\n  \u003cp class=\"lead\">⚠️ input() hamesha str deta hai — math karne se pehle int()/float() me convert karo!\u003c/p>\n\u003c/section>\n\n\u003c!-- PRACTICE -->\n\u003csection id=\"practice\">\n  \u003cspan class=\"badge\">Practice Lab\u003c/span>\n  \u003ch2>5 Mini Programs — Try Live\u003c/h2>\n  \u003cdiv class=\"grid g2\">\n\n    \u003cdiv class=\"card widget\">\n      \u003ch3>🧮 1. Calculator\u003c/h3>\n      \u003cdiv class=\"calcdisplay\" id=\"calcDisp\">0\u003c/div>\n      \u003cdiv class=\"calcbtns\" id=\"calcBtns\">\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card widget\">\n      \u003ch3>🌡️ 2. Celsius → Fahrenheit\u003c/h3>\n      \u003clabel>Celsius\u003c/label>\n      \u003cinput type=\"number\" id=\"cTemp\" value=\"25\" oninput=\"convertTemp()\">\n      \u003cdiv class=\"codebox\" style=\"margin:6px 0;\">F = C * 9/5 + 32\u003c/div>\n      \u003cdiv class=\"result\" id=\"fResult\">77.0 °F\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card widget\">\n      \u003ch3>💰 3. Simple Interest\u003c/h3>\n      \u003clabel>Principal (P)\u003c/label>\u003cinput type=\"number\" id=\"siP\" value=\"1000\" oninput=\"calcSI()\">\n      \u003clabel>Rate % (R)\u003c/label>\u003cinput type=\"number\" id=\"siR\" value=\"5\" oninput=\"calcSI()\">\n      \u003clabel>Time yrs (T)\u003c/label>\u003cinput type=\"number\" id=\"siT\" value=\"2\" oninput=\"calcSI()\">\n      \u003cdiv class=\"codebox\" style=\"margin:6px 0;\">SI = (P × R × T) / 100\u003c/div>\n      \u003cdiv class=\"result\" id=\"siResult\">SI = 100\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card widget\">\n      \u003ch3>⚖️ 4. Even / Odd\u003c/h3>\n      \u003clabel>Enter a number\u003c/label>\n      \u003cinput type=\"number\" id=\"eoNum\" value=\"7\" oninput=\"checkEO()\">\n      \u003cdiv class=\"codebox\" style=\"margin:6px 0;\">n % 2 == 0 → Even, else Odd\u003c/div>\n      \u003cdiv class=\"result\" id=\"eoResult\">7 is Odd\u003c/div>\n    \u003c/div>\n\n    \u003cdiv class=\"card widget\" style=\"grid-column:1/-1;max-width:420px;margin:0 auto;\">\n      \u003ch3>➕➖ 5. Positive / Negative / Zero\u003c/h3>\n      \u003clabel>Enter a number\u003c/label>\n      \u003cinput type=\"number\" id=\"pnNum\" value=\"-4\" oninput=\"checkPN()\">\n      \u003cdiv class=\"result\" id=\"pnResult\">-4 is Negative\u003c/div>\n    \u003c/div>\n\n  \u003c/div>\n\u003c/section>\n\n\u003c!-- REVISION -->\n\u003csection id=\"revision\">\n  \u003cspan class=\"badge\">⚡ Quick Revision\u003c/span>\n  \u003ch2>30-Second Recap\u003c/h2>\n  \u003cdiv class=\"grid g2\">\n    \u003cdiv class=\"card revcard\">\u003cp>\u003cb>Variable\u003c/b> = naam-wala box. \u003ccode>x = 5\u003c/code>\u003c/p>\u003c/div>\n    \u003cdiv class=\"card revcard\">\u003cp>\u003cb>int/float/str/bool\u003c/b> = number / decimal / text / True-False\u003c/p>\u003c/div>\n    \u003cdiv class=\"card revcard\">\u003cp>\u003cb>Operators\u003c/b>: + − * / % ** // (math), ==  &gt; &lt; (compare)\u003c/p>\u003c/div>\n    \u003cdiv class=\"card revcard\">\u003cp>\u003cb>input()\u003c/b> leta hai (as str), \u003cb>print()\u003c/b> dikhata hai\u003c/p>\u003c/div>\n    \u003cdiv class=\"card revcard\">\u003cp>\u003cb>Casting\u003c/b>: \u003ccode>int()\u003c/code> \u003ccode>float()\u003c/code> \u003ccode>str()\u003c/code> se type badlo\u003c/p>\u003c/div>\n    \u003cdiv class=\"card revcard\">\u003cp>\u003cb>Golden Rule\u003c/b>: input() ka result hamesha str hota hai — convert karna mat bhoolo\u003c/p>\u003c/div>\n  \u003c/div>\n\u003c/section>\n\n\u003c/main>\n\u003cfooter>Made for absolute beginners · scroll up anytime, switch theme, revise in 2 minutes ✨\u003c/footer>\n\u003c/div>\n\n\u003cscript>\n/* ---------------- THEME SYSTEM ---------------- */\nconst themes = {\n  galaxy:    {emoji:\"🌌\", bg:\"#0a0118\", bg2:\"#1b0a3d\", text:\"#eef0ff\", sub:\"#b6b8e0\", accent:\"#9d7bff\", accent2:\"#5ad1ff\", mode:\"stars\"},\n  blackhole: {emoji:\"🕳️\", bg:\"#000000\", bg2:\"#0a0a0a\", text:\"#ffe9cf\", sub:\"#b8a690\", accent:\"#ff9d3d\", accent2:\"#ffd27a\", mode:\"orbit\"},\n  supernova: {emoji:\"💥\", bg:\"#140302\", bg2:\"#2b0a05\", text:\"#ffe9df\", sub:\"#ffb199\", accent:\"#ff5a36\", accent2:\"#ffcf4a\", mode:\"burst\"},\n  aurora:    {emoji:\"🌈\", bg:\"#001414\", bg2:\"#012424\", text:\"#d9fff5\", sub:\"#7fe8cf\", accent:\"#2bd9a3\", accent2:\"#5ad1ff\", mode:\"wave\"},\n  cyberpunk: {emoji:\"🤖\", bg:\"#0a0014\", bg2:\"#160024\", text:\"#f2e9ff\", sub:\"#d19dff\", accent:\"#ff2bd6\", accent2:\"#2bf7ff\", mode:\"grid\"},\n  ocean:     {emoji:\"🌊\", bg:\"#00111f\", bg2:\"#002138\", text:\"#dff6ff\", sub:\"#7fc8e8\", accent:\"#2bbcff\", accent2:\"#4affd1\", mode:\"bubble\"},\n  sunset:    {emoji:\"🌅\", bg:\"#2b0a2e\", bg2:\"#5a1a3d\", text:\"#fff0ec\", sub:\"#ffc2a8\", accent:\"#ff7a59\", accent2:\"#ffb347\", mode:\"drift\"},\n  light:     {emoji:\"📄\", bg:\"#f7f7fb\", bg2:\"#eef0f8\", text:\"#1b1b2b\", sub:\"#5a5a72\", accent:\"#6a4bd6\", accent2:\"#1a86c9\", mode:\"none\"},\n};\nconst root = document.documentElement;\nfunction applyTheme(name){\n  const t = themes[name];\n  document.body.setAttribute('data-theme', name === 'light' ? 'light' : 'dark');\n  root.style.setProperty('--bg', t.bg);\n  root.style.setProperty('--bg2', t.bg2);\n  root.style.setProperty('--text', t.text);\n  root.style.setProperty('--sub', t.sub);\n  root.style.setProperty('--accent', t.accent);\n  root.style.setProperty('--accent2', t.accent2);\n  root.style.setProperty('--card', name==='light' ? 'rgba(0,0,0,.04)' : 'rgba(255,255,255,.06)');\n  root.style.setProperty('--cardBorder', name==='light' ? 'rgba(0,0,0,.12)' : 'rgba(255,255,255,.14)');\n  document.body.style.background = t.bg;\n  document.body.style.color = t.text;\n  engine.setMode(t.mode, t.accent, t.accent2, t.bg);\n  document.querySelectorAll('.themebtn').forEach(b=>b.classList.toggle('active', b.dataset.name===name));\n  try{ localStorage.setItem('py1theme', name); }catch(e){}\n}\nconst picker = document.getElementById('themepicker');\nObject.keys(themes).forEach(name=>{\n  const b = document.createElement('button');\n  b.className='themebtn'; b.dataset.name=name; b.title=name;\n  b.style.color = themes[name].accent2;\n  b.textContent = themes[name].emoji;\n  b.onclick = ()=>applyTheme(name);\n  picker.appendChild(b);\n});\n\n/* ---------------- CANVAS ENGINE ---------------- */\nconst canvas = document.getElementById('bgcanvas');\nconst ctx = canvas.getContext('2d');\nlet W,H;\nfunction resize(){ W=canvas.width=innerWidth; H=canvas.height=innerHeight; }\naddEventListener('resize', resize); resize();\n\nconst engine = (function(){\n  let particles = [], mode='stars', c1='#9d7bff', c2='#5ad1ff', bgcol='#0a0118', t=0;\n  function spawn(n, fn){ particles = Array.from({length:n}, fn); }\n  function setMode(m, a, b, bg){\n    mode = m; c1=a; c2=b; bgcol=bg;\n    if(m==='stars') spawn(140,()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+0.3,a:Math.random(),s:Math.random()*0.02+0.005}));\n    else if(m==='orbit') spawn(90,()=>({ang:Math.random()*Math.PI*2,rad:40+Math.random()*(Math.min(W,H)*0.42),spd:0.002+Math.random()*0.006,r:Math.random()*2+0.6}));\n    else if(m==='burst') spawn(110,()=>({ang:Math.random()*Math.PI*2,sp:0.6+Math.random()*2.2,d:0,max:80+Math.random()*260,r:Math.random()*2+0.8}));\n    else if(m==='wave') spawn(4,(_,i)=>({off:i*60,amp:30+i*12,spd:0.006+i*0.002,yb:H*0.3+i*H*0.14}));\n    else if(m==='grid') spawn(26,()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,r:Math.random()*2+1}));\n    else if(m==='bubble') spawn(70,()=>({x:Math.random()*W,y:H+Math.random()*H,r:Math.random()*4+1.5,vy:0.3+Math.random()*0.8,vx:Math.sin(Math.random()*6)*0.3}));\n    else if(m==='drift') spawn(60,()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.6,vx:(Math.random()-0.5)*0.15,vy:-0.1-Math.random()*0.25,a:Math.random()}));\n    else particles=[];\n  }\n  function draw(){\n    ctx.clearRect(0,0,W,H);\n    if(mode==='sunset' || mode==='drift'){\n      const g = ctx.createLinearGradient(0,0,0,H);\n      g.addColorStop(0,'#2b0a2e'); g.addColorStop(0.5,'#7a2a4a'); g.addColorStop(1,'#ff7a4a');\n      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);\n    } else if(mode!=='none'){\n      ctx.fillStyle = bgcol; ctx.fillRect(0,0,W,H);\n    } else { ctx.fillStyle = bgcol; ctx.fillRect(0,0,W,H); }\n\n    t+=1;\n    if(mode==='stars'){\n      particles.forEach(p=>{ p.a += p.s; const al = (Math.sin(p.a)+1)/2;\n        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fillStyle=`rgba(255,255,255,${0.2+al*0.8})`; ctx.fill(); });\n    } else if(mode==='orbit'){\n      const cx=W/2, cy=H/2;\n      ctx.beginPath(); ctx.arc(cx,cy,26,0,7); ctx.fillStyle='#000'; ctx.shadowColor=c1; ctx.shadowBlur=30; ctx.fill(); ctx.shadowBlur=0;\n      particles.forEach(p=>{ p.ang+=p.spd;\n        const x=cx+Math.cos(p.ang)*p.rad, y=cy+Math.sin(p.ang)*p.rad*0.35;\n        ctx.beginPath(); ctx.arc(x,y,p.r,0,7); ctx.fillStyle = Math.random()>0.5?c1:c2; ctx.fill(); });\n    } else if(mode==='burst'){\n      const cx=W/2, cy=H/2;\n      particles.forEach(p=>{ p.d+=p.sp; if(p.d>p.max){p.d=0;}\n        const x=cx+Math.cos(p.ang)*p.d, y=cy+Math.sin(p.ang)*p.d;\n        const al = 1-(p.d/p.max);\n        ctx.beginPath(); ctx.arc(x,y,p.r,0,7); ctx.fillStyle=`rgba(255,${120+al*100|0},${60+al*60|0},${al})`; ctx.fill(); });\n    } else if(mode==='wave'){\n      particles.forEach((wv,i)=>{ wv.off+=wv.spd;\n        ctx.beginPath();\n        for(let x=0;x\u003c=W;x+=10){ const y=wv.yb+Math.sin(x*0.008+wv.off*8)*wv.amp;\n          if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }\n        ctx.strokeStyle = i%2? c1:c2; ctx.globalAlpha=0.35; ctx.lineWidth=2.4; ctx.stroke(); ctx.globalAlpha=1; });\n    } else if(mode==='grid'){\n      ctx.strokeStyle = c2; ctx.globalAlpha=0.08;\n      const gap=46;\n      for(let x=0;x\u003cW;x+=gap){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}\n      for(let y=0;y\u003cH;y+=gap){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}\n      ctx.globalAlpha=1;\n      particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy;\n        if(p.x\u003c0||p.x>W)p.vx*=-1; if(p.y\u003c0||p.y>H)p.vy*=-1;\n        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fillStyle = Math.random()>0.5?c1:c2; ctx.shadowColor=c1; ctx.shadowBlur=8; ctx.fill(); ctx.shadowBlur=0; });\n    } else if(mode==='bubble'){\n      particles.forEach(p=>{ p.y-=p.vy; p.x+=Math.sin(p.y*0.02)*0.3; if(p.y\u003c-10){p.y=H+10; p.x=Math.random()*W;}\n        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.strokeStyle=c2; ctx.globalAlpha=0.5; ctx.lineWidth=1.3; ctx.stroke(); ctx.globalAlpha=1; });\n    } else if(mode==='drift'){\n      particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; if(p.y\u003c-5)p.y=H+5;\n        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fillStyle=`rgba(255,220,180,${0.3+p.a*0.5})`; ctx.fill(); });\n    }\n    requestAnimationFrame(draw);\n  }\n  draw();\n  return {setMode};\n})();\n\n/* ---------------- PRACTICE LOGIC ---------------- */\nfunction convertTemp(){\n  const c = parseFloat(document.getElementById('cTemp').value)||0;\n  const f = (c*9/5+32).toFixed(1);\n  document.getElementById('fResult').textContent = f + \" °F\";\n}\nfunction calcSI(){\n  const p = parseFloat(document.getElementById('siP').value)||0;\n  const r = parseFloat(document.getElementById('siR').value)||0;\n  const t = parseFloat(document.getElementById('siT').value)||0;\n  document.getElementById('siResult').textContent = \"SI = \" + ((p*r*t)/100).toFixed(2);\n}\nfunction checkEO(){\n  const n = parseInt(document.getElementById('eoNum').value)||0;\n  document.getElementById('eoResult').textContent = n + \" is \" + (n%2===0 ? \"Even ✅\" : \"Odd ⚡\");\n}\nfunction checkPN(){\n  const n = parseFloat(document.getElementById('pnNum').value)||0;\n  let r = n>0 ? \"Positive 🔼\" : (n\u003c0 ? \"Negative 🔽\" : \"Zero ⬥\");\n  document.getElementById('pnResult').textContent = n + \" is \" + r;\n}\nfunction runIO(){\n  const name = document.getElementById('ioName').value || \"Friend\";\n  document.getElementById('ioTerm').innerHTML =\n    '\u003cspan class=\"prompt\">&gt;&gt;&gt;\u003c/span> name = input(\"Your name: \")  →  \"'+name+'\"\u003cbr>'+\n    '\u003cspan class=\"prompt\">&gt;&gt;&gt;\u003c/span> print(\"Hello\", name)\u003cbr>Hello '+name+' \u003cspan class=\"blink\">&nbsp;\u003c/span>';\n}\nfunction runOp(){\n  const a = parseFloat(document.getElementById('opA').value)||0;\n  const b = parseFloat(document.getElementById('opB').value)||0;\n  const sym = document.getElementById('opSym').value;\n  let r;\n  switch(sym){\n    case '+': r=a+b; break; case '−': r=a-b; break; case '*': r=a*b; break;\n    case '/': r=b!==0? (a/b): 'Err'; break; case '%': r=b!==0?(a%b):'Err'; break;\n    case '**': r=Math.pow(a,b); break; case '//': r=b!==0? Math.floor(a/b):'Err'; break;\n  }\n  document.getElementById('opResult').textContent = a+' '+sym+' '+b+' = '+r;\n}\n['opA','opB','opSym'].forEach(id=>document.getElementById(id).addEventListener('input',runOp));\ndocument.getElementById('opSym').addEventListener('change',runOp);\n\n/* mini calculator */\nconst calcDisp = document.getElementById('calcDisp');\nlet calcVal = \"0\";\nconst keys = ['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+','C'];\nconst btnWrap = document.getElementById('calcBtns');\nkeys.forEach(k=>{\n  const b=document.createElement('button'); b.textContent=k;\n  b.onclick=()=>{\n    if(k==='C'){ calcVal=\"0\"; }\n    else if(k==='='){\n      try{ calcVal = String(Function('\"use strict\";return ('+calcVal.replace(/×/g,'*')+')')()); }\n      catch(e){ calcVal=\"Error\"; }\n    } else {\n      calcVal = (calcVal===\"0\" && !'+-*/.'.includes(k)) ? k : calcVal+k;\n    }\n    calcDisp.textContent = calcVal;\n  };\n  btnWrap.appendChild(b);\n});\n\n/* init */\nrunOp(); convertTemp(); calcSI(); checkEO(); checkPN();\nlet savedTheme='galaxy';\ntry{ savedTheme = localStorage.getItem('py1theme') || 'galaxy'; }catch(e){}\napplyTheme(savedTheme);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Python Day 2 & 3 — Conditions, Loops, Data Structures\u003c/title>\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*{box-sizing:border-box}\nbody{margin:0;font:16px/1.6 Georgia,serif;color:var(--fg);background:var(--bg);transition:background .6s,color .4s}\nbody[data-theme=galaxy]{--bg:linear-gradient(160deg,#0b0720,#1a1050 60%,#0d1a4a);--fg:#eef0ff;--acc:#a78bfa;--acc2:#60a5fa;--card:rgba(16,10,52,.82);--bd:#6d5bd0}\nbody[data-theme=hole]{--bg:radial-gradient(circle at 50% 30%,#1a0e04,#030303 70%);--fg:#fff3e6;--acc:#ff9a2e;--acc2:#ffe0b0;--card:rgba(10,8,6,.85);--bd:#a8570f}\nbody[data-theme=nova]{--bg:linear-gradient(160deg,#1c0404,#3d0e00 70%,#2a0505);--fg:#fff0e0;--acc:#ff6a2b;--acc2:#ffd23f;--card:rgba(40,8,4,.84);--bd:#c4401a}\nbody[data-theme=aurora]{--bg:linear-gradient(180deg,#010d14,#03302e);--fg:#e8fff6;--acc:#2effb2;--acc2:#2ee6d6;--card:rgba(2,28,32,.84);--bd:#14a07a}\nbody[data-theme=neon]{--bg:linear-gradient(180deg,#09051a,#150a2e);--fg:#f6ecff;--acc:#ff2bd6;--acc2:#00f0ff;--card:rgba(14,6,30,.88);--bd:#b0189a}\nbody[data-theme=ocean]{--bg:linear-gradient(180deg,#00182e,#00395a 70%,#00243d);--fg:#e6f6ff;--acc:#38d9ff;--acc2:#7cffcb;--card:rgba(0,28,50,.84);--bd:#1b87a8}\nbody[data-theme=sunset]{--bg:linear-gradient(180deg,#2b1055,#9b3a8a 45%,#ff6f6f 80%,#ffb347);--fg:#fff5ea;--acc:#ffc25c;--acc2:#ff8ec7;--card:rgba(42,12,62,.86);--bd:#e07aa0}\nbody[data-theme=paper]{--bg:#f7f5ef;--fg:#1d1b22;--acc:#5b3df5;--acc2:#d6336c;--card:rgba(255,255,255,.92);--bd:#cfc9b8}\ncanvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}\nmain{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 14px 60px}\n.bar{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:max(8px,env(safe-area-inset-top,0px)) 8px 8px;background:var(--card);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}\n.bar button,.tabs button{font:600 13px system-ui,sans-serif;padding:6px 11px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--fg);cursor:pointer}\n.bar button.on,.tabs button.on{background:var(--acc);color:#111;border-color:var(--acc)}\nh1{font:800 clamp(30px,6vw,54px)/1.1 system-ui,sans-serif;margin:32px 0 8px;letter-spacing:-.02em}h1 em{font-style:normal;color:var(--acc)}\nh2{font:700 25px/1.2 system-ui,sans-serif;margin:0 0 10px;color:var(--acc)}h3{font:700 18px system-ui;margin:16px 0 6px;color:var(--acc2)}\n.sub{font:16px system-ui,sans-serif;opacity:.93;max-width:66ch}\nsection{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin:22px 0;backdrop-filter:blur(6px)}\n.day{display:inline-block;font:700 12px system-ui;background:var(--acc);color:#111;border-radius:99px;padding:2px 10px;margin-bottom:6px}\n.tip{border-left:4px solid var(--acc2);padding:6px 12px;margin:10px 0;font:15px system-ui,sans-serif}\n.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font:15px system-ui,sans-serif;margin:10px 0}\n.btn{font:600 14px system-ui,sans-serif;padding:7px 13px;border-radius:8px;border:0;background:var(--acc);color:#111;cursor:pointer}\n.btn.o{background:transparent;color:var(--fg);border:1px solid var(--bd)}\ninput[type=range]{accent-color:var(--acc)}\ninput[type=text],input[type=number],select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--bd);background:rgba(127,127,127,.12);color:var(--fg)}select option{color:#111}\n.out{font:15px/1.7 system-ui,sans-serif;background:rgba(127,127,127,.15);border-radius:10px;padding:10px 14px;min-height:44px}\nb.k{color:var(--acc2)}\npre{font:13.5px/1.55 'Courier New',monospace;background:rgba(0,0,0,.35);color:#f1f5f9;border-radius:10px;padding:10px 12px;margin:8px 0;overflow-x:auto}\npre span{display:block;padding:0 4px;border-radius:4px;transition:.3s}pre span.g{background:rgba(34,197,94,.45)}pre span.b{background:rgba(239,68,68,.4);text-decoration:line-through}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}\n.cd{border:2px solid var(--bd);border-radius:12px;padding:10px;font:14px/1.45 system-ui,sans-serif}.cd big{display:block;font:700 22px system-ui;color:var(--acc)}\n.rules{display:flex;flex-wrap:wrap;gap:8px;font:14px system-ui,sans-serif}\n.rule{border:2px solid var(--bd);border-radius:10px;padding:8px 12px;transition:.35s}.rule.yes{background:rgba(34,197,94,.4);border-color:#22c55e;transform:scale(1.06)}.rule.no{background:rgba(239,68,68,.3);border-color:#ef4444}.rule.skip{opacity:.4}\n.cells{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}\n.cell{min-width:42px;height:42px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--acc2);border-radius:8px;font:600 15px system-ui;transition:.3s;background:rgba(127,127,127,.12)}\n.cell.cur{background:var(--acc);color:#111;transform:translateY(-8px) scale(1.12);box-shadow:0 0 14px var(--acc)}.cell.done{background:var(--acc2);color:#111}.cell.skip{opacity:.4;text-decoration:line-through}.cell.brk{background:#ef4444;color:#fff}.cell.off{border-style:dashed;opacity:.5}.cell.sel{background:var(--acc);color:#111;transform:translateY(-6px)}\n.ix{display:flex;flex-direction:column;align-items:center;font:11px system-ui;gap:2px}.ix i{font-style:normal;opacity:.8}\n.ds{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;align-items:center;font:14px system-ui,sans-serif}\n.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}\n.log div{font:14px/1.5 'Courier New',monospace;padding:1px 6px;animation:fi .4s}@keyframes fi{from{opacity:0;transform:translateX(-8px)}}\n.log{max-height:230px;overflow:auto;background:rgba(0,0,0,.28);border-radius:10px;padding:8px;color:#f1f5f9}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}\ntable{border-collapse:collapse;width:100%;font:14px system-ui,sans-serif}td,th{border:1px solid var(--bd);padding:6px 8px;text-align:left}th{color:var(--acc)}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\u003c/style>\u003c/head>\n\u003cbody data-theme=\"galaxy\">\n\u003ccanvas id=\"bg\">\u003c/canvas>\u003cdiv class=\"bar\" id=\"themes\">\u003c/div>\n\u003cmain>\n\u003ch1>Python \u003cem>Day 2 &amp; Day 3\u003c/em>\u003c/h1>\n\u003cp class=\"sub\">Zero-level visual notes. Day 2: decisions and repetition. Day 3: storing many values. Every box below is a live simulation — click, drag, and watch the code run.\u003c/p>\n\u003cdiv class=\"cards\">\u003cdiv class=\"cd\">\u003cbig>Day 2\u003c/big>if / elif / else · nested · for / while · break / continue · range()\u003cbr>\u003cb class=\"k\">Programs:\u003c/b> prime, factorial, Fibonacci, table, Armstrong\u003c/div>\u003cdiv class=\"cd\">\u003cbig>Day 3\u003c/big>list · tuple · set · dict · indexing &amp; slicing · methods\u003cbr>\u003cb class=\"k\">Programs:\u003c/b> max/min, remove duplicates, frequency, student marks\u003c/div>\u003c/div>\n\n\u003csection>\u003cspan class=\"day\">DAY 2\u003c/span>\u003ch2>1 · Conditions: the program chooses a path\u003c/h2>\n\u003cp class=\"sub\">Python checks conditions \u003cb>top to bottom\u003c/b> and runs the \u003cb>first\u003c/b> true branch only. Drag the marks.\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>marks = \u003cinput type=\"range\" id=\"mk\" min=\"0\" max=\"100\" value=\"82\"> \u003cb id=\"mkv\">\u003c/b>\u003c/label>\u003c/div>\n\u003cdiv class=\"rules\" id=\"rules\">\u003c/div>\u003cpre id=\"cc\">\u003c/pre>\n\u003ch3>Nested conditions (an if inside an if)\u003c/h3>\n\u003cdiv class=\"row\">\u003clabel>attendance % = \u003cinput type=\"range\" id=\"at\" min=\"0\" max=\"100\" value=\"80\"> \u003cb id=\"atv\">\u003c/b>\u003c/label>\u003c/div>\u003cpre id=\"nc\">\u003c/pre>\n\u003cdiv class=\"tip\">\u003cb>Remember:\u003c/b> indentation (4 spaces) is how Python knows what belongs inside. \u003ccode>==\u003c/code> compares, \u003ccode>=\u003c/code> stores. Red = checked and false. Grey = skipped.\u003c/div>\u003c/section>\n\n\u003csection>\u003cspan class=\"day\">DAY 2\u003c/span>\u003ch2>2 · Loops: repeat without copy-paste\u003c/h2>\n\u003cp class=\"sub\">\u003cb>range(start, stop, step)\u003c/b> makes the numbers. The \u003cb>stop\u003c/b> value is never included (dashed box).\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>start \u003cinput type=\"number\" id=\"ls\" value=\"1\" min=\"-5\" max=\"10\" style=\"width:64px\">\u003c/label>\u003clabel>stop \u003cinput type=\"number\" id=\"le\" value=\"10\" min=\"-5\" max=\"20\" style=\"width:64px\">\u003c/label>\u003clabel>step \u003cselect id=\"lp\">\u003coption>1\u003c/option>\u003coption>2\u003c/option>\u003coption>3\u003c/option>\u003coption>-1\u003c/option>\u003coption>-2\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>continue at \u003cinput type=\"number\" id=\"lc\" value=\"3\" style=\"width:64px\">\u003c/label>\u003clabel>break at \u003cinput type=\"number\" id=\"lb\" value=\"7\" style=\"width:64px\">\u003c/label>\u003clabel>loop \u003cselect id=\"lt\">\u003coption>for\u003c/option>\u003coption>while\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n\u003cdiv class=\"cells\" id=\"lcells\">\u003c/div>\u003cpre id=\"lcode\">\u003c/pre>\n\u003cdiv class=\"row\">\u003cbutton class=\"btn\" id=\"lrun\">▶ Run loop\u003c/button>\u003cspan id=\"lout\">\u003c/span>\u003c/div>\n\u003cdiv class=\"tip\">\u003cb>continue\u003c/b> = skip this round (crossed box). \u003cb>break\u003c/b> = leave the loop completely (red box). A \u003cb>while\u003c/b> loop must change its variable (\u003ccode>i += step\u003c/code>) or it runs forever.\u003c/div>\u003c/section>\n\n\u003csection>\u003cspan class=\"day\">DAY 2\u003c/span>\u003ch2>3 · Day-2 programs, step by step\u003c/h2>\n\u003cp class=\"sub\">Pick a program, change the input, press Run. The right side shows each step Python takes.\u003c/p>\u003cdiv id=\"r2\">\u003c/div>\u003c/section>\n\n\u003csection>\u003cspan class=\"day\">DAY 3\u003c/span>\u003ch2>4 · Four containers, four personalities\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>list\u003c/th>\u003cth>tuple\u003c/th>\u003cth>set\u003c/th>\u003cth>dict\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Brackets\u003c/td>\u003ctd>[ ]\u003c/td>\u003ctd>( )\u003c/td>\u003ctd>{ }\u003c/td>\u003ctd>{k: v}\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ordered\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>no\u003c/td>\u003ctd>yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Change it\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>\u003cb>no\u003c/b>\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>yes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Duplicates\u003c/td>\u003ctd>allowed\u003c/td>\u003ctd>allowed\u003c/td>\u003ctd>\u003cb>never\u003c/b>\u003c/td>\u003ctd>unique keys\u003c/td>\u003c/tr>\u003c/table>\n\u003cdiv class=\"row\">\u003clabel>add value \u003cinput type=\"text\" id=\"av\" value=\"7\" style=\"width:70px\">\u003c/label>\u003cbutton class=\"btn\" id=\"addb\">Add to all four\u003c/button>\u003cbutton class=\"btn o\" id=\"rstb\">Reset\u003c/button>\u003c/div>\n\u003cdiv class=\"ds\" id=\"ds\">\u003c/div>\u003cdiv class=\"out\" id=\"dt\">Try adding 7 (a duplicate), then a new value.\u003c/div>\u003c/section>\n\n\u003csection>\u003cspan class=\"day\">DAY 3\u003c/span>\u003ch2>5 · Indexing and slicing\u003c/h2>\n\u003cp class=\"sub\">Every item has a position: \u003cb>0,1,2…\u003c/b> from the left and \u003cb>−1,−2…\u003c/b> from the right. A slice \u003ccode>L[start:stop:step]\u003c/code> takes from start up to (not including) stop.\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>start \u003cinput type=\"number\" id=\"s1\" value=\"1\" min=\"-8\" max=\"8\" style=\"width:64px\">\u003c/label>\u003clabel>stop \u003cinput type=\"number\" id=\"s2\" value=\"6\" min=\"-8\" max=\"8\" style=\"width:64px\">\u003c/label>\u003clabel>step \u003cselect id=\"s3\">\u003coption>1\u003c/option>\u003coption>2\u003c/option>\u003coption>3\u003c/option>\u003coption>-1\u003c/option>\u003coption>-2\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n\u003cdiv class=\"cells\" id=\"sl\">\u003c/div>\u003cdiv class=\"out\" id=\"so\">\u003c/div>\n\u003cdiv class=\"tip\">Shortcuts: \u003ccode>L[:3]\u003c/code> first three · \u003ccode>L[-2:]\u003c/code> last two · \u003ccode>L[::-1]\u003c/code> reversed · \u003ccode>L[0]\u003c/code> first · \u003ccode>L[-1]\u003c/code> last.\u003c/div>\u003c/section>\n\n\u003csection>\u003cspan class=\"day\">DAY 3\u003c/span>\u003ch2>6 · Common list methods (click to try)\u003c/h2>\n\u003cdiv class=\"tabs\" id=\"mb\">\u003c/div>\u003cdiv class=\"cells\" id=\"mc\">\u003c/div>\u003cpre id=\"mcode\">L = [5, 2, 8, 2, 9]\u003c/pre>\u003cdiv class=\"out\" id=\"mt\">Click a method.\u003c/div>\u003c/section>\n\n\u003csection>\u003cspan class=\"day\">DAY 3\u003c/span>\u003ch2>7 · Day-3 programs, step by step\u003c/h2>\n\u003cp class=\"sub\">Type your own values (comma separated) and watch the loop work.\u003c/p>\u003cdiv id=\"r3\">\u003c/div>\u003c/section>\n\n\u003csection>\u003ch2>8 · Quick revision cheat sheet\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Topic\u003c/th>\u003cth>Remember\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>if / elif / else\u003c/td>\u003ctd>first true branch wins; else = everything left\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>for\u003c/td>\u003ctd>use when you know how many times / which items\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>while\u003c/td>\u003ctd>use while a condition holds; update the variable!\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>range(a,b,s)\u003c/td>\u003ctd>a, a+s, … up to but not including b\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>break / continue\u003c/td>\u003ctd>leave loop / skip this round\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Prime\u003c/td>\u003ctd>test divisors 2 … √n; any n % i == 0 → not prime\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Factorial\u003c/td>\u003ctd>result = result × i for i = 1 … n\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Fibonacci\u003c/td>\u003ctd>a, b = b, a + b\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Armstrong\u003c/td>\u003ctd>sum of (digit ^ number-of-digits) == number\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>list / tuple / set / dict\u003c/td>\u003ctd>[ ] changeable · ( ) fixed · { } unique · {k:v} lookup\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Slice\u003c/td>\u003ctd>L[start:stop:step], stop excluded, -1 = last\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Frequency\u003c/td>\u003ctd>d[x] = d.get(x, 0) + 1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Remove duplicates\u003c/td>\u003ctd>list(set(L)) or loop with a \"seen\" check\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Common mistakes\u003c/td>\u003ctd>= vs ==, missing colon :, wrong indent, infinite while, off-by-one in range\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\u003c/main>\n\u003cscript>\nvar $=function(i){return document.getElementById(i)};\n/* themes + background */\nvar TH=[['galaxy','Galaxy'],['hole','Black Hole'],['nova','Supernova'],['aurora','Aurora'],['neon','Cyberpunk Neon'],['ocean','Deep Ocean'],['sunset','Sunset Retro'],['paper','Light Paper']],cur='galaxy',cv=$('bg'),cx=cv.getContext('2d'),W,H,P=[];\nTH.forEach(function(t){var b=document.createElement('button');b.textContent=t[1];b.id='t_'+t[0];b.onclick=function(){set(t[0])};$('themes').appendChild(b)});\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',function(){rs();init()});\nfunction set(t){cur=t;document.body.dataset.theme=t;TH.forEach(function(x){$('t_'+x[0]).classList.toggle('on',x[0]==t)});init()}\nfunction R(a,b){return a+Math.random()*(b-a)}\nfunction init(){P=[];var n={galaxy:170,hole:420,nova:260,aurora:90,neon:0,ocean:60,sunset:0,paper:40}[cur];for(var i=0;i\u003cn;i++)P.push({x:R(0,W),y:R(0,H),r:R(.4,2.4),a:R(0,6.28),s:R(.3,1.6),d:R(60,Math.min(W,H)*.6),l:Math.random()})}\nfunction draw(t){t/=1000;cx.clearRect(0,0,W,H);var i,p,X,Y;\nif(cur=='galaxy'){var g=cx.createRadialGradient(W*.7,H*.3,0,W*.7,H*.3,W*.5);g.addColorStop(0,'rgba(167,100,255,.35)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);cx.fillStyle='#fff';for(i=0;i\u003cP.length;i++){p=P[i];cx.globalAlpha=.4+.6*Math.abs(Math.sin(t*p.s+p.a));cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}}\nelse if(cur=='hole'){X=W/2;Y=H*.4;for(i=0;i\u003cP.length;i++){p=P[i];var rr=50+p.d*(.3+p.l),an=p.a+t*(120/rr)*p.s;cx.globalAlpha=.8;cx.fillStyle=p.l>.6?'#fff4e0':'#ff8a1f';cx.beginPath();cx.arc(X+Math.cos(an)*rr*1.6,Y+Math.sin(an)*rr*.4,p.r,0,7);cx.fill()}var g2=cx.createRadialGradient(X,Y,10,X,Y,90);g2.addColorStop(0,'#000');g2.addColorStop(.55,'#000');g2.addColorStop(.7,'rgba(255,170,60,.5)');g2.addColorStop(1,'rgba(0,0,0,0)');cx.globalAlpha=1;cx.fillStyle=g2;cx.beginPath();cx.arc(X,Y,90,0,7);cx.fill()}\nelse if(cur=='nova'){X=W/2;Y=H*.45;for(i=0;i\u003cP.length;i++){p=P[i];p.l+=.004*p.s;if(p.l>1){p.l=0;p.a=R(0,6.28)}var d=p.l*Math.max(W,H)*.6;cx.globalAlpha=1-p.l;cx.fillStyle=p.l\u003c.3?'#ffe27a':p.l\u003c.6?'#ff8a2b':'#e0301a';cx.beginPath();cx.arc(X+Math.cos(p.a)*d,Y+Math.sin(p.a)*d,p.r*(2-p.l),0,7);cx.fill()}}\nelse if(cur=='aurora'){cx.lineWidth=26;for(i=0;i\u003c5;i++){cx.beginPath();for(var x=0;x\u003c=W;x+=14){var y=H*.3+i*34+Math.sin(x/160+t*.6+i)*40+Math.sin(x/70-t*.4)*14;x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.strokeStyle=i%2?'rgba(46,255,178,.35)':'rgba(46,230,214,.3)';cx.globalAlpha=.7;cx.stroke()}cx.fillStyle='#fff';for(i=0;i\u003cP.length;i++){p=P[i];cx.globalAlpha=.5;cx.fillRect(p.x,p.y*.5,1.4,1.4)}}\nelse if(cur=='neon'){cx.lineWidth=1;cx.strokeStyle='#ff2bd6';cx.globalAlpha=.5;var hz=H*.55;for(i=-20;i\u003c=20;i++){cx.beginPath();cx.moveTo(W/2+i*20,hz);cx.lineTo(W/2+i*140,H);cx.stroke()}cx.strokeStyle='#00f0ff';for(i=0;i\u003c12;i++){var f=((i+t*.5)%12)/12,y2=hz+(H-hz)*f*f;cx.beginPath();cx.moveTo(0,y2);cx.lineTo(W,y2);cx.stroke()}}\nelse if(cur=='ocean'){cx.strokeStyle='#7cffcb';cx.shadowColor='#38d9ff';cx.shadowBlur=12;for(i=0;i\u003cP.length;i++){p=P[i];p.y-=p.s*.6;if(p.y\u003c-10){p.y=H+10;p.x=R(0,W)}cx.globalAlpha=.6;cx.beginPath();cx.arc(p.x+Math.sin(t*p.s+p.a)*14,p.y,p.r*3,0,7);cx.stroke()}cx.shadowBlur=0}\nelse if(cur=='sunset'){var sy=H*.55,sg=cx.createLinearGradient(0,sy-90,0,sy+90);sg.addColorStop(0,'#ffe27a');sg.addColorStop(1,'#ff4f9a');cx.globalAlpha=.9;cx.fillStyle=sg;cx.beginPath();cx.arc(W/2,sy,90,0,7);cx.fill();cx.fillStyle='rgba(60,10,80,.55)';cx.fillRect(0,sy+20,W,H);cx.strokeStyle='rgba(255,200,140,.35)';for(i=0;i\u003c6;i++){cx.beginPath();for(var x2=0;x2\u003c=W;x2+=20){var yy=sy+30+i*28+Math.sin(x2/90+t+i)*5;x2?cx.lineTo(x2,yy):cx.moveTo(x2,yy)}cx.stroke()}}\nelse{for(i=0;i\u003cP.length;i++){p=P[i];p.y-=p.s*.15;if(p.y\u003c-5)p.y=H+5;cx.globalAlpha=.25;cx.fillStyle=i%2?'#5b3df5':'#d6336c';cx.beginPath();cx.arc(p.x+Math.sin(t*.3+p.a)*10,p.y,p.r*2,0,7);cx.fill()}}\ncx.globalAlpha=1;requestAnimationFrame(draw)}\nrs();set('galaxy');requestAnimationFrame(draw);\n/* helpers */\nfunction code(el,lines,good,bad){el.innerHTML=lines.map(function(l,i){return '\u003cspan class=\"'+(good.indexOf(i)>-1?'g':bad.indexOf(i)>-1?'b':'')+'\">'+l.replace(/\u003c/g,'&lt;')+'&nbsp;\u003c/span>'}).join('')}\nfunction cells(a,c){return a.map(function(x){return '\u003cspan class=\"cell '+(c||'')+'\">'+x+'\u003c/span>'}).join('')}\n/* 1 conditions */\nfunction cond(){var m=+$('mk').value,a=+$('at').value;$('mkv').textContent=m;$('atv').textContent=a;\nvar rs_=[['marks >= 90','A',m>=90],['marks >= 75','B',m>=75],['marks >= 40','C',m>=40],['else','Fail',1]],hit=rs_.findIndex(function(r){return r[2]});\n$('rules').innerHTML=rs_.map(function(r,i){return '\u003cdiv class=\"rule '+(i\u003chit?'no':i==hit?'yes':'skip')+'\">'+(i\u003chit?'✘ ':i==hit?'✔ ':'')+r[0]+' → '+r[1]+'\u003c/div>'}).join('');\nvar L=['if marks >= 90:','    grade = \"A\"','elif marks >= 75:','    grade = \"B\"','elif marks >= 40:','    grade = \"C\"','else:','    grade = \"Fail\"'],g=[2*hit,2*hit+1],b=[];for(var i=0;i\u003chit;i++)b.push(2*i);code($('cc'),L,g,b);\nvar N=['if attendance >= 75:','    if marks >= 40:','        print(\"Pass\")','    else:','        print(\"Fail\")','else:','    print(\"Not allowed to sit exam\")'];\ncode($('nc'),N,a>=75?(m>=40?[0,1,2]:[0,1,3,4]):[0,5,6],a>=75?[]:[0])}\n$('mk').oninput=$('at').oninput=cond;cond();\n/* 2 loops */\nvar lt;function lr(){clearInterval(lt);var s=+$('ls').value,e=+$('le').value,p=+$('lp').value,c=$('lc').value,b=$('lb').value,v=[];\nfor(var i=s;p>0?i\u003ce:i>e;i+=p){v.push(i);if(v.length>20)break}\n$('lcells').innerHTML=cells(v)+'\u003cspan class=\"cell off\">'+e+' (stop)\u003c/span>';\nvar w=$('lt').value=='while',L=w?['i = '+s,'while i '+(p>0?'\u003c':'>')+' '+e+':']:['for i in range('+s+', '+e+(p!=1?', '+p:'')+'):'],ind=w?'    ':'    ';\nif(c!=='')L.push(ind+'if i == '+c+': '+(w?'i += '+p+'; ':'')+'continue');if(b!=='')L.push(ind+'if i == '+b+': break');L.push(ind+'print(i)');if(w)L.push(ind+'i += '+p);\ncode($('lcode'),L,[],[]);$('lout').textContent='';return v}\n['ls','le','lp','lc','lb','lt'].forEach(function(i){$(i).oninput=$(i).onchange=lr});\n$('lrun').onclick=function(){var v=lr(),cs=document.querySelectorAll('#lcells .cell'),k=0,o=[],c=$('lc').value,b=$('lb').value;\nlt=setInterval(function(){cs.forEach(function(x){x.classList.remove('cur')});if(k>=v.length){clearInterval(lt);$('lout').innerHTML='Output: \u003cb class=\"k\">'+(o.join(' ')||'(nothing)')+'\u003c/b>';return}\nvar x=v[k],el=cs[k];if(String(x)===c){el.classList.add('skip');$('lout').textContent='i = '+x+': continue (skip)'}else if(String(x)===b){el.classList.add('brk');$('lout').textContent='i = '+x+': break!';k=v.length;for(var j=0;j\u003ccs.length-1;j++)if(!cs[j].classList.length||cs[j].className=='cell')cs[j].style.opacity=.35;clearInterval(lt);$('lout').innerHTML+=' Output: \u003cb class=\"k\">'+(o.join(' ')||'(nothing)')+'\u003c/b>';return}else{el.classList.add('cur','done');o.push(x);$('lout').textContent='i = '+x+': print → '+o.join(' ')}k++},650)};lr();\n/* program runner */\nfunction nums(v){return v.split(/[ ,]+/).filter(Boolean).map(Number).filter(function(x){return !isNaN(x) bg:#f7f5ef;--fg:#1d1b22;--acc:#5b3df5;--acc2:#d6336c;--card:rgba(255,255,255,.92);--bd:#cfc9b8}\ncanvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}\nmain{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:0 14px 60px}\n.bar{position:sticky;top:0;z-index:5;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:max(8px,env(safe-area-inset-top,0px)) 8px 8px;background:var(--card);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}\n.bar button,.tabs button{font:600 13px system-ui,sans-serif;padding:6px 11px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--fg);cursor:pointer}\n.bar button.on,.tabs button.on{background:var(--acc);color:#111;border-color:var(--acc)}\nh1{font:800 clamp(30px,6vw,54px)/1.1 system-ui,sans-serif;margin:32px 0 8px;letter-spacing:-.02em}h1 em{font-style:normal;color:var(--acc)}\nh2{font:700 25px/1.2 system-ui,sans-serif;margin:0 0 10px;color:var(--acc)}\n.sub{font:16px system-ui,sans-serif;opacity:.93;max-width:66ch}\nsection{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:20px;margin:22px 0;backdrop-filter:blur(6px)}\n.tip{border-left:4px solid var(--acc2);padding:6px 12px;margin:10px 0;font:15px system-ui,sans-serif}\n.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;font:15px system-ui,sans-serif;margin:10px 0}\n.btn{font:600 14px system-ui,sans-serif;padding:7px 13px;border-radius:8px;border:0;background:var(--acc);color:#111;cursor:pointer}\ninput[type=text],select{font:inherit;padding:5px 8px;border-radius:8px;border:1px solid var(--bd);background:rgba(127,127,127,.12);color:var(--fg)}select option{color:#111}\n.out{font:15px/1.7 system-ui,sans-serif;background:rgba(127,127,127,.15);border-radius:10px;padding:10px 14px;min-height:44px}\nb.k{color:var(--acc2)}code{background:rgba(127,127,127,.2);padding:0 4px;border-radius:4px}\npre{font:13.5px/1.55 'Courier New',monospace;background:rgba(0,0,0,.35);color:#f1f5f9;border-radius:10px;padding:10px 12px;margin:8px 0;overflow-x:auto}\npre span{display:block;padding:0 4px;border-radius:4px;transition:.3s}pre span.g{background:rgba(34,197,94,.45)}\n.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}\n.cd{border:2px solid var(--bd);border-radius:12px;padding:10px;font:14px/1.45 system-ui,sans-serif}.cd big{display:block;font:700 22px system-ui;color:var(--acc)}\n.flow{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:10px 0}\n.chip{min-width:44px;height:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--acc2);border-radius:20px;font:600 15px system-ui;background:rgba(127,127,127,.12);animation:pop .5s}\n.chip.o{background:var(--acc);color:#111;border-color:var(--acc)}.chip.e{background:#ef4444;color:#fff;border-color:#ef4444}\n@keyframes pop{from{transform:scale(.2);opacity:0}}\n.mach{padding:14px 18px;border:3px solid var(--bd);border-radius:14px;font:700 16px system-ui;transition:.3s;text-align:center}.mach.on{border-color:var(--acc);box-shadow:0 0 22px var(--acc);transform:scale(1.07)}\n.arr{font-size:24px;color:var(--acc)}\n.nest{border:2px dashed var(--bd);border-radius:12px;padding:8px 10px;margin:6px 0;font:13px system-ui;transition:.35s}.nest.s{background:rgba(250,204,21,.3);border-color:#facc15}.nest.f{background:rgba(34,197,94,.4);border-color:#22c55e}.nest.n{background:rgba(239,68,68,.25);border-color:#ef4444}\n.log{max-height:240px;overflow:auto;background:rgba(0,0,0,.28);border-radius:10px;padding:8px;color:#f1f5f9}.log div{font:14px/1.5 'Courier New',monospace;padding:1px 6px;white-space:pre;animation:fi .4s}@keyframes fi{from{opacity:0;transform:translateX(-8px)}}\n.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}\ntable{border-collapse:collapse;width:100%;font:14px system-ui,sans-serif}td,th{border:1px solid var(--bd);padding:6px 8px;text-align:left}th{color:var(--acc)}\n@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}\n\u003c/style>\u003c/head>\n\u003cbody data-theme=\"galaxy\">\n\u003ccanvas id=\"bg\">\u003c/canvas>\u003cdiv class=\"bar\" id=\"themes\">\u003c/div>\n\u003cmain>\n\u003ch1>Python \u003cem>Day 4: Functions\u003c/em>\u003c/h1>\n\u003cp class=\"sub\">A function is a \u003cb>machine\u003c/b>: put things in, get a result out, reuse it forever. Zero-level visual notes — every box below is a live simulation.\u003c/p>\n\u003cdiv class=\"cards\">\u003cdiv class=\"cd\">\u003cbig>Concepts\u003c/big>def · parameters &amp; arguments · return · default args · *args / **kwargs · lambda · scope\u003c/div>\u003cdiv class=\"cd\">\u003cbig>Programs\u003c/big>mean() · variance() · maximum() · minimum() · factorial()\u003c/div>\u003c/div>\n\n\u003csection>\u003ch2>1 · A function is a machine\u003c/h2>\n\u003cp class=\"sub\">Define once with \u003ccode>def\u003c/code>, use many times by \u003cb>calling\u003c/b> it. Choose a function, type the inputs (comma separated), press Run.\u003c/p>\n\u003cdiv class=\"row\">\u003cselect id=\"fs\">\u003coption value=\"square\">square(x)\u003c/option>\u003coption value=\"add\">add(a, b)\u003c/option>\u003coption value=\"greet\">greet(name)\u003c/option>\u003c/select>\u003clabel>arguments \u003cinput type=\"text\" id=\"fa\" value=\"5\" style=\"width:130px\">\u003c/label>\u003cbutton class=\"btn\" id=\"fr\">▶ Run\u003c/button>\u003c/div>\n\u003cpre id=\"fc\">\u003c/pre>\n\u003cdiv class=\"flow\">\u003cdiv id=\"mi\" class=\"flow\">\u003c/div>\u003cspan class=\"arr\">➜\u003c/span>\u003cdiv class=\"mach\" id=\"mm\">def body\u003c/div>\u003cspan class=\"arr\">➜\u003c/span>\u003cdiv id=\"mo\">\u003c/div>\u003c/div>\n\u003cdiv class=\"out\" id=\"ft\">\u003c/div>\n\u003cdiv class=\"tip\">\u003cb>Anatomy:\u003c/b> \u003ccode>def\u003c/code> starts · \u003cb>name\u003c/b> · \u003cb>(parameters)\u003c/b> · colon \u003ccode>:\u003c/code> · indented \u003cb>body\u003c/b> · \u003ccode>return\u003c/code> sends the answer back. Nothing runs until you call \u003ccode>square(5)\u003c/code>.\u003c/div>\u003c/section>\n\n\u003csection>\u003ch2>2 · Parameters vs arguments, and default values\u003c/h2>\n\u003cp class=\"sub\">\u003cb>Parameter\u003c/b> = the name in \u003ccode>def\u003c/code> (empty slot). \u003cb>Argument\u003c/b> = the real value you pass (what fills the slot). A \u003cb>default\u003c/b> fills the slot if you pass nothing.\u003c/p>\n\u003cpre>def power(base, exp=2):\n    return base ** exp\u003c/pre>\n\u003cdiv class=\"row\">\u003clabel>base \u003cinput type=\"text\" id=\"pb\" value=\"5\" style=\"width:60px\">\u003c/label>\u003clabel>exp \u003cinput type=\"text\" id=\"pe\" placeholder=\"(blank = default)\" style=\"width:150px\">\u003c/label>\u003clabel>style \u003cselect id=\"ps\">\u003coption>positional\u003c/option>\u003coption>keyword\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n\u003cdiv class=\"flow\" id=\"pf\">\u003c/div>\u003cdiv class=\"out\" id=\"pt\">\u003c/div>\n\u003cdiv class=\"tip\">Rule: parameters with defaults go \u003cb>last\u003c/b>. Keyword style lets you pass in any order: \u003ccode>power(exp=3, base=5)\u003c/code>.\u003c/div>\u003c/section>\n\n\u003csection>\u003ch2>3 · return vs print\u003c/h2>\n\u003cp class=\"sub\">\u003cb>print\u003c/b> only shows text on the screen. \u003cb>return\u003c/b> hands the value back so you can store it and use it.\u003c/p>\n\u003cdiv class=\"row\">\u003cselect id=\"rm\">\u003coption value=\"print\">function uses print\u003c/option>\u003coption value=\"return\">function uses return\u003c/option>\u003c/select>\u003cbutton class=\"btn\" id=\"rr\">▶ x = double(4); then x + 1\u003c/button>\u003c/div>\n\u003cpre id=\"rc\">\u003c/pre>\u003cdiv class=\"flow\">\u003cdiv class=\"out\" style=\"flex:1\" id=\"rs\">\u003c/div>\u003cdiv class=\"out\" style=\"flex:1\" id=\"rx\">\u003c/div>\u003c/div>\n\u003cdiv class=\"tip\">A function with no \u003ccode>return\u003c/code> gives back \u003ccode>None\u003c/code> — a very common beginner bug.\u003c/div>\u003c/section>\n\n\u003csection>\u003ch2>4 · *args and **kwargs: any number of inputs\u003c/h2>\n\u003cp class=\"sub\">\u003cb>*args\u003c/b> packs extra positional values into a \u003cb>tuple\u003c/b>. \u003cb>**kwargs\u003c/b> packs extra name=value pairs into a \u003cb>dict\u003c/b>.\u003c/p>\n\u003cpre>def show(*args, **kwargs):\n    print(args, kwargs)\u003c/pre>\n\u003cdiv class=\"row\">\u003clabel>positional \u003cinput type=\"text\" id=\"ka\" value=\"1, 2, 3\" style=\"width:130px\">\u003c/label>\u003clabel>keyword \u003cinput type=\"text\" id=\"kk\" value=\"a=5, b=6\" style=\"width:130px\">\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"kc\">\u003c/div>\u003cdiv class=\"flow\">\u003cb>args =\u003c/b>\u003cspan id=\"kat\" class=\"flow\">\u003c/span>\u003cb>kwargs =\u003c/b>\u003cspan id=\"kkd\" class=\"flow\">\u003c/span>\u003c/div>\n\u003cdiv class=\"tip\">Names \u003ccode>args\u003c/code>/\u003ccode>kwargs\u003c/code> are convention; the stars do the magic. Opposite direction works too: \u003ccode>f(*[1,2,3])\u003c/code> unpacks a list into separate arguments.\u003c/div>\u003c/section>\n\n\u003csection>\u003ch2>5 · Lambda: a one-line mini function\u003c/h2>\n\u003cpre>square = lambda x: x * x        # same as: def square(x): return x * x\u003c/pre>\n\u003cdiv class=\"row\">\u003cselect id=\"ls\">\u003coption value=\"x * x\">lambda x: x * x\u003c/option>\u003coption value=\"x * 2\">lambda x: x * 2\u003c/option>\u003coption value=\"x % 2 == 0\">lambda x: x % 2 == 0\u003c/option>\u003coption value=\"-x\">lambda x: -x\u003c/option>\u003c/select>\u003cselect id=\"lm\">\u003coption>map\u003c/option>\u003coption>filter\u003c/option>\u003c/select>\u003clabel>list \u003cinput type=\"text\" id=\"ll\" value=\"1, 2, 3, 4, 5, 6\" style=\"width:150px\">\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"lc\">\u003c/div>\u003cdiv class=\"flow\">\u003cspan id=\"li\" class=\"flow\">\u003c/span>\u003cspan class=\"arr\">➜\u003c/span>\u003cspan id=\"lo\" class=\"flow\">\u003c/span>\u003c/div>\n\u003cdiv class=\"tip\">\u003cb>map\u003c/b> transforms every item. \u003cb>filter\u003c/b> keeps items where the lambda is True. Two inputs work too: \u003ccode>lambda a, b: a + b\u003c/code>. Use lambda for tiny throw-away functions only.\u003c/div>\u003c/section>\n\n\u003csection>\u003ch2>6 · Scope: who can see which variable? (LEGB)\u003c/h2>\n\u003cp class=\"sub\">Python looks for a name in order: \u003cb>L\u003c/b>ocal → \u003cb>E\u003c/b>nclosing → \u003cb>G\u003c/b>lobal → \u003cb>B\u003c/b>uilt-in. First match wins.\u003c/p>\n\u003cpre>x = \"global\"\ndef outer():\n    z = \"enclosing\"\n    def inner():\n        y = \"local\"\n        print(?)   # ← pick the name below\u003c/pre>\n\u003cdiv class=\"row\">\u003cselect id=\"sv\">\u003coption>y\u003c/option>\u003coption>z\u003c/option>\u003coption>x\u003c/option>\u003coption>len\u003c/option>\u003coption>w\u003c/option>\u003coption value=\"yo\">y (read outside the function)\u003c/option>\u003c/select>\u003cbutton class=\"btn\" id=\"sb\">🔍 Look up\u003c/button>\u003c/div>\n\u003cdiv class=\"nest\" id=\"nB\">\u003cb>B\u003c/b> Built-in: len, print, max…\u003cdiv class=\"nest\" id=\"nG\">\u003cb>G\u003c/b> Global: x\u003cdiv class=\"nest\" id=\"nE\">\u003cb>E\u003c/b> Enclosing (outer): z\u003cdiv class=\"nest\" id=\"nL\">\u003cb>L\u003c/b> Local (inner): y\u003c/div>\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv class=\"out\" id=\"st\">\u003c/div>\n\u003cdiv class=\"tip\">Local variables \u003cb>die\u003c/b> when the function ends. To change a global inside a function you must write \u003ccode>global x\u003c/code> first (use rarely).\u003c/div>\u003c/section>\n\n\u003csection>\u003ch2>7 · Day-4 programs as functions\u003c/h2>\n\u003cp class=\"sub\">Each program is a function. Edit the input list and press Run to see the steps. Factorial uses \u003cb>recursion\u003c/b>: watch the calls stack up, then return.\u003c/p>\u003cdiv id=\"r4\">\u003c/div>\u003c/section>\n\n\u003csection>\u003ch2>8 · Quick revision cheat sheet\u003c/h2>\n\u003ctable>\u003ctr>\u003cth>Idea\u003c/th>\u003cth>Remember\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>def\u003c/td>\u003ctd>\u003ccode>def name(params):\u003c/code> + indented body\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Parameter / argument\u003c/td>\u003ctd>slot in def / value in the call\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>return\u003c/td>\u003ctd>sends value back and ends the function; no return → None\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Default\u003c/td>\u003ctd>\u003ccode>def f(a, b=10)\u003c/code>, defaults go last\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>*args / **kwargs\u003c/td>\u003ctd>tuple of extras / dict of name=value extras\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>lambda\u003c/td>\u003ctd>\u003ccode>lambda x: x*2\u003c/code>, one expression, no return keyword\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Scope\u003c/td>\u003ctd>L → E → G → B; locals disappear after the call\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>mean\u003c/td>\u003ctd>sum(L) / len(L)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>variance\u003c/td>\u003ctd>average of (x − mean)²\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>max / min\u003c/td>\u003ctd>keep a \"best so far\" and compare each item\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>factorial\u003c/td>\u003ctd>n! = n × (n−1)!, base case 0! = 1! = 1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Common mistakes\u003c/td>\u003ctd>forgot return · print instead of return · missing colon · calling without () · mutable default argument\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\u003c/main>\n\u003cscript>\nvar $=function(i){return document.getElementById(i)};\nvar TH=[['galaxy','Galaxy'],['hole','Black Hole'],['nova','Supernova'],['aurora','Aurora'],['neon','Cyberpunk Neon'],['ocean','Deep Ocean'],['sunset','Sunset Retro'],['paper','Light Paper']],cur='galaxy',cv=$('bg'),cx=cv.getContext('2d'),W,H,P=[];\nTH.forEach(function(t){var b=document.createElement('button');b.textContent=t[1];b.id='t_'+t[0];b.onclick=function(){set(t[0])};$('themes').appendChild(b)});\nfunction rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',function(){rs();init()});\nfunction set(t){cur=t;document.body.dataset.theme=t;TH.forEach(function(x){$('t_'+x[0]).classList.toggle('on',x[0]==t)});init()}\nfunction R(a,b){return a+Math.random()*(b-a)}\nfunction init(){P=[];var n={galaxy:170,hole:420,nova:260,aurora:90,neon:0,ocean:60,sunset:0,paper:40}[cur];for(var i=0;i\u003cn;i++)P.push({x:R(0,W),y:R(0,H),r:R(.4,2.4),a:R(0,6.28),s:R(.3,1.6),d:R(60,Math.min(W,H)*.6),l:Math.random()})}\nfunction draw(t){t/=1000;cx.clearRect(0,0,W,H);var i,p,X,Y;\nif(cur=='galaxy'){var g=cx.createRadialGradient(W*.7,H*.3,0,W*.7,H*.3,W*.5);g.addColorStop(0,'rgba(167,100,255,.35)');g.addColorStop(1,'rgba(0,0,0,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);cx.fillStyle='#fff';for(i=0;i\u003cP.length;i++){p=P[i];cx.globalAlpha=.4+.6*Math.abs(Math.sin(t*p.s+p.a));cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}}\nelse if(cur=='hole'){X=W/2;Y=H*.4;for(i=0;i\u003cP.length;i++){p=P[i];var rr=50+p.d*(.3+p.l),an=p.a+t*(120/rr)*p.s;cx.globalAlpha=.8;cx.fillStyle=p.l>.6?'#fff4e0':'#ff8a1f';cx.beginPath();cx.arc(X+Math.cos(an)*rr*1.6,Y+Math.sin(an)*rr*.4,p.r,0,7);cx.fill()}var g2=cx.createRadialGradient(X,Y,10,X,Y,90);g2.addColorStop(0,'#000');g2.addColorStop(.55,'#000');g2.addColorStop(.7,'rgba(255,170,60,.5)');g2.addColorStop(1,'rgba(0,0,0,0)');cx.globalAlpha=1;cx.fillStyle=g2;cx.beginPath();cx.arc(X,Y,90,0,7);cx.fill()}\nelse if(cur=='nova'){X=W/2;Y=H*.45;for(i=0;i\u003cP.length;i++){p=P[i];p.l+=.004*p.s;if(p.l>1){p.l=0;p.a=R(0,6.28)}var d=p.l*Math.max(W,H)*.6;cx.globalAlpha=1-p.l;cx.fillStyle=p.l\u003c.3?'#ffe27a':p.l\u003c.6?'#ff8a2b':'#e0301a';cx.beginPath();cx.arc(X+Math.cos(p.a)*d,Y+Math.sin(p.a)*d,p.r*(2-p.l),0,7);cx.fill()}}\nelse if(cur=='aurora'){cx.lineWidth=26;for(i=0;i\u003c5;i++){cx.beginPath();for(var x=0;x\u003c=W;x+=14){var y=H*.3+i*34+Math.sin(x/160+t*.6+i)*40+Math.sin(x/70-t*.4)*14;x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.strokeStyle=i%2?'rgba(46,255,178,.35)':'rgba(46,230,214,.3)';cx.globalAlpha=.7;cx.stroke()}cx.fillStyle='#fff';for(i=0;i\u003cP.length;i++){p=P[i];cx.globalAlpha=.5;cx.fillRect(p.x,p.y*.5,1.4,1.4)}}\nelse if(cur=='neon'){cx.lineWidth=1;cx.strokeStyle='#ff2bd6';cx.globalAlpha=.5;var hz=H*.55;for(i=-20;i\u003c=20;i++){cx.beginPath();cx.moveTo(W/2+i*20,hz);cx.lineTo(W/2+i*140,H);cx.stroke()}cx.strokeStyle='#00f0ff';for(i=0;i\u003c12;i++){var f=((i+t*.5)%12)/12,y2=hz+(H-hz)*f*f;cx.beginPath();cx.moveTo(0,y2);cx.lineTo(W,y2);cx.stroke()}}\nelse if(cur=='ocean'){cx.strokeStyle='#7cffcb';cx.shadowColor='#38d9ff';cx.shadowBlur=12;for(i=0;i\u003cP.length;i++){p=P[i];p.y-=p.s*.6;if(p.y\u003c-10){p.y=H+10;p.x=R(0,W)}cx.globalAlpha=.6;cx.beginPath();cx.arc(p.x+Math.sin(t*p.s+p.a)*14,p.y,p.r*3,0,7);cx.stroke()}cx.shadowBlur=0}\nelse if(cur=='sunset'){var sy=H*.55,sg=cx.createLinearGradient(0,sy-90,0,sy+90);sg.addColorStop(0,'#ffe27a');sg.addColorStop(1,'#ff4f9a');cx.globalAlpha=.9;cx.fillStyle=sg;cx.beginPath();cx.arc(W/2,sy,90,0,7);cx.fill();cx.fillStyle='rgba(60,10,80,.55)';cx.fillRect(0,sy+20,W,H);cx.strokeStyle='rgba(255,200,140,.35)';for(i=0;i\u003c6;i++){cx.beginPath();for(var x2=0;x2\u003c=W;x2+=20){var yy=sy+30+i*28+Math.sin(x2/90+t+i)*5;x2?cx.lineTo(x2,yy):cx.moveTo(x2,yy)}cx.stroke()}}\nelse{for(i=0;i\u003cP.length;i++){p=P[i];p.y-=p.s*.15;if(p.y\u003c-5)p.y=H+5;cx.globalAlpha=.25;cx.fillStyle=i%2?'#5b3df5':'#d6336c';cx.beginPath();cx.arc(p.x+Math.sin(t*.3+p.a)*10,p.y,p.r*2,0,7);cx.fill()}}\ncx.globalAlpha=1;requestAnimationFrame(draw)}\nrs();set('galaxy');requestAnimationFrame(draw);\nfunction code(el,lines,good){el.innerHTML=lines.map(function(l,i){return '\u003cspan class=\"'+(good.indexOf(i)>-1?'g':'')+'\">'+l.replace(/\u003c/g,'&lt;')+'&nbsp;\u003c/span>'}).join('')}\nfunction chips(a,c){return a.map(function(x){return '\u003cspan class=\"chip '+(c||'')+'\">'+x+'\u003c/span>'}).join('')}\nfunction
