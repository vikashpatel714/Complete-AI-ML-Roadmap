x;border:2px solid var(--a);font-weight:700;transition:.35s;font-variant-numeric:tabular-nums}\n.cell.hit{background:var(--b);color:#000;transform:scale(1.08);box-shadow:0 0 12px var(--b)}\n.g{display:grid;gap:5px;width:max-content;max-width:100%}\n.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}\n.four>div{border:1px dashed var(--a);border-radius:12px;padding:10px;text-align:center}\ntable{border-collapse:collapse;font-size:14px;max-width:100%}td,th{border:1px solid color-mix(in srgb,var(--a) 45%,transparent);padding:5px 10px;text-align:left}\n.hide td:last-child{filter:blur(8px);cursor:pointer}\ndetails{margin:6px 0;border:1px dashed var(--a);border-radius:10px;padding:6px 10px}summary{cursor:pointer}\n@keyframes pop{from{opacity:0;transform:scale(.6)}}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cheader>\u003cdiv class=\"ths\" id=\"ths\">\u003c/div>\u003c/header>\n\u003cmain>\n\u003ch1>Day 11 &amp; 12: Linear Algebra for ML\u003c/h1>\n\u003cp class=\"m\">Zero to clear. Drag the sliders: every picture is live. Jump: \u003ca href=\"#d11\" style=\"color:var(--b)\">Day 11\u003c/a> · \u003ca href=\"#d12\" style=\"color:var(--b)\">Day 12\u003c/a> · \u003ca href=\"#why\" style=\"color:var(--b)\">Why ML uses matrices\u003c/a>\u003c/p>\n\n\u003ch2 id=\"d11\">DAY 11: Linear Algebra I\u003c/h2>\n\n\u003cdiv class=\"c\">\u003ch3>1. Scalar → Vector → Matrix → Tensor\u003c/h3>\n\u003cdiv class=\"k\">Just numbers in bigger and bigger boxes. Count the directions = \u003cb>dimensions\u003c/b>.\u003c/div>\n\u003cdiv class=\"four\" id=\"four\">\u003c/div>\n\u003cpre>s = 5                          # scalar     ndim 0\nv = np.array([2,3,4])          # vector     shape (3,)\nM = np.array([[1,2,3],[4,5,6]])# matrix     shape (2,3)\nT = np.zeros((2,3,4))          # tensor     shape (2,3,4)\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>2. Vector addition &amp; scalar multiplication\u003c/h3>\n\u003cp>A vector is an \u003cb>arrow\u003c/b>: go x steps right, y steps up.\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton class=\"b on\" id=\"m1\" onclick=\"vm('add')\">v + w\u003c/button>\u003cbutton class=\"b o\" id=\"m2\" onclick=\"vm('sc')\">k × v\u003c/button>\u003c/div>\n\u003cdiv class=\"row\">\u003clabel>v: x \u003cb id=\"o1\">3\u003c/b> \u003cinput type=\"range\" id=\"vx\" min=\"-4\" max=\"4\" value=\"3\">\u003c/label>\u003clabel>y \u003cb id=\"o2\">1\u003c/b> \u003cinput type=\"range\" id=\"vy\" min=\"-4\" max=\"4\" value=\"1\">\u003c/label>\u003c/div>\n\u003cdiv class=\"row\" id=\"wrow\">\u003clabel>w: x \u003cb id=\"o3\">1\u003c/b> \u003cinput type=\"range\" id=\"wx\" min=\"-4\" max=\"4\" value=\"1\">\u003c/label>\u003clabel>y \u003cb id=\"o4\">3\u003c/b> \u003cinput type=\"range\" id=\"wy\" min=\"-4\" max=\"4\" value=\"3\">\u003c/label>\u003c/div>\n\u003cdiv class=\"row\" id=\"krow\" style=\"display:none\">\u003clabel>k = \u003cb id=\"o5\">2\u003c/b> \u003cinput type=\"range\" id=\"kk\" min=\"-3\" max=\"3\" step=\"0.5\" value=\"2\">\u003c/label>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cV\" width=\"640\" height=\"300\">\u003c/canvas>\n\u003cdiv id=\"vt\" class=\"big\">\u003c/div>\n\u003cdiv class=\"k\">Add: place w at the tip of v (tip-to-tail). Scale: k stretches (k&gt;1), shrinks (0&lt;k&lt;1), or flips (k&lt;0) the arrow.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>3. Dot product: \"how much do they agree?\"\u003c/h3>\n\u003cdiv class=\"k\">\u003cb>v · w = v₁w₁ + v₂w₂ = |v||w|cos θ\u003c/b>\u003c/div>\n\u003cdiv class=\"row\">\u003clabel>angle of w: \u003cb id=\"da\">45\u003c/b>° \u003cinput type=\"range\" id=\"dA\" min=\"0\" max=\"180\" value=\"45\">\u003c/label>\u003clabel>length of w: \u003cb id=\"dl\">3\u003c/b> \u003cinput type=\"range\" id=\"dL\" min=\"1\" max=\"4\" step=\"0.5\" value=\"3\">\u003c/label>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cD\" width=\"640\" height=\"280\">\u003c/canvas>\n\u003cdiv id=\"dt\" class=\"big\">\u003c/div>\n\u003cp class=\"m\">Positive = pointing the same way · 0 = perpendicular · negative = opposite. ML uses it as a similarity score.\u003c/p>\n\u003cpre>np.dot(v, w)    # or v @ w\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>4. Matrix addition &amp; multiplication\u003c/h3>\n\u003cdiv class=\"row\">\u003cbutton class=\"b on\" id=\"p1\" onclick=\"mop('add')\">A + B (cell by cell)\u003c/button>\u003cbutton class=\"b o\" id=\"p2\" onclick=\"mop('mul')\">A @ B (row × column)\u003c/button>\u003c/div>\n\u003cdiv class=\"row\" style=\"align-items:flex-start\">\u003cdiv>\u003cb>A\u003c/b>\u003cdiv class=\"g\" id=\"xA\">\u003c/div>\u003c/div>\u003cb id=\"opn\">+\u003c/b>\u003cdiv>\u003cb>B\u003c/b>\u003cdiv class=\"g\" id=\"xB\">\u003c/div>\u003c/div>\u003cb>=\u003c/b>\u003cdiv>\u003cb>C\u003c/b>\u003cdiv class=\"g\" id=\"xC\">\u003c/div>\u003c/div>\u003c/div>\n\u003cdiv id=\"xt\" class=\"big\">\u003c/div>\n\u003cdiv class=\"k\">Multiply rule: (m×n) @ (n×p) → (m×p). Inner numbers must match. A@B ≠ B@A in general.\u003c/div>\n\u003cp>\u003cb>Transpose\u003c/b>: flip over the diagonal, rows ⇄ columns.\u003c/p>\n\u003cbutton class=\"b\" onclick=\"tr()\">↻ Transpose\u003c/button>\u003cdiv class=\"g\" id=\"tg\" style=\"margin:8px 0\">\u003c/div>\u003cdiv id=\"tt\" class=\"m\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>✍ Day 11: implement with NumPy (hide outputs, then test yourself)\u003c/h3>\n\u003cp class=\"m\">v=[1,2,3] · w=[4,5,6] · A=[[1,2],[3,4]] · B=[[5,6],[7,8]] · \u003cbutton class=\"b o\" onclick=\"$('ops').classList.toggle('hide')\">Hide / show outputs\u003c/button>\u003c/p>\n\u003ctable id=\"ops\" class=\"hide\">\u003ctr>\u003cth>#\u003c/th>\u003cth>Code\u003c/th>\u003cth>Output\u003c/th>\u003c/tr>\u003c/table>\n\u003cdetails>\u003csummary>Full practice script\u003c/summary>\u003cpre>import numpy as np\nv = np.array([1,2,3]); w = np.array([4,5,6])\nA = np.array([[1,2],[3,4]]); B = np.array([[5,6],[7,8]])\nprint(v + w, 3*v, v @ w)\nprint(A + B); print(A @ B); print(A.T)\u003c/pre>\u003c/details>\u003c/div>\n\n\u003ch2 id=\"d12\">DAY 12: Linear Algebra II\u003c/h2>\n\n\u003cdiv class=\"c\">\u003ch3>The big idea: a matrix MOVES space\u003c/h3>\n\u003cdiv class=\"k\">A 2×2 matrix [[a,b],[c,d]] takes the arrows \u003cb style=\"color:#f97316\">i = (1,0)\u003c/b> to \u003cb>(a,c)\u003c/b> and \u003cb style=\"color:#22c55e\">j = (0,1)\u003c/b> to \u003cb>(b,d)\u003c/b>. Everything else follows. Move the sliders or press a preset:\u003c/p>\u003c/div>\n\u003cdiv class=\"row\" id=\"pre\">\u003c/div>\n\u003cdiv class=\"row\">\u003clabel>a \u003cb id=\"ta\">1\u003c/b> \u003cinput type=\"range\" id=\"sa\" min=\"-4\" max=\"4\" step=\"0.1\" value=\"1\">\u003c/label>\u003clabel>b \u003cb id=\"tb\">0\u003c/b> \u003cinput type=\"range\" id=\"sb\" min=\"-4\" max=\"4\" step=\"0.1\" value=\"0\">\u003c/label>\u003clabel>c \u003cb id=\"tc\">0\u003c/b> \u003cinput type=\"range\" id=\"sc\" min=\"-4\" max=\"4\" step=\"0.1\" value=\"0\">\u003c/label>\u003clabel>d \u003cb id=\"td\">1\u003c/b> \u003cinput type=\"range\" id=\"sd\" min=\"-4\" max=\"4\" step=\"0.1\" value=\"1\">\u003c/label>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cT\" width=\"640\" height=\"400\">\u003c/canvas>\n\u003cdiv class=\"m\">\u003cspan style=\"color:#f97316\">■ i-hat\u003c/span> · \u003cspan style=\"color:#22c55e\">■ j-hat\u003c/span> · shaded = unit square · \u003cspan style=\"color:#facc15\">- - eigen-direction 1\u003c/span> · \u003cspan style=\"color:#ec4899\">- - eigen-direction 2\u003c/span>\u003c/div>\n\u003ctable style=\"margin-top:8px;width:100%\">\u003ctr>\u003ctd>\u003cb>Identity I\u003c/b>\u003c/td>\u003ctd>[[1,0],[0,1]]: changes nothing (like multiplying by 1)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>Determinant\u003c/b>\u003c/td>\u003ctd id=\"r1\">\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Inverse A⁻¹\u003c/b>\u003c/td>\u003ctd id=\"r2\">\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Rank\u003c/b>\u003c/td>\u003ctd id=\"r3\">\u003c/td>\u003c/tr>\u003ctr>\u003ctd>\u003cb>Eigen\u003c/b>\u003c/td>\u003ctd id=\"r4\">\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>What each word means\u003c/h3>\n\u003ctable>\u003ctr>\u003cth>Term\u003c/th>\u003cth>Meaning in one line\u003c/th>\u003cth>Picture\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Identity\u003c/td>\u003ctd>A·I = A\u003c/td>\u003ctd>Grid unchanged\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Determinant\u003c/td>\u003ctd>Area scale factor of the square. Negative = flipped. 0 = squashed flat\u003c/td>\u003ctd>Shaded square size\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Inverse\u003c/td>\u003ctd>Matrix that undoes A: A⁻¹A = I. Exists only if det ≠ 0\u003c/td>\u003ctd>Rewind the move\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Rank\u003c/td>\u003ctd>Number of independent columns = dimension of the output\u003c/td>\u003ctd>2 plane · 1 line · 0 point\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Eigenvector\u003c/td>\u003ctd>Direction that only stretches: A·v = λ·v\u003c/td>\u003ctd>Dashed lines stay on their line\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Eigenvalue λ\u003c/td>\u003ctd>The stretch factor along that direction\u003c/td>\u003ctd>How far the arrow grows\u003c/td>\u003c/tr>\u003c/table>\n\u003cpre>np.eye(2)                 # identity\nnp.linalg.det(A)          # determinant\nnp.linalg.inv(A)          # inverse\nnp.linalg.matrix_rank(A)  # rank\nvals, vecs = np.linalg.eig(A)   # eigenvalues, eigenvectors (columns)\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"c\" id=\"why\">\u003ch3>Why datasets, weights and predictions use matrices\u003c/h3>\n\u003cdiv class=\"k\">Dataset X = table (rows = samples, columns = features). Weights w = importance of each feature. \u003cb>Predictions ŷ = X @ w\u003c/b>: ONE multiplication gives ALL predictions.\u003c/div>\n\u003cp>🎮 Game: House data (size, rooms). Find weights so predictions match the real price (error → 0):\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>w₁ (size) \u003cb id=\"g1\">1\u003c/b> \u003cinput type=\"range\" id=\"w1\" min=\"0\" max=\"4\" step=\"0.1\" value=\"1\">\u003c/label>\u003clabel>w₂ (rooms) \u003cb id=\"g2\">1\u003c/b> \u003cinput type=\"range\" id=\"w2\" min=\"0\" max=\"4\" step=\"0.1\" value=\"1\">\u003c/label>\u003c/div>\n\u003cdiv id=\"why1\">\u003c/div>\u003cdiv id=\"wt\" class=\"big\">\u003c/div>\n\u003cdiv class=\"four\" style=\"margin-top:10px\">\u003cdiv>📊 Dataset\u003cbr>\u003cspan class=\"m\">matrix X (n×features)\u003c/span>\u003c/div>\u003cdiv>⚖ Weights\u003cbr>\u003cspan class=\"m\">matrix W\u003c/span>\u003c/div>\u003cdiv>🖼 Image\u003cbr>\u003cspan class=\"m\">matrix of pixels\u003c/span>\u003c/div>\u003cdiv>🧠 Neural layer\u003cbr>\u003cspan class=\"m\">X @ W + b\u003c/span>\u003c/div>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>✍ Day 12 practice (tap to check)\u003c/h3>\n\u003cdetails>\u003csummary>Q1. det of [[2,1],[1,3]]?\u003c/summary>2×3 − 1×1 = \u003cb>5\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q2. Inverse of [[2,0],[0,4]]?\u003c/summary>Invert each diagonal item: \u003cb>[[0.5,0],[0,0.25]]\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q3. Rank of [[1,2],[2,4]]?\u003c/summary>Column 2 = 2 × column 1, so only one independent column: \u003cb>rank 1\u003c/b> (det = 0, no inverse)\u003c/details>\n\u003cdetails>\u003csummary>Q4. Eigenvalues of [[4,1],[2,3]]?\u003c/summary>trace 7, det 10 → λ² − 7λ + 10 = 0 → \u003cb>λ = 5 and 2\u003c/b>. Eigenvectors: (1,1) for 5, (1,−2) for 2. Check: A(1,1) = (5,5) ✓\u003c/details>\n\u003cdetails>\u003csummary>Q5. NumPy check of Q4\u003c/summary>\u003cpre>A = np.array([[4,1],[2,3]])\nnp.linalg.det(A)      # 10.0\nnp.linalg.inv(A)      # [[ 0.3 -0.1] [-0.2  0.4]]\nvals, vecs = np.linalg.eig(A)   # vals [5. 2.] (order may vary)\n# vecs columns ≈ [0.707, 0.707] and [0.447, -0.894]\u003c/pre>\u003c/details>\u003c/div>\n\u003c/main>\n\u003cscript>\nconst $=i=>document.getElementById(i),col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst T={galaxy:['🌌 Galaxy','#0b0620','rgba(28,16,66,.78)','#f1edff','#b8b0e8','#a78bfa','#60a5fa'],\nhole:['🕳 Black Hole','#050505','rgba(22,12,6,.82)','#fff3e6','#d9b99a','#ff9a3c','#ffe2b0'],\nnova:['💥 Supernova','#1a0505','rgba(54,12,8,.8)','#fff0e0','#f0b8a0','#ff5a2c','#ffd23c'],\naurora:['🌿 Aurora','#03130f','rgba(6,44,38,.78)','#eafff8','#9fd8c8','#2ee6a6','#2cc6d8'],\nneon:['🌆 Cyberpunk','#0a0612','rgba(22,10,40,.82)','#f6eaff','#c4a3e6','#ff2bd6','#18f0ff'],\nocean:['🌊 Deep Ocean','#021426','rgba(4,38,70,.78)','#e6f6ff','#9cc8e6','#38bdf8','#2dd4bf'],\nsunset:['🌇 Sunset Retro','#2a0f3a','rgba(70,22,60,.78)','#fff1e6','#f5c6b8','#ff8a3d','#ff5fa2'],\npaper:['📄 Light Paper','#f6f3ea','rgba(255,255,255,.9)','#1f2430','#555b6b','#4f46e5','#0d9488']};\nlet mode='galaxy';\nObject.keys(T).forEach(k=>{const b=document.createElement('button');b.textContent=T[k][0];b.onclick=()=>setT(k);b.id='t_'+k;$('ths').appendChild(b)});\nfunction setT(k){mode=k;const v=T[k],s=document.documentElement.style;['bg','card','tx','mut','a','b'].forEach((n,i)=>s.setProperty('--'+n,v[i+1]));\ndocument.querySelectorAll('.ths button').forEach(b=>b.classList.toggle('on',b.id=='t_'+k));initP();redraw()}\nconst bg=$('bg'),g=bg.getContext('2d');let W,H,P=[],t=0;\nfunction initP(){P=[];const n={galaxy:150,hole:260,nova:170,ocean:50}[mode]||60;for(let i=0;i\u003cn;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random(),a:Math.random()*6.28,d:70+Math.random()*Math.min(W,H)*.5})}\nfunction rs(){W=bg.width=innerWidth;H=bg.height=innerHeight;initP()}addEventListener('resize',rs);\nfunction lg(y0,y1,st){const q=g.createLinearGradient(0,y0,0,y1);st.forEach((c,i)=>q.addColorStop(i/(st.length-1),c));return q}\nfunction loop(){t+=.016;const cx=W/2,cy=H/2;g.globalCompositeOperation='source-over';\nif(mode=='galaxy'){const q=g.createRadialGradient(W*.3,H*.3,0,W*.5,H*.5,W);q.addColorStop(0,'#3a1a7a');q.addColorStop(.5,'#0f0a3a');q.addColorStop(1,'#050314');g.fillStyle=q;g.fillRect(0,0,W,H);P.forEach(p=>{g.globalAlpha=.4+.6*Math.abs(Math.sin(t*2+p.a));g.fillStyle='#fff';g.fillRect(p.x,p.y,p.r*2+.5,p.r*2+.5)})}\nelse if(mode=='hole'){g.fillStyle='#030303';g.fillRect(0,0,W,H);const q=g.createRadialGradient(cx,cy,30,cx,cy,260);q.addColorStop(0,'rgba(255,200,120,.5)');q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(0,0,W,H);\nP.forEach(p=>{const a=p.a+t*90/p.d,x=cx+Math.cos(a)*p.d*1.2,y=cy+Math.sin(a)*p.d*.3;g.globalAlpha=.8;g.fillStyle=`hsl(${25+Math.min(30,2000/p.d)},100%,${60+20*Math.sin(a)}%)`;g.fillRect(x,y,2.2,2.2)});\ng.globalAlpha=1;g.fillStyle='#000';g.beginPath();g.arc(cx,cy,42,0,7);g.fill();g.strokeStyle='#ffd9a0';g.lineWidth=2;g.stroke()}\nelse if(mode=='nova'){g.fillStyle='#1a0505';g.fillRect(0,0,W,H);const M=Math.max(W,H)*.6;P.forEach(p=>{const r=(t*60*(.3+p.r)+p.d)%M,x=cx+Math.cos(p.a)*r,y=cy+Math.sin(p.a)*r;g.globalAlpha=1-r/M;g.fillStyle=`hsl(${55-r/M*55},100%,55%)`;g.beginPath();g.arc(x,y,1+p.r*3,0,7);g.fill()})}\nelse if(mode=='aurora'){g.fillStyle='#03130f';g.fillRect(0,0,W,H);g.globalCompositeOperation='lighter';g.globalAlpha=1;\nfor(let k=0;k\u003c3;k++){const y0=H*.15+k*50;g.fillStyle=lg(y0,y0+260,['rgba(0,0,0,0)',k%2?'rgba(44,198,216,.28)':'rgba(46,230,166,.3)','rgba(0,0,0,0)']);g.beginPath();g.moveTo(0,y0);\nfor(let x=0;x\u003c=W;x+=14)g.lineTo(x,y0+Math.sin(x*.004+t*.6+k*2)*60);for(let x=W;x>=0;x-=14)g.lineTo(x,y0+200+Math.sin(x*.007+t*.8+k)*50);g.fill()}\ng.globalCompositeOperation='source-over';g.fillStyle='#fff';P.forEach(p=>{g.globalAlpha=.3+.3*Math.sin(t+p.a);g.fillRect(p.x,p.y*.5,1.5,1.5)})}\nelse if(mode=='neon'){g.fillStyle='#0a0612';g.fillRect(0,0,W,H);const hz=H*.55;g.globalAlpha=1;const q=g.createRadialGradient(cx,hz,0,cx,hz,130);q.addColorStop(0,'#ff2bd6');q.addColorStop(1,'rgba(255,43,214,0)');g.fillStyle=q;g.fillRect(0,hz-140,W,140);\ng.lineWidth=1.2;g.strokeStyle='#18f0ff';g.globalAlpha=.55;for(let i=-24;i\u003c=24;i++){g.beginPath();g.moveTo(cx+i*14,hz);g.lineTo(cx+i*W*.1,H);g.stroke()}\ng.strokeStyle='#ff2bd6';for(let j=0;j\u003c12;j++){const y=hz+(((j+t*.6)%12)/12)**2*(H-hz);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}}\nelse if(mode=='ocean'){g.fillStyle=lg(0,H,['#04406a','#021426','#010a14']);g.fillRect(0,0,W,H);P.forEach(p=>{const y=((p.y-t*(15+p.r*40))%H+H)%H,x=p.x+Math.sin(t+p.a)*15,r=3+p.r*14;g.globalAlpha=.5;g.strokeStyle='#5eead4';g.lineWidth=1.3;g.beginPath();g.arc(x,y,r,0,7);g.stroke();g.globalAlpha=.1;g.fillStyle='#38bdf8';g.fill()})}\nelse if(mode=='sunset'){g.fillStyle=lg(0,H,['#2a0f3a','#c2306b','#ff8a3d']);g.fillRect(0,0,W,H);const q=g.createRadialGradient(cx,H*.68,10,cx,H*.68,180);q.addColorStop(0,'rgba(255,230,150,.95)');q.addColorStop(.4,'rgba(255,140,60,.5)');q.addColorStop(1,'rgba(255,100,100,0)');g.fillStyle=q;g.fillRect(0,0,W,H);P.forEach(p=>{g.globalAlpha=.5;g.fillStyle='#fff';g.fillRect((p.x+t*10*p.r)%W,p.y*.5,2,2)})}\nelse{g.fillStyle='#f6f3ea';g.fillRect(0,0,W,H);P.forEach(p=>{g.globalAlpha=.12;g.fillStyle='#4f46e5';g.beginPath();g.arc((p.x+t*8*p.r)%W,(p.y+Math.sin(t+p.a)*10),2+p.r*4,0,7);g.fill()})}\ng.globalAlpha=1;requestAnimationFrame(loop)}\n/* helpers */\nconst ce=(v,c='')=>`\u003cdiv class=\"cell ${c}\">${v}\u003c/div>`;\nfunction cv(id,sc){const c=$(id),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);return{x,w,h,X:u=>w/2+u*sc,Y:u=>h/2-u*sc,sc}}\nfunction grid(o,step=1){const{x,w,h,X,Y,sc}=o;x.lineWidth=1;x.strokeStyle=col('--tx');x.globalAlpha=.12;for(let i=-12;i\u003c=12;i+=step){x.beginPath();x.moveTo(X(i),0);x.lineTo(X(i),h);x.stroke();x.beginPath();x.moveTo(0,Y(i));x.lineTo(w,Y(i));x.stroke()}x.globalAlpha=.5;x.beginPath();x.moveTo(0,Y(0));x.lineTo(w,Y(0));x.moveTo(X(0),0);x.lineTo(X(0),h);x.stroke();x.globalAlpha=1}\nfunction arr(o,x0,y0,x1,y1,c,l,lw=3,dash){const{x,X,Y}=o;x.strokeStyle=c;x.fillStyle=c;x.lineWidth=lw;x.setLineDash(dash||[]);x.beginPath();x.moveTo(X(x0),Y(y0));x.lineTo(X(x1),Y(y1));x.stroke();x.setLineDash([]);\nif(Math.hypot(x1-x0,y1-y0)\u003c.05)return;const a=Math.atan2(-(y1-y0),x1-x0),px=X(x1),py=Y(y1);x.beginPath();x.moveTo(px,py);x.lineTo(px-11*Math.cos(a-.4),py-11*Math.sin(a-.4));x.lineTo(px-11*Math.cos(a+.4),py-11*Math.sin(a+.4));x.fill();\nif(l){x.font='bold 14px system-ui';x.fillText(l,px+7,py-7)}}\n/* 1 four */\n$('four').innerHTML=`\u003cdiv>\u003cb>Scalar\u003c/b>${ce(5)}\u003cdiv class=\"m\">0D · one number\u003c/div>\u003c/div>\n\u003cdiv>\u003cb>Vector\u003c/b>\u003cdiv class=\"g\" style=\"grid-template-columns:repeat(3,36px);margin:auto\">${[2,3,4].map(v=>ce(v)).join('')}\u003c/div>\u003cdiv class=\"m\">1D · a list\u003c/div>\u003c/div>\n\u003cdiv>\u003cb>Matrix\u003c/b>\u003cdiv class=\"g\" style=\"grid-template-columns:repeat(3,36px);margin:auto\">${[1,2,3,4,5,6].map(v=>ce(v)).join('')}\u003c/div>\u003cdiv class=\"m\">2D · a table\u003c/div>\u003c/div>\n\u003cdiv>\u003cb>Tensor\u003c/b>\u003cdiv style=\"display:flex;gap:6px;justify-content:center\">${[0,1].map(()=>`\u003cdiv class=\"g\" style=\"grid-template-columns:repeat(2,26px);gap:3px\">${[1,2,3,4].map(v=>`\u003cdiv class=\"cell\" style=\"min-width:26px;height:26px;font-size:12px\">${v}\u003c/div>`).join('')}\u003c/div>`).join('')}\u003c/div>\u003cdiv class=\"m\">3D+ · stack of tables (images, batches)\u003c/div>\u003c/div>`;\n/* 2 vectors */\nlet vmode='add';\nfunction vm(m){vmode=m;$('m1').className='b '+(m=='add'?'on':'o');$('m2').className='b '+(m=='sc'?'on':'o');$('wrow').style.display=m=='add'?'':'none';$('krow').style.display=m=='sc'?'':'none';vec()}\nfunction vec(){const vx=+$('vx').value,vy=+$('vy').value,wx=+$('wx').value,wy=+$('wy').value,k=+$('kk').value;[vx,vy,wx,wy,k].forEach((v,i)=>$('o'+(i+1)).textContent=v);\nconst o=cv('cV',32);grid(o);\nif(vmode=='add'){arr(o,0,0,vx,vy,'#f97316','v');arr(o,0,0,wx,wy,'#22c55e','w',2,[6,5]);arr(o,vx,vy,vx+wx,vy+wy,'#22c55e','w',3);arr(o,0,0,vx+wx,vy+wy,'#facc15','v+w',4);\n$('vt').textContent=`(${vx}, ${vy}) + (${wx}, ${wy}) = (${vx+wx}, ${vy+wy})`}\nelse{arr(o,0,0,vx,vy,'#f97316','v');arr(o,0,0,k*vx,k*vy,'#facc15','k·v',4);$('vt').textContent=`${k} × (${vx}, ${vy}) = (${k*vx}, ${k*vy})`}}\n['vx','vy','wx','wy','kk'].forEach(i=>$(i).oninput=vec);\n/* 3 dot */\nfunction dot(){const A=+$('dA').value,L=+$('dL').value;$('da').textContent=A;$('dl').textContent=L;const o=cv('cD',50),r=A*Math.PI/180,wx=L*Math.cos(r),wy=L*Math.sin(r),d=4*wx,{x}=o;\narr(o,0,0,4,0,'#f97316','v=(4,0)');arr(o,0,0,wx,wy,'#22c55e','w');\nx.strokeStyle='#facc15';x.lineWidth=7;x.globalAlpha=.8;x.beginPath();x.moveTo(o.X(0),o.Y(0)+10);x.lineTo(o.X(wx),o.Y(0)+10);x.stroke();x.globalAlpha=1;x.setLineDash([4,4]);x.lineWidth=1.5;x.strokeStyle=col('--tx');x.beginPath();x.moveTo(o.X(wx),o.Y(wy));x.lineTo(o.X(wx),o.Y(0));x.stroke();x.setLineDash([]);\n$('dt').textContent=`v·w = 4×${wx.toFixed(2)} + 0×${wy.toFixed(2)} = ${d.toFixed(2)}  →  ${Math.abs(d)\u003c.05?'perpendicular (0)':d>0?'same direction (+)':'opposite (−)'}`}\n$('dA').oninput=dot;$('dL').oninput=dot;\n/* 4 matrix ops */\nconst MA=[[1,2],[3,4]],MB=[[5,6],[7,8]];let xm='add';\nfunction mop(m,ci,cj){xm=m;$('p1').className='b '+(m=='add'?'on':'o');$('p2').className='b '+(m=='mul'?'on':'o');$('opn').textContent=m=='add'?'+':'@';\n['xA','xB','xC'].forEach(i=>$(i).style.gridTemplateColumns='repeat(2,48px)');ci=ci??0;cj=cj??0;const f=(M,h)=>M.map((r,i)=>r.map((v,j)=>ce(v,h(i,j)?'hit':'')).join('')).join('');\n$('xA').innerHTML=f(MA,(i,j)=>m=='add'?i==ci&&j==cj:i==ci);$('xB').innerHTML=f(MB,(i,j)=>m=='add'?i==ci&&j==cj:j==cj);\nconst C=(i,j)=>m=='add'?MA[i][j]+MB[i][j]:MA[i][0]*MB[0][j]+MA[i][1]*MB[1][j];\n$('xC').innerHTML=[0,1].map(i=>[0,1].map(j=>`\u003cdiv class=\"cell ${i==ci&&j==cj?'hit':''}\" style=\"cursor:pointer\" onclick=\"mop('${m}',${i},${j})\">${C(i,j)}\u003c/div>`).join('')).join('');\n$('xt').textContent=m=='add'?`C[${ci},${cj}] = ${MA[ci][cj]} + ${MB[ci][cj]} = ${C(ci,cj)}`:`C[${ci},${cj}] = ${MA[ci][0]}×${MB[0][cj]} + ${MA[ci][1]}×${MB[1][cj]} = ${C(ci,cj)}`}\nlet tp=0;function tr(){tp=1-tp;const R=tp?[[1,4],[2,5],[3,6]]:[[1,2,3],[4,5,6]];$('tg').style.gridTemplateColumns=`repeat(${R[0].length},44px)`;$('tg').innerHTML=R.flat().map((v,i)=>`\u003cdiv class=\"cell hit\" style=\"min-width:44px;animation:pop .4s ${i*.05}s both\">${v}\u003c/div>`).join('');$('tt').textContent=tp?'M.T → shape (3,2)':'M → shape (2,3)'}\nconst OPS=[['np.ndim(5)','0'],['v.shape','(3,)'],['A.shape','(2, 2)'],['np.zeros((2,3,4)).ndim','3'],['v + w','[5 7 9]'],['3 * v','[3 6 9]'],['v @ w','32'],['A + B','[[ 6  8]\\n [10 12]]'],['A @ B','[[19 22]\\n [43 50]]'],['A.T','[[1 3]\\n [2 4]]']];\nOPS.forEach((o,i)=>{const r=$('ops').insertRow();r.innerHTML=`\u003ctd>${i+1}\u003c/td>\u003ctd>\u003ccode>${o[0]}\u003c/code>\u003c/td>\u003ctd onclick=\"this.style.filter='none'\">\u003cpre style=\"margin:0;background:none;color:inherit;padding:0\">${o[1]}\u003c/pre>\u003c/td>`});\n/* 5 transform */\nlet M=[1,0,0,1],raf=0;const PRE={Identity:[1,0,0,1],Scale:[2,0,0,1.5],'Rotate 45°':[.71,-.71,.71,.71],Shear:[1,1,0,1],Flip:[-1,0,0,1],'Squash (rank 1)':[1,2,.5,1],'Eigen demo':[2,1,1,2]};\nObject.keys(PRE).forEach(k=>{const b=document.createElement('button');b.className='b o';b.textContent=k;b.onclick=()=>anim(PRE[k]);$('pre').appendChild(b)});\nfunction anim(to){cancelAnimationFrame(raf);const from=M.slice();let s=0;const f=()=>{s++;const u=Math.min(1,s/28),e=u*u*(3-2*u);M=from.map((v,i)=>v+(to[i]-v)*e);['a','b','c','d'].forEach((n,i)=>$('s'+n).value=M[i]);tf();if(u\u003c1)raf=requestAnimationFrame(f)};f()}\n['a','b','c','d'].forEach((n,i)=>$('s'+n).oninput=()=>{M[i]=+$('s'+n).value;tf()});\nfunction tf(){const[a,b,c,d]=M;['a','b','c','d'].forEach((n,i)=>$('t'+n).textContent=M[i].toFixed(1));const o=cv('cT',38),{x}=o,mp=(p,q)=>[a*p+b*q,c*p+d*q];\nx.lineWidth=1;x.strokeStyle=col('--tx');x.globalAlpha=.1;for(let i=-9;i\u003c=9;i++){x.beginPath();x.moveTo(o.X(i),0);x.lineTo(o.X(i),o.h);x.stroke();x.beginPath();x.moveTo(0,o.Y(i));x.lineTo(o.w,o.Y(i));x.stroke()}\nx.strokeStyle=col('--b');x.globalAlpha=.45;for(let i=-9;i\u003c=9;i++){let p=mp(i,-9),q=mp(i,9);x.beginPath();x.moveTo(o.X(p[0]),o.Y(p[1]));x.lineTo(o.X(q[0]),o.Y(q[1]));x.stroke();p=mp(-9,i);q=mp(9,i);x.beginPath();x.moveTo(o.X(p[0]),o.Y(p[1]));x.lineTo(o.X(q[0]),o.Y(q[1]));x.stroke()}\nx.globalAlpha=.35;x.fillStyle=col('--a');x.beginPath();[[0,0],[1,0],[1,1],[0,1]].forEach((p,i)=>{const q=mp(...p);i?x.lineTo(o.X(q[0]),o.Y(q[1])):x.moveTo(o.X(q[0]),o.Y(q[1]))});x.closePath();x.fill();x.globalAlpha=1;\nconst det=a*d-b*c,tr=a+d,disc=tr*tr/4-det,ev=[];\nif(disc>=-1e-9){const s=Math.sqrt(Math.max(0,disc)),ls=[tr/2+s,tr/2-s];const vecOf=l=>Math.abs(b)>1e-6?[b,l-a]:Math.abs(c)>1e-6?[l-d,c]:Math.abs(l-a)\u003c1e-6?[1,0]:[0,1];\nif(s\u003c1e-6&&Math.abs(b)\u003c1e-6&&Math.abs(c)\u003c1e-6)ev.push({all:1,l:ls[0]});else{ev.push({l:ls[0],v:vecOf(ls[0])});if(s>1e-6)ev.push({l:ls[1],v:vecOf(ls[1])})}}\nconst cs=['#facc15','#ec4899'];ev.forEach((e,i)=>{if(e.all)return;const n=Math.hypot(...e.v);e.u=[e.v[0]/n,e.v[1]/n];x.globalAlpha=.9;x.strokeStyle=cs[i];x.lineWidth=2;x.setLineDash([8,6]);x.beginPath();x.moveTo(o.X(-12*e.u[0]),o.Y(-12*e.u[1]));x.lineTo(o.X(12*e.u[0]),o.Y(12*e.u[1]));x.stroke();x.setLineDash([])});\narr(o,0,0,a,c,'#f97316','i',4);arr(o,0,0,b,d,'#22c55e','j',4);\nconst f=v=>(Math.abs(v)\u003c5e-4?0:v).toFixed(2);\n$('r1').innerHTML=`ad − bc = \u003cb>${f(det)}\u003c/b> → ${Math.abs(det)\u003c1e-6?'squashed flat (area 0)':det\u003c0?`area × ${f(Math.abs(det))} and FLIPPED`:`area × ${f(det)}`}`;\n$('r2').innerHTML=Math.abs(det)\u003c1e-6?'\u003cb>None\u003c/b> (det = 0, cannot undo a squash)':`(1/${f(det)}) × [[d,−b],[−c,a]] = \u003cb>[[${f(d/det)}, ${f(-b/det)}], [${f(-c/det)}, ${f(a/det)}]]\u003c/b>`;\nconst z=Math.max(...M.map(Math.abs))\u003c1e-6,rk=z?0:Math.abs(det)\u003c1e-6?1:2;$('r3').innerHTML=`\u003cb>${rk}\u003c/b> → output is a ${['point','line','full plane'][rk]}`;\n$('r4').innerHTML=!ev.length?'\u003cb>No real eigenvectors\u003c/b>: this matrix rotates every direction':ev[0].all?`\u003cb>λ = ${f(ev[0].l)}\u003c/b>: EVERY direction is an eigenvector (pure scaling)`:ev.map((e,i)=>`\u003cspan style=\"color:${cs[i]}\">■\u003c/span> λ = \u003cb>${f(e.l)}\u003c/b>, v ≈ (${f(e.u[0])}, ${f(e.u[1])})`).join('\u003cbr>')+'\u003cbr>\u003cspan class=\"m\">A·v = λ·v: the arrow stays on its dashed line\u003c/span>'}\n/* 6 why */\nconst X=[[1,2],[1.5,3],[2,3],[2.5,4]],Y=[5,7.5,8.5,11];\nfunction why(){const w1=+$('w1').value,w2=+$('w2').value;$('g1').textContent=w1;$('g2').textContent=w2;let err=0;\n$('why1').innerHTML='\u003ctable>\u003ctr>\u003cth>size\u003c/th>\u003cth>rooms\u003c/th>\u003cth>ŷ = X@w\u003c/th>\u003cth>real y\u003c/th>\u003c/tr>'+X.map((r,i)=>{const p=r[0]*w1+r[1]*w2;err+=(p-Y[i])**2;return`\u003ctr>\u003ctd>${r[0]}\u003c/td>\u003ctd>${r[1]}\u003c/td>\u003ctd>\u003cb>${p.toFixed(2)}\u003c/b>\u003c/td>\u003ctd>${Y[i]}\u003c/td>\u003c/tr>`}).join('')+'\u003c/table>';\n$('wt').textContent=err\u003c.02?`Error = ${err.toFixed(2)} 🎉 Perfect weights!`:`Total squared error = ${err.toFixed(2)}. Slide to reduce it.`}\n$('w1').oninput=why;$('w2').oninput=why;\nfunction redraw(){vec();dot();tf()}\ndocument.querySelectorAll('.c').forEach(c=>new IntersectionObserver((es,o)=>{if(es[0].isIntersecting){c.classList.add('in');o.disconnect()}},{threshold:.05}).observe(c));\nrs();mop('add');tr();tr();why();setT('galaxy');loop();\n\u003c/script>\u003c/body>\u003c/html>\n", "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Day 13-14: Calculus &amp; Linear Regression\u003c/title>\n\u003cstyle>\n:root{--bg:#0b0620;--card:rgba(28,16,66,.78);--tx:#f1edff;--mut:#b8b0e8;--a:#a78bfa;--b:#60a5fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml{scroll-padding-top:90px;scroll-behavior:smooth}\nbody{margin:0;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--tx);background:var(--bg)}\n#bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%}\nheader{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);backdrop-filter:blur(10px);padding:8px 10px;border-bottom:1px solid var(--a)}\n.ths{display:flex;gap:6px;overflow-x:auto}\n.ths button{flex:none;border:1px solid var(--a);background:transparent;color:var(--tx);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:13px}\n.ths button.on{background:var(--a);color:#000;font-weight:700}\nmain{max-width:860px;margin:auto;padding:12px 14px 60px}\nh1{font-size:clamp(26px,6vw,42px);margin:18px 0 4px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}\nh2{margin:34px 0 4px;color:var(--a)}h3{margin:0 0 6px;color:var(--b)}\n.c{background:var(--card);border:1px solid color-mix(in srgb,var(--a) 40%,transparent);border-radius:16px;padding:16px;margin:14px 0;backdrop-filter:blur(8px);opacity:0;transform:translateY(24px);transition:.7s}\n.c.in{opacity:1;transform:none}\n.k{border-left:4px solid var(--b);padding:6px 12px;margin:8px 0;background:color-mix(in srgb,var(--b) 14%,transparent);border-radius:0 10px 10px 0}\n.m{color:var(--mut);font-size:14px}\nbutton.b{background:var(--a);color:#000;border:0;border-radius:10px;padding:7px 12px;margin:3px 2px;cursor:pointer;font-weight:600;font-size:14px}\nbutton.b.o{background:transparent;color:var(--tx);border:1px solid var(--a)}\nbutton.b.on{background:var(--b)}\ninput[type=range]{width:min(100%,180px);accent-color:var(--a);vertical-align:middle}\n.row{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:6px 0}\npre{background:rgba(0,0,0,.45);color:#e8e8ff;border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:13px;line-height:1.5;margin:8px 0}\ncode{background:rgba(127,127,127,.22);padding:1px 6px;border-radius:5px}\n.big{font-size:17px;font-weight:700;color:var(--b)}\ncanvas.ch{width:100%;background:rgba(127,127,127,.08);border-radius:10px;touch-action:none}\ntable{border-collapse:collapse;font-size:13px;max-width:100%}td,th{border:1px solid color-mix(in srgb,var(--a) 45%,transparent);padding:3px 9px;text-align:left}\n.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}\n.fb{padding:8px 12px;border-radius:10px;border:2px solid var(--a);transition:.4s;opacity:.45}\n.fb.go{opacity:1;background:var(--b);color:#000;box-shadow:0 0 14px var(--b);transform:scale(1.07)}\ndetails{margin:6px 0;border:1px dashed var(--a);border-radius:10px;padding:6px 10px}summary{cursor:pointer}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cheader>\u003cdiv class=\"ths\" id=\"ths\">\u003c/div>\u003c/header>\n\u003cmain>\n\u003ch1>Day 13 &amp; 14: Calculus + Linear Regression\u003c/h1>\n\u003cp class=\"m\">Zero to clear. Slide, drag, press Run: every picture is live. Jump: \u003ca href=\"#d13\" style=\"color:var(--b)\">Day 13\u003c/a> · \u003ca href=\"#gd\" style=\"color:var(--b)\">Gradient descent\u003c/a> · \u003ca href=\"#d14\" style=\"color:var(--b)\">Day 14\u003c/a>\u003c/p>\n\n\u003ch2 id=\"d13\">DAY 13: Calculus for ML\u003c/h2>\n\n\u003cdiv class=\"c\">\u003ch3>1. Function: an input → output machine\u003c/h3>\n\u003cdiv class=\"k\">f(x) = x² + 1. Put x in, get one answer out. A \u003cb>loss\u003c/b> in ML is also a function: weights in, error out.\u003c/div>\n\u003clabel>x = \u003cb id=\"fxv\">2\u003c/b> \u003cinput type=\"range\" id=\"fx\" min=\"-4\" max=\"4\" step=\"0.1\" value=\"2\">\u003c/label>\n\u003ccanvas class=\"ch\" id=\"cF\" width=\"640\" height=\"240\">\u003c/canvas>\u003cdiv id=\"ft\" class=\"big\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>2. Limit: \"where is it heading?\"\u003c/h3>\n\u003cp>f(x) = (x²−1)/(x−1). At x = 1 it is \u003cb>0/0, undefined\u003c/b> (open circle). But what happens as x creeps toward 1?\u003c/p>\n\u003clabel>distance h = \u003cb id=\"lkv\">1\u003c/b> \u003cinput type=\"range\" id=\"lk\" min=\"0\" max=\"3\" step=\"0.1\" value=\"0\">\u003c/label>\n\u003ccanvas class=\"ch\" id=\"cLm\" width=\"640\" height=\"240\">\u003c/canvas>\u003cdiv id=\"lt\" class=\"big\">\u003c/div>\n\u003cdiv class=\"k\">lim\u003csub>x→1\u003c/sub> f(x) = \u003cb>2\u003c/b>. A limit asks where the value is going, not what happens exactly at the point.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>3. Derivative: the slope at one point\u003c/h3>\n\u003cdiv class=\"k\">\u003cb>f′(x) = lim\u003csub>h→0\u003c/sub> [f(x+h) − f(x)] / h\u003c/b>: slope of the line through two points as they merge.\u003c/div>\n\u003cdiv class=\"row\" id=\"fb\">\u003c/div>\n\u003cdiv class=\"row\">\u003clabel>x = \u003cb id=\"dxv\">1\u003c/b> \u003cinput type=\"range\" id=\"dx\" min=\"-3\" max=\"3\" step=\"0.1\" value=\"1\">\u003c/label>\u003clabel>gap h: \u003cb id=\"dhv\">2\u003c/b> \u003cinput type=\"range\" id=\"dh\" min=\"0\" max=\"5\" value=\"0\">\u003c/label>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cD\" width=\"640\" height=\"300\">\u003c/canvas>\u003cdiv id=\"dtx\" class=\"big\">\u003c/div>\n\u003cp class=\"m\">\u003cspan style=\"color:#facc15\">━ secant (two points)\u003c/span> · \u003cspan style=\"color:#22c55e\">- - tangent (true slope)\u003c/span>. Slide h → 0 and the yellow line snaps onto the green one.\u003c/p>\n\u003cp class=\"m\">Rules: (xⁿ)′ = nxⁿ⁻¹ · (c)′ = 0 · (sin x)′ = cos x · slope &gt; 0 going up, &lt; 0 going down, = 0 at the bottom (minimum).\u003c/p>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>4. Partial derivative &amp; gradient\u003c/h3>\n\u003cp>Two inputs now: f(x, y) = x² + 2y² (a bowl, drawn as contour rings). \u003cb>Partial derivative\u003c/b> = slope while moving only ONE variable, freezing the other. \u003cb>Gradient\u003c/b> = both partials packed in a vector: it points \u003cb>uphill\u003c/b>.\u003c/p>\n\u003cp class=\"m\">Drag on the picture, or use sliders.\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>x \u003cb id=\"gxv\">3\u003c/b> \u003cinput type=\"range\" id=\"gx\" min=\"-4\" max=\"4\" step=\"0.1\" value=\"3\">\u003c/label>\u003clabel>y \u003cb id=\"gyv\">1.2\u003c/b> \u003cinput type=\"range\" id=\"gy\" min=\"-2\" max=\"2\" step=\"0.1\" value=\"1.2\">\u003c/label>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cG\" width=\"640\" height=\"340\">\u003c/canvas>\u003cdiv id=\"gtx\" class=\"big\">\u003c/div>\n\u003cp class=\"m\">\u003cspan style=\"color:#f97316\">■ ∇f (uphill)\u003c/span> · \u003cspan style=\"color:#22c55e\">■ −∇f (downhill: where we want to go)\u003c/span>\u003c/p>\u003c/div>\n\n\u003cdiv class=\"c\" id=\"gd\">\u003ch3>5. Gradient descent: walk downhill\u003c/h3>\n\u003cdiv class=\"k\">\u003cb>w_new = w − learning_rate × gradient\u003c/b>. Loss f(w) = (w−3)² + 1, so the best w is 3.\u003c/div>\n\u003cdiv class=\"flow\">\u003cdiv class=\"fb\" id=\"p1\">① Loss\u003cbr>\u003csmall>how bad?\u003c/small>\u003c/div>→\u003cdiv class=\"fb\" id=\"p2\">② Gradient\u003cbr>\u003csmall>slope here\u003c/small>\u003c/div>→\u003cdiv class=\"fb\" id=\"p3\">③ Direction\u003cbr>\u003csmall>go opposite\u003c/small>\u003c/div>→\u003cdiv class=\"fb\" id=\"p4\">④ Update w\u003cbr>\u003csmall>small step\u003c/small>\u003c/div>\u003c/div>\n\u003cdiv class=\"row\">\u003clabel>start w \u003cb id=\"gsv\">0.5\u003c/b> \u003cinput type=\"range\" id=\"gs\" min=\"-0.5\" max=\"6.5\" step=\"0.5\" value=\"0.5\">\u003c/label>\u003clabel>learning rate \u003cb id=\"glv\">0.2\u003c/b> \u003cinput type=\"range\" id=\"glr\" min=\"0.05\" max=\"1.1\" step=\"0.05\" value=\"0.2\">\u003c/label>\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"b\" onclick=\"gdStep()\">Step\u003c/button>\u003cbutton class=\"b\" onclick=\"gdRun()\">▶ Run 30 steps\u003c/button>\u003cbutton class=\"b o\" onclick=\"gdInit()\">Reset\u003c/button>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cGD\" width=\"640\" height=\"260\">\u003c/canvas>\u003cdiv id=\"gdt\" class=\"big\">\u003c/div>\n\u003cp class=\"m\">Try learning rate 0.05 (slow), 0.5 (jumps over!), 1.0 (bounces forever), 1.1 (explodes).\u003c/p>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>✍ Day 13 practice (tap to check)\u003c/h3>\n\u003cdetails>\u003csummary>Q1. Derivative of f(x) = x³?\u003c/summary>\u003cb>3x²\u003c/b> (power rule). At x=2 the slope is 12.\u003c/details>\n\u003cdetails>\u003csummary>Q2. lim x→2 of (x²−4)/(x−2)?\u003c/summary>Factor: (x−2)(x+2)/(x−2) = x+2 → \u003cb>4\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q3. f(x,y) = 3x²y. Find ∂f/∂x and ∂f/∂y.\u003c/summary>∂f/∂x = \u003cb>6xy\u003c/b> (y frozen). ∂f/∂y = \u003cb>3x²\u003c/b> (x frozen).\u003c/details>\n\u003cdetails>\u003csummary>Q4. f = x²+y². Gradient at (1,2)? Which way to descend?\u003c/summary>∇f = (2x, 2y) = \u003cb>(2, 4)\u003c/b>. Descent direction = \u003cb>(−2, −4)\u003c/b>.\u003c/details>\n\u003cdetails>\u003csummary>Q5. One step: w=5, loss (w−3)², lr=0.1. New w?\u003c/summary>gradient = 2(5−3) = 4. w = 5 − 0.1×4 = \u003cb>4.6\u003c/b> (closer to 3 ✓)\u003c/details>\u003c/div>\n\n\u003ch2 id=\"d14\">DAY 14: Linear Regression from Scratch\u003c/h2>\n\n\u003cdiv class=\"c\">\u003ch3>1. Linear regression: fit the best straight line\u003c/h3>\n\u003cdiv class=\"k\">\u003cb>ŷ = m·x + b\u003c/b> (prediction). m = slope, b = intercept. These two numbers are the model's \u003cb>parameters\u003c/b>. Learning = finding good m and b.\u003c/div>\n\u003cp>Data (x = hours, y = score). Drag m and b to fit the line by hand. The pink bars are errors (residuals):\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>m \u003cb id=\"lmv\">1\u003c/b> \u003cinput type=\"range\" id=\"lm\" min=\"-1\" max=\"5\" step=\"0.05\" value=\"1\">\u003c/label>\u003clabel>b \u003cb id=\"lbv\">0\u003c/b> \u003cinput type=\"range\" id=\"lb\" min=\"-5\" max=\"8\" step=\"0.05\" value=\"0\">\u003c/label>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cL\" width=\"640\" height=\"280\">\u003c/canvas>\u003cdiv id=\"lt2\" class=\"big\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>2. Cost function &amp; MSE\u003c/h3>\n\u003cdiv class=\"k\">\u003cb>MSE = (1/n) Σ (ŷᵢ − yᵢ)²\u003c/b>: average of squared errors. Squared so errors can't cancel, and big mistakes hurt more. This is the \u003cb>loss\u003c/b>.\u003c/div>\n\u003cdiv id=\"tbl\">\u003c/div>\n\u003cp>Cost against m (b fixed at your slider value). It is a \u003cb>bowl\u003c/b>, so there is one lowest point:\u003c/p>\n\u003ccanvas class=\"ch\" id=\"cJ\" width=\"640\" height=\"220\">\u003c/canvas>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>3. Gradient descent trains the line\u003c/h3>\n\u003cdiv class=\"k\">\u003cb>dm = (2/n) Σ (ŷ−y)·x\u003c/b> · \u003cb>db = (2/n) Σ (ŷ−y)\u003c/b>\u003cbr>\u003cb>m ← m − lr·dm\u003c/b> · \u003cb>b ← b − lr·db\u003c/b>\u003c/div>\n\u003cdiv class=\"row\">\u003clabel>learning rate \u003cb id=\"rlv\">0.02\u003c/b> \u003cinput type=\"range\" id=\"rlr\" min=\"0.002\" max=\"0.045\" step=\"0.001\" value=\"0.02\">\u003c/label>\n\u003cbutton class=\"b\" onclick=\"rgStep();rgW()\">Step\u003c/button>\u003cbutton class=\"b\" onclick=\"rgRun()\">▶ Run\u003c/button>\u003cbutton class=\"b o\" onclick=\"rgInit()\">Reset\u003c/button>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cR\" width=\"640\" height=\"260\">\u003c/canvas>\n\u003ccanvas class=\"ch\" id=\"cRL\" width=\"640\" height=\"170\" style=\"margin-top:8px\">\u003c/canvas>\n\u003cdiv id=\"rtx\" class=\"big\">\u003c/div>\u003cdiv id=\"rt2\" class=\"m\">\u003c/div>\n\u003cp class=\"m\">Top: the line rotating into place. Bottom: the loss falling (the \"learning curve\"). Try lr = 0.045 to see it diverge.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>4. Full code: NumPy only, no sklearn\u003c/h3>\n\u003cpre>import numpy as np\nX = np.array([1,2,3,4,5,6,7,8], dtype=float)\ny = np.array([3.1,4.9,7.2,9.0,10.8,13.1,15.2,16.9])\n\nm, b, lr, n = 0.0, 0.0, 0.02, len(X)\nfor epoch in range(2000):\n    y_pred = m * X + b                 # 1. predict\n    error  = y_pred - y\n    loss   = np.mean(error ** 2)       # 2. MSE (loss)\n    dm = (2/n) * np.sum(error * X)     # 3. gradients\n    db = (2/n) * np.sum(error)\n    m -= lr * dm                       # 4. update\n    b -= lr * db\nprint(m, b, loss)   # about 2.0, 1.05, tiny loss\u003c/pre>\n\u003cp class=\"m\">Matrix version (same idea, scales to many features):\u003c/p>\n\u003cpre>Xb = np.c_[X, np.ones(n)]        # add a column of 1s for b\nw  = np.zeros(2)                 # w = [m, b]\nfor _ in range(2000):\n    grad = (2/n) * Xb.T @ (Xb @ w - y)\n    w -= lr * grad\u003c/pre>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>✍ Day 14 practice (tap to check)\u003c/h3>\n\u003cdetails>\u003csummary>Q1. y = [1,2,3], ŷ = [1,3,5]. MSE?\u003c/summary>errors 0, 1, 2 → squares 0, 1, 4 → (0+1+4)/3 = \u003cb>1.67\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q2. X=[1,2], y=[3,5], m=0, b=0, lr=0.1. One update?\u003c/summary>ŷ=[0,0], error=[−3,−5]. dm = (2/2)(−3·1 + −5·2) = −13. db = (2/2)(−8) = −8. \u003cb>m = 1.3, b = 0.8\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q3. Why subtract the gradient, not add?\u003c/summary>The gradient points uphill (loss grows). We want the loss to shrink, so go the opposite way.\u003c/details>\n\u003cdetails>\u003csummary>Q4. What happens if the learning rate is too big?\u003c/summary>Steps overshoot the minimum, loss bounces or grows: \u003cb>divergence\u003c/b>. Too small = very slow.\u003c/details>\n\u003cdetails>\u003csummary>Q5. Why is MSE squared instead of plain error?\u003c/summary>Plain errors (+3 and −3) cancel to 0. Squares are always positive, punish big misses, and give a smooth bowl to descend.\u003c/details>\u003c/div>\n\u003c/main>\n\u003cscript>\nconst $=i=>document.getElementById(i),col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst T={galaxy:['🌌 Galaxy','#0b0620','rgba(28,16,66,.78)','#f1edff','#b8b0e8','#a78bfa','#60a5fa'],\nhole:['🕳 Black Hole','#050505','rgba(22,12,6,.82)','#fff3e6','#d9b99a','#ff9a3c','#ffe2b0'],\nnova:['💥 Supernova','#1a0505','rgba(54,12,8,.8)','#fff0e0','#f0b8a0','#ff5a2c','#ffd23c'],\naurora:['🌿 Aurora','#03130f','rgba(6,44,38,.78)','#eafff8','#9fd8c8','#2ee6a6','#2cc6d8'],\nneon:['🌆 Cyberpunk','#0a0612','rgba(22,10,40,.82)','#f6eaff','#c4a3e6','#ff2bd6','#18f0ff'],\nocean:['🌊 Deep Ocean','#021426','rgba(4,38,70,.78)','#e6f6ff','#9cc8e6','#38bdf8','#2dd4bf'],\nsunset:['🌇 Sunset Retro','#2a0f3a','rgba(70,22,60,.78)','#fff1e6','#f5c6b8','#ff8a3d','#ff5fa2'],\npaper:['📄 Light Paper','#f6f3ea','rgba(255,255,255,.9)','#1f2430','#555b6b','#4f46e5','#0d9488']};\nlet mode='galaxy';\nObject.keys(T).forEach(k=>{const b=document.createElement('button');b.textContent=T[k][0];b.onclick=()=>setT(k);b.id='t_'+k;$('ths').appendChild(b)});\nfunction setT(k){mode=k;const v=T[k],s=document.documentElement.style;['bg','card','tx','mut','a','b'].forEach((n,i)=>s.setProperty('--'+n,v[i+1]));\ndocument.querySelectorAll('.ths button').forEach(b=>b.classList.toggle('on',b.id=='t_'+k));initP();redraw()}\nconst bg=$('bg'),g=bg.getContext('2d');let W,H,P=[],t=0;\nfunction initP(){P=[];const n={galaxy:150,hole:260,nova:170,ocean:50}[mode]||60;for(let i=0;i\u003cn;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random(),a:Math.random()*6.28,d:70+Math.random()*Math.min(W,H)*.5})}\nfunction rs(){W=bg.width=innerWidth;H=bg.height=innerHeight;initP()}addEventListener('resize',rs);\nfunction lg(y0,y1,st){const q=g.createLinearGradient(0,y0,0,y1);st.forEach((c,i)=>q.addColorStop(i/(st.length-1),c));return q}\nfunction loop(){t+=.016;const cx=W/2,cy=H/2;g.globalCompositeOperation='source-over';\nif(mode=='galaxy'){const q=g.createRadialGradient(W*.3,H*.3,0,W*.5,H*.5,W);q.addColorStop(0,'#3a1a7a');q.addColorStop(.5,'#0f0a3a');q.addColorStop(1,'#050314');g.fillStyle=q;g.fillRect(0,0,W,H);P.forEach(p=>{g.globalAlpha=.4+.6*Math.abs(Math.sin(t*2+p.a));g.fillStyle='#fff';g.fillRect(p.x,p.y,p.r*2+.5,p.r*2+.5)})}\nelse if(mode=='hole'){g.fillStyle='#030303';g.fillRect(0,0,W,H);const q=g.createRadialGradient(cx,cy,30,cx,cy,260);q.addColorStop(0,'rgba(255,200,120,.5)');q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(0,0,W,H);\nP.forEach(p=>{const a=p.a+t*90/p.d,x=cx+Math.cos(a)*p.d*1.2,y=cy+Math.sin(a)*p.d*.3;g.globalAlpha=.8;g.fillStyle=`hsl(${25+Math.min(30,2000/p.d)},100%,${60+20*Math.sin(a)}%)`;g.fillRect(x,y,2.2,2.2)});\ng.globalAlpha=1;g.fillStyle='#000';g.beginPath();g.arc(cx,cy,42,0,7);g.fill();g.strokeStyle='#ffd9a0';g.lineWidth=2;g.stroke()}\nelse if(mode=='nova'){g.fillStyle='#1a0505';g.fillRect(0,0,W,H);const M=Math.max(W,H)*.6;P.forEach(p=>{const r=(t*60*(.3+p.r)+p.d)%M,x=cx+Math.cos(p.a)*r,y=cy+Math.sin(p.a)*r;g.globalAlpha=1-r/M;g.fillStyle=`hsl(${55-r/M*55},100%,55%)`;g.beginPath();g.arc(x,y,1+p.r*3,0,7);g.fill()})}\nelse if(mode=='aurora'){g.fillStyle='#03130f';g.fillRect(0,0,W,H);g.globalCompositeOperation='lighter';g.globalAlpha=1;\nfor(let k=0;k\u003c3;k++){const y0=H*.15+k*50;g.fillStyle=lg(y0,y0+260,['rgba(0,0,0,0)',k%2?'rgba(44,198,216,.28)':'rgba(46,230,166,.3)','rgba(0,0,0,0)']);g.beginPath();g.moveTo(0,y0);\nfor(let x=0;x\u003c=W;x+=14)g.lineTo(x,y0+Math.sin(x*.004+t*.6+k*2)*60);for(let x=W;x>=0;x-=14)g.lineTo(x,y0+200+Math.sin(x*.007+t*.8+k)*50);g.fill()}\ng.globalCompositeOperation='source-over';g.fillStyle='#fff';P.forEach(p=>{g.globalAlpha=.3+.3*Math.sin(t+p.a);g.fillRect(p.x,p.y*.5,1.5,1.5)})}\nelse if(mode=='neon'){g.fillStyle='#0a0612';g.fillRect(0,0,W,H);const hz=H*.55;g.globalAlpha=1;const q=g.createRadialGradient(cx,hz,0,cx,hz,130);q.addColorStop(0,'#ff2bd6');q.addColorStop(1,'rgba(255,43,214,0)');g.fillStyle=q;g.fillRect(0,hz-140,W,140);\ng.lineWidth=1.2;g.strokeStyle='#18f0ff';g.globalAlpha=.55;for(let i=-24;i\u003c=24;i++){g.beginPath();g.moveTo(cx+i*14,hz);g.lineTo(cx+i*W*.1,H);g.stroke()}\ng.strokeStyle='#ff2bd6';for(let j=0;j\u003c12;j++){const y=hz+(((j+t*.6)%12)/12)**2*(H-hz);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}}\nelse if(mode=='ocean'){g.fillStyle=lg(0,H,['#04406a','#021426','#010a14']);g.fillRect(0,0,W,H);P.forEach(p=>{const y=((p.y-t*(15+p.r*40))%H+H)%H,x=p.x+Math.sin(t+p.a)*15,r=3+p.r*14;g.globalAlpha=.5;g.strokeStyle='#5eead4';g.lineWidth=1.3;g.beginPath();g.arc(x,y,r,0,7);g.stroke();g.globalAlpha=.1;g.fillStyle='#38bdf8';g.fill()})}\nelse if(mode=='sunset'){g.fillStyle=lg(0,H,['#2a0f3a','#c2306b','#ff8a3d']);g.fillRect(0,0,W,H);const q=g.createRadialGradient(cx,H*.68,10,cx,H*.68,180);q.addColorStop(0,'rgba(255,230,150,.95)');q.addColorStop(.4,'rgba(255,140,60,.5)');q.addColorStop(1,'rgba(255,100,100,0)');g.fillStyle=q;g.fillRect(0,0,W,H);P.forEach(p=>{g.globalAlpha=.5;g.fillStyle='#fff';g.fillRect((p.x+t*10*p.r)%W,p.y*.5,2,2)})}\nelse{g.fillStyle='#f6f3ea';g.fillRect(0,0,W,H);P.forEach(p=>{g.globalAlpha=.12;g.fillStyle='#4f46e5';g.beginPath();g.arc((p.x+t*8*p.r)%W,(p.y+Math.sin(t+p.a)*10),2+p.r*4,0,7);g.fill()})}\ng.globalAlpha=1;requestAnimationFrame(loop)}\n/* plot helpers */\nfunction pl(id,x0,x1,y0,y1){const c=$(id),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.globalAlpha=1;x.setLineDash([]);return{x,w,h,x0,x1,y0,y1,X:u=>(u-x0)/(x1-x0)*w,Y:v=>h-(v-y0)/(y1-y0)*h}}\nfunction axes(o,sx=1,sy=1){const{x,w,h,X,Y}=o;x.lineWidth=1;x.strokeStyle=col('--tx');x.globalAlpha=.12;for(let u=Math.ceil(o.x0/sx)*sx;u\u003c=o.x1;u+=sx){x.beginPath();x.moveTo(X(u),0);x.lineTo(X(u),h);x.stroke()}for(let v=Math.ceil(o.y0/sy)*sy;v\u003c=o.y1;v+=sy){x.beginPath();x.moveTo(0,Y(v));x.lineTo(w,Y(v));x.stroke()}\nx.globalAlpha=.55;x.beginPath();if(o.y0\u003c=0&&o.y1>=0){x.moveTo(0,Y(0));x.lineTo(w,Y(0))}if(o.x0\u003c=0&&o.x1>=0){x.moveTo(X(0),0);x.lineTo(X(0),h)}x.stroke();x.globalAlpha=1}\nfunction curve(o,f,c,lw=3){const{x,w}=o;x.beginPath();let first=1;for(let px=0;px\u003c=w;px+=2){const u=o.x0+px/w*(o.x1-o.x0),v=f(u);if(!isFinite(v))continue;first?x.moveTo(px,o.Y(v)):x.lineTo(px,o.Y(v));first=0}x.strokeStyle=c;x.lineWidth=lw;x.stroke()}\nfunction dot(o,u,v,r,c){o.x.fillStyle=c;o.x.beginPath();o.x.arc(o.X(u),o.Y(v),r,0,7);o.x.fill()}\nfunction seg(o,a,b,c2,d,c,lw=2,dash){const x=o.x;x.strokeStyle=c;x.lineWidth=lw;x.setLineDash(dash||[]);x.beginPath();x.moveTo(o.X(a),o.Y(b));x.lineTo(o.X(c2),o.Y(d));x.stroke();x.setLineDash([])}\nfunction arr(o,x0,y0,x1,y1,c,lw=3){seg(o,x0,y0,x1,y1,c,lw);const x=o.x,a=Math.atan2(-(o.Y(y1)-o.Y(y0))*-1,o.X(x1)-o.X(x0)),px=o.X(x1),py=o.Y(y1),an=Math.atan2(py-o.Y(y0),px-o.X(x0));x.fillStyle=c;x.beginPath();x.moveTo(px,py);x.lineTo(px-12*Math.cos(an-.4),py-12*Math.sin(an-.4));x.lineTo(px-12*Math.cos(an+.4),py-12*Math.sin(an+.4));x.fill()}\nconst tag=(o,s,u,v)=>{o.x.fillStyle=col('--tx');o.x.font='13px system-ui';o.x.fillText(s,o.X(u),o.Y(v))};\n/* 1 function */\nfunction fnW(){const v=+$('fx').value;$('fxv').textContent=v;const o=pl('cF',-4,4,-1,17);axes(o);curve(o,x=>x*x+1,col('--a'));seg(o,v,0,v,v*v+1,'#facc15',2,[5,4]);seg(o,0,v*v+1,v,v*v+1,'#facc15',2,[5,4]);dot(o,v,v*v+1,8,'#facc15');tag(o,'x',3.8,-.7);tag(o,'f(x)',.1,16.2);\n$('ft').textContent=`x = ${v}  →  [ f(x) = x² + 1 ]  →  ${(v*v+1).toFixed(2)}`}\n$('fx').oninput=fnW;\n/* 2 limit */\nfunction limW(){const k=+$('lk').value,h=Math.pow(10,-k),f=x=>(x*x-1)/(x-1);$('lkv').textContent=h>=.01?h.toFixed(2):h.toExponential(0);const o=pl('cLm',-1,3,-1,4.5);axes(o);curve(o,x=>Math.abs(x-1)\u003c1e-9?NaN:x+1,col('--a'));\no.x.strokeStyle='#facc15';o.x.lineWidth=3;o.x.fillStyle=col('--bg');o.x.beginPath();o.x.arc(o.X(1),o.Y(2),7,0,7);o.x.fill();o.x.stroke();\nconst l=1-h,r=1+h;dot(o,l,f(l),7,'#22c55e');dot(o,r,f(r),7,'#ec4899');tag(o,'hole at (1, ?)',1.1,1.5);\n$('lt').innerHTML=`f(${l.toFixed(4)}) = ${f(l).toFixed(4)} &nbsp;|&nbsp; f(${r.toFixed(4)}) = ${f(r).toFixed(4)} → heading to 2`}\n$('lk').oninput=limW;\n/* 3 derivative */\nconst FS=[[x=>x*x,x=>2*x,'x²','2x'],[x=>x**3-3*x,x=>3*x*x-3,'x³ − 3x','3x² − 3'],[Math.sin,Math.cos,'sin x','cos x']],HS=[2,1,.5,.1,.01,.001];let fi=0;\nFS.forEach((f,i)=>{const b=document.createElement('button');b.className='b '+(i?'o':'on');b.textContent='f = '+f[2];b.onclick=()=>{fi=i;[...$('fb').children].forEach((x,j)=>x.className='b '+(j==i?'on':'o'));derW()};$('fb').appendChild(b)});\nfunction derW(){const x0=+$('dx').value,h=HS[+$('dh').value],[f,df,n,dn]=FS[fi];$('dxv').textContent=x0;$('dhv').textContent=h;const o=pl('cD',-3,3,-4,9);axes(o);curve(o,f,col('--a'));\nconst y0=f(x0),s=(f(x0+h)-y0)/h,d=df(x0);seg(o,-3,y0+d*(-3-x0),3,y0+d*(3-x0),'#22c55e',2,[7,5]);seg(o,-3,y0+s*(-3-x0),3,y0+s*(3-x0),'#facc15',2.5);dot(o,x0,y0,7,'#22c55e');dot(o,x0+h,f(x0+h),6,'#facc15');\n$('dtx').innerHTML=`f(x) = ${n} · secant slope = ${s.toFixed(3)} · true f′(x) = ${dn} = \u003cspan style=\"color:#22c55e\">${d.toFixed(3)}\u003c/span>`}\n$('dx').oninput=derW;$('dh').oninput=derW;\n/* 4 gradient */\nfunction grW(){const px=+$('gx').value,py=+$('gy').value;$('gxv').textContent=px.toFixed(1);$('gyv').textContent=py.toFixed(1);const o=pl('cG',-4,4,-2.125,2.125);axes(o);\n[.5,1,2,4,6,9,12,16].forEach(c=>{o.x.strokeStyle=col('--a');o.x.globalAlpha=.45;o.x.lineWidth=2;o.x.beginPath();o.x.ellipse(o.X(0),o.Y(0),o.X(Math.sqrt(c))-o.X(0),o.Y(0)-o.Y(Math.sqrt(c/2)),0,0,7);o.x.stroke()});o.x.globalAlpha=1;\nconst gx=2*px,gy=4*py,k=.28;arr(o,px,py,px+gx*k,py+gy*k,'#f97316',4);arr(o,px,py,px-gx*k,py-gy*k,'#22c55e',4);dot(o,px,py,7,col('--tx'));\n$('gtx').innerHTML=`∂f/∂x = 2x = ${gx.toFixed(1)} · ∂f/∂y = 4y = ${gy.toFixed(1)} → ∇f = (${gx.toFixed(1)}, ${gy.toFixed(1)}); go (${(-gx).toFixed(1)}, ${(-gy).toFixed(1)})`}\n$('gx').oninput=grW;$('gy').oninput=grW;\n{const c=$('cG'),mv=e=>{if(e.type=='pointermove'&&!e.buttons)return;const r=c.getBoundingClientRect();$('gx').value=Math.max(-4,Math.min(4,((e.clientX-r.left)/r.width)*8-4));$('gy').value=Math.max(-2,Math.min(2,2.125-((e.clientY-r.top)/r.height)*4.25));grW()};c.addEventListener('pointerdown',mv);c.addEventListener('pointermove',mv)}\n/* 5 GD 1D */\nlet gw=.5,ghist=[.5],gmsg='Press Step or Run',gtimer=0;\nfunction flash(){[1,2,3,4].forEach(i=>setTimeout(()=>[1,2,3,4].forEach(j=>$('p'+j).className='fb'+(j==i?' go':'')),(i-1)*200))}\nfunction gdInit(){clearInterval(gtimer);gw=+$('gs').value;ghist=[gw];gmsg='Press Step or Run';[1,2,3,4].forEach(j=>$('p'+j).className='fb');gdW()}\nfunction gdStep(){const lr=+$('glr').value,old=gw,gr=2*(old-3);gw=old-lr*gr;ghist.push(gw);gmsg=`loss ${((old-3)**2+1).toFixed(2)} → gradient ${gr.toFixed(2)} → go ${gr>0?'LEFT':'RIGHT'} → w = ${old.toFixed(2)} − ${lr}×${gr.toFixed(2)} = ${gw.toFixed(2)}`;flash();gdW()}\nfunction gdRun(){clearInterval(gtimer);let n=0;gtimer=setInterval(()=>{gdStep();if(++n>=30||Math.abs(2*(gw-3))\u003c.005||Math.abs(gw)>1e3)clearInterval(gtimer)},500)}\nfunction gdW(){$('gsv').textContent=$('gs').value;$('glv').textContent=$('glr').value;const o=pl('cGD',-1,7,0,18),f=w=>(w-3)**2+1;axes(o);curve(o,f,col('--a'));\nghist.forEach((w,i)=>{o.x.globalAlpha=.25+.75*i/Math.max(1,ghist.length-1);dot(o,w,f(w),i==ghist.length-1?9:5,i==ghist.length-1?'#facc15':col('--b'))});o.x.globalAlpha=1;dot(o,3,1,4,'#22c55e');tag(o,'goal',3.1,.6);\n$('gdt').textContent=gmsg+(Math.abs(gw)>1e3?'  💥 Diverged: learning rate too big!':'')}\n$('gs').oninput=gdInit;$('glr').oninput=gdInit;\n/* 6 regression data */\nconst XS=[1,2,3,4,5,6,7,8],YS=[3.1,4.9,7.2,9.0,10.8,13.1,15.2,16.9],N=8,mse=(m,b)=>XS.reduce((s,x,i)=>s+(m*x+b-YS[i])**2,0)/N;\nconst mx=4.5,my=YS.reduce((a,b)=>a+b)/N,BM=XS.reduce((s,x,i)=>s+(x-mx)*(YS[i]-my),0)/XS.reduce((s,x)=>s+(x-mx)**2,0),BB=my-BM*mx;\nfunction drawFit(o,m,b,res){axes(o,1,2);if(res)XS.forEach((x,i)=>seg(o,x,YS[i],x,m*x+b,'#ec4899',3));seg(o,0,b,9,m*9+b,'#facc15',3);XS.forEach((x,i)=>dot(o,x,YS[i],6,col('--b')))}\nfunction lrW(){const m=+$('lm').value,b=+$('lb').value;$('lmv').textContent=m.toFixed(2);$('lbv').textContent=b.toFixed(2);const o=pl('cL',0,9,0,20);drawFit(o,m,b,1);\nconst L=mse(m,b);$('lt2').textContent=`MSE = ${L.toFixed(2)}  ${L\u003c.1?'🎉 excellent fit!':'· best possible ≈ '+mse(BM,BB).toFixed(2)+' at m ≈ '+BM.toFixed(2)+', b ≈ '+BB.toFixed(2)}`;\n$('tbl').innerHTML='\u003ctable>\u003ctr>\u003cth>x\u003c/th>\u003cth>y\u003c/th>\u003cth>ŷ = mx+b\u003c/th>\u003cth>error ŷ−y\u003c/th>\u003cth>error²\u003c/th>\u003c/tr>'+XS.map((x,i)=>{const p=m*x+b,e=p-YS[i];return`\u003ctr>\u003ctd>${x}\u003c/td>\u003ctd>${YS[i]}\u003c/td>\u003ctd>${p.toFixed(2)}\u003c/td>\u003ctd>${e.toFixed(2)}\u003c/td>\u003ctd>${(e*e).toFixed(2)}\u003c/td>\u003c/tr>`}).join('')+`\u003ctr>\u003ctd colspan=\"4\">\u003cb>MSE = average of error²\u003c/b>\u003c/td>\u003ctd>\u003cb>${L.toFixed(2)}\u003c/b>\u003c/td>\u003c/tr>\u003c/table>`;\nconst ms=[];for(let i=0;i\u003c=60;i++)ms.push(-1+i*.1);const ym=Math.min(Math.max(...ms.map(q=>mse(q,b))),400),oj=pl('cJ',-1,5,0,ym*1.05);axes(oj,1,Math.max(1,Math.round(ym/5)));curve(oj,q=>mse(q,b),col('--a'));dot(oj,m,Math.min(L,ym),8,'#facc15');tag(oj,'m →',4.5,ym*.08);tag(oj,'cost',-.9,ym*.95)}\n$('lm').oninput=lrW;$('lb').oninput=lrW;\n/* 7 GD regression */\nlet rm=0,rb=0,rep=0,rlh=[],rrun=0,rdm=1,rdb=1;\nfunction rgInit(){rm=0;rb=0;rep=0;rdm=1;rdb=1;rrun=0;rlh=[mse(0,0)];$('rlv').textContent=$('rlr').value;rgW()}\nfunction rgStep(){const lr=+$('rlr').value;let dm=0,db=0;XS.forEach((x,i)=>{const e=rm*x+rb-YS[i];dm+=2*e*x/N;db+=2*e/N});rdm=dm;rdb=db;rm-=lr*dm;rb-=lr*db;rep++;rlh.push(mse(rm,rb))}\nfunction rgRun(){if(rrun)return;rrun=1;const f=()=>{for(let i=0;i\u003c5;i++)rgStep();rgW();const L=rlh[rlh.length-1];if(rrun&&rep\u003c2500&&isFinite(L)&&L\u003c1e7&&(Math.abs(rdm)>1e-4||Math.abs(rdb)>1e-4))requestAnimationFrame(f);else rrun=0};f()}\nfunction rgW(){const o=pl('cR',0,9,0,20);drawFit(o,rm,rb,0);const L=rlh[rlh.length-1],o2=pl('cRL',0,Math.max(40,rep),0,rlh[0]*1.05);axes(o2,Math.max(10,Math.round(Math.max(40,rep)/8)),Math.max(1,Math.round(rlh[0]/4)));\no2.x.beginPath();let st=0;rlh.forEach((v,i)=>{if(!isFinite(v))return;st?o2.x.lineTo(o2.X(i),o2.Y(v)):o2.x.moveTo(o2.X(i),o2.Y(v));st=1});o2.x.strokeStyle='#22c55e';o2.x.lineWidth=3;o2.x.stroke();tag(o2,'loss vs epoch',Math.max(40,rep)*.55,rlh[0]*.9);\nconst bad=!isFinite(L)||L>1e7;$('rtx').textContent=bad?'💥 Diverged: learning rate too big. Press Reset.':`epoch ${rep} · m = ${rm.toFixed(3)} · b = ${rb.toFixed(3)} · MSE = ${L.toFixed(3)}`;\n$('rt2').textContent=rep?`last gradients: dm = ${rdm.toFixed(3)}, db = ${rdb.toFixed(3)} → m ← m − lr·dm, b ← b − lr·db.  Target (exact math): m ≈ ${BM.toFixed(3)}, b ≈ ${BB.toFixed(3)}`:`Start: m = 0, b = 0 (a flat line, big error). Target: m ≈ ${BM.toFixed(2)}, b ≈ ${BB.toFixed(2)}`}\n$('rlr').oninput=rgInit;\nfunction redraw(){fnW();limW();derW();grW();gdW();lrW();rgW()}\ndocument.querySelectorAll('.c').forEach(c=>new IntersectionObserver((es,o)=>{if(es[0].isIntersecting){c.classList.add('in');o.disconnect()}},{threshold:.05}).observe(c));\nrs();rgInit();gdInit();setT('galaxy');loop();\n\u003c/script>\u003c/body>\u003c/html>\n", "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Day 15-16: What is ML &amp; Types of ML\u003c/title>\n\u003cstyle>\n:root{--bg:#0b0620;--card:rgba(28,16,66,.78);--tx:#f1edff;--mut:#b8b0e8;--a:#a78bfa;--b:#60a5fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml{scroll-padding-top:90px;scroll-behavior:smooth}\nbody{margin:0;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--tx);background:var(--bg)}\n#bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%}\nheader{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);backdrop-filter:blur(10px);padding:8px 10px;border-bottom:1px solid var(--a)}\n.ths{display:flex;gap:6px;overflow-x:auto}\n.ths button{flex:none;border:1px solid var(--a);background:transparent;color:var(--tx);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:13px}\n.ths button.on{background:var(--a);color:#000;font-weight:700}\nmain{max-width:860px;margin:auto;padding:12px 14px 60px}\nh1{font-size:clamp(26px,6vw,42px);margin:18px 0 4px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:t :scale(1.06)}\n.sp{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;max-width:480px}.sp i{aspect-ratio:1;border-radius:3px;transition:.5s}\n.bar{height:22px;border-radius:6px;background:var(--a);transition:width .6s;color:#000;font-weight:700;padding-left:8px;font-size:13px;line-height:22px;white-space:nowrap}\n.rl{display:grid;grid-template-columns:repeat(6,52px);gap:4px;margin:8px 0}.rl div{height:52px;border:2px solid var(--a);border-radius:8px;display:grid;place-items:center;font-size:22px;transition:.3s}\ndetails{margin:6px 0;border:1px dashed var(--a);border-radius:10px;padding:6px 10px}summary{cursor:pointer}\nsvg text{fill:var(--tx);font-size:13px;font-weight:700}svg circle{cursor:pointer;transition:.3s}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cheader>\u003cdiv class=\"ths\" id=\"ths\">\u003c/div>\u003c/header>\n\u003cmain>\n\u003ch1>Day 15 &amp; 16: What is ML + Types of ML\u003c/h1>\n\u003cp class=\"m\">Zero to clear. Tap, slide, train: every picture is live. Jump: \u003ca href=\"#d15\" style=\"color:var(--b)\">Day 15\u003c/a> · \u003ca href=\"#d16\" style=\"color:var(--b)\">Day 16\u003c/a> · \u003ca href=\"#leak\" style=\"color:var(--b)\">Data leakage\u003c/a>\u003c/p>\n\n\u003ch2 id=\"d15\">DAY 15: What is Machine Learning?\u003c/h2>\n\n\u003cdiv class=\"c\">\u003ch3>1. AI vs ML vs Deep Learning vs Generative AI\u003c/h3>\n\u003cdiv class=\"k\">Four circles, each INSIDE the bigger one. Tap a circle:\u003c/div>\n\u003csvg viewBox=\"0 0 420 300\" style=\"width:100%;max-width:440px\">\u003ccircle id=\"n0\" cx=\"210\" cy=\"150\" r=\"145\" fill=\"#a78bfa\" fill-opacity=\".22\" stroke=\"#a78bfa\" stroke-width=\"3\" onclick=\"ai(0)\"/>\u003ccircle id=\"n1\" cx=\"210\" cy=\"170\" r=\"105\" fill=\"#60a5fa\" fill-opacity=\".28\" stroke=\"#60a5fa\" stroke-width=\"3\" onclick=\"ai(1)\"/>\u003ccircle id=\"n2\" cx=\"210\" cy=\"190\" r=\"68\" fill=\"#22c55e\" fill-opacity=\".3\" stroke=\"#22c55e\" stroke-width=\"3\" onclick=\"ai(2)\"/>\u003ccircle id=\"n3\" cx=\"210\" cy=\"208\" r=\"32\" fill=\"#f97316\" fill-opacity=\".45\" stroke=\"#f97316\" stroke-width=\"3\" onclick=\"ai(3)\"/>\n\u003ctext x=\"210\" y=\"30\" text-anchor=\"middle\">AI\u003c/text>\u003ctext x=\"210\" y=\"82\" text-anchor=\"middle\">Machine Learning\u003c/text>\u003ctext x=\"210\" y=\"140\" text-anchor=\"middle\">Deep Learning\u003c/text>\u003ctext x=\"210\" y=\"205\" text-anchor=\"middle\" style=\"font-size:11px\">GenAI\u003c/text>\u003c/svg>\n\u003cdiv id=\"ait\" class=\"big\">\u003c/div>\u003cdiv id=\"aid\" class=\"m\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>2. Dataset, sample, feature, label\u003c/h3>\n\u003cdiv class=\"row\">\u003cbutton class=\"b on\" onclick=\"ds(0,this)\">🏠 House prices\u003c/button>\u003cbutton class=\"b o\" onclick=\"ds(1,this)\">📧 Spam emails\u003c/button>\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"b\" onclick=\"hl('f')\">Features (inputs)\u003c/button>\u003cbutton class=\"b\" onclick=\"hl('l')\">Label (answer)\u003c/button>\u003cbutton class=\"b\" onclick=\"hl('r')\">One sample (row)\u003c/button>\u003cbutton class=\"b o\" onclick=\"hl('')\">Clear\u003c/button>\u003c/div>\n\u003cdiv id=\"dst\">\u003c/div>\n\u003cdiv class=\"k\">\u003cb>Dataset\u003c/b> = whole table · \u003cb>Sample\u003c/b> = one row · \u003cb>Feature\u003c/b> = input column (what we know) · \u003cb>Label\u003c/b> = the answer column (what we want to predict).\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>3. Training, validation, testing: three sets\u003c/h3>\n\u003cdiv class=\"k\">📘 Train = practice questions to learn from · 📝 Validation = mock test to adjust · 🎓 Test = final exam, opened ONCE.\u003c/div>\n\u003cdiv class=\"row\">\u003clabel>Train \u003cb id=\"v1\">70\u003c/b>% \u003cinput type=\"range\" id=\"str\" min=\"50\" max=\"90\" value=\"70\">\u003c/label>\u003clabel>Validation \u003cb id=\"v2\">15\u003c/b>% \u003cinput type=\"range\" id=\"sva\" min=\"0\" max=\"30\" value=\"15\">\u003c/label>\u003cbutton class=\"b\" onclick=\"shuf()\">🔀 Shuffle\u003c/button>\u003c/div>\n\u003cdiv class=\"sp\" id=\"sp\">\u003c/div>\n\u003cdiv class=\"m\">\u003cspan style=\"color:#60a5fa\">■ train\u003c/span> · \u003cspan style=\"color:#facc15\">■ validation\u003c/span> · \u003cspan style=\"color:#22c55e\">■ test\u003c/span>\u003c/div>\u003cdiv id=\"spt\" class=\"big\">\u003c/div>\n\u003cpre>idx = np.random.permutation(len(X))        # shuffle first\nn_tr, n_va = int(0.7*len(X)), int(0.15*len(X))\ntrain, val, test = idx[:n_tr], idx[n_tr:n_tr+n_va], idx[n_tr+n_va:]\u003c/pre>\n\u003cp>\u003cb>Why validation?\u003c/b> Watch what happens as training goes on. Slide the epoch:\u003c/p>\n\u003clabel>training epochs \u003cb id=\"ev\">10\u003c/b> \u003cinput type=\"range\" id=\"ep\" min=\"0\" max=\"100\" value=\"10\">\u003c/label>\n\u003ccanvas class=\"ch\" id=\"cO\" width=\"640\" height=\"230\">\u003c/canvas>\u003cdiv id=\"ot\" class=\"big\">\u003c/div>\n\u003cp class=\"m\">\u003cspan style=\"color:#60a5fa\">━ training error\u003c/span> · \u003cspan style=\"color:#ec4899\">━ validation error\u003c/span> · \u003cspan style=\"color:#22c55e\">● best stopping point\u003c/span>\u003c/p>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>4. Model &amp; prediction: watch a model learn\u003c/h3>\n\u003cdiv class=\"k\">\u003cb>Model\u003c/b> = a function with adjustable numbers (weights): ŷ = w·x + b. \u003cb>Training\u003c/b> = tuning w, b until predictions match the labels. \u003cb>Prediction\u003c/b> = using the trained model on NEW input.\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"b\" onclick=\"mTrain()\">▶ Train\u003c/button>\u003cbutton class=\"b o\" onclick=\"mReset()\">Reset\u003c/button>\u003c/div>\n\u003cdiv id=\"mtb\">\u003c/div>\u003cdiv id=\"mt\" class=\"big\">\u003c/div>\n\u003clabel>New unseen x = \u003cb id=\"nxv\">6\u003c/b> \u003cinput type=\"range\" id=\"nx\" min=\"0\" max=\"10\" step=\"0.5\" value=\"6\">\u003c/label>\u003cdiv id=\"mp\" class=\"big\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>5. The complete ML learning process\u003c/h3>\n\u003cdiv class=\"row\">\u003cbutton class=\"b\" onclick=\"pPlay()\">▶ Play the whole story\u003c/button>\u003c/div>\n\u003cdiv class=\"flow\" id=\"pf\">\u003c/div>\u003cdiv id=\"pt\" class=\"big\" style=\"min-height:52px\">\u003c/div>\n\u003cdiv class=\"k\">Training loop (repeat many times): \u003cb>predict → measure loss → find gradient → update weights\u003c/b>, on training data only.\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>✍ Day 15 practice (tap to check)\u003c/h3>\n\u003cdetails>\u003csummary>Q1. One line each: AI, ML, DL, GenAI.\u003c/summary>AI: machines doing smart tasks. ML: AI that learns from data. DL: ML with deep neural networks. GenAI: DL that creates new text, images, code.\u003c/details>\n\u003cdetails>\u003csummary>Q2. Columns: age, salary, bought(Yes/No). Features? Label?\u003c/summary>Features: \u003cb>age, salary\u003c/b>. Label: \u003cb>bought\u003c/b> (so it is a classification task).\u003c/details>\n\u003cdetails>\u003csummary>Q3. Why keep a separate test set?\u003c/summary>To get an honest score on data the model never saw. If you tune on test data, it is no longer a fair exam.\u003c/details>\n\u003cdetails>\u003csummary>Q4. List the learning process in order.\u003c/summary>Collect data → clean, pick features/label → split train/val/test → choose model → train → validate and tune → test once → predict on new data.\u003c/details>\n\u003cdetails>\u003csummary>Q5. Train accuracy 99%, test accuracy 60%. Meaning?\u003c/summary>\u003cb>Overfitting\u003c/b>: the model memorised the training data and fails on new data.\u003c/details>\u003c/div>\n\n\u003ch2 id=\"d16\">DAY 16: Types of ML\u003c/h2>\n\n\u003cdiv class=\"c\">\u003ch3>The family tree\u003c/h3>\n\u003cdiv class=\"row\">\u003cbutton class=\"b\" style=\"background:#60a5fa\" onclick=\"ty('sup')\">Supervised\u003c/button>\u003cbutton class=\"b o\" onclick=\"ty('reg')\">↳ Regression\u003c/button>\u003cbutton class=\"b o\" onclick=\"ty('cls')\">↳ Classification\u003c/button>\u003cbutton class=\"b\" style=\"background:#22c55e\" onclick=\"ty('uns')\">Unsupervised\u003c/button>\u003cbutton class=\"b o\" onclick=\"ty('clu')\">↳ Clustering\u003c/button>\u003cbutton class=\"b o\" onclick=\"ty('dim')\">↳ Dim. reduction\u003c/button>\u003cbutton class=\"b\" style=\"background:#f97316\" onclick=\"ty('rl')\">Reinforcement\u003c/button>\u003c/div>\n\u003cdiv id=\"tyt\" class=\"big\">\u003c/div>\u003cdiv id=\"tyd\">\u003c/div>\n\u003ctable style=\"margin-top:8px;width:100%\">\u003ctr>\u003cth>Type\u003c/th>\u003cth>Data\u003c/th>\u003cth>Goal\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Supervised\u003c/td>\u003ctd>features + labels\u003c/td>\u003ctd>predict label\u003c/td>\u003ctd>email → spam?\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Unsupervised\u003c/td>\u003ctd>features only\u003c/td>\u003ctd>find structure\u003c/td>\u003ctd>customer groups\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Reinforcement\u003c/td>\u003ctd>rewards from actions\u003c/td>\u003ctd>best behaviour\u003c/td>\u003ctd>game-playing agent\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>A. Supervised → Regression: predict a NUMBER\u003c/h3>\n\u003cp>Learn from (x, y) pairs, then predict y for a new x. Example: hours studied → marks.\u003c/p>\n\u003clabel>new x = \u003cb id=\"rxv\">9\u003c/b> \u003cinput type=\"range\" id=\"rx\" min=\"0\" max=\"12\" step=\"0.5\" value=\"9\">\u003c/label>\n\u003ccanvas class=\"ch\" id=\"cRg\" width=\"640\" height=\"240\">\u003c/canvas>\u003cdiv id=\"rgt\" class=\"big\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>B. Supervised → Classification: predict a CATEGORY\u003c/h3>\n\u003cp>🔵 Class A vs 🟠 Class B. Tinted background = what the model would predict there (k-nearest neighbours). \u003cb>Tap the picture\u003c/b> to classify a new point:\u003c/p>\n\u003ccanvas class=\"ch\" id=\"cCl\" width=\"640\" height=\"280\">\u003c/canvas>\u003cdiv id=\"clt\" class=\"big\">Tap anywhere ↑\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>C. Unsupervised → Clustering: find groups, no labels\u003c/h3>\n\u003cp>Grey dots have NO labels. K-means: ① drop k centres ② assign each dot to nearest centre ③ move centres to group average ④ repeat.\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>k = \u003cb id=\"kv\">3\u003c/b> \u003cinput type=\"range\" id=\"kk\" min=\"2\" max=\"5\" value=\"3\">\u003c/label>\u003cbutton class=\"b\" onclick=\"kmStep()\">Step\u003c/button>\u003cbutton class=\"b\" onclick=\"kmRun()\">▶ Run\u003c/button>\u003cbutton class=\"b o\" onclick=\"kmInit()\">Reset\u003c/button>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cKm\" width=\"640\" height=\"300\">\u003c/canvas>\u003cdiv id=\"kmt\" class=\"big\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>D. Unsupervised → Dimensionality reduction\u003c/h3>\n\u003cp>Squash 2D data to 1D (a line) while keeping as much information (spread) as possible. Rotate the line to find the best view (PCA idea):\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>line angle \u003cb id=\"pav\">100\u003c/b>° \u003cinput type=\"range\" id=\"pa\" min=\"0\" max=\"180\" value=\"100\">\u003c/label>\u003cbutton class=\"b\" onclick=\"pBest()\">✨ Snap to best\u003c/button>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cPc\" width=\"640\" height=\"300\">\u003c/canvas>\u003cdiv id=\"pct\" class=\"big\">\u003c/div>\n\u003cp class=\"m\">Dashed pink = information lost. Yellow dots = the 1D data you keep. Real use: 100 columns → 2 columns so you can plot and train faster.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>E. Reinforcement learning: learn by trial and reward\u003c/h3>\n\u003cdiv class=\"k\">Agent 🤖 takes an \u003cb>action\u003c/b> → environment gives a \u003cb>reward\u003c/b>. Goal 🏁 = +10, trap 💥 = −10, every step = −1 (so go fast!). Arrows show the best action learned in each cell.\u003c/div>\n\u003cdiv class=\"rl\" id=\"rl\">\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"b\" onclick=\"rlTrain(10)\">Train ×10 episodes\u003c/button>\u003cbutton class=\"b\" onclick=\"rlTrain(200)\">Train ×200\u003c/button>\u003cbutton class=\"b\" onclick=\"rlWatch()\">🎬 Watch agent\u003c/button>\u003cbutton class=\"b o\" onclick=\"rlReset()\">Reset\u003c/button>\u003c/div>\n\u003cdiv id=\"rlt\" class=\"big\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\" id=\"leak\">\u003ch3>F. Data leakage: the model \"peeks\" at the answers\u003c/h3>\n\u003cdiv class=\"k\">Leakage = information from the test set (or the future) sneaks into training. Scores look amazing, then fail in real life.\u003c/div>\n\u003cp>Experiment: labels are pure coin flips, so any honest model gets ≈ 50%. Run it:\u003c/p>\n\u003cbutton class=\"b\" onclick=\"runLeak()\">▶ Run 30 experiments\u003c/button>\n\u003cdiv style=\"margin-top:8px\">\u003cdiv class=\"m\">✅ Honest split (test data kept away)\u003c/div>\u003cdiv class=\"bar\" id=\"lb1\" style=\"width:0%\">\u003c/div>\n\u003cdiv class=\"m\" style=\"margin-top:6px\">❌ Leaky (test rows also copied into training)\u003c/div>\u003cdiv class=\"bar\" id=\"lb2\" style=\"width:0%;background:#ec4899\">\u003c/div>\u003c/div>\n\u003ctable style=\"margin-top:10px\">\u003ctr>\u003cth>Common leak\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Scaling / filling missing values on ALL data before splitting\u003c/td>\u003ctd>Split first, fit scaler on train only\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Duplicate rows in train and test\u003c/td>\u003ctd>Remove duplicates before splitting\u003c/td>\u003c/tr>\u003ctr>\u003ctd>A feature that secretly contains the answer (e.g. \"refund_issued\" to predict churn)\u003c/td>\u003ctd>Drop features not known at prediction time\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Time series: training on the future\u003c/td>\u003ctd>Split by date, never shuffle\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>✍ Day 16 practice (tap to check)\u003c/h3>\n\u003cdetails>\u003csummary>Q1. Type each: (a) predict tomorrow's temperature (b) cat or dog photo (c) group news articles by topic (d) robot learns to walk\u003c/summary>(a) supervised \u003cb>regression\u003c/b> · (b) supervised \u003cb>classification\u003c/b> · (c) unsupervised \u003cb>clustering\u003c/b> · (d) \u003cb>reinforcement\u003c/b> learning\u003c/details>\n\u003cdetails>\u003csummary>Q2. Classification vs clustering?\u003c/summary>Classification has known labels to learn from (supervised). Clustering has none, it discovers groups itself (unsupervised).\u003c/details>\n\u003cdetails>\u003csummary>Q3. Why reduce dimensions?\u003c/summary>Fewer columns means faster training, easier plots, less noise, while keeping most of the information.\u003c/details>\n\u003cdetails>\u003csummary>Q4. Example of data leakage?\u003c/summary>Normalising the whole dataset (including test rows) before splitting: test statistics leaked into training.\u003c/details>\n\u003cdetails>\u003csummary>Q5. In RL, why is each step −1?\u003c/summary>It pushes the agent to reach the goal in as few steps as possible instead of wandering.\u003c/details>\u003c/div>\n\u003c/main>\n\u003cscript>\nconst $=i=>document.getElementById(i),col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\nconst T={galaxy:['🌌 Galaxy','#0b0620','rgba(28,16,66,.78)','#f1edff','#b8b0e8','#a78bfa','#60a5fa'],\nhole:['🕳 Black Hole','#050505','rgba(22,12,6,.82)','#fff3e6','#d9b99a','#ff9a3c','#ffe2b0'],\nnova:['💥 Supernova','#1a0505','rgba(54,12,8,.8)','#fff0e0','#f0b8a0','#ff5a2c','#ffd23c'],\naurora:['🌿 Aurora','#03130f','rgba(6,44,38,.78)','#eafff8','#9fd8c8','#2ee6a6','#2cc6d8'],\nneon:['🌆 Cyberpunk','#0a0612','rgba(22,10,40,.82)','#f6eaff','#c4a3e6','#ff2bd6','#18f0ff'],\nocean:['🌊 Deep Ocean','#021426','rgba(4,38,70,.78)','#e6f6ff','#9cc8e6','#38bdf8','#2dd4bf'],\nsunset:['🌇 Sunset Retro','#2a0f3a','rgba(70,22,60,.78)','#fff1e6','#f5c6b8','#ff8a3d','#ff5fa2'],\npaper:['📄 Light Paper','#f6f3ea','rgba(255,255,255,.9)','#1f2430','#555b6b','#4f46e5','#0d9488']};\nlet mode='galaxy';\nObject.keys(T).forEach(k=>{const b=document.createElement('button');b.textContent=T[k][0];b.onclick=()=>setT(k);b.id='t_'+k;$('ths').appendChild(b)});\nfunction setT(k){mode=k;const v=T[k],s=document.documentElement.style;['bg','card','tx','mut','a','b'].forEach((n,i)=>s.setProperty('--'+n,v[i+1]));\ndocument.querySelectorAll('.ths button').forEach(b=>b.classList.toggle('on',b.id=='t_'+k));initP();redraw()}\nconst bg=$('bg'),g=bg.getContext('2d');let W,H,P=[],t=0;\nfunction initP(){P=[];const n={galaxy:150,hole:260,nova:170,ocean:50}[mode]||60;for(let i=0;i\u003cn;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random(),a:Math.random()*6.28,d:70+Math.random()*Math.min(W,H)*.5})}\nfunction rs(){W=bg.width=innerWidth;H=bg.height=innerHeight;initP()}addEventListener('resize',rs);\nfunction lg(y0,y1,st){const q=g.createLinearGradient(0,y0,0,y1);st.forEach((c,i)=>q.addColorStop(i/(st.length-1),c));return q}\nfunction loop(){t+=.016;const cx=W/2,cy=H/2;g.globalCompositeOperation='source-over';\nif(mode=='galaxy'){const q=g.createRadialGradient(W*.3,H*.3,0,W*.5,H*.5,W);q.addColorStop(0,'#3a1a7a');q.addColorStop(.5,'#0f0a3a');q.addColorStop(1,'#050314');g.fillStyle=q;g.fillRect(0,0,W,H);P.forEach(p=>{g.globalAlpha=.4+.6*Math.abs(Math.sin(t*2+p.a));g.fillStyle='#fff';g.fillRect(p.x,p.y,p.r*2+.5,p.r*2+.5)})}\nelse if(mode=='hole'){g.fillStyle='#030303';g.fillRect(0,0,W,H);const q=g.createRadialGradient(cx,cy,30,cx,cy,260);q.addColorStop(0,'rgba(255,200,120,.5)');q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(0,0,W,H);\nP.forEach(p=>{const a=p.a+t*90/p.d,x=cx+Math.cos(a)*p.d*1.2,y=cy+Math.sin(a)*p.d*.3;g.globalAlpha=.8;g.fillStyle=`hsl(${25+Math.min(30,2000/p.d)},100%,${60+20*Math.sin(a)}%)`;g.fillRect(x,y,2.2,2.2)});\ng.globalAlpha=1;g.fillStyle='#000';g.beginPath();g.arc(cx,cy,42,0,7);g.fill();g.strokeStyle='#ffd9a0';g.lineWidth=2;g.stroke()}\nelse if(mode=='nova'){g.fillStyle='#1a0505';g.fillRect(0,0,W,H);const M=Math.max(W,H)*.6;P.forEach(p=>{const r=(t*60*(.3+p.r)+p.d)%M,x=cx+Math.cos(p.a)*r,y=cy+Math.sin(p.a)*r;g.globalAlpha=1-r/M;g.fillStyle=`hsl(${55-r/M*55},100%,55%)`;g.beginPath();g.arc(x,y,1+p.r*3,0,7);g.fill()})}\nelse if(mode=='aurora'){g.fillStyle='#03130f';g.fillRect(0,0,W,H);g.globalCompositeOperation='lighter';g.globalAlpha=1;\nfor(let k=0;k\u003c3;k++){const y0=H*.15+k*50;g.fillStyle=lg(y0,y0+260,['rgba(0,0,0,0)',k%2?'rgba(44,198,216,.28)':'rgba(46,230,166,.3)','rgba(0,0,0,0)']);g.beginPath();g.moveTo(0,y0);\nfor(let x=0;x\u003c=W;x+=14)g.lineTo(x,y0+Math.sin(x*.004+t*.6+k*2)*60);for(let x=W;x>=0;x-=14)g.lineTo(x,y0+200+Math.sin(x*.007+t*.8+k)*50);g.fill()}\ng.globalCompositeOperation='source-over';g.fillStyle='#fff';P.forEach(p=>{g.globalAlpha=.3+.3*Math.sin(t+p.a);g.fillRect(p.x,p.y*.5,1.5,1.5)})}\nelse if(mode=='neon'){g.fillStyle='#0a0612';g.fillRect(0,0,W,H);const hz=H*.55;g.globalAlpha=1;const q=g.createRadialGradient(cx,hz,0,cx,hz,130);q.addColorStop(0,'#ff2bd6');q.addColorStop(1,'rgba(255,43,214,0)');g.fillStyle=q;g.fillRect(0,hz-140,W,140);\ng.lineWidth=1.2;g.strokeStyle='#18f0ff';g.globalAlpha=.55;for(let i=-24;i\u003c=24;i++){g.beginPath();g.moveTo(cx+i*14,hz);g.lineTo(cx+i*W*.1,H);g.stroke()}\ng.strokeStyle='#ff2bd6';for(let j=0;j\u003c12;j++){const y=hz+(((j+t*.6)%12)/12)**2*(H-hz);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}}\nelse if(mode=='ocean'){g.fillStyle=lg(0,H,['#04406a','#021426','#010a14']);g.fillRect(0,0,W,H);P.forEach(p=>{const y=((p.y-t*(15+p.r*40))%H+H)%H,x=p.x+Math.sin(t+p.a)*15,r=3+p.r*14;g.globalAlpha=.5;g.strokeStyle='#5eead4';g.lineWidth=1.3;g.beginPath();g.arc(x,y,r,0,7);g.stroke();g.globalAlpha=.1;g.fillStyle='#38bdf8';g.fill()})}\nelse if(mode=='sunset'){g.fillStyle=lg(0,H,['#2a0f3a','#c2306b','#ff8a3d']);g.fillRect(0,0,W,H);const q=g.createRadialGradient(cx,H*.68,10,cx,H*.68,180);q.addColorStop(0,'rgba(255,230,150,.95)');q.addColorStop(.4,'rgba(255,140,60,.5)');q.addColorStop(1,'rgba(255,100,100,0)');g.fillStyle=q;g.fillRect(0,0,W,H);P.forEach(p=>{g.globalAlpha=.5;g.fillStyle='#fff';g.fillRect((p.x+t*10*p.r)%W,p.y*.5,2,2)})}\nelse{g.fillStyle='#f6f3ea';g.fillRect(0,0,W,H);P.forEach(p=>{g.globalAlpha=.12;g.fillStyle='#4f46e5';g.beginPath();g.arc((p.x+t*8*p.r)%W,(p.y+Math.sin(t+p.a)*10),2+p.r*4,0,7);g.fill()})}\ng.globalAlpha=1;requestAnimationFrame(loop)}\n/* helpers */\nfunction pl(id,x0,x1,y0,y1){const c=$(id),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.globalAlpha=1;x.setLineDash([]);return{x,w,h,x0,x1,y0,y1,X:u=>(u-x0)/(x1-x0)*w,Y:v=>h-(v-y0)/(y1-y0)*h}}\nfunction axes(o,sx=1,sy=1){const{x,w,h,X,Y}=o;x.lineWidth=1;x.strokeStyle=col('--tx');x.globalAlpha=.12;for(let u=Math.ceil(o.x0/sx)*sx;u\u003c=o.x1;u+=sx){x.beginPath();x.moveTo(X(u),0);x.lineTo(X(u),h);x.stroke()}for(let v=Math.ceil(o.y0/sy)*sy;v\u003c=o.y1;v+=sy){x.beginPath();x.moveTo(0,Y(v));x.lineTo(w,Y(v));x.stroke()}x.globalAlpha=1}\nfunction curve(o,f,c,lw=3){const{x,w}=o;x.beginPath();for(let px=0;px\u003c=w;px+=2){const u=o.x0+px/w*(o.x1-o.x0);px?x.lineTo(px,o.Y(f(u))):x.moveTo(px,o.Y(f(u)))}x.strokeStyle=c;x.lineWidth=lw;x.stroke()}\nfunction dot(o,u,v,r,c){o.x.fillStyle=c;o.x.beginPath();o.x.arc(o.X(u),o.Y(v),r,0,7);o.x.fill()}\nfunction seg(o,a,b,c2,d,c,lw=2,dash){const x=o.x;x.strokeStyle=c;x.lineWidth=lw;x.setLineDash(dash||[]);x.beginPath();x.moveTo(o.X(a),o.Y(b));x.lineTo(o.X(c2),o.Y(d));x.stroke();x.setLineDash([])}\nconst tag=(o,s,u,v)=>{o.x.fillStyle=col('--tx');o.x.font='13px system-ui';o.x.fillText(s,o.X(u),o.Y(v))};\nconst rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let q=Math.imul(s^s>>>15,1|s);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296},gs=r=>Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(6.2832*r());\nconst PAL=['#f97316','#22c55e','#60a5fa','#ec4899','#facc15'];\n/* 1 AI rings */\nconst AI=[['AI: Artificial Intelligence','Machines doing tasks that need human-like intelligence. Examp
