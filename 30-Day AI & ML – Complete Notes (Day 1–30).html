der.top{position:sticky;top:0;z-index:5;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--card);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}\nheader.top b{margin-right:6px}\nheader.top button{font:inherit;font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}\nheader.top button.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}\nmain{max-width:980px;margin:0 auto;padding:18px 14px 80px}\nh1{font-size:clamp(30px,6vw,54px);line-height:1.1;margin:30px 0 8px}\nh2{font-size:clamp(24px,4vw,34px);margin:50px 0 6px;color:var(--acc)}\nh3{font-size:19px;margin:0 0 6px}\np{margin:6px 0}.mut{color:var(--mut)}\nsection.c{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px 0}\n.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n@media(max-width:760px){.g2{grid-template-columns:1fr}}\ncanvas.s{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px}\n.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:8px 0}\n.ctl label{font-size:14px;display:flex;gap:8px;align-items:center}\ninput[type=range]{accent-color:var(--acc);width:150px}\nbutton.b{font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;border:1px solid var(--acc);background:transparent;color:var(--fg);cursor:pointer}\nbutton.b:hover{background:var(--acc);color:#000}\n.out{font-size:15px;padding:6px 10px;border-left:3px solid var(--acc2);background:rgba(127,127,127,.12);border-radius:4px;margin-top:6px}\n.eq{font-size:22px;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:10px;margin:10px 0}\n.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0}\n.flow span.n{padding:8px 12px;border:1px solid var(--line);border-radius:10px;transition:.3s;text-align:center;font-size:14px}\n.flow span.n.hi{background:var(--acc);color:#000;transform:scale(1.08);border-color:var(--acc)}\n.flow i{color:var(--acc2);font-style:normal}\npre{background:rgba(0,0,0,.45);color:#e8ecff;padding:12px;border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.5;margin:8px 0}\nbody[data-theme=paper] pre{background:#f0f3fa;color:#1c2230}\n.bar{height:22px;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .25s;min-width:2px}\n.row{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:14px}.row b{width:48px}\n.tip{border-left:4px solid var(--acc);padding:6px 12px;margin:8px 0;background:rgba(127,127,127,.12);border-radius:4px}\ntable{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}\n.fill{background:var(--acc);color:#000}button.b.on{background:var(--acc);color:#000}a{color:var(--acc2)}select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px}html{scroll-behavior:smooth}\u003c/style>\u003c/head>\n\u003cbody data-theme=\"galaxy\">\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cheader class=\"top\">\u003cb>Theme\u003c/b>\u003cspan id=\"th\" style=\"display:contents\">\u003c/span>\u003c/header>\n\u003cmain>\n\u003ch1>Days 22 and 23: Clean the Data, Then Engineer Features\u003c/h1>\n\u003cp class=\"mut\">Zero-level notes. Models are only as good as the data you feed them. Jump to:\n\u003ca href=\"#d22\">Day 22 Preprocessing\u003c/a> &nbsp; \u003ca href=\"#d23\">Day 23 Feature Engineering\u003c/a>\u003c/p>\n\n\u003ch2 id=\"d22\">Day 22: Data Preprocessing\u003c/h2>\n\u003csection class=\"c\">\u003ch3>The preprocessing pipeline: raw data → model-ready data\u003c/h3>\n\u003cdiv class=\"flow\" id=\"pipe\">\u003cspan class=\"n\">Raw data\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">Missing values\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">Duplicates\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">Outliers\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">Encoding\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">Scaling\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">Model\u003c/span>\u003c/div>\n\u003cp class=\"tip\">Golden rule: learn the fill values / scaling numbers from the \u003cb>training set only\u003c/b>, then apply them to the test set. Otherwise test information leaks into training (data leakage).\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>1. Missing values\u003c/h3>\n\u003cp>Real data has holes (\u003cb>NaN\u003c/b>). Models cannot digest them. Pick a fix and see the table change:\u003c/p>\n\u003cdiv class=\"ctl\" id=\"mb\">\u003cbutton class=\"b\" data-m=\"none\">Original\u003c/button>\u003cbutton class=\"b\" data-m=\"drop\">Drop rows\u003c/button>\u003cbutton class=\"b\" data-m=\"mean\">Fill with mean\u003c/button>\u003cbutton class=\"b\" data-m=\"median\">Fill with median\u003c/button>\u003c/div>\n\u003cdiv id=\"mt\" style=\"overflow-x:auto\">\u003c/div>\u003cdiv class=\"out\" id=\"mo\">\u003c/div>\n\u003cp class=\"tip\">Dropping loses data. Mean is fine for balanced numbers, median is safer with outliers, and text columns use the \u003cb>most frequent\u003c/b> value. Filled cells are highlighted.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>2. Duplicates\u003c/h3>\n\u003cp>The same row twice = the model counts it double. Crossed-out rows are duplicates.\u003c/p>\n\u003cdiv id=\"dt\" style=\"overflow-x:auto\">\u003c/div>\u003cdiv class=\"ctl\">\u003cbutton class=\"b\" id=\"db\">drop_duplicates()\u003c/button>\u003c/div>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>3. Outliers: values far from the crowd\u003c/h3>\n\u003cdiv class=\"eq\" style=\"font-size:18px\">IQR = Q3 − Q1 &nbsp; | &nbsp; fences = Q1 − 1.5·IQR and Q3 + 1.5·IQR\u003c/div>\n\u003ccanvas class=\"s\" id=\"o1\" width=\"640\" height=\"230\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>add one more value \u003cinput type=\"range\" id=\"ov\" min=\"20\" max=\"200\" value=\"40\">\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" id=\"oc\"> cap outliers at the fences\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"oo\">\u003c/div>\n\u003cp class=\"tip\">Box = middle 50% of data. Dashed lines = fences. Red dots are outliers. Slide the value up: the \u003cb>mean\u003c/b> runs away but the \u003cb>median\u003c/b> hardly moves.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>4. Encoding: turn words into numbers\u003c/h3>\n\u003cdiv class=\"ctl\">\u003clabel>column type \u003cselect id=\"es\">\u003coption value=\"city\">City (no order)\u003c/option>\u003coption value=\"size\">T-shirt size (has order)\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n\u003cdiv id=\"et\" style=\"overflow-x:auto\">\u003c/div>\u003cdiv class=\"out\" id=\"eo\">\u003c/div>\n\u003ctable style=\"margin-top:8px\">\u003ctr>\u003cth>Tool\u003c/th>\u003cth>Use for\u003c/th>\u003c/tr>\u003ctr>\u003ctd>LabelEncoder\u003c/td>\u003ctd>the \u003cb>target\u003c/b> column (y): turns classes into 0, 1, 2\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OrdinalEncoder\u003c/td>\u003ctd>feature with a real order (S &lt; M &lt; L)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>OneHotEncoder\u003c/td>\u003ctd>feature with no order (cities, colours): one 0/1 column per category\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>5. Scaling: give every feature a fair voice\u003c/h3>\n\u003cp>Age is 20 to 60, salary is 20,000 to 150,000. Distance-based models (KNN, SVM, gradient descent) will ignore age unless we rescale.\u003c/p>\n\u003cdiv class=\"g2\">\u003cdiv class=\"eq\" style=\"font-size:17px\">\u003cb>Standardization\u003c/b>\u003cbr>z = (x − mean) / std\u003cbr>\u003cspan class=\"mut\" style=\"font-size:14px\">StandardScaler: mean 0, std 1\u003c/span>\u003c/div>\n\u003cdiv class=\"eq\" style=\"font-size:17px\">\u003cb>Normalization (Min-Max)\u003c/b>\u003cbr>x' = (x − min) / (max − min)\u003cbr>\u003cspan class=\"mut\" style=\"font-size:14px\">MinMaxScaler: squeezes into 0 to 1\u003c/span>\u003c/div>\u003c/div>\n\u003ccanvas class=\"s\" id=\"sc\" width=\"640\" height=\"250\">\u003c/canvas>\n\u003cdiv class=\"ctl\" id=\"sb\">\u003cbutton class=\"b\" data-m=\"raw\">Raw\u003c/button>\u003cbutton class=\"b\" data-m=\"std\">Standardize\u003c/button>\u003cbutton class=\"b\" data-m=\"mm\">MinMax\u003c/button>\u003c/div>\n\u003cdiv class=\"out\" id=\"so\">\u003c/div>\n\u003ctable style=\"margin-top:8px\">\u003ctr>\u003cth>\u003c/th>\u003cth>Standardization\u003c/th>\u003cth>Min-Max\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Range\u003c/td>\u003ctd>about −3 to 3, unbounded\u003c/td>\u003ctd>exactly 0 to 1\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Outliers\u003c/td>\u003ctd>handles better\u003c/td>\u003ctd>squashes everything else\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Good for\u003c/td>\u003ctd>linear/logistic, SVM, KNN, PCA\u003c/td>\u003ctd>neural nets, image pixels\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Not needed for\u003c/td>\u003ctd colspan=\"2\">decision trees, random forests, boosting\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>6. Build a preprocessing pipeline\u003c/h3>\n\u003cpre>import pandas as pd\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.preprocessing import StandardScaler, OneHotEncoder, LabelEncoder  # MinMaxScaler is the alternative\nfrom sklearn.linear_model import LogisticRegression\n\ndf = pd.DataFrame({\"age\":[25,32,None,41,29,32], \"salary\":[30000,45000,40000,None,35000,45000],\n                   \"city\":[\"Delhi\",\"Noida\",\"Delhi\",None,\"Noida\",\"Noida\"],\n                   \"bought\":[\"yes\",\"no\",\"yes\",\"no\",\"yes\",\"no\"]})\ndf = df.drop_duplicates()                                   # duplicates\nq1, q3 = df[\"salary\"].quantile([.25, .75]); iqr = q3 - q1\ndf[\"salary\"] = df[\"salary\"].clip(q1 - 1.5*iqr, q3 + 1.5*iqr)  # outliers: cap at fences\ny = LabelEncoder().fit_transform(df.pop(\"bought\"))          # LabelEncoder for the target\n\nnum = Pipeline([(\"fill\", SimpleImputer(strategy=\"median\")), (\"scale\", StandardScaler())])\ncat = Pipeline([(\"fill\", SimpleImputer(strategy=\"most_frequent\")),\n                (\"onehot\", OneHotEncoder(handle_unknown=\"ignore\"))])\nprep = ColumnTransformer([(\"num\", num, [\"age\", \"salary\"]), (\"cat\", cat, [\"city\"])])\n\nmodel = Pipeline([(\"prep\", prep), (\"clf\", LogisticRegression())])\nmodel.fit(df, y)                                            # fit on TRAIN data only in real projects\nprint(model.predict(df))\u003c/pre>\u003c/section>\n\n\u003ch2 id=\"d23\">Day 23: Feature Engineering\u003c/h2>\n\u003csection class=\"c\">\u003ch3>Selection vs extraction, numerical vs categorical\u003c/h3>\n\u003cdiv class=\"g2\">\u003cdiv class=\"flow\" style=\"flex-direction:column\">\u003cb>Feature selection\u003c/b>\u003cspan class=\"n\">keep the useful columns, drop the rest\u003c/span>\u003cspan class=\"mut\" style=\"font-size:14px\">12 columns → 6 columns\u003c/span>\u003c/div>\n\u003cdiv class=\"flow\" style=\"flex-direction:column\">\u003cb>Feature extraction\u003c/b>\u003cspan class=\"n\">build new columns from old ones (ratios, PCA)\u003c/span>\u003cspan class=\"mut\" style=\"font-size:14px\">height, weight → BMI\u003c/span>\u003c/div>\u003c/div>\n\u003ctable>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Examples\u003c/th>\u003cth>Tricks\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Numerical\u003c/td>\u003ctd>age, price, area\u003c/td>\u003ctd>scale, log transform, binning, ratios\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Categorical\u003c/td>\u003ctd>city, colour, size\u003c/td>\u003ctd>one-hot, ordinal, group rare values\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Date/time\u003c/td>\u003ctd>2026-10-09\u003c/td>\u003ctd>year, month, weekday, is_weekend\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>1. Covariance and correlation\u003c/h3>\n\u003cdiv class=\"g2\">\u003cdiv class=\"eq\" style=\"font-size:16px\">Cov(x,y) = mean[(x − x̄)(y − ȳ)]\u003c/div>\u003cdiv class=\"eq\" style=\"font-size:16px\">r = Cov(x,y) / (σx · σy) &nbsp; (−1 to +1)\u003c/div>\u003c/div>\n\u003ccanvas class=\"s\" id=\"c1\" width=\"640\" height=\"360\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>correlation r \u003cinput type=\"range\" id=\"cr\" min=\"-.99\" max=\".99\" step=\".01\" value=\".7\">\u003c/label>\u003clabel>measure y in bigger units (×) \u003cinput type=\"range\" id=\"cu\" min=\"1\" max=\"10\" step=\".5\" value=\"1\">\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"co\">\u003c/div>\n\u003cp class=\"tip\">Move r: the cloud tilts and tightens. Now raise the units: \u003cb>covariance explodes but correlation stays the same\u003c/b>. That is why we compare features using correlation, not covariance.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>2. Feature selection with correlation\u003c/h3>\n\u003cp>Correlation of each feature with the target (house price). Slide the cut-off: features below it get dropped.\u003c/p>\n\u003cdiv id=\"fs\">\u003c/div>\n\u003cdiv class=\"ctl\">\u003clabel>keep if |correlation| ≥ \u003cinput type=\"range\" id=\"ft\" min=\"0\" max=\".8\" step=\".05\" value=\".2\"> \u003cb id=\"ftv\">\u003c/b>\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"fo\">\u003c/div>\n\u003ctable style=\"margin-top:8px\">\u003ctr>\u003cth>Method\u003c/th>\u003cth>Idea\u003c/th>\u003cth>Example\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Filter\u003c/td>\u003ctd>score each feature alone\u003c/td>\u003ctd>correlation, SelectKBest\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Wrapper\u003c/td>\u003ctd>try subsets with a model\u003c/td>\u003ctd>RFE\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Embedded\u003c/td>\u003ctd>model picks while training\u003c/td>\u003ctd>Lasso, tree importances\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>3. Multicollinearity: features that copy each other\u003c/h3>\n\u003cp>If two inputs say the same thing, a linear model cannot tell who deserves the credit. Each dot below is one re-sampling of the data; the true weights are (1, 1) ★.\u003c/p>\n\u003ccanvas class=\"s\" id=\"m1\" width=\"640\" height=\"360\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>correlation between x₁ and x₂ \u003cinput type=\"range\" id=\"rh\" min=\"0\" max=\".995\" step=\".005\" value=\".1\">\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"mo2\">\u003c/div>\n\u003cp class=\"tip\">At low correlation the dots hug the ★. At high correlation they smear into a long diagonal: coefficients become unstable and unreliable. \u003cb>VIF = 1 / (1 − r²)\u003c/b>, and VIF above 5 to 10 is a red flag. Fix: drop one feature, combine them, or use PCA/Ridge.\u003c/p>\n\u003cp style=\"margin-top:10px\">\u003cb>Spot it with a correlation heatmap\u003c/b> (outlined cells: |r| above 0.8):\u003c/p>\u003cdiv id=\"hm\" style=\"overflow-x:auto\">\u003c/div>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>4. Interaction features: combine two features\u003c/h3>\n\u003cp>Class depends on x₁ × x₂ (opposite quadrants share a class). No straight line can split this. Add the feature \u003cb>x₁·x₂\u003c/b> and slide it in:\u003c/p>\n\u003ccanvas class=\"s\" id=\"i1\" width=\"640\" height=\"360\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>blend in x₁·x₂ \u003cinput type=\"range\" id=\"it\" min=\"0\" max=\"100\" value=\"0\">\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"io\">\u003c/div>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>5. Polynomial features: let a line bend\u003c/h3>\n\u003cdiv class=\"eq\" style=\"font-size:17px\">x → [x, x², x³, …]  (PolynomialFeatures)\u003c/div>\n\u003ccanvas class=\"s\" id=\"p1\" width=\"640\" height=\"360\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>degree \u003cinput type=\"range\" id=\"pd\" min=\"1\" max=\"10\" value=\"1\"> \u003cb id=\"pdv\">1\u003c/b>\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"po\">\u003c/div>\n\u003cp class=\"tip\">Dots are training data, hollow dots are unseen test data. Degree 1 underfits. Degree 2 matches the real curve. High degree wiggles through every training dot (test error jumps): overfitting.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>6. Mini project: engineer features on a real dataset\u003c/h3>\n\u003cpre>import numpy as np, pandas as pd\nfrom sklearn.datasets import fetch_california_housing\nfrom sklearn.model_selection import cross_val_score\nfrom sklearn.linear_model import LinearRegression\nfrom sklearn.pipeline import make_pipeline\nfrom sklearn.preprocessing import StandardScaler, PolynomialFeatures\nfrom sklearn.feature_selection import SelectKBest, f_regression\nfrom statsmodels.tools.tools import add_constant\nfrom statsmodels.stats.outliers_influence import variance_inflation_factor\n\ndf = fetch_california_housing(as_frame=True).frame            # target: MedHouseVal\ny = df.pop(\"MedHouseVal\")\nprint(\"baseline R2:\", cross_val_score(LinearRegression(), df, y, cv=5).mean())\n\n# 1) create features\ndf[\"RoomsPerPerson\"] = df.AveRooms / df.AveOccup\ndf[\"BedroomRatio\"]   = df.AveBedrms / df.AveRooms\ndf[\"LogPopulation\"]  = np.log1p(df.Population)\ndf[\"Income_x_Rooms\"] = df.MedInc * df.AveRooms                # interaction\n\n# 2) correlation and multicollinearity\nprint(pd.concat([df, y], axis=1).corr()[\"MedHouseVal\"].sort_values())\nXc = add_constant(df)\nprint(pd.Series([variance_inflation_factor(Xc.values, i) for i in range(1, Xc.shape[1])], index=df.columns))\n\n# 3) select the best k, add polynomial terms, compare\nmodel = make_pipeline(StandardScaler(), SelectKBest(f_regression, k=8),\n                      PolynomialFeatures(2), LinearRegression())\nprint(\"engineered R2:\", cross_val_score(model, df, y, cv=5).mean())\u003c/pre>\n\u003cp class=\"tip\">Always judge a new feature by cross-validated score, not by feeling. If R² does not improve, drop it.\u003c/p>\u003c/section>\n\u003c/main>\n\u003cscript>\nconst $=s=>document.querySelector(s),C=n=>getComputedStyle(document.body).getPropertyValue(n).trim();\nconst P=id=>{const c=$(id);return{x:c.getContext('2d'),W:c.width,H:c.height}};\nfunction fr(p,xr,yr,xl,yl){const{x,W,H}=p,m=38;x.clearRect(0,0,W,H);\nconst X=v=>m+(v-xr[0])/(xr[1]-xr[0])*(W-m-12),Y=v=>H-m-(v-yr[0])/(yr[1]-yr[0])*(H-m-12);\nx.strokeStyle=C('--line');x.fillStyle=C('--mut');x.lineWidth=1;x.font='12px sans-serif';x.setLineDash([]);\nx.beginPath();x.moveTo(m,8);x.lineTo(m,H-m);x.lineTo(W-8,H-m);x.stroke();\nx.fillText(xl,W/2-30,H-10);x.save();x.translate(13,H/2+20);x.rotate(-Math.PI/2);x.fillText(yl,0,0);x.restore();\nreturn{X,Y,m}}\nconst clip=(p,m)=>{p.x.save();p.x.beginPath();p.x.rect(m,8,p.W-m-8,p.H-m-8);p.x.clip()};\n/* ---- themes + background ---- */\nconst TH=[['galaxy','Galaxy'],['blackhole','Black Hole'],['supernova','Supernova'],['aurora','Aurora'],['neon','Cyberpunk Neon'],['ocean','Deep Ocean'],['sunset','Sunset Retro'],['paper','Light Paper']];\nfunction setTheme(k){document.body.dataset.theme=k;[...$('#th').children].forEach(b=>b.classList.toggle('on',b.dataset.k==k));redraw()}\nTH.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.k=k;b.onclick=()=>setTheme(k);$('#th').appendChild(b)});\nconst bg=$('#bg'),bx=bg.getContext('2d');let BW,BH,T=0;const rs=()=>{BW=bg.width=innerWidth;BH=bg.height=innerHeight};rs();addEventListener('resize',rs);\nconst PS=Array.from({length:170},()=>({a:Math.random()*6.283,r:Math.random(),s:Math.random()}));\nconst glow=(x,y,r,c0,c1)=>{const g=bx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c0);g.addColorStop(1,c1);bx.fillStyle=g;bx.fillRect(x-r,y-r,2*r,2*r)};\nconst BGF={\ngalaxy(){glow(BW*(.3+.05*Math.sin(T*.2)),BH*.3,BW*.45,'rgba(150,80,255,.28)','rgba(150,80,25 st I1=mk('#i1');\nfunction dI(){const t=+$('#it').value/100,F=fr(I1,[-3.2,3.2],[-3.2,3.2],'x₁','vertical axis: x₂ morphing into x₁·x₂'),x=I1.x;\nif(t>.9){x.strokeStyle=C('--acc2');x.lineWidth=3;x.setLineDash([8,6]);x.beginPath();x.moveTo(F.X(-3.2),F.Y(0));x.lineTo(F.X(3.2),F.Y(0));x.stroke();x.setLineDash([])}\nIP.forEach(([a,b,c])=>dot(x,F.X(a),F.Y((1-t)*b+t*a*b/3),0,c));\n$('#io').innerHTML=t>.9?'With x₁·x₂ as the vertical axis, \u003cb>one straight line separates the classes perfectly\u003c/b>.':'In (x₁, x₂) space, \u003cb>no single straight line\u003c/b> can separate circles from squares.'}\n$('#it').oninput=dI;\n/* ---- polynomial ---- */\nconst f0=v=>.6*v*v-v+1,PX=Array.from({length:16},()=>rnd()*4-2),PY=PX.map(v=>f0(v)+gn()*.5),TX=Array.from({length:40},()=>rnd()*4-2),TY=TX.map(v=>f0(v)+gn()*.5),P1=mk('#p1');\nfunction fitP(d){const n=d+1,A=Array.from({length:n},()=>Array(n+1).fill(0));\nPX.forEach((v,i)=>{const s=v/2;for(let j=0;j\u003cn;j++){for(let k=0;k\u003cn;k++)A[j][k]+=s**(j+k);A[j][n]+=s**j*PY[i]}});for(let j=0;j\u003cn;j++)A[j][j]+=1e-6;\nfor(let c=0;c\u003cn;c++){let p=c;for(let r=c+1;r\u003cn;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];for(let r=0;r\u003cn;r++){if(r==c)continue;const m=A[r][c]/A[c][c];for(let k=c;k\u003c=n;k++)A[r][k]-=m*A[c][k]}}\nconst w=A.map((r,i)=>r[n]/r[i]);return v=>w.reduce((s,wk,k)=>s+wk*(v/2)**k,0)}\nfunction dP(){const d=+$('#pd').value;$('#pdv').textContent=d;const g=fitP(d),F=fr(P1,[-2.2,2.2],[-2,6],'x','y'),x=P1.x;clip(P1,F.m);\nx.setLineDash([5,5]);x.strokeStyle=C('--mut');x.lineWidth=1.5;x.beginPath();for(let v=-2.2;v\u003c=2.2;v+=.05)v\u003c-2.19?x.moveTo(F.X(v),F.Y(f0(v))):x.lineTo(F.X(v),F.Y(f0(v)));x.stroke();x.setLineDash([]);\nx.strokeStyle=C('--acc');x.lineWidth=3;x.beginPath();for(let v=-2.2;v\u003c=2.2;v+=.05)v\u003c-2.19?x.moveTo(F.X(v),F.Y(g(v))):x.lineTo(F.X(v),F.Y(g(v)));x.stroke();x.restore();\nTX.forEach((v,i)=>{x.strokeStyle=C('--acc2');x.lineWidth=2;x.beginPath();x.arc(F.X(v),F.Y(TY[i]),4,0,7);x.stroke()});\nPX.forEach((v,i)=>{x.fillStyle=C('--fg');x.beginPath();x.arc(F.X(v),F.Y(PY[i]),5,0,7);x.fill()});\nconst e=(X,Y)=>avg(X.map((v,i)=>(Y[i]-g(v))**2));$('#po').innerHTML=`degree ${d} | train error \u003cb>${e(PX,PY).toFixed(2)}\u003c/b> | test error \u003cb>${e(TX,TY).toFixed(2)}\u003c/b> | dashed line = the true curve`}\n$('#pd').oninput=dP;\n/* ---- misc ---- */\nconst pn=[...document.querySelectorAll('#pipe span.n')];let pk=0;setInterval(()=>{pn.forEach((e,i)=>e.classList.toggle('hi',i==pk));pk=(pk+1)%pn.length},800);\nfunction redraw(){dM();dD();dO();dEn();dSc();dC();dFS();dMC();dH();dI();dP()}\nsetTheme('galaxy');\n\u003c/script>\u003c/body>\u003c/html>", "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>ML from Zero: Evaluation, Validation, Bias-Variance (Day 24-25)\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*{box-sizing:border-box}\nbody{margin:0;font:16px/1.65 'Space Grotesk',system-ui,sans-serif;color:var(--fg);background:var(--bg) fixed;transition:color .4s}\nbody[data-theme=galaxy]{--bg:linear-gradient(160deg,#0b0620,#1a1050 60%,#0a2050);--fg:#eeeaff;--mut:#b4acd9;--card:rgba(20,12,60,.66);--acc:#b388ff;--acc2:#5ec8ff;--line:rgba(200,190,255,.35)}\nbody[data-theme=blackhole]{--bg:radial-gradient(circle at 72% 30%,#1a0c04,#000 60%);--fg:#fff3e6;--mut:#d8b79a;--card:rgba(15,8,4,.72);--acc:#ff9a2e;--acc2:#fff1b0;--line:rgba(255,170,90,.35)}\nbody[data-theme=supernova]{--bg:radial-gradient(circle at 50% 40%,#4a0d05,#16030a 70%);--fg:#fff1e0;--mut:#f2b98f;--card:rgba(40,6,4,.7);--acc:#ff5a2a;--acc2:#ffd23f;--line:rgba(255,150,80,.4)}\nbody[data-theme=aurora]{--bg:linear-gradient(180deg,#02121a,#06302f 70%,#0a3a3a);--fg:#e8fff6;--mut:#9fd9c6;--card:rgba(2,28,30,.68);--acc:#4dffa6;--acc2:#4de1ff;--line:rgba(120,255,200,.35)}\nbody[data-theme=neon]{--bg:linear-gradient(180deg,#0a0016,#1a0033);--fg:#f4f0ff;--mut:#c5a8ee;--card:rgba(14,2,32,.74);--acc:#ff2fa8;--acc2:#2ff3ff;--line:rgba(255,80,200,.45)}\nbody[data-theme=ocean]{--bg:linear-gradient(180deg,#02142e,#012a5a 60%,#00162b);--fg:#e6f6ff;--mut:#9cc8e6;--card:rgba(2,24,56,.7);--acc:#35e0d0;--acc2:#7fb8ff;--line:rgba(120,210,255,.38)}\nbody[data-theme=sunset]{--bg:linear-gradient(180deg,#2a0b4d,#a1275f 55%,#ff9152);--fg:#fff7f0;--mut:#ffd9c2;--card:rgba(50,10,60,.68);--acc:#ffc24d;--acc2:#7ff0ff;--line:rgba(255,220,190,.45)}\nbody[data-theme=paper]{--bg:#fdfdfe;--fg:#1c2230;--mut:#5a6478;--card:rgba(255,255,255,.92);--acc:#2457d6;--acc2:#d6245e;--line:rgba(30,40,70,.25)}\n#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}\nheader.top{position:sticky;top:0;z-index:5;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--card);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}\nheader.top b{margin-right:6px}\nheader.top button{font:inherit;font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}\nheader.top button.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}\nmain{max-width:980px;margin:0 auto;padding:18px 14px 80px}\nh1{font-size:clamp(30px,6vw,54px);line-height:1.1;margin:30px 0 8px}\nh2{font-size:clamp(24px,4vw,34px);margin:50px 0 6px;color:var(--acc)}\nh3{font-size:19px;margin:0 0 6px}\np{margin:6px 0}.mut{color:var(--mut)}\nsection.c{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px 0}\n.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n@media(max-width:760px){.g2{grid-template-columns:1fr}}\ncanvas.s{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px}\n.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:8px 0}\n.ctl label{font-size:14px;display:flex;gap:8px;align-items:center}\ninput[type=range]{accent-color:var(--acc);width:150px}\nbutton.b{font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;border:1px solid var(--acc);background:transparent;color:var(--fg);cursor:pointer}\nbutton.b:hover{background:var(--acc);color:#000}\n.out{font-size:15px;padding:6px 10px;border-left:3px solid var(--acc2);background:rgba(127,127,127,.12);border-radius:4px;margin-top:6px}\n.eq{font-size:22px;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:10px;margin:10px 0}\n.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0}\n.flow span.n{padding:8px 12px;border:1px solid var(--line);border-radius:10px;transition:.3s;text-align:center;font-size:14px}\n.flow span.n.hi{background:var(--acc);color:#000;transform:scale(1.08);border-color:var(--acc)}\n.flow i{color:var(--acc2);font-style:normal}\npre{background:rgba(0,0,0,.45);color:#e8ecff;padding:12px;border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.5;margin:8px 0}\nbody[data-theme=paper] pre{background:#f0f3fa;color:#1c2230}\n.bar{height:22px;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .25s;min-width:2px}\n.row{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:14px}.row b{width:48px}\n.tip{border-left:4px solid var(--acc);padding:6px 12px;margin:8px 0;background:rgba(127,127,127,.12);border-radius:4px}\ntable{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}\n.fill{background:var(--acc);color:#000}a{color:var(--acc2)}select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px}html{scroll-behavior:smooth}\u003c/style>\u003c/head>\n\u003cbody data-theme=\"galaxy\">\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cheader class=\"top\">\u003cb>Theme\u003c/b>\u003cspan id=\"th\" style=\"display:contents\">\u003c/span>\u003c/header>\n\u003cmain>\n\u003ch1>Days 24 and 25: Is the Model Any Good?\u003c/h1>\n\u003cp class=\"mut\">Zero-level notes. First learn the scorecards (metrics), then learn how to test fairly (splits, cross-validation, bias/variance). Jump to:\n\u003ca href=\"#d24\">Day 24 Model Evaluation\u003c/a> &nbsp; \u003ca href=\"#d25\">Day 25 Validation + Bias/Variance\u003c/a>\u003c/p>\n\n\u003ch2 id=\"d24\">Day 24: Model Evaluation\u003c/h2>\n\u003csection class=\"c\">\u003ch3>1. Confusion matrix: all four outcomes of a yes/no model\u003c/h3>\n\u003cp>Say the model detects a disease. \u003cb>Positive\u003c/b> = \"sick\". Each patient lands in one of 4 boxes. Squares = really sick, circles = really healthy. \u003cspan style=\"color:#ff6b6b\">Red outline\u003c/span> = model got it wrong.\u003c/p>\n\u003ccanvas class=\"s\" id=\"e1\" width=\"640\" height=\"210\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>threshold (say \"sick\" if score ≥) \u003cinput type=\"range\" id=\"th\" min=\"0\" max=\"1.01\" step=\".01\" value=\".5\"> \u003cb id=\"thv\">\u003c/b>\u003c/label>\n\u003clabel>class separation \u003cinput type=\"range\" id=\"sep\" min=\"0\" max=\".7\" step=\".05\" value=\".3\">\u003c/label>\n\u003clabel>data \u003cselect id=\"pv\">\u003coption value=\".4\">Balanced (40% sick)\u003c/option>\u003coption value=\".05\">Rare disease (5% sick)\u003c/option>\u003c/select>\u003c/label>\n\u003cbutton class=\"b\" id=\"sn\">Always say \"healthy\"\u003c/button>\u003c/div>\n\u003cdiv class=\"g2\">\u003cdiv id=\"cm\">\u003c/div>\u003cdiv id=\"mt\">\u003c/div>\u003c/div>\n\u003cdiv class=\"out\" id=\"eo\">\u003c/div>\n\u003cp class=\"tip\">Try \u003cb>Rare disease\u003c/b> + \u003cb>Always say \"healthy\"\u003c/b>: accuracy looks great (about 95%) but recall is 0%, and the model finds nobody sick. Accuracy lies when classes are imbalanced.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>2. Precision, recall, F1: which mistake hurts more?\u003c/h3>\n\u003ctable>\u003ctr>\u003cth>Metric\u003c/th>\u003cth>Formula\u003c/th>\u003cth>Plain meaning\u003c/th>\u003cth>Care when\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Accuracy\u003c/td>\u003ctd>(TP+TN) / all\u003c/td>\u003ctd>how often we are right\u003c/td>\u003ctd>classes are balanced\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Precision\u003c/td>\u003ctd>TP / (TP+FP)\u003c/td>\u003ctd>of those we called positive, how many really are\u003c/td>\u003ctd>false alarms are costly (spam filter)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Recall\u003c/td>\u003ctd>TP / (TP+FN)\u003c/td>\u003ctd>of all real positives, how many we caught\u003c/td>\u003ctd>missing one is costly (cancer, fraud)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>F1\u003c/td>\u003ctd>2·P·R / (P+R)\u003c/td>\u003ctd>one number balancing precision and recall\u003c/td>\u003ctd>imbalanced data, both matter\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"tip\">Raising the threshold makes the model pickier: precision goes up, recall goes down. Slide the threshold above and watch them trade places.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>3. ROC curve, AUC and PR curve\u003c/h3>\n\u003cp>Instead of one threshold, sweep \u003cb>all\u003c/b> thresholds. \u003cb>ROC\u003c/b>: True Positive Rate vs False Positive Rate. \u003cb>AUC\u003c/b> = area under it (0.5 = coin flip, 1.0 = perfect). \u003cb>PR curve\u003c/b>: precision vs recall. The big dot is your current threshold.\u003c/p>\n\u003cdiv class=\"g2\">\u003ccanvas class=\"s\" id=\"e2\" width=\"440\" height=\"340\">\u003c/canvas>\u003ccanvas class=\"s\" id=\"e3\" width=\"440\" height=\"340\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"out\" id=\"eo2\">\u003c/div>\n\u003cp class=\"tip\">Use the same sliders above. Switch to Rare disease: ROC still looks decent, but the PR curve drops. For rare positives, trust the \u003cb>PR curve\u003c/b> more than ROC-AUC.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>4. Regression metrics: how far off are the numbers?\u003c/h3>\n\u003cdiv class=\"g2\">\u003cdiv class=\"eq\" style=\"font-size:16px\">MAE = mean |y − ŷ| &nbsp; MSE = mean (y − ŷ)²\u003cbr>RMSE = √MSE\u003c/div>\u003cdiv class=\"eq\" style=\"font-size:16px\">R² = 1 − Σ(y − ŷ)² / Σ(y − ȳ)²\u003c/div>\u003c/div>\n\u003ccanvas class=\"s\" id=\"r1\" width=\"640\" height=\"340\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>push the last point away from the line \u003cinput type=\"range\" id=\"rd\" min=\"-15\" max=\"15\" step=\"1\" value=\"0\">\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"ro\">\u003c/div>\n\u003cp class=\"tip\">MAE: the average mistake, same units as y. MSE/RMSE: punish big mistakes much harder (squared). R²: share of the variation explained (1 = perfect, 0 = no better than predicting the mean). Drag the slider: MSE explodes, MAE only creeps.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>5. Which metric for which problem?\u003c/h3>\n\u003ctable>\u003ctr>\u003cth>Problem\u003c/th>\u003cth>Use\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Balanced classes, general check\u003c/td>\u003ctd>Accuracy + confusion matrix\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Spam filter (false alarms hurt)\u003c/td>\u003ctd>Precision\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Disease, fraud, safety (misses hurt)\u003c/td>\u003ctd>Recall\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Imbalanced data, need balance\u003c/td>\u003ctd>F1, PR curve, PR-AUC\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Compare models across thresholds\u003c/td>\u003ctd>ROC-AUC\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Regression, outliers are normal\u003c/td>\u003ctd>MAE\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Regression, big errors are very bad\u003c/td>\u003ctd>RMSE / MSE\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Regression, explain overall fit\u003c/td>\u003ctd>R²\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>6. Code: all the metrics\u003c/h3>\n\u003cpre>from sklearn.datasets import make_classification\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.metrics import (confusion_matrix, accuracy_score, precision_score, recall_score, f1_score,\n    classification_report, roc_auc_score, roc_curve, precision_recall_curve, average_precision_score,\n    mean_absolute_error, mean_squared_error, r2_score)\n\nX, y = make_classification(n_samples=1000, weights=[0.9], random_state=1)   # imbalanced: 10% positive\nXtr, Xte, ytr, yte = train_test_split(X, y, stratify=y, random_state=1)\nclf = LogisticRegression().fit(Xtr, ytr)\npred, proba = clf.predict(Xte), clf.predict_proba(Xte)[:, 1]\n\nprint(confusion_matrix(yte, pred))              # [[TN FP] [FN TP]]\nprint(\"acc\", accuracy_score(yte, pred), \"prec\", precision_score(yte, pred),\n      \"rec\", recall_score(yte, pred), \"f1\", f1_score(yte, pred))\nprint(classification_report(yte, pred))\nprint(\"ROC-AUC\", roc_auc_score(yte, proba), \"PR-AUC\", average_precision_score(yte, proba))\nfpr, tpr, _ = roc_curve(yte, proba); prec, rec, _ = precision_recall_curve(yte, proba)\n\n# regression\ny_true, y_pred = [3.0, 5.0, 7.5, 10.0], [2.8, 5.4, 7.0, 11.0]\nmse = mean_squared_error(y_true, y_pred)\nprint(\"MAE\", mean_absolute_error(y_true, y_pred), \"MSE\", mse, \"RMSE\", mse ** 0.5, \"R2\", r2_score(y_true, y_pred))\u003c/pre>\u003c/section>\n\n\u003ch2 id=\"d25\">Day 25: Train / Validation / Test and Bias-Variance\u003c/h2>\n\u003csection class=\"c\">\u003ch3>1. Three datasets, three jobs\u003c/h3>\n\u003cdiv class=\"flow\">\u003cspan class=\"n\">\u003cb>Train\u003c/b>\u003cbr>practice questions\u003cbr>model learns here\u003c/span>\u003cspan class=\"n\">\u003cb>Validation\u003c/b>\u003cbr>mock exam\u003cbr>tune and compare models\u003c/span>\u003cspan class=\"n\">\u003cb>Test\u003c/b>\u003cbr>final exam\u003cbr>use once, at the very end\u003c/span>\u003c/div>\n\u003cdiv id=\"sp\" style=\"margin:10px 0\">\u003c/div>\n\u003cdiv class=\"ctl\">\u003clabel>train % \u003cinput type=\"range\" id=\"st\" min=\"30\" max=\"85\" value=\"60\">\u003c/label>\u003clabel>validation % \u003cinput type=\"range\" id=\"sv\" min=\"5\" max=\"30\" value=\"20\">\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"so\">\u003c/div>\n\u003cp class=\"tip\">If you tune the model using the test set, the test set is no longer \"unseen\" and your final score is too optimistic. Keep it locked away.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>2. K-Fold and Stratified K-Fold cross-validation\u003c/h3>\n\u003cp>Data is small? Don't waste it. Split into K folds. Each round, one fold is the validation set (bright) and the rest train. Average the K scores. Below: 40 samples, only 8 positive (underlined) and sorted by class, the worst case.\u003c/p>\n\u003cdiv class=\"ctl\">\u003clabel>K (folds) \u003cinput type=\"range\" id=\"kk\" min=\"2\" max=\"10\" value=\"5\"> \u003cb id=\"kv\">5\u003c/b>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\" id=\"ks\"> Stratified (keep class proportions in every fold)\u003c/label>\u003c/div>\n\u003cdiv id=\"kf\" style=\"overflow-x:auto\">\u003c/div>\n\u003cdiv class=\"out\" id=\"ko\">\u003c/div>\n\u003cp class=\"tip\">Plain K-Fold cuts straight blocks, so some folds contain only positives and others none: a useless, unfair score. \u003cb>Stratified\u003c/b> gives every fold a fair mix. Use it for classification.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>3. Underfitting, overfitting and diagnosing them\u003c/h3>\n\u003cp>The true pattern is a wave. Dots = training data, hollow dots = validation data. Increase model complexity (polynomial degree):\u003c/p>\n\u003cdiv class=\"g2\">\u003ccanvas class=\"s\" id=\"v1\" width=\"440\" height=\"340\">\u003c/canvas>\u003ccanvas class=\"s\" id=\"v2\" width=\"440\" height=\"340\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"ctl\">\u003clabel>model complexity (degree) \u003cinput type=\"range\" id=\"vd\" min=\"1\" max=\"10\" value=\"1\"> \u003cb id=\"vdv\">1\u003c/b>\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"vo\">\u003c/div>\n\u003ctable style=\"margin-top:8px\">\u003ctr>\u003cth>Symptom\u003c/th>\u003cth>Diagnosis\u003c/th>\u003cth>Fix\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Train error high, validation error high\u003c/td>\u003ctd>\u003cb>Underfitting\u003c/b> (high bias)\u003c/td>\u003ctd>more complex model, more features, less regularization\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Train error low, validation error much higher\u003c/td>\u003ctd>\u003cb>Overfitting\u003c/b> (high variance)\u003c/td>\u003ctd>more data, simpler model, regularization, ensembles, early stopping\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Both low and close\u003c/td>\u003ctd>Good fit\u003c/td>\u003ctd>Evaluate once on the test set\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>4. Bias, variance and the tradeoff\u003c/h3>\n\u003cdiv class=\"eq\" style=\"font-size:18px\">Expected error = Bias² + Variance + Noise\u003c/div>\n\u003cdiv class=\"g2\">\u003ccanvas class=\"s\" id=\"d1\" width=\"360\" height=\"360\" style=\"max-width:360px;margin:auto\">\u003c/canvas>\n\u003cdiv>\u003cp>\u003cb>Bias\u003c/b> = darts land far from the bullseye on average: the model is too simple or wrong.\u003c/p>\u003cp>\u003cb>Variance\u003c/b> = darts scatter: the model changes a lot with every new sample.\u003c/p>\n\u003cdiv class=\"ctl\" style=\"flex-direction:column;align-items:flex-start\">\u003clabel>bias \u003cinput type=\"range\" id=\"db\" min=\"0\" max=\"1.5\" step=\".05\" value=\".1\">\u003c/label>\u003clabel>variance \u003cinput type=\"range\" id=\"dv\" min=\".05\" max=\"1\" step=\".05\" value=\".15\">\u003c/label>\u003c/div>\u003cdiv class=\"out\" id=\"do\">\u003c/div>\u003c/div>\u003c/div>\n\u003cp class=\"tip\">Simple models: high bias, low variance. Complex models: low bias, high variance. The U-shaped validation curve above is this tradeoff. We want the bottom of the U.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>5. Code: cross-validation and diagnosing overfitting\u003c/h3>\n\u003cpre>from sklearn.datasets import load_breast_cancer\nfrom sklearn.model_selection import train_test_split, StratifiedKFold, cross_validate\nfrom sklearn.tree import DecisionTreeClassifier\n\nX, y = load_breast_cancer(return_X_y=True)\nXdev, Xtest, ydev, ytest = train_test_split(X, y, test_size=0.2, stratify=y, random_state=1)  # lock test set away\n\nskf = StratifiedKFold(n_splits=5, shuffle=True, random_state=1)\nfor depth in [1, 3, 5, 10, None]:\n    r = cross_validate(DecisionTreeClassifier(max_depth=depth, random_state=1),\n                       Xdev, ydev, cv=skf, return_train_score=True)\n    print(\"depth\", depth, \"train\", r[\"train_score\"].mean().round(3), \"cv\", r[\"test_score\"].mean().round(3))\n# train ~ 1.0 but cv much lower  -> overfitting\n# both low                       -> underfitting\n# both high and close            -> good: pick that setting\n\nbest = DecisionTreeClassifier(max_depth=3, random_state=1).fit(Xdev, ydev)\nprint(\"final test score (use once):\", best.score(Xtest, ytest))\u003c/pre>\u003c/section>\n\u003c/main>\n\u003cscript>\nconst $=s=>document.querySelector(s),C=n=>getComputedStyle(document.body).getPropertyValue(n).trim();\nconst P=id=>{const c=$(id);return{x:c.getContext('2d'),W:c.width,H:c.height}};\nfunction fr(p,xr,yr,xl,yl){const{x,W,H}=p,m=38;x.clearRect(0,0,W,H);\nconst X=v=>m+(v-xr[0])/(xr[1]-xr[0])*(W-m-12),Y=v=>H-m-(v-yr[0])/(yr[1]-yr[0])*(H-m-12);\nx.strokeStyle=C('--line');x.fillStyle=C('--mut');x.lineWidth=1;x.font='12px sans-serif';x.setLineDash([]);\nx.beginPath();x.moveTo(m,8);x.lineTo(m,H-m);x.lineTo(W-8,H-m);x.stroke();\nx.fillText(xl,W/2-30,H-10);x.save();x.translate(13,H/2+20);x.rotate(-Math.PI/2);x.fillText(yl,0,0);x.restore();\nreturn{X,Y,m}}\nconst clip=(p,m)=>{p.x.save();p.x.beginPath();p.x.rect(m,8,p.W-m-8,p.H-m-8);p.x.clip()};\n/* ---- themes + background ---- */\nconst TH=[['galaxy','Galaxy'],['blackhole','Black Hole'],['supernova','Supernova'],['aurora','Aurora'],['neon','Cyberpunk Neon'],['ocean','Deep Ocean'],['sunset','Sunset Retro'],['paper','Light Paper']];\nfunction setTheme(k){document.body.dataset.theme=k;[...$('#th').children].forEach(b=>b.classList.toggle('on',b.dataset.k==k));redraw()}\nTH.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.k=k;b.onclick=()=>setTheme(k);$('#th').appendChild(b)});\nconst bg=$('#bg'),bx=bg.getContext('2d');let BW,BH,T=0;const rs=()=>{BW=bg.width=innerWidth;BH=bg.height=innerHeight};rs();addEventListener('resize',rs);\nconst PS=Array.from({length:170},()=>({a:Math.random()*6.283,r:Math.random(),s:Math.random()}));\nconst glow=(x,y,r,c0,c1)=>{const g=bx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c0);g.addColorStop(1,c1);bx.fillStyle=g;bx.fillRect(x-r,y-r,2*r,2*r)};\nconst BGF={\ngalaxy(){glow(BW*(.3+.05*Math.sin(T*.2)),BH*.3,BW*.45,'rgba(150,80,255,.28)','rgba(150,80,255,0)');glow(BW*.75,BH*(.6+.05*Math.cos(T*.25)),BW*.4,'rgba(60,150,255,.25)','rgba(60,150,255,0)');\nPS.forEach(p=>{bx.globalAlpha=.25+.75*Math.abs(Math.sin(T*p.s*2+p.a));bx.fillStyle='#fff';bx.fillRect(p.r*BW,p.a/6.283*BH,1+p.s*1.6,1+p.s*1.6)});bx.globalAlpha=1},\nblackhole(){const cx=BW*.72,cy=BH*.3;glow(cx,cy,260,'rgba(255,140,40,.35)','rgba(255,140,40,0)');\nPS.forEach(p=>{const rad=70+p.r*240,an=p.a+T*(1.2/(rad/60));bx.fillStyle=`hsl(${25+(1-p.r)*25},100%,${50+(1-p.r)*45}%)`;bx.fillRect(cx+Math.cos(an)*rad,cy+Math.sin(an)*rad*.3,2.2,2.2)});\nbx.fillStyle='#000';bx.beginPath();bx.arc(cx,cy,52,0,7);bx.fill();bx.strokeStyle='rgba(255,200,120,.8)';bx.lineWidth=2;bx.stroke()},\nsupernova(){const cx=BW/2,cy=BH*.4,R=Math.min(BW,BH)*.7;glow(cx,cy,140+30*Math.sin(T*3),'rgba(255,230,120,.5)','rgba(255,80,20,0)');\nPS.forEach(p=>{const l=(T*.3+p.s)%1,d=l*R*(.3+p.r);bx.globalAlpha=1-l;bx.fillStyle=`hsl(${55-l*55},100%,55%)`;bx.fillRect(cx+Math.cos(p.a)*d,cy+Math.sin(p.a)*d,2+3*(1-l),2+3*(1-l))});bx.globalAlpha=1},\naurora(){[['77,255,166',0],['77,225,255',1],['150,120,255',2]].forEach(([c,k])=>{const g=bx.createLinearGradient(0,BH*.05,0,BH*.65);g.addColorStop(0,`rgba(${c},.0)`);g.addColorStop(.35,`rgba(${c},.38)`);g.addColorStop(1,`rgba(${c},0)`);\nbx.fillStyle=g;bx.beginPath();const f=x=>BH*.22+k*45+Math.sin(x*.004+T*.4+k)*60+Math.sin(x*.011+T*.9+k*2)*22;bx.moveTo(0,f(0));for(let x=0;x\u003c=BW;x+=12)bx.lineTo(x,f(x));for(let x=BW;x>=0;x-=12)bx.lineTo(x,f(x)+220);bx.fill()});\nbx.fillStyle='#fff';PS.slice(0,50).forEach(p=>{bx.globalAlpha=.3+.5*Math.sin(T+p.a)**2;bx.fillRect(p.r*BW,p.s*BH*.4,1.5,1.5)});bx.globalAlpha=1},\nneon(){const hz=BH*.55;glow(BW/2,hz,BW*.4,'rgba(255,47,168,.35)','rgba(255,47,168,0)');bx.lineWidth=1.5;\nfor(let i=-14;i\u003c=14;i++){bx.strokeStyle='rgba(47,243,255,.55)';bx.beginPath();bx.moveTo(BW/2+i*28,hz);bx.lineTo(BW/2+i*BW/9,BH);bx.stroke()}\nfor(let j=0;j\u003c12;j++){const t=((j+T*.7)%12)/12,y=hz+(BH-hz)*t*t;bx.strokeStyle=`rgba(255,47,168,${.15+.6*t})`;bx.beginPath();bx.moveTo(0,y);bx.lineTo(BW,y);bx.stroke()}},\nocean(){glow(BW*.5,BH,BW*.7,'rgba(40,200,220,.25)','rgba(40,200,220,0)');\nPS.forEach(p=>{const y=BH+20-((T*(14+p.s*40)+p.a*160)%(BH+40)),x=p.r*BW+Math.sin(T+p.a*3)*18,r=2+p.s*9;bx.strokeStyle=`rgba(120,255,240,${.35+.4*p.s})`;bx.fillStyle='rgba(53,224,208,.08)';bx.lineWidth=1.3;bx.shadowColor='#35e0d0';bx.shadowBlur=10;bx.beginPath();bx.arc(x,y,r,0,7);bx.fill();bx.stroke()});bx.shadowBlur=0},\nsunset(){const cx=BW/2,cy=BH*.58,r=Math.min(BW,BH)*.22,g=bx.createLinearGradient(0,cy-r,0,cy+r);g.addColorStop(0,'#ffe36e');g.addColorStop(1,'#ff4f9a');\nglow(cx,cy,r*2.6,'rgba(255,170,90,.4)','rgba(255,170,90,0)');bx.fillStyle=g;bx.beginPath();bx.arc(cx,cy,r,0,7);bx.fill();\nfor(let i=0;i\u003c6;i++){const y=cy+r*(.05+i*.17)+Math.sin(T+i)*3;bx.fillStyle='rgba(90,20,110,.75)';bx.fillRect(cx-r,y,2*r,3+i*2.2)}},\npaper(){PS.slice(0,60).forEach(p=>{bx.fillStyle='rgba(36,87,214,.14)';bx.beginPath();bx.arc(p.r*BW,(p.a/6.283*BH-T*(6+p.s*10)+BH*3)%BH,1.5+p.s*2,0,7);bx.fill()})}};\n(function loop(){T+=.016;bx.clearRect(0,0,BW,BH);const f=BGF[document.body.dataset.theme];if(f)f();requestAnimationFrame(loop)})();\n/* ---- shared ---- */\nlet sd=9;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647,gn=()=>Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(6.283*rnd());\nconst avg=a=>a.reduce((s,v)=>s+v,0)/a.length,mk=id=>P(id);\nfunction path(x,F,pts,c,w=3){x.strokeStyle=C(c);x.lineWidth=w;x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(F.X(a),F.Y(b)):x.moveTo(F.X(a),F.Y(b)));x.stroke()}\nfunction mark(x,F,a,b){x.fillStyle=C('--fg');x.strokeStyle=C('--acc');x.lineWidth=3;x.beginPath();x.arc(F.X(a),F.Y(b),8,0,7);x.fill();x.stroke()}\n/* ---- classification metrics ---- */\nconst NS=120,ZS=Array.from({length:NS},()=>gn()),JS=Array.from({length:NS},()=>rnd()),E1=mk('#e1'),E2=mk('#e2'),E3=mk('#e3');\nconst smp=()=>{const np=Math.round(+$('#pv').value*NS),sep=+$('#sep').value;return ZS.map((z,i)=>{const y=i\u003cnp?1:0;return{y,j:JS[i],s:Math.min(1,Math.max(0,.5+(y?sep/2:-sep/2)+.17*z))}})};\nfunction curves(S){const T=[...S].sort((a,b)=>b.s-a.s),Pp=S.filter(d=>d.y).length,N=S.length-Pp;let tp=0,fp=0;const roc=[[0,0]],pr=[[0,1]];\nT.forEach(d=>{d.y?tp++:fp++;roc.push([fp/N,tp/Pp]);pr.push([tp/Pp,tp/(tp+fp)])});let auc=0,ap=0;\nfor(let i=1;i\u003croc.length;i++)auc+=(roc[i][0]-roc[i-1][0])*(roc[i][1]+roc[i-1][1])/2;for(let i=1;i\u003cpr.length;i++)ap+=(pr[i][0]-pr[i-1][0])*pr[i][1];return{roc,pr,auc,ap}}\nfunction dE(){const S=smp(),th=+$('#th').value,n=S.length;$('#thv').textContent=th.toFixed(2);let tp=0,fp=0,fn=0,tn=0;\nS.forEach(d=>{const p=d.s>=th;d.y?(p?tp++:fn++):(p?fp++:tn++);d.bad=p!=!!d.y});\nconst F=fr(E1,[0,1],[0,1],'model score (higher = more likely
