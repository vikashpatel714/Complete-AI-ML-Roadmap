r:var(--acc);font-weight:700}\nmain{max-width:980px;margin:0 auto;padding:18px 14px 80px}\nh1{font-size:clamp(30px,6vw,54px);line-height:1.1;margin:30px 0 8px}\nh2{font-size:clamp(24px,4vw,34px);margin:50px 0 6px;color:var(--acc)}\nh3{font-size:19px;margin:0 0 6px}\np{margin:6px 0}.mut{color:var(--mut)}\nsection.c{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px 0}\n.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n@media(max-width:760px){.g2{grid-template-columns:1fr}}\ncanvas.s{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px}\n.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:8px 0}\n.ctl label{font-size:14px;display:flex;gap:8px;align-items:center}\ninput[type=range]{accent-color:var(--acc);width:150px}\nbutton.b{font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;border:1px solid var(--acc);background:transparent;color:var(--fg);cursor:pointer}\nbutton.b:hover{background:var(--acc);color:#000}\n.out{font-size:15px;padding:6px 10px;border-left:3px solid var(--acc2);background:rgba(127,127,127,.12);border-radius:4px;margin-top:6px}\n.eq{font-size:22px;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:10px;margin:10px 0}\n.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0}\n.flow span.n{padding:8px 12px;border:1px solid var(--line);border-radius:10px;transition:.3s;text-align:center;font-size:14px}\n.flow span.n.hi{background:var(--acc);color:#000;transform:scale(1.08);border-color:var(--acc)}\n.flow i{color:var(--acc2);font-style:normal}\npre{background:rgba(0,0,0,.45);color:#e8ecff;padding:12px;border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.5;margin:8px 0}\nbody[data-theme=paper] pre{background:#f0f3fa;color:#1c2230}\n.bar{height:22px;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .25s;min-width:2px}\n.row{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:14px}.row b{width:48px}\n.tip{border-left:4px solid var(--acc);padding:6px 12px;margin:8px 0;background:rgba(127,127,127,.12);border-radius:4px}\ntable{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}\na{color:var(--acc2)}small{font-size:11px;opacity:.8}code{background:rgba(127,127,127,.2);padding:1px 5px;border-radius:4px}select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px}html{scroll-behavior:smooth}.g3{display:grid;gap:10px}.fc{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;min-height:84px;background:rgba(127,127,127,.12);transition:.2s}.fc:hover{border-color:var(--acc)}.fc .a{display:none;margin-top:8px;color:var(--acc2);font-size:14px}.fc.on .a{display:block}.fc.on .q{opacity:.75}\u003c/style>\u003c/head>\n\u003cbody data-theme=\"galaxy\">\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cheader class=\"top\">\u003cb>Theme\u003c/b>\u003cspan id=\"th\" style=\"display:contents\">\u003c/span>\u003c/header>\n\u003cmain>\n\u003ch1 id=\"d30\">Day 30: Put It All Together\u003c/h1>\n\u003cp class=\"mut\">Final integration and revision. Goal: build one complete ML project on your own and explain every step \u003cb>without notes\u003c/b>. Use this page in 4 passes: \u003ca href=\"#s1\">1 See the big picture\u003c/a> &nbsp; \u003ca href=\"#s2\">2 Re-learn how models learn\u003c/a> &nbsp; \u003ca href=\"#s3\">3 Test yourself\u003c/a> &nbsp; \u003ca href=\"#s4\">4 Plan your project\u003c/a>\u003c/p>\n\n\u003ch2 id=\"s1\">1. The end-to-end workflow\u003c/h2>\n\u003csection class=\"c\">\u003ch3>Click any stage\u003c/h3>\n\u003cdiv class=\"flow\" id=\"rm\">\u003c/div>\n\u003cdiv class=\"out\" id=\"rmc\" style=\"min-height:70px\">\u003c/div>\n\u003cp class=\"tip\">One sentence to remember: \u003cb>define the problem, clean and split the data, build features, train a simple baseline, evaluate with the right metric, diagnose bias or variance, tune, pick the model, test once, save.\u003c/b>\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>Which model should I try first?\u003c/h3>\n\u003cdiv class=\"ctl\">\u003clabel>I want to \u003cselect id=\"cg\">\u003coption value=\"num\">predict a number\u003c/option>\u003coption value=\"cat\">predict a category\u003c/option>\u003coption value=\"grp\">find groups (no labels)\u003c/option>\u003coption value=\"shr\">shrink many features\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>data size \u003cselect id=\"cs\">\u003coption value=\"s\">small (under 10k rows)\u003c/option>\u003coption value=\"l\">large\u003c/option>\u003c/select>\u003c/label>\n\u003clabel>must explain results? \u003cselect id=\"ci\">\u003coption value=\"y\">yes\u003c/option>\u003coption value=\"n\">no, accuracy matters most\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"co\">\u003c/div>\u003c/section>\n\n\u003ch2 id=\"s2\">2. How a model learns: loss, gradient descent, overfitting\u003c/h2>\n\u003csection class=\"c\">\u003ch3>One picture for everything\u003c/h3>\n\u003cdiv class=\"flow\">\u003cspan class=\"n\">Guess (model)\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">Loss: how wrong? (MSE, log loss)\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">Gradient: which way is downhill?\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">Update weights: w = w − lr · gradient\u003c/span>\u003ci>↺ epoch\u003c/i>\u003c/div>\n\u003ccanvas class=\"s\" id=\"l1\" width=\"640\" height=\"300\">\u003c/canvas>\n\u003ccanvas class=\"s\" id=\"l2\" width=\"640\" height=\"300\" style=\"margin-top:10px\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>model complexity (degree) \u003cinput type=\"range\" id=\"ld\" min=\"1\" max=\"14\" value=\"12\"> \u003cb id=\"ldv\">\u003c/b>\u003c/label>\u003clabel>learning rate \u003cinput type=\"range\" id=\"ll\" min=\".01\" max=\".3\" step=\".01\" value=\".1\"> \u003cb id=\"llv\">\u003c/b>\u003c/label>\u003cbutton class=\"b\" id=\"lp\">Play\u003c/button>\u003c/div>\n\u003cdiv class=\"out\" id=\"lo\">\u003c/div>\n\u003cp class=\"tip\">Dots = training data, hollow dots = validation data. Press Play and watch the \u003cb>training loss\u003c/b> keep falling while the \u003cb>validation loss\u003c/b> falls, then (for a complex model) climbs: the model starts memorising noise. That turning point is where \u003cb>early stopping\u003c/b> would stop. Try degree 1 (underfit: both losses stay high), degree 12 (overfit), and a huge learning rate (loss explodes).\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>Diagnose and fix\u003c/h3>\n\u003ctable>\u003ctr>\u003cth>What you see\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Levers\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Train bad, validation bad\u003c/td>\u003ctd>underfitting, high bias\u003c/td>\u003ctd>bigger model, better features, less regularization, train longer\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Train great, validation much worse\u003c/td>\u003ctd>overfitting, high variance\u003c/td>\u003ctd>more data, simpler model, regularization, early stopping, ensembles, cross-validation\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Loss jumps up or becomes NaN\u003c/td>\u003ctd>learning rate too high\u003c/td>\u003ctd>lower the learning rate, scale features\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Great scores, bad in real life\u003c/td>\u003ctd>data leakage or test set reuse\u003c/td>\u003ctd>split before preprocessing, lock the test set\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>Algorithm cheat sheet\u003c/h3>\n\u003ctable>\u003ctr>\u003cth>Algorithm\u003c/th>\u003cth>Core idea\u003c/th>\u003cth>Scale?\u003c/th>\u003cth>Watch out\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Linear Regression\u003c/td>\u003ctd>best straight line, minimize MSE\u003c/td>\u003ctd>helps\u003c/td>\u003ctd>multicollinearity, outliers\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Logistic Regression\u003c/td>\u003ctd>sigmoid → probability, log loss\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>linear boundary only\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>KNN\u003c/td>\u003ctd>vote of K nearest points\u003c/td>\u003ctd>\u003cb>must\u003c/b>\u003c/td>\u003ctd>slow on big data, choose K\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Naive Bayes\u003c/td>\u003ctd>Bayes + independent features\u003c/td>\u003ctd>no\u003c/td>\u003ctd>independence is \"naive\"\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Decision Tree\u003c/td>\u003ctd>greedy splits by Gini/entropy\u003c/td>\u003ctd>no\u003c/td>\u003ctd>overfits, limit depth\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Random Forest\u003c/td>\u003ctd>many trees, bagging, average\u003c/td>\u003ctd>no\u003c/td>\u003ctd>big and slower, less explainable\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Boosting (XGBoost, LightGBM)\u003c/td>\u003ctd>trees fix previous errors\u003c/td>\u003ctd>no\u003c/td>\u003ctd>tune learning rate, depth\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>K-Means\u003c/td>\u003ctd>assign, update centroids\u003c/td>\u003ctd>\u003cb>must\u003c/b>\u003c/td>\u003ctd>choose K, round clusters only\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>DBSCAN\u003c/td>\u003ctd>dense regions + noise\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>eps and minPts\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>PCA\u003c/td>\u003ctd>axes of maximum variance\u003c/td>\u003ctd>\u003cb>must\u003c/b>\u003c/td>\u003ctd>components hard to interpret\u003c/td>\u003c/tr>\u003c/table>\n\u003ctable style=\"margin-top:10px\">\u003ctr>\u003cth>Metric\u003c/th>\u003cth>Use when\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Accuracy\u003c/td>\u003ctd>balanced classes\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Precision / Recall / F1\u003c/td>\u003ctd>false alarms / misses matter, imbalance\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>ROC-AUC / PR-AUC\u003c/td>\u003ctd>compare models across thresholds / rare positives\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>MAE / RMSE / R²\u003c/td>\u003ctd>regression: average error / punish big errors / variance explained\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Silhouette\u003c/td>\u003ctd>clustering quality (−1 to 1)\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\n\u003ch2 id=\"s3\">3. Test yourself (no notes!)\u003c/h2>\n\u003csection class=\"c\">\u003ch3>Quiz: 10 questions\u003c/h3>\n\u003cdiv id=\"qz\">\u003c/div>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>Flashcards: click to flip\u003c/h3>\n\u003cdiv class=\"ctl\">\u003cbutton class=\"b\" id=\"fsh\">Shuffle\u003c/button>\u003cbutton class=\"b\" id=\"fhd\">Hide all answers\u003c/button>\u003c/div>\n\u003cdiv id=\"fc\" class=\"g3\" style=\"grid-template-columns:repeat(auto-fill,minmax(230px,1fr))\">\u003c/div>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>Teach-back drill: explain it out loud in 60 seconds\u003c/h3>\n\u003cp>This is the final test of \"explain every step without notes\". Press start, speak the answer out loud as if teaching a friend, then reveal and compare.\u003c/p>\n\u003cdiv class=\"ctl\">\u003cbutton class=\"b\" id=\"pqb\">Give me a question\u003c/button>\u003cbutton class=\"b\" id=\"pqr\">Reveal answer\u003c/button>\u003cb id=\"pqt\" style=\"font-size:22px\">\u003c/b>\u003c/div>\n\u003cdiv class=\"out\" id=\"pqq\" style=\"font-size:18px\">Press the button to start.\u003c/div>\u003cdiv class=\"out\" id=\"pqa\" style=\"display:none\">\u003c/div>\u003c/section>\n\n\u003ch2 id=\"s4\">4. Plan your independent project\u003c/h2>\n\u003csection class=\"c\">\u003ch3>Pick a project idea\u003c/h3>\n\u003cdiv class=\"ctl\">\u003clabel>project \u003cselect id=\"pj\">\u003coption value=\"ids\">Intrusion detection (recommended)\u003c/option>\u003coption value=\"spam\">Spam / phishing detection\u003c/option>\u003coption value=\"house\">House price prediction\u003c/option>\u003coption value=\"churn\">Customer churn\u003c/option>\u003coption value=\"seg\">Customer segmentation\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n\u003cdiv id=\"pjt\" style=\"overflow-x:auto\">\u003c/div>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>Reusable project skeleton (code)\u003c/h3>\n\u003cpre>import numpy as np, pandas as pd\nfrom sklearn.model_selection import train_test_split, StratifiedKFold, cross_val_score, RandomizedSearchCV\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.impute import SimpleImputer\nfrom sklearn.preprocessing import StandardScaler, OneHotEncoder\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.metrics import classification_report, confusion_matrix, roc_auc_score, average_precision_score\n\n# 1 PROBLEM: write the target, the metric and the cost of each mistake in comments\ndf = pd.read_csv(\"data.csv\").drop_duplicates()                       # 2 load + 3 clean\nprint(df.shape, df.isna().sum().sum(), df[\"target\"].value_counts(normalize=True))   # EDA\n\n# 4 FEATURES\ndf[\"ratio\"] = df[\"a\"] / (df[\"b\"] + 1)\nX, y = df.drop(columns=\"target\"), df[\"target\"]\nnum = X.select_dtypes(\"number\").columns; cat = X.select_dtypes(\"object\").columns\n\n# 5 SPLIT first (stratified), lock the test set\nXtr, Xte, ytr, yte = train_test_split(X, y, test_size=0.2, stratify=y, random_state=1)\n\n# 6 PREPROCESS + 7 MODEL in one pipeline (no leakage)\nprep = ColumnTransformer([\n    (\"num\", Pipeline([(\"fill\", SimpleImputer(strategy=\"median\")), (\"scale\", StandardScaler())]), num),\n    (\"cat\", Pipeline([(\"fill\", SimpleImputer(strategy=\"most_frequent\")),\n                      (\"onehot\", OneHotEncoder(handle_unknown=\"ignore\"))]), cat)])\ncv = StratifiedKFold(5, shuffle=True, random_state=1)\nmodels = {\"logreg\": LogisticRegression(max_iter=1000, class_weight=\"balanced\"),\n          \"forest\": RandomForestClassifier(n_estimators=200, class_weight=\"balanced\", random_state=1)}\n\n# 8 EVALUATE with cross-validation: baseline first, then stronger models\nfor name, m in models.items():\n    pipe = Pipeline([(\"prep\", prep), (\"model\", m)])\n    print(name, cross_val_score(pipe, Xtr, ytr, cv=cv, scoring=\"f1\").mean())\n\n# 9 DIAGNOSE (train vs CV score) and TUNE the best one\npipe = Pipeline([(\"prep\", prep), (\"model\", models[\"forest\"])])\nsearch = RandomizedSearchCV(pipe, {\"model__max_depth\": [4, 8, 16, None], \"model__min_samples_leaf\": [1, 3, 5]},\n                            n_iter=8, cv=cv, scoring=\"f1\", random_state=1).fit(Xtr, ytr)\n\n# 10 FINAL TEST: once\npred = search.predict(Xte); proba = search.predict_proba(Xte)[:, 1]\nprint(confusion_matrix(yte, pred)); print(classification_report(yte, pred))\nprint(\"ROC-AUC\", roc_auc_score(yte, proba), \"PR-AUC\", average_precision_score(yte, proba))\n# import joblib; joblib.dump(search.best_estimator_, \"model.joblib\")   # 11 SAVE\u003c/pre>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>Day 17 to 29 in one glance\u003c/h3>\n\u003ctable>\u003ctr>\u003cth>Day\u003c/th>\u003cth>You learned\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>17 to 18\u003c/td>\u003ctd>Linear and logistic regression: line, sigmoid, MSE, log loss, gradient descent\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>19 to 21\u003c/td>\u003ctd>KNN, Naive Bayes, decision trees, bagging, boosting\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>22 to 23\u003c/td>\u003ctd>Preprocessing and feature engineering: missing values, encoding, scaling, correlation, interactions\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>24 to 25\u003c/td>\u003ctd>Metrics, validation, cross-validation, bias and variance\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>26 to 27\u003c/td>\u003ctd>Hyperparameter tuning, K-Means, hierarchical, DBSCAN\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>28 to 29\u003c/td>\u003ctd>PCA, and a complete intrusion-detection project\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>30\u003c/td>\u003ctd>Integrate everything and explain it without notes\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"tip\">\u003cb>Next steps:\u003c/b> finish your own project end to end, write a short README that explains each decision, then explore neural networks, NLP and model deployment. You now have the foundation.\u003c/p>\u003c/section>\n\u003c/main>\n\u003cscript>\nconst $=s=>document.querySelector(s),C=n=>getComputedStyle(document.body).getPropertyValue(n).trim();\nconst P=id=>{const c=$(id);return{x:c.getContext('2d'),W:c.width,H:c.height}};\nfunction fr(p,xr,yr,xl,yl){const{x,W,H}=p,m=38;x.clearRect(0,0,W,H);\nconst X=v=>m+(v-xr[0])/(xr[1]-xr[0])*(W-m-12),Y=v=>H-m-(v-yr[0])/(yr[1]-yr[0])*(H-m-12);\nx.strokeStyle=C('--line');x.fillStyle=C('--mut');x.lineWidth=1;x.font='12px sans-serif';x.setLineDash([]);\nx.beginPath();x.moveTo(m,8);x.lineTo(m,H-m);x.lineTo(W-8,H-m);x.stroke();\nx.fillText(xl,W/2-30,H-10);x.save();x.translate(13,H/2+20);x.rotate(-Math.PI/2);x.fillText(yl,0,0);x.restore();\nreturn{X,Y,m}}\nconst clip=(p,m)=>{p.x.save();p.x.beginPath();p.x.rect(m,8,p.W-m-8,p.H-m-8);p.x.clip()};\n/* ---- themes + background ---- */\nconst TH=[['galaxy','Galaxy'],['blackhole','Black Hole'],['supernova','Supernova'],['aurora','Aurora'],['neon','Cyberpunk Neon'],['ocean','Deep Ocean'],['sunset','Sunset Retro'],['paper','Light Paper']];\nfunction setTheme(k){document.body.dataset.theme=k;[...$('#th').children].forEach(b=>b.classList.toggle('on',b.dataset.k==k));redraw()}\nTH.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.k=k;b.onclick=()=>setTheme(k);$('#th').appendChild(b)});\nconst bg=$('#bg'),bx=bg.getContext('2d');let BW,BH,T=0;const rs=()=>{BW=bg.width=innerWidth;BH=bg.height=innerHeight};rs();addEventListener('resize',rs);\nconst PS=Array.from({length:170},()=>({a:Math.random()*6.283,r:Math.random(),s:Math.random()}));\nconst glow=(x,y,r,c0,c1)=>{const g=bx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c0);g.addColorStop(1,c1);bx.fillStyle=g;bx.fillRect(x-r,y-r,2*r,2*r)};\nconst BGF={\ngalaxy(){glow(BW*(.3+.05*Math.sin(T*.2)),BH*.3,BW*.45,'rgba(150,80,255,.28)','rgba(150,80,255,0)');glow(BW*.75,BH*(.6+.05*Math.cos(T*.25)),BW*.4,'rgba(60,150,255,.25)','rgba(60,150,255,0)');\nPS.forEach(p=>{bx.globalAlpha=.25+.75*Math.abs(Math.sin(T*p.s*2+p.a));bx.fillStyle='#fff';bx.fillRect(p.r*BW,p.a/6.283*BH,1+p.s*1.6,1+p.s*1.6)});bx.globalAlpha=1},\nblackhole(){const cx=BW*.72,cy=BH*.3;glow(cx,cy,260,'rgba(255,140,40,.35)','rgba(255,140,40,0)');\nPS.forEach(p=>{const rad=70+p.r*240,an=p.a+T*(1.2/(rad/60));bx.fillStyle=`hsl(${25+(1-p.r)*25},100%,${50+(1-p.r)*45}%)`;bx.fillRect(cx+Math.cos(an)*rad,cy+Math.sin(an)*rad*.3,2.2,2.2)});\nbx.fillStyle='#000';bx.beginPath();bx.arc(cx,cy,52,0,7);bx.fill();bx.strokeStyle='rgba(255,200,120,.8)';bx.lineWidth=2;bx.stroke()},\nsupernova(){const cx=BW/2,cy=BH*.4,R=Math.min(BW,BH)*.7;glow(cx,cy,140+30*Math.sin(T*3),'rgba(255,230,120,.5)','rgba(255,80,20,0)');\nPS.forEach(p=>{const l=(T*.3+p.s)%1,d=l*R*(.3+p.r);bx.globalAlpha=1-l;bx.fillStyle=`hsl(${55-l*55},100%,55%)`;bx.fillRect(cx+Math.cos(p.a)*d,cy+Math.sin(p.a)*d,2+3*(1-l),2+3*(1-l))});bx.globalAlpha=1},\naurora(){[['77,255,166',0],['77,225,255',1],['150,120,255',2]].forEach(([c,k])=>{const g=bx.createLinearGradient(0,BH*.05,0,BH*.65);g.addColorStop(0,`rgba(${c},.0)`);g.addColorStop(.35,`rgba(${c},.38)`);g.addColorStop(1,`rgba(${c},0)`);\nbx.fillStyle=g;bx.beginPath();const f=x=>BH*.22+k*45+Math.sin(x*.004+T*.4+k)*60+Math.sin(x*.011+T*.9+k*2)*22;bx.moveTo(0,f(0));for(let x=0;x\u003c=BW;x+=12)bx.lineTo(x,f(x));for(let x=BW;x>=0;x-=12)bx.lineTo(x,f(x)+220);bx.fill()});\nbx.fillStyle='#fff';PS.slice(0,50).forEach(p=>{bx.globalAlpha=.3+.5*Math.sin(T+p.a)**2;bx.fillRect(p.r*BW,p.s*BH*.4,1.5,1.5)});bx.globalAlpha=1},\nneon(){const hz=BH*.55;glow(BW/2,hz,BW*.4,'rgba(255,47,168,.35)','rgba(255,47,168,0)');bx.lineWidth=1.5;\nfor(let i=-14;i\u003c=14;i++){bx.strokeStyle='rgba(47,243,255,.55)';bx.beginPath();bx.moveTo(BW/2+i*28,hz);bx.lineTo(BW/2+i*BW/9,BH);bx.stroke()}\nfor(let j=0;j\u003c12;j++){const t=((j+T*.7)%12)/12,y=hz+(BH-hz)*t*t;bx.strokeStyle=`rgba(255,47,168,${.15+.6*t})`;bx.beginPath();bx.moveTo(0,y);bx.lineTo(BW,y);bx.stroke()}},\nocean(){glow(BW*.5,BH,BW*.7,'rgba(40,200,220,.25)','rgba(40,200,220,0)');\nPS.forEach(p=>{const y=BH+20-((T*(14+p.s*40)+p.a*160)%(BH+40)),x=p.r*BW+Math.sin(T+p.a*3)*18,r=2+p.s*9;bx.strokeStyle=`rgba(120,255,240,${.35+.4*p.s})`;bx.fillStyle='rgba(53,224,208,.08)';bx.lineWidth=1.3;bx.shadowColor='#35e0d0';bx.shadowBlur=10;bx.beginPath();bx.arc(x,y,r,0,7);bx.fill();bx.stroke()});bx.shadowBlur=0},\nsunset(){const cx=BW/2,cy=BH*.58,r=Math.min(BW,BH)*.22,g=bx.createLinearGradient(0,cy-r,0,cy+r);g.addColorStop(0,'#ffe36e');g.addColorStop(1,'#ff4f9a');\nglow(cx,cy,r*2.6,'rgba(255,170,90,.4)','rgba(255,170,90,0)');bx.fillStyle=g;bx.beginPath();bx.arc(cx,cy,r,0,7);bx.fill();\nfor(let i=0;i\u003c6;i++){const y=cy+r*(.05+i*.17)+Math.sin(T+i)*3;bx.fillStyle='rgba(90,20,110,.75)';bx.fillRect(cx-r,y,2*r,3+i*2.2)}},\npaper(){PS.slice(0,60).forEach(p=>{bx.fillStyle='rgba(36,87,214,.14)';bx.beginPath();bx.arc(p.r*BW,(p.a/6.283*BH-T*(6+p.s*10)+BH*3)%BH,1.5+p.s*2,0,7);bx.fill()})}};\n(function loop(){T+=.016;bx.clearRect(0,0,BW,BH);const f=BGF[document.body.dataset.theme];if(f)f();requestAnimationFrame(loop)})();\n/* ---- shared ---- */\nlet sd=55;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647,gn=()=>Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(6.283*rnd());\nconst avg=a=>a.reduce((s,v)=>s+v,0)/a.length,mk=id=>P(id),qs=(s,f)=>document.querySelectorAll(s).forEach(f);\nfunction path(x,F,pts,c,w=3){x.strokeStyle=C(c);x.lineWidth=w;x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(F.X(a),F.Y(b)):x.moveTo(F.X(a),F.Y(b)));x.stroke()}\n/* ---- roadmap ---- */\nconst RS=[['Problem','Day 29','Decide what to predict (a number, a category, or groups) and pick the metric from the cost of mistakes.','Using accuracy on rare-event data.'],\n['Data + EDA','Day 29','Look at shape, class balance, distributions, missing values and duplicates before touching a model.','Jumping straight to models.'],\n['Clean','Day 22','Drop duplicates, fill missing values, handle outliers, encode categories, scale when the model needs it.','Fitting the imputer or scaler on all the data (leakage).'],\n['Features','Days 23, 28','Create ratios, logs, interactions. Select by correlation. Remove copies (multicollinearity). PCA to compress.','Adding features without checking the cross-validated score.'],\n['Split','Day 25','Train / validation / test, stratified for classification. Split BEFORE any preprocessing.','Touching the test set while tuning.'],\n['Model + learning','Days 17 to 21','Start with a simple baseline, then trees, forests, boosting. Learning = reduce the loss with gradient descent.','Starting with the most complex model.'],\n['Evaluate','Day 24','Confusion matrix, precision, recall, F1, ROC/PR-AUC for classes. MAE, RMSE, R² for numbers.','Reporting one number from one lucky split.'],\n['Diagnose','Day 25','Compare train vs validation score: underfit (bias) or overfit (variance)?','Tuning before diagnosing.'],\n['Tune','Day 26','Grid, random or Optuna search, always with cross-validation.','Tuning on the test set.'],\n['Select + test','Day 29','Choose the model whose mistakes cost least, then run the test set exactly once.','Choosing by accuracy alone.'],\n['Save + monitor','Day 29','Save the whole pipeline, set the alert threshold, watch for data drift.','Assuming tomorrow\\'s data looks like today\\'s.']];\nlet rsel=0,rauto=setInterval(()=>{rsel=(rsel+1)%RS.length;dRm()},3500);\nfunction dRm(){$('#rm').innerHTML=RS.map((s,i)=>`\u003cspan class=\"n ${i==rsel?'hi':''}\" data-i=\"${i}\" style=\"cursor:pointer\">${s[0]}\u003cbr>\u003csmall>${s[1]}\u003c/small>\u003c/span>`).join('\u003ci>→\u003c/i>');\nconst s=RS[rsel];$('#rmc').innerHTML=`\u003cb>${s[0]}\u003c/b> (${s[1]}): ${s[2]}\u003cbr>\u003cspan style=\"color:#ff8f8f\">Common mistake:\u003c/span> ${s[3]}`;qs('#rm span.n',e=>e.onclick=()=>{clearInterval(rauto);rsel=+e.dataset.i;dRm()})}\n/* ---- model chooser ---- */\nfunction dCh(){const g=$('#cg').value,s=$('#cs').value,i=$('#ci').value,t=[];\nif(g=='num')t.push('\u003cb>Regression.\u003c/b> Baseline: Linear Regression (try Ridge/Lasso if features are correlated).',i=='y'?'Keep it explainable: linear model or a shallow decision tree.':'For accuracy: Random Forest, then Gradient Boosting (XGBoost or LightGBM).','Metrics: MAE, RMSE, R².');\nif(g=='cat')t.push('\u003cb>Classification.\u003c/b> Baseline: Logistic Regression (Naive Bayes for text).',i=='y'?'Explainable: Logistic Regression or a shallow Decision Tree with feature importances.':'For accuracy: Random Forest, then XGBoost/LightGBM.','Metrics: confusion matrix, F1, recall or precision (by cost), PR-AUC if classes are rare.');\nif(g=='grp')t.push('\u003cb>Clustering.\u003c/b> Scale first. Round blobs and known K: K-Means (choose K with elbow + silhouette).','Odd shapes or noise: DBSCAN. Want a tree of groups: hierarchical.','Check with silhouette, then profile each cluster and name it.');\nif(g=='shr')t.push('\u003cb>Dimensionality reduction.\u003c/b> Scale, then PCA. Keep enough components for about 95% variance (scree plot).','Drop one of each highly correlated pair first if you need to keep original features.');\nt.push(s=='s'?'Small data: use cross-validation, keep models simple, KNN is fine.':'Large data: avoid KNN and hierarchical clustering. Prefer LightGBM/XGBoost, and tune on a sample.');$('#co').innerHTML=t.join('\u003cbr>')}\n['#cg','#cs','#ci'].forEach(s=>$(s).onchange=dCh);\n/* ---- learning curves ---- */\nconst lf=v=>Math.sin(2.2*v),TX=Array.from({length:14},()=>rnd()*2-1),TY=TX.map(v=>lf(v)+gn()*.25),VX=Array.from({length:60},()=>rnd()*2-1),VY=VX.map(v=>lf(v)+gn()*.25),L1=mk('#l1'),L2=mk('#l2');\nconst phi=(x,d)=>{const o=[1,x];for(let k=2;k\u003c=d;k++)o.push(2*x*o[k-1]-o[k-2]);return o.slice(0,d+1)};\nlet LH=null,LP=0,Ltm=null;const LE=1500;\nfunction lcRun(){const d=+$('#ld').value,lr=+$('#ll').value,w=Array(d+1).fill(0),A=TX.map(x=>phi(x,d)),B=VX.map(x=>phi(x,d)),W=[],TL=[],VL=[];let dead=false;\nfor(let e=0;e\u003c=LE;e++){const pr=a=>a.reduce((s,v,k)=>s+v*w[k],0);W.push(w.slice());let tl=avg(A.map((a,i)=>(pr(a)-TY[i])**2)),vl=avg(B.map((a,i)=>(pr(a)-VY[i])**2));\nif(!isFinite(tl)||tl>1e4){dead=true;tl=vl=1e4}TL.push(tl);VL.push(vl);\nif(!dead){const g=Array(d+1).fill(0);A.forEach((a,i)=>{const er=pr(a)-TY[i];a.forEach((v,k)=>g[k]+=2*er*v/A.length)});w.forEach((_,k)=>w[k]-=lr*g[k])}}\nlet best=0;VL.forEach((v,i)=>{if(v\u003cVL[best])best=i});LH={d,W,TL,VL,best,dead}}\nfunction dLc(){if(!LH)lcRun();const ep=LP,d=LH.d,w=LH.W[ep],F=fr(L1,[-1,1],[-1.6,1.6],'x','y'),x=L1.x;$('#ldv').textContent=d;$('#llv').textContent=(+$('#ll').value).toFixed(2);\nclip(L1,F.m);const xs=[];for(let v=-1;v\u003c=1.001;v+=.02)xs.push(v);x.setLineDash([5,5]);path(x,F,xs.map(v=>[v,lf(v)]),'--mut',1.5);x.setLineDash([]);path(x,F,xs.map(v=>[v,phi(v,d).reduce((s,p,k)=>s+p*w[k],0)]),'--acc');x.restore();\nVX.forEach((v,i)=>{x.strokeStyle=C('--acc2');x.lineWidth=1.5;x.beginPath();x.arc(F.X(v),F.Y(VY[i]),4,0,7);x.stroke()});TX.forEach((v,i)=>{x.fillStyle=C('--fg');x.beginPath();x.arc(F.X(v),F.Y(TY[i]),5,0,7);x.fill()});\nconst G=fr(L2,[0,LE],[0,.6],'epoch (one full gradient descent step)','loss (MSE)'),y=L2.x;clip(L2,G.m);const tr=[],va=[];for(let e=0;e\u003c=ep;e+=5){tr.push([e,LH.TL[e]]);va.push([e,LH.VL[e]])}\npath(y,G,tr,'--acc');path(y,G,va,'--acc2');y.setLineDash([6,5]);path(y,G,[[LH.best,0],[LH.best,.6]],'--fg',1.5);y.setLineDash([]);y.restore();\ny.font='13px sans-serif';y.fillStyle=C('--acc');y.fillText('■ training loss',G.X(LE*.62),G.Y(.56));y.fillStyle=C('--acc2');y.fillText('■ validation loss',G.X(LE*.62),G.Y(.5));y.fillStyle=C('--fg');y.fillText('dashed = best validation epoch',G.X(LE*.62),G.Y(.44));\nconst tl=LH.TL[ep],vl=LH.VL[ep],bv=LH.VL[LH.best];let dg;\nif(LH.dead&&tl>=1e4)dg='\u003cb>EXPLODED: learning rate too big\u003c/b>';else if(d\u003c=2)dg='\u003cb>underfitting\u003c/b>: model too simple, both losses stay high';else if(ep>LH.best+30&&vl>bv*1.12)dg=`\u003cb>overfitting\u003c/b>: validation loss rising, early stopping would stop at epoch ${LH.best}`;else dg=ep>=LE?'looks stable':'still learning';\n$('#lo').innerHTML=`epoch ${ep} | train loss \u003cb>${tl>=1e4?'huge':tl.toFixed(3)}\u003c/b> | validation loss \u003cb>${vl>=1e4?'huge':vl.toFixed(3)}\u003c/b> | best validation ${bv>=1e4?'-':bv.toFixed(3)} at epoch ${LH.best} → ${dg}`}\n$('#lp').onclick=()=>{if(Ltm){clearInterval(Ltm);Ltm=null;$('#lp').textContent='Play';return}if(LP>=LE)LP=0;$('#lp').textContent='Pause';Ltm=setInterval(()=>{LP=Math.min(LE,LP+10);dLc();if(LP>=LE){clearInterval(Ltm);Ltm=null;$('#lp').textContent='Replay'}},40)};\nconst lcReset=()=>{clearInterval(Ltm);Ltm=null;lcRun();LP=0;$('#lp').textContent='Play';dLc();$('#lp').onclick()};$('#ld').oninput=$('#ll').oninput=lcReset;\n/* ---- quiz ---- */\nconst QZ=[{q:'A model scores 99% on training data but 71% on validation data. What is happening?',o:['Underfitting (high bias)','Overfitting (high variance)','A perfect model','Not enough features'],a:1,e:'Huge gap between train and validation = overfitting.'},\n{q:'Only 0.5% of transactions are fraud. Which metric is best to watch?',o:['Accuracy','Recall / PR-AUC','R²','RMSE'],a:1,e:'Always predicting \"not fraud\" gives 99.5% accuracy but catches nothing. Use recall, F1 or PR-AUC.'},\n{q:'What does one gradient descent step do?',o:['Randomly changes the weights','Moves weights opposite to the gradient of the loss','Removes outliers','Splits the data'],a:1,e:'Gradient = uphill direction, so we step the other way: w = w − lr · gradient.'},\n{q:'Which model needs feature scaling the most?',o:['Random Forest','Decision Tree','KNN','XGBoost'],a:2,e:'KNN uses distances, so a large-valued feature would dominate. Tree models are scale-free.'},\n{q:'When should you fit a StandardScaler?',o:['On the whole dataset before splitting','On the training set only, then apply to test','On the test set only','Never'],a:1,e:'Fitting on all data leaks test information into training (data leakage).'},\n{q:'How does boosting differ from bagging?',o:['Trees are trained in parallel on random samples','Trees are trained one after another, each fixing the previous errors','It uses no trees','It only works on text'],a:1,e:'Bagging (Random Forest) = parallel and independent. Boosting = sequential and corrective.'},\n{q:'Your data forms two curved crescents plus some noise points. Which clustering fits best?',o:['K-Means','DBSCAN','Linear Regression','PCA'],a:1,e:'DBSCAN follows dense shapes and marks noise. K-Means likes round blobs.'},\n{q:'What is the first principal component in PCA?',o:['The direction of least variance','The direction of maximum variance','The target column','The mean of the data'],a:1,e:'PC1 is the eigenvector with the largest eigenvalue: the most spread-out direction.'},\n{q:'Both training and validation scores are low. What is the best next move?',o:['Simplify the model','Use a more complex model or better features','Remove half the training data','Shrink the test set'],a:1,e:'Both low = underfitting (high bias). Add capacity or information.'},\n{q:'When do you use the test set?',o:['To tune hyperparameters','Once, at the very end','After every epoch','Mixed into training'],a:1,e:'Using it repeatedly makes your final score optimistic and meaningless.'}];\nlet qi=0,qsc=0,qans=false;\nfunction dQz(){const el=$('#qz');if(qi>=QZ.length){el.innerHTML=`\u003cb style=\"font-size:22px\">Score: ${qsc} / ${QZ.length}\u003c/b>\u003cp>${qsc>=9?'Excellent. You are ready to build and explain a project.':qsc>=7?'Good. Revisit the ones you missed.':'Review the sections above, then try again.'}\u003c/p>\u003cbutton class=\"b\" id=\"qr\">Restart\u003c/button>`;$('#qr').onclick=()=>{qi=0;qsc=0;dQz()};return}\nconst q=QZ[qi];qans=false;el.innerHTML=`\u003cp class=\"mut\">Question ${qi+1} of ${QZ.length}\u003c/p>\u003cp style=\"font-size:18px\">\u003cb>${q.q}\u003c/b>\u003c/p>`+q.o.map((o,i)=>`\u003cbutton class=\"b\" data-i=\"${i}\" style=\"display:block;width:100%;text-align:left;margin:6px 0\">${o}\u003c/button>`).join('')+'\u003cdiv class=\"out\" id=\"qe\" style=\"display:none\">\u003c/div>\u003cbutton class=\"b\" id=\"qn\" style=\"display:none;margin-top:8px\">Next\u003c/button>';\nqs('#qz button[data-i]',b=>b.onclick=()=>{if(qans)return;qans=true;const i=+b.dataset.i,ok=i==q.a;if(ok)qsc++;b.style.background=ok?C('--acc'):'#ff4d4d';b.style.color='#000';\nif(!ok)qs('#qz button[data-i]',c=>{if(+c.dataset.i==q.a){c.style.background=C('--acc');c.style.color='#000'}});$('#qe').style.display='block';$('#qe').innerHTML=(ok?'\u003cb>Correct.\u003c/b> ':'\u003cb>Not quite.\u003c/b> ')+q.e;$('#qn').style.display='inline-block'});\n$('#qn')&&($('#qn').onclick=()=>{qi++;dQz()})}\n/* ---- flashcards + teach-back ---- */\nconst FC=[['What is a hyperparameter?','A setting you choose BEFORE training (depth, learning rate, K). Parameters (weights) are learned from data.'],\n['Explain loss and gradient descent.','Loss measures how wrong predictions are (MSE, log loss). Gradient descent repeatedly moves weights a small step (learning rate) opposite to the loss gradient until the loss stops falling.'],\n['Overfitting vs underfitting?','Overfit: great on train, poor on validation (high variance). Underfit: poor on both (high bias). Fix with simpler/more complex models, more data, regularization.'],\n['Why split before scaling?','Scaler statistics from the test set would leak into training. Fit on train only, then apply to test.'],\n['Precision vs recall?','Precision = of predicted positives, how many are right. Recall = of real positives, how many we caught. Pick by the cost of false alarms vs misses.'],\n['When ROC-AUC, when PR-AUC?','ROC-AUC compares models over all thresholds. PR-AUC is more honest when positives are rare.'],\n['Bias vs variance?','Bias = systematic error from a too-simple model. Variance = sensitivity to the training sample from a too-complex model. Total error = bias² + variance + noise.'],\n['Bagging vs boosting?','Bagging (Random Forest): parallel trees on bootstrap samples, averaged, lowers variance. Boosting: sequential trees correcting errors, lowers bias.'],\n['Why does KNN need scaling?','It uses distances, so features with big numeric ranges dominate. Scaling gives each feature a fair say.'],\n['Entropy, Gini, information gain?','Entropy and Gini measure how mixed a node is. Information gain = parent impurity minus weighted child impurity. The tree picks the split with the best gain.'],\n['How do you choose K in K-Means?','Elbow method (inertia vs K) and silhouette score, plus whether the clusters make sense to a human.'],\n['PCA in one breath?','Scale, centre, find eigenvectors of the covariance matrix, project onto the top few (largest eigenvalues) to keep most variance with fewer features.'],\n['K-Fold vs Stratified K-Fold?','K-Fold rotates which fold validates. Stratified keeps class proportions in every fold, so each score is fair for classification.'],\n['What is the naive part of Naive Bayes?','It assumes features are independent given the class, so likelihoods are simply multiplied.']];\nlet fo=FC.map((_,i)=>i);\nfunction dFc(){$('#fc').innerHTML=fo.map(i=>`\u003cdiv class=\"fc\" data-i=\"${i}\">\u003cdiv class=\"q\">\u003cb>${FC[i][0]}\u003c/b>\u003c/div>\u003cdiv class=\"a\">${FC[i][1]}\u003c/div>\u003c/div>`).join('');qs('.fc',e=>e.onclick=()=>e.classList.toggle('on'))}\n$('#fsh').onclick=()=>{fo.sort(()=>Math.random()-.5);dFc()};$('#fhd').onclick=()=>qs('.fc',e=>e.classList.remove('on'));\nlet ptm=null,pcur=null;\n$('#pqb').onclick=()=>{pcur=FC[Math.floor(Math.random()*FC.length)];$('#pqq').textContent=pcur[0];$('#pqa').style.display='none';clearInterval(ptm);let t=60;$('#pqt').textContent=t;ptm=setInterval(()=>{t--;$('#pqt').textContent=t>0?t:'time!';if(t\u003c=0)clearInterval(ptm)},1000)};\n$('#pqr').onclick=()=>{if(!pcur)return;clearInterval(ptm);$('#pqa').style.display='block';$('#pqa').innerHTML='\u003cb>Model answer:\u003c/b> '+pcur[1]};\n/* ---- project planner ---- */\nconst PJ={ids:[['Problem type','Binary classification: normal vs attack'],['Data','KDD Cup 99 (sklearn) or NSL-KDD CSV'],['Main metric','Recall, F1, PR-AUC (attacks are rare)'],['Cleaning + features','duplicates, missing values, log bytes, bytes ratio, protocol one-hot'],['Models to try','Logistic Regression → Decision Tree → Random Forest → XGBoost'],['Pitfalls','accuracy trap, duplicates leaking across train/test, new attack types in real life'],['Explain without notes','why recall, why split before scaling, why PR-AUC, which model you chose and why']],\nspam:[['Problem type','Binary text classification: spam vs not spam'],['Data','SMS Spam Collection (UCI) or any labelled email set'],['Main metric','Precision (do not block good mail), F1, PR-AUC'],['Cleaning + features','lowercase, remove duplicates, TF-IDF (fit on train only)'],['Models to try','Naive Bayes → Logistic Regression → Random Forest'],['Pitfalls','imbalance, vocabulary leakage, fancy models that barely beat Naive Bayes'],['Explain without notes','Bayes theorem, why \"naive\", precision vs recall trade-off']],\nhouse:[['Problem type','Regression: predict the price'],['Data','California Housing (sklearn)'],['Main metric','RMSE, MAE, R²'],['Cleaning + features','cap outliers, log of skewed columns, rooms per person, interactions, check VIF'],['Models to try','Linear → Ridge/Lasso → Random Forest → XGBoost'],['Pitfalls','multicollinearity, skewed target, leakage through engineered target features'],['Explain without notes','MSE and gradient descent, bias-variance, why scaling helps linear models']],\nchurn:[['Problem type','Binary classification: will the customer leave?'],['Data','Telco Customer Churn CSV (public)'],['Main metric','Recall and F1 at a business threshold, PR-AUC'],['Cleaning + features','blank TotalCharges as missing, one-hot categories, tenure buckets'],['Models to try','Logistic Regression → Decision Tree → Random Forest → XGBoost'],['Pitfalls','leakage from columns known only after churn, class imbalance'],['Explain without notes','confusion matrix costs, threshold choice, feature importance for the business']],\nseg:[['Problem type','Unsupervised: group customers'],['Data','Mall Customers CSV or the Wine dataset'],['Main metric','Silhouette score plus business sense'],['Cleaning + features','scale everything, PCA only for plotting'],['Models to try','K-Means (elbow + silhouette) → Hierarchical → DBSCAN'],['Pitfalls','unscaled features, forcing a K, never profiling the clusters'],['Explain without notes','centroids and iterations, elbow vs silhouette, how you named each cluster']]};\nfunction dPj(){const r=PJ[$('#pj').value];$('#pjt').innerHTML='\u003ctable>'+r.map(([a,b])=>`\u003ctr>\u003cth style=\"width:190px\">${a}\u003c/th>\u003ctd>${b}\u003c/td>\u003c/tr>`).join('')+'\u003c/table>'}\n$('#pj').onchange=dPj;\nfunction redraw(){dRm();dLc()}\ndFc();dQz();dCh();dPj();lcRun();setTheme('galaxy');\n\u003c/script>\u003c/body>\u003c/html>"];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let cur=-1,done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem('ml30-done')||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem('ml30-done',JSON.stringify([...done]))}catch(e){}};
const dayIdx=d=>META.findIndex(m=>m.d.includes(d));
const chips=$('#chips');
function mkChip(label,i){const b=document.createElement('button');b.className='c';b.textContent=label;b.setAttribute('role','tab');b.onclick=()=>show(i);chips.appendChild(b);return b}
const chipEls=[mkChip('🏠 Plan',-1),...META.map((m,i)=>mkChip(m.l,i))];
function show(i){cur=i;$('#home').classList.toggle('on',i<0);
$$('#stage iframe').forEach(f=>f.classList.remove('on'));
if(i>=0){let f=document.getElementById('f'+i);if(!f){f=document.createElement('iframe');f.id='f'+i;f.title=META[i].l+': '+META[i].t;f.srcdoc=DAYS[i];$('#stage').appendChild(f)}f.classList.add('on')}
else renderHome();
chipEls.forEach((c,k)=>{c.classList.toggle('on',k-1===i);c.setAttribute('aria-selected',k-1===i)});
chipEls[i+1].scrollIntoView({inline:'center',block:'nearest'});
try{history.replaceState(null,'','#'+(i<0?'plan':'d'+i))}catch(e){}}
function $$(s){return [...document.querySelectorAll(s)]}
$('#prev').onclick=()=>show(Math.max(-1,cur-1));$('#next').onclick=()=>show(Math.min(META.length-1,cur+1));
$('#tm').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim();r.dataset.theme=(d==='#0c0a1e')?'light':'dark'};
function refreshDone(){META.forEach((m,i)=>chipEls[i+1].classList.toggle('done',m.d.every(d=>done.has(d))))}
function renderHome(){
const pct=Math.round(done.size/30*100);
let h=`<h2>30-Day AI &amp; Machine Learning Master Plan</h2><p class="lead">Beginner → Machine Learning Foundation. Daily target: 2.5–3 hours (60–75 min theory + 60–75 min coding + 30 min practice/notes). All 16 note pages are merged here: tap a day below or use the bar on top.</p>
<div class="pg"><i style="width:${pct}%"></i></div><p class="lead"><b>${done.size}/30 days done (${pct}%)</b> · progress is saved in this browser.</p>
<h3>Jump to notes</h3><div class="grid">${META.map((m,i)=>`<button class="tile" data-go="${i}"><b>${m.l}</b><span>${esc(m.t)}</span></button>`).join('')}</div>
<h3>30-Day Curriculum</h3>`;
CUR.forEach(([d,t,s,p])=>{h+=`<div class="row ${done.has(d)?'d':''}"><input type="checkbox" data-d="${d}" ${done.has(d)?'checked':''} aria-label="Mark day ${d} done"><div><div class="t">Day ${d} — ${esc(t)}</div><small><b>Study:</b> ${esc(s)}</small><small><b>Practice:</b> ${esc(p)}</small></div><button class="go" data-go="${dayIdx(d)}">Open notes ▶</button></div>`});
h+=`<h3>How to study each day</h3><div class="box"><ol><li>Learn the concept and intuition first.</li><li>Write the important formulas in your own notebook.</li><li>Code every concept yourself instead of only watching tutorials.</li><li>For ML algorithms: understand the mathematics, implement from scratch where practical, then use sklearn.</li><li>Keep a daily Jupyter Notebook or VS Code file.</li><li>Save your work in Git/GitHub from Day 1.</li><li>End every day by writing 5–10 lines explaining what you learned without looking at notes.</li></ol></div>
<h3>30-Day milestones</h3><div style="overflow-x:auto"><table><tr><th>Period</th><th>Milestone</th></tr>
<tr><td>Days 1–7</td><td>Python + NumPy + Pandas</td></tr><tr><td>Days 8–14</td><td>Statistics + Probability + Linear Algebra + Calculus + first ML algorithm</td></tr><tr><td>Days 15–21</td><td>ML fundamentals + core supervised algorithms + ensemble learning</td></tr><tr><td>Days 22–28</td><td>Preprocessing + feature engineering + evaluation + tuning + unsupervised learning + PCA</td></tr><tr><td>Days 29–30</td><td>End-to-end ML project + complete revision</td></tr></table></div>
<h3>After Day 30: next roadmap</h3><div class="box"><p>Deep Learning → Neural Networks → PyTorch → CNN → Computer Vision → RNN/LSTM → NLP → Attention → Transformers → Generative AI → LLMs → RAG → Fine-tuning → AI Agents → MLOps → Advanced AI → Research specialization.</p><p><b>Recommended specialization:</b> for a research-oriented path, AI/ML + Cybersecurity and/or Healthcare AI, then explainable AI, OOD detection, adversarial ML, federated learning, multimodal learning and trustworthy AI.</p><p><b>Goal:</b> Learn → Code → Implement → Experiment → Build Projects → Read Papers → Research</p></div>`;
$('#homein').innerHTML=h;
$$('[data-go]').forEach(b=>b.onclick=()=>show(+b.dataset.go));
$$('input[data-d]').forEach(c=>c.onchange=()=>{const d=+c.dataset.d;c.checked?done.add(d):done.delete(d);save();refreshDone();renderHome()})}
refreshDone();
let st=-1;const m=(location.hash||'').match(/^#d(\d+)$/);if(m&&+m[1]<META.length)st=+m[1];
show(st);
</script>
