((r,i)=>{x.strokeStyle=C('--line');x.lineWidth=2;x.fillStyle=i==3?C('--acc'):'transparent';x.globalAlpha=i==3?.5:1;x.beginPath();x.arc(180,180,r,0,7);i==3&&x.fill();x.stroke()});x.globalAlpha=1;\nDZ.forEach(([a,c])=>{const X=180+b*80*Math.cos(.7)+v*60*a,Y=180+b*80*Math.sin(.7)+v*60*c;x.fillStyle=C('--acc2');x.strokeStyle=C('--fg');x.lineWidth=1.3;x.beginPath();x.arc(X,Y,6,0,7);x.fill();x.stroke()});\nconst hb=b>.6,hv=v>.45;$('#do').innerHTML=`\u003cb>${hb?'High':'Low'} bias, ${hv?'high':'low'} variance\u003c/b>: ${!hb&&!hv?'ideal: accurate and consistent':hb&&!hv?'consistent but wrong (underfit)':!hb&&hv?'right on average but scattered (overfit)':'wrong and scattered (worst case)'}`}\n$('#db').oninput=$('#dv').oninput=dD;\nfunction redraw(){dE();dR();dSp();dK();dV();dD()}\nsetTheme('galaxy');\n\u003c/script>\u003c/body>\u003c/html>", "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>ML from Zero: Hyperparameter Tuning and Unsupervised Learning (Day 26-27)\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*{box-sizing:border-box}\nbody{margin:0;font:16px/1.65 'Space Grotesk',system-ui,sans-serif;color:var(--fg);background:var(--bg) fixed;transition:color .4s}\nbody[data-theme=galaxy]{--bg:linear-gradient(160deg,#0b0620,#1a1050 60%,#0a2050);--fg:#eeeaff;--mut:#b4acd9;--card:rgba(20,12,60,.66);--acc:#b388ff;--acc2:#5ec8ff;--line:rgba(200,190,255,.35)}\nbody[data-theme=blackhole]{--bg:radial-gradient(circle at 72% 30%,#1a0c04,#000 60%);--fg:#fff3e6;--mut:#d8b79a;--card:rgba(15,8,4,.72);--acc:#ff9a2e;--acc2:#fff1b0;--line:rgba(255,170,90,.35)}\nbody[data-theme=supernova]{--bg:radial-gradient(circle at 50% 40%,#4a0d05,#16030a 70%);--fg:#fff1e0;--mut:#f2b98f;--card:rgba(40,6,4,.7);--acc:#ff5a2a;--acc2:#ffd23f;--line:rgba(255,150,80,.4)}\nbody[data-theme=aurora]{--bg:linear-gradient(180deg,#02121a,#06302f 70%,#0a3a3a);--fg:#e8fff6;--mut:#9fd9c6;--card:rgba(2,28,30,.68);--acc:#4dffa6;--acc2:#4de1ff;--line:rgba(120,255,200,.35)}\nbody[data-theme=neon]{--bg:linear-gradient(180deg,#0a0016,#1a0033);--fg:#f4f0ff;--mut:#c5a8ee;--card:rgba(14,2,32,.74);--acc:#ff2fa8;--acc2:#2ff3ff;--line:rgba(255,80,200,.45)}\nbody[data-theme=ocean]{--bg:linear-gradient(180deg,#02142e,#012a5a 60%,#00162b);--fg:#e6f6ff;--mut:#9cc8e6;--card:rgba(2,24,56,.7);--acc:#35e0d0;--acc2:#7fb8ff;--line:rgba(120,210,255,.38)}\nbody[data-theme=sunset]{--bg:linear-gradient(180deg,#2a0b4d,#a1275f 55%,#ff9152);--fg:#fff7f0;--mut:#ffd9c2;--card:rgba(50,10,60,.68);--acc:#ffc24d;--acc2:#7ff0ff;--line:rgba(255,220,190,.45)}\nbody[data-theme=paper]{--bg:#fdfdfe;--fg:#1c2230;--mut:#5a6478;--card:rgba(255,255,255,.92);--acc:#2457d6;--acc2:#d6245e;--line:rgba(30,40,70,.25)}\n#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}\nheader.top{position:sticky;top:0;z-index:5;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--card);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}\nheader.top b{margin-right:6px}\nheader.top button{font:inherit;font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}\nheader.top button.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}\nmain{max-width:980px;margin:0 auto;padding:18px 14px 80px}\nh1{font-size:clamp(30px,6vw,54px);line-height:1.1;margin:30px 0 8px}\nh2{font-size:clamp(24px,4vw,34px);margin:50px 0 6px;color:var(--acc)}\nh3{font-size:19px;margin:0 0 6px}\np{margin:6px 0}.mut{color:var(--mut)}\nsection.c{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px 0}\n.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n@media(max-width:760px){.g2{grid-template-columns:1fr}}\ncanvas.s{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px}\n.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:8px 0}\n.ctl label{font-size:14px;display:flex;gap:8px;align-items:center}\ninput[type=range]{accent-color:var(--acc);width:150px}\nbutton.b{font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;border:1px solid var(--acc);background:transparent;color:var(--fg);cursor:pointer}\nbutton.b:hover{background:var(--acc);color:#000}\n.out{font-size:15px;padding:6px 10px;border-left:3px solid var(--acc2);background:rgba(127,127,127,.12);border-radius:4px;margin-top:6px}\n.eq{font-size:22px;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:10px;margin:10px 0}\n.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0}\n.flow span.n{padding:8px 12px;border:1px solid var(--line);border-radius:10px;transition:.3s;text-align:center;font-size:14px}\n.flow span.n.hi{background:var(--acc);color:#000;transform:scale(1.08);border-color:var(--acc)}\n.flow i{color:var(--acc2);font-style:normal}\npre{background:rgba(0,0,0,.45);color:#e8ecff;padding:12px;border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.5;margin:8px 0}\nbody[data-theme=paper] pre{background:#f0f3fa;color:#1c2230}\n.bar{height:22px;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .25s;min-width:2px}\n.row{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:14px}.row b{width:48px}\n.tip{border-left:4px solid var(--acc);padding:6px 12px;margin:8px 0;background:rgba(127,127,127,.12);border-radius:4px}\ntable{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}\n.fill{background:var(--acc);color:#000}button.b.on{background:var(--acc);color:#000}a{color:var(--acc2)}code{background:rgba(127,127,127,.2);padding:1px 5px;border-radius:4px}select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px}html{scroll-behavior:smooth}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}@media(max-width:760px){.g3{grid-template-columns:1fr}}\u003c/style>\u003c/head>\n\u003cbody data-theme=\"galaxy\">\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cheader class=\"top\">\u003cb>Theme\u003c/b>\u003cspan id=\"th\" style=\"display:contents\">\u003c/span>\u003c/header>\n\u003cmain>\n\u003ch1>Days 26 and 27: Tuning Knobs, and Finding Groups Without Labels\u003c/h1>\n\u003cp class=\"mut\">Zero-level notes. Day 26: how to pick the best settings for a model. Day 27: how to discover groups in data that has no answers. Jump to:\n\u003ca href=\"#d26\">Day 26 Hyperparameter Tuning\u003c/a> &nbsp; \u003ca href=\"#d27\">Day 27 Unsupervised Learning\u003c/a>\u003c/p>\n\n\u003ch2 id=\"d26\">Day 26: Hyperparameter Tuning\u003c/h2>\n\u003csection class=\"c\">\u003ch3>1. Parameters vs hyperparameters\u003c/h3>\n\u003cdiv class=\"g2\">\u003cdiv class=\"flow\" style=\"flex-direction:column\">\u003cb>Parameters\u003c/b>\u003cspan class=\"n\">learned by the model from data\u003c/span>\u003cspan class=\"mut\" style=\"font-size:14px\">weights in regression, split thresholds in a tree\u003c/span>\u003c/div>\n\u003cdiv class=\"flow\" style=\"flex-direction:column\">\u003cb>Hyperparameters\u003c/b>\u003cspan class=\"n\">set by YOU before training\u003c/span>\u003cspan class=\"mut\" style=\"font-size:14px\">K in KNN, max_depth, learning_rate, n_estimators\u003c/span>\u003c/div>\u003c/div>\n\u003cp class=\"tip\">Analogy: baking. Ingredients turning into a cake = parameters (the oven does it). Oven temperature and baking time = hyperparameters (you choose). Tuning = trying settings and keeping the cake that tastes best on \u003cb>validation\u003c/b> data, never the test set.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Model\u003c/th>\u003cth>Key hyperparameters\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Random Forest\u003c/td>\u003ctd>n_estimators, max_depth, min_samples_leaf, max_features\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>XGBoost\u003c/td>\u003ctd>learning_rate, n_estimators, max_depth, subsample, colsample_bytree\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>KNN / SVM\u003c/td>\u003ctd>K / C, kernel, gamma\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>2. Grid vs Random vs Bayesian search\u003c/h3>\n\u003cp>Imagine two hyperparameters. The colour shows the (normally hidden) score: bright = good. Each method gets the \u003cb>same number of tries\u003c/b>. Press Run and watch where they look.\u003c/p>\n\u003cdiv class=\"g3\">\u003ccanvas class=\"s\" id=\"h1\" width=\"300\" height=\"300\">\u003c/canvas>\u003ccanvas class=\"s\" id=\"h2\" width=\"300\" height=\"300\">\u003c/canvas>\u003ccanvas class=\"s\" id=\"h3\" width=\"300\" height=\"300\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"ctl\">\u003clabel>budget (grid size) \u003cinput type=\"range\" id=\"hn\" min=\"3\" max=\"7\" value=\"5\"> \u003cb id=\"hnv\">\u003c/b>\u003c/label>\u003cbutton class=\"b\" id=\"hr\">Run all three\u003c/button>\u003c/div>\n\u003cdiv class=\"out\" id=\"ho\">\u003c/div>\n\u003ctable style=\"margin-top:8px\">\u003ctr>\u003cth>Method\u003c/th>\u003cth>Idea\u003c/th>\u003cth>Weakness\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>GridSearchCV\u003c/td>\u003ctd>try every combination on a fixed grid\u003c/td>\u003ctd>explodes with more hyperparameters, can step over a narrow peak\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>RandomizedSearchCV\u003c/td>\u003ctd>try random combinations\u003c/td>\u003ctd>pure luck, but covers more distinct values per axis\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Bayesian optimization\u003c/td>\u003ctd>learn from past tries, test where the score is promising or unknown\u003c/td>\u003ctd>sequential, a bit more setup\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"tip\">Run it several times: grid can miss the narrow bright peak, random is hit-and-miss, Bayesian-style search climbs toward bright areas after a few exploratory tries.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>3. Optuna: Bayesian-style tuning made easy\u003c/h3>\n\u003cdiv class=\"flow\">\u003cspan class=\"n\">define objective(trial)\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">Optuna suggests settings\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">you return the CV score\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">Optuna learns, suggests better ones\u003c/span>\u003ci>↺\u003c/i>\u003c/div>\n\u003cp>It uses a smart sampler (TPE) and can \u003cb>prune\u003c/b> hopeless trials early. You describe the search space with \u003ccode>suggest_int\u003c/code>, \u003ccode>suggest_float\u003c/code> (with \u003ccode>log=True\u003c/code> for learning rates) and \u003ccode>suggest_categorical\u003c/code>.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>4. Code: tune Random Forest and XGBoost\u003c/h3>\n\u003cpre>from scipy.stats import randint\nfrom sklearn.datasets import load_breast_cancer\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.model_selection import GridSearchCV, RandomizedSearchCV, StratifiedKFold, cross_val_score, train_test_split\n\nX, y = load_breast_cancer(return_X_y=True)\nXtr, Xte, ytr, yte = train_test_split(X, y, test_size=0.2, stratify=y, random_state=1)  # test set stays locked\ncv = StratifiedKFold(5, shuffle=True, random_state=1)\n\n# Grid search: every combination (2 x 3 x 3 = 18 models x 5 folds)\ngrid = GridSearchCV(RandomForestClassifier(random_state=1),\n                    {\"n_estimators\": [100, 200], \"max_depth\": [3, 5, None], \"min_samples_leaf\": [1, 3, 5]},\n                    cv=cv, scoring=\"f1\", n_jobs=-1).fit(Xtr, ytr)\nprint(\"grid:\", grid.best_params_, grid.best_score_)\n\n# Random search: 30 random combinations from ranges\nrand = RandomizedSearchCV(RandomForestClassifier(random_state=1),\n                          {\"n_estimators\": randint(50, 400), \"max_depth\": randint(2, 20),\n                           \"min_samples_leaf\": randint(1, 10), \"max_features\": [\"sqrt\", \"log2\", 0.5]},\n                          n_iter=30, cv=cv, scoring=\"f1\", n_jobs=-1, random_state=1).fit(Xtr, ytr)\nprint(\"random:\", rand.best_params_, rand.best_score_)\nprint(\"test score (once):\", rand.best_estimator_.score(Xte, yte))\n\n# Optuna + XGBoost  (pip install optuna xgboost)\nimport optuna\nfrom xgboost import XGBClassifier\ndef objective(trial):\n    p = {\"n_estimators\": trial.suggest_int(\"n_estimators\", 100, 600),\n         \"learning_rate\": trial.suggest_float(\"learning_rate\", 0.01, 0.3, log=True),\n         \"max_depth\": trial.suggest_int(\"max_depth\", 2, 8),\n         \"subsample\": trial.suggest_float(\"subsample\", 0.5, 1.0),\n         \"colsample_bytree\": trial.suggest_float(\"colsample_bytree\", 0.5, 1.0)}\n    return cross_val_score(XGBClassifier(**p, random_state=1, eval_metric=\"logloss\"), Xtr, ytr, cv=cv, scoring=\"f1\").mean()\nstudy = optuna.create_study(direction=\"maximize\")\nstudy.optimize(objective, n_trials=40)\nprint(study.best_params, study.best_value)\u003c/pre>\u003c/section>\n\n\u003ch2 id=\"d27\">Day 27: Unsupervised Learning\u003c/h2>\n\u003csection class=\"c\">\u003ch3>1. No labels, no answers: find the structure\u003c/h3>\n\u003cdiv class=\"g2\">\u003cdiv class=\"flow\" style=\"flex-direction:column\">\u003cb>Supervised\u003c/b>\u003cspan class=\"n\">data + correct answers → predict answers\u003c/span>\u003c/div>\u003cdiv class=\"flow\" style=\"flex-direction:column\">\u003cb>Unsupervised\u003c/b>\u003cspan class=\"n\">data only → discover groups or patterns\u003c/span>\u003c/div>\u003c/div>\n\u003cp class=\"mut\">Examples: group customers by behaviour, find similar songs, spot unusual transactions.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>2. K-Means: assign, update, repeat\u003c/h3>\n\u003cdiv class=\"flow\">\u003cspan class=\"n\">1 Pick K random centroids\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">2 Assign: each point joins its nearest centroid (distance)\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">3 Update: move each centroid to the mean of its points\u003c/span>\u003ci>↺\u003c/i>\u003cspan class=\"n\">stop when nothing moves\u003c/span>\u003c/div>\n\u003ccanvas class=\"s\" id=\"k1\" width=\"640\" height=\"420\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>K \u003cinput type=\"range\" id=\"kk\" min=\"2\" max=\"6\" value=\"3\"> \u003cb id=\"kv\">3\u003c/b>\u003c/label>\u003cbutton class=\"b\" id=\"ks\">Step\u003c/button>\u003cbutton class=\"b\" id=\"kr\">Run to the end\u003c/button>\u003cbutton class=\"b\" id=\"kn\">New random start\u003c/button>\u003c/div>\n\u003cdiv class=\"out\" id=\"ko\">\u003c/div>\n\u003cp class=\"tip\">Stars = centroids. Press Step: first the points snap to the nearest star (assign), then the stars move to the middle of their points (update). \u003cb>Inertia\u003c/b> = total squared distance to centroids; it only goes down. Try \"New random start\" a few times: a bad start can give a worse result, so sklearn runs several starts (n_init).\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>3. How many clusters? Elbow and silhouette\u003c/h3>\n\u003cdiv class=\"g2\">\u003cdiv class=\"eq\" style=\"font-size:16px\">Elbow: plot inertia vs K, pick where the drop flattens\u003c/div>\u003cdiv class=\"eq\" style=\"font-size:16px\">Silhouette s = (b − a) / max(a, b)\u003cbr>\u003cspan class=\"mut\" style=\"font-size:13px\">a = distance to own cluster, b = to nearest other cluster\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"g2\">\u003ccanvas class=\"s\" id=\"k2\" width=\"440\" height=\"320\">\u003c/canvas>\u003ccanvas class=\"s\" id=\"k3\" width=\"440\" height=\"320\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"out\" id=\"kq\">\u003c/div>\n\u003cp class=\"tip\">The big dot follows the K slider above. Elbow: the line bends sharply, then flattens. Silhouette: between −1 and 1, higher is better (1 = tight, well separated; near 0 = overlapping). Use both, plus common sense.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>4. Hierarchical clustering: build a family tree\u003c/h3>\n\u003cp>Start with every point alone, repeatedly \u003cb>merge the two closest clusters\u003c/b>. The tree is a \u003cb>dendrogram\u003c/b>. Cut it at a height to get clusters. No need to choose K in advance.\u003c/p>\n\u003cdiv class=\"g2\">\u003ccanvas class=\"s\" id=\"hc1\" width=\"440\" height=\"340\">\u003c/canvas>\u003ccanvas class=\"s\" id=\"hc2\" width=\"440\" height=\"340\">\u003c/canvas>\u003c/div>\n\u003cdiv class=\"ctl\">\u003clabel>linkage \u003cselect id=\"hl\">\u003coption value=\"average\">average\u003c/option>\u003coption value=\"single\">single (nearest points)\u003c/option>\u003coption value=\"complete\">complete (farthest points)\u003c/option>\u003c/select>\u003c/label>\u003clabel>cut height \u003cinput type=\"range\" id=\"hcut\" min=\"0\" max=\"100\" value=\"35\">\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"hco\">\u003c/div>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>5. DBSCAN: clusters of any shape, and noise\u003c/h3>\n\u003cp>A point is a \u003cb>core\u003c/b> point if at least \u003cb>minPts\u003c/b> points (itself included) lie within distance \u003cb>eps\u003c/b>. Connected core points form a cluster. Lonely points become \u003cb>noise\u003c/b> (grey ✕). Large dots = core points.\u003c/p>\n\u003ccanvas class=\"s\" id=\"db\" width=\"640\" height=\"400\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>algorithm \u003cselect id=\"da\">\u003coption value=\"db\">DBSCAN\u003c/option>\u003coption value=\"km\">K-Means (K=2)\u003c/option>\u003c/select>\u003c/label>\u003clabel>eps \u003cinput type=\"range\" id=\"de\" min=\".05\" max=\".6\" step=\".01\" value=\".25\"> \u003cb id=\"dev\">\u003c/b>\u003c/label>\u003clabel>minPts \u003cinput type=\"range\" id=\"dm\" min=\"2\" max=\"10\" value=\"4\"> \u003cb id=\"dmv\">\u003c/b>\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"dbo\">\u003c/div>\n\u003cp class=\"tip\">Switch to K-Means: it cuts the two crescents with a straight line (it likes round blobs). DBSCAN follows the curves and flags the scattered points as noise. Too small an eps = everything is noise; too large = everything merges into one.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>\u003c/th>\u003cth>K-Means\u003c/th>\u003cth>Hierarchical\u003c/th>\u003cth>DBSCAN\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Need K?\u003c/td>\u003ctd>yes\u003c/td>\u003ctd>no (cut the tree)\u003c/td>\u003ctd>no (eps, minPts)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Cluster shape\u003c/td>\u003ctd>round blobs\u003c/td>\u003ctd>depends on linkage\u003c/td>\u003ctd>any shape\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Outliers\u003c/td>\u003ctd>pulled by them\u003c/td>\u003ctd>pulled by them\u003c/td>\u003ctd>labelled noise\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Large data\u003c/td>\u003ctd>fast\u003c/td>\u003ctd>slow\u003c/td>\u003ctd>medium\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>6. Code: cluster a real dataset and interpret the clusters\u003c/h3>\n\u003cpre>import pandas as pd\nfrom sklearn.datasets import load_wine\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.cluster import KMeans, AgglomerativeClustering, DBSCAN\nfrom sklearn.metrics import silhouette_score\nfrom sklearn.decomposition import PCA\nimport matplotlib.pyplot as plt\n\nwine = load_wine(as_frame=True)\nX = wine.data                                          # 13 chemical measurements, we IGNORE the labels\nXs = StandardScaler().fit_transform(X)                 # distance-based, so scale first\n\nfor k in range(2, 9):                                  # elbow + silhouette\n    km = KMeans(n_clusters=k, n_init=10, random_state=1).fit(Xs)\n    print(k, round(km.inertia_), round(silhouette_score(Xs, km.labels_), 3))\n\nkm = KMeans(n_clusters=3, n_init=10, random_state=1).fit(Xs)\nX[\"cluster\"] = km.labels_\nprint(X.groupby(\"cluster\").mean().round(2).T)          # INTERPRET: what stands out in each cluster?\nprint(X[\"cluster\"].value_counts())\n\nZ = PCA(n_components=2).fit_transform(Xs)              # draw 13 dimensions in 2D\nplt.scatter(Z[:, 0], Z[:, 1], c=km.labels_); plt.title(\"K-Means clusters\"); plt.show()\n\nhier = AgglomerativeClustering(n_clusters=3, linkage=\"ward\").fit(Xs)\ndb = DBSCAN(eps=2.2, min_samples=5).fit(Xs)            # label -1 = noise\nprint(\"hier:\", silhouette_score(Xs, hier.labels_), \" dbscan clusters:\", set(db.labels_))\u003c/pre>\n\u003cp class=\"tip\">Interpreting = look at each cluster's average per feature, find what is unusually high or low, then give it a name (for example \"high alcohol, high flavonoids\"). Check the clusters make sense to a human, not only to the score.\u003c/p>\u003c/section>\n\u003c/main>\n\u003cscript>\nconst $=s=>document.querySelector(s),C=n=>getComputedStyle(document.body).getPropertyValue(n).trim();\nconst P=id=>{const c=$(id);return{x:c.getContext('2d'),W:c.width,H:c.height}};\nfunction fr(p,xr,yr,xl,yl){const{x,W,H}=p,m=38;x.clearRect(0,0,W,H);\nconst X=v=>m+(v-xr[0])/(xr[1]-xr[0])*(W-m-12),Y=v=>H-m-(v-yr[0])/(yr[1]-yr[0])*(H-m-12);\nx.strokeStyle=C('--line');x.fillStyle=C('--mut');x.lineWidth=1;x.font='12px sans-serif';x.setLineDash([]);\nx.beginPath();x.moveTo(m,8);x.lineTo(m,H-m);x.lineTo(W-8,H-m);x.stroke();\nx.fillText(xl,W/2-30,H-10);x.save();x.translate(13,H/2+20);x.rotate(-Math.PI/2);x.fillText(yl,0,0);x.restore();\nreturn{X,Y,m}}\nconst clip=(p,m)=>{p.x.save();p.x.beginPath();p.x.rect(m,8,p.W-m-8,p.H-m-8);p.x.clip()};\n/* ---- themes + background ---- */\nconst TH=[['galaxy','Galaxy'],['blackhole','Black Hole'],['supernova','Supernova'],['aurora','Aurora'],['neon','Cyberpunk Neon'],['ocean','Deep Ocean'],['sunset','Sunset Retro'],['paper','Light Paper']];\nfunction setTheme(k){document.body.dataset.theme=k;[...$('#th').children].forEach(b=>b.classList.toggle('on',b.dataset.k==k));redraw()}\nTH.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.k=k;b.onclick=()=>setTheme(k);$('#th').appendChild(b)});\nconst bg=$('#bg'),bx=bg.getContext('2d');let BW,BH,T=0;const rs=()=>{BW=bg.width=innerWidth;BH=bg.height=innerHeight};rs();addEventListener('resize',rs);\nconst PS=Array.from({length:170},()=>({a:Math.random()*6.283,r:Math.random(),s:Math.random()}));\nconst glow=(x,y,r,c0,c1)=>{const g=bx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c0);g.addColorStop(1,c1);bx.fillStyle=g;bx.fillRect(x-r,y-r,2*r,2*r)};\nconst BGF={\ngalaxy(){glow(BW*(.3+.05*Math.sin(T*.2)),BH*.3,BW*.45,'rgba(150,80,255,.28)','rgba(150,80,255,0)');glow(BW*.75,BH*(.6+.05*Math.cos(T*.25)),BW*.4,'rgba(60,150,255,.25)','rgba(60,150,255,0)');\nPS.forEach(p=>{bx.globalAlpha=.25+.75*Math.abs(Math.sin(T*p.s*2+p.a));bx.fillStyle='#fff';bx.fillRect(p.r*BW,p.a/6.283*BH,1+p.s*1.6,1+p.s*1.6)});bx.globalAlpha=1},\nblackhole(){const cx=BW*.72,cy=BH*.3;glow(cx,cy,260,'rgba(255,140,40,.35)','rgba(255,140,40,0)');\nPS.forEach(p=>{const rad=70+p.r*240,an=p.a+T*(1.2/(rad/60));bx.fillStyle=`hsl(${25+(1-p.r)*25},100%,${50+(1-p.r)*45}%)`;bx.fillRect(cx+Math.cos(an)*rad,cy+Math.sin(an)*rad*.3,2.2,2.2)});\nbx.fillStyle='#000';bx.beginPath();bx.arc(cx,cy,52,0,7);bx.fill();bx.strokeStyle='rgba(255,200,120,.8)';bx.lineWidth=2;bx.stroke()},\nsupernova(){const cx=BW/2,cy=BH*.4,R=Math.min(BW,BH)*.7;glow(cx,cy,140+30*Math.sin(T*3),'rgba(255,230,120,.5)','rgba(255,80,20,0)');\nPS.forEach(p=>{const l=(T*.3+p.s)%1,d=l*R*(.3+p.r);bx.globalAlpha=1-l;bx.fillStyle=`hsl(${55-l*55},100%,55%)`;bx.fillRect(cx+Math.cos(p.a)*d,cy+Math.sin(p.a)*d,2+3*(1-l),2+3*(1-l))});bx.globalAlpha=1},\naurora(){[['77,255,166',0],['77,225,255',1],['150,120,255',2]].forEach(([c,k])=>{const g=bx.createLinearGradient(0,BH*.05,0,BH*.65);g.addColorStop(0,`rgba(${c},.0)`);g.addColorStop(.35,`rgba(${c},.38)`);g.addColorStop(1,`rgba(${c},0)`);\nbx.fillStyle=g;bx.beginPath();const f=x=>BH*.22+k*45+Math.sin(x*.004+T*.4+k)*60+Math.sin(x*.011+T*.9+k*2)*22;bx.moveTo(0,f(0));for(let x=0;x\u003c=BW;x+=12)bx.lineTo(x,f(x));for(let x=BW;x>=0;x-=12)bx.lineTo(x,f(x)+220);bx.fill()});\nbx.fillStyle='#fff';PS.slice(0,50).forEach(p=>{bx.globalAlpha=.3+.5*Math.sin(T+p.a)**2;bx.fillRect(p.r*BW,p.s*BH*.4,1.5,1.5)});bx.globalAlpha=1},\nneon(){const hz=BH*.55;glow(BW/2,hz,BW*.4,'rgba(255,47,168,.35)','rgba(255,47,168,0)');bx.lineWidth=1.5;\nfor(let i=-14;i\u003c=14;i++){bx.strokeStyle='rgba(47,243,255,.55)';bx.beginPath();bx.moveTo(BW/2+i*28,hz);bx.lineTo(BW/2+i*BW/9,BH);bx.stroke()}\nfor(let j=0;j\u003c12;j++){const t=((j+T*.7)%12)/12,y=hz+(BH-hz)*t*t;bx.strokeStyle=`rgba(255,47,168,${.15+.6*t})`;bx.beginPath();bx.moveTo(0,y);bx.lineTo(BW,y);bx.stroke()}},\nocean(){glow(BW*.5,BH,BW*.7,'rgba(40,200,220,.25)','rgba(40,200,220,0)');\nPS.forEach(p=>{const y=BH+20-((T*(14+p.s*40)+p.a*160)%(BH+40)),x=p.r*BW+Math.sin(T+p.a*3)*18,r=2+p.s*9;bx.strokeStyle=`rgba(120,255,240,${.35+.4*p.s})`;bx.fillStyle='rgba(53,224,208,.08)';bx.lineWidth=1.3;bx.shadowColor='#35e0d0';bx.shadowBlur=10;bx.beginPath();bx.arc(x,y,r,0,7);bx.fill();bx.stroke()});bx.shadowBlur=0},\nsunset(){const cx=BW/2,cy=BH*.58,r=Math.min(BW,BH)*.22,g=bx.createLinearGradient(0,cy-r,0,cy+r);g.addColorStop(0,'#ffe36e');g.addColorStop(1,'#ff4f9a');\nglow(cx,cy,r*2.6,'rgba(255,170,90,.4)','rgba(255,170,90,0)');bx.fillStyle=g;bx.beginPath();bx.arc(cx,cy,r,0,7);bx.fill();\nfor(let i=0;i\u003c6;i++){const y=cy+r*(.05+i*.17)+Math.sin(T+i)*3;bx.fillStyle='rgba(90,20,110,.75)';bx.fillRect(cx-r,y,2*r,3+i*2.2)}},\npaper(){PS.slice(0,60).forEach(p=>{bx.fillStyle='rgba(36,87,214,.14)';bx.beginPath();bx.arc(p.r*BW,(p.a/6.283*BH-T*(6+p.s*10)+BH*3)%BH,1.5+p.s*2,0,7);bx.fill()})}};\n(function loop(){T+=.016;bx.clearRect(0,0,BW,BH);const f=BGF[document.body.dataset.theme];if(f)f();requestAnimationFrame(loop)})();\n/* ---- shared ---- */\nlet sd=21;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647,gn=()=>Math.sqrt(-2*Math.log(rnd()+1e-9))*Math.cos(6.283*rnd());\nconst avg=a=>a.reduce((s,v)=>s+v,0)/a.length,mk=id=>P(id),dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]),PAL=['#ff6b6b','#4dd0e1','#ffd54f','#9be564','#c792ea','#ff9f68'];\nfunction path(x,F,pts,c,w=3){x.strokeStyle=C(c);x.lineWidth=w;x.beginPath();pts.forEach(([a,b],i)=>i?x.lineTo(F.X(a),F.Y(b)):x.moveTo(F.X(a),F.Y(b)));x.stroke()}\nconst dotc=(x,X,Y,col,r=5)=>{x.fillStyle=col;x.strokeStyle=C('--fg');x.lineWidth=1.2;x.beginPath();x.arc(X,Y,r,0,7);x.fill();x.stroke()};\nfunction star(x,X,Y,col){x.fillStyle=col;x.strokeStyle='#000';x.lineWidth=2;x.beginPath();for(let i=0;i\u003c10;i++){const r=i%2?6:15,a=-1.5708+i*.6283;x.lineTo(X+Math.cos(a)*r,Y+Math.sin(a)*r)}x.closePath();x.fill();x.stroke()}\n/* ---- search landscape ---- */\nconst LF=(x,y)=>.95*Math.exp(-((x-.74)**2+(y-.28)**2)/.006)+.72*Math.exp(-((x-.24)**2+(y-.7)**2)/.07),HC=[mk('#h1'),mk('#h2'),mk('#h3')],HL=['Grid','Random','Bayesian-style'];let HS={pts:[[],[],[]],shown:0,tm:null};\nfunction seqs(n){const N=n*n,g=[];for(let i=0;i\u003cn;i++)for(let j=0;j\u003cn;j++)g.push([(i+.5)/n,(j+.5)/n]);\nconst r=Array.from({length:N},()=>[rnd(),rnd()]),b=[];for(let i=0;i\u003cMath.min(5,N);i++)b.push([rnd(),rnd()]);\nwhile(b.length\u003cN){let best=null,bv=-9;for(let i=0;i\u003c25;i++)for(let j=0;j\u003c25;j++){const c=[(i+.5)/25,(j+.5)/25];let w=0,s=0,dm=9;\nb.forEach(p=>{const d=dist(c,p);w+=Math.exp(-d*d/.0288);s+=Math.exp(-d*d/.0288)*LF(p[0],p[1]);dm=Math.min(dm,d)});\nconst a=(w>1e-9?s/w:0)+.9*(1-Math.exp(-dm*dm/.02));if(a>bv){bv=a;best=c}}b.push(best)}\nreturn[g,r,b]}\nfunction dH(){const n=+$('#hn').value;$('#hnv').textContent=n+'×'+n+' = '+n*n+' tries';const out=[];\nHC.forEach((p,k)=>{const F=fr(p,[0,1],[0,1],'hyperparameter 1','hyperparameter 2'),x=p.x;\nfor(let i=0;i\u003c30;i++)for(let j=0;j\u003c30;j++){x.globalAlpha=.1+LF((i+.5)/30,(j+.5)/30)*.75;x.fillStyle=C('--acc2');x.fillRect(F.X(i/30),F.Y((j+1)/30),F.X(1/30)-F.X(0)+1,F.Y(0)-F.Y(1/30)+1)}x.globalAlpha=1;\nlet best=-1,bp=null;const pts=HS.pts[k].slice(0,HS.shown);pts.forEach(q=>{const v=LF(q[0],q[1]);if(v>best){best=v;bp=q}dotc(x,F.X(q[0]),F.Y(q[1]),C('--fg'),4)});\nif(bp)star(x,F.X(bp[0]),F.Y(bp[1]),C('--acc'));x.fillStyle=C('--fg');x.font='bold 14px sans-serif';x.fillText(HL[k],F.m+8,26);\nout.push(`${HL[k]}: best score so far \u003cb>${pts.length?best.toFixed(2):'-'}\u003c/b> after ${pts.length} tries (maximum possible about 0.95)`)});$('#ho').innerHTML=out.join('\u003cbr>')}\n$('#hn').oninput=()=>{clearInterval(HS.tm);HS={pts:[[],[],[]],shown:0};dH()};\n$('#hr').onclick=()=>{clearInterval(HS.tm);const n=+$('#hn').value;HS={pts:seqs(n),shown:0};HS.tm=setInterval(()=>{HS.shown++;dH();if(HS.shown>=n*n)clearInterval(HS.tm)},140)};\n/* ---- k-means data ---- */\nconst R=[-4,4],KD=[];[[-2,-1.5],[2,-1],[0,2.2]].forEach(([cx,cy])=>{for(let i=0;i\u003c40;i++)KD.push([cx+gn()*.7,cy+gn()*.7])});\nconst fr2=(p,r1,r2)=>fr(p,r1,r2,'feature 1','feature 2');\nfunction kmFull(pts,K){let cent=Array.from({length:K},()=>pts[Math.floor(rnd()*pts.length)].slice()),asg=[];\nfor(let it=0;it\u003c40;it++){asg=pts.map(p=>{let b=0,bd=1e9;cent.forEach((c,i)=>{const d=dist(p,c);if(d\u003cbd){bd=d;b=i}});return b});\ncent=cent.map((c,i)=>{const m=pts.filter((_,j)=>asg[j]==i);return m.length?[avg(m.map(p=>p[0])),avg(m.map(p=>p[1]))]:c})}\nreturn{cent,asg,inertia:pts.reduce((s,p,j)=>s+dist(p,cent[asg[j]])**2,0)}}\n/* ---- interactive k-means ---- */\nlet KS;\nfunction kInit(){const K=+$('#kk').value;KS={cent:Array.from({length:K},()=>KD[Math.floor(rnd()*KD.length)].slice()),asg:KD.map(()=>-1),phase:0,it:0,done:0}}\nfunction kStep(){if(KS.done)return;if(KS.phase==0){KS.asg=KD.map(p=>{let b=0,bd=1e9;KS.cent.forEach((c,i)=>{const d=dist(p,c);if(d\u003cbd){bd=d;b=i}});return b});KS.phase=1}\nelse{let mv=0;KS.cent=KS.cent.map((c,i)=>{const m=KD.filter((_,j)=>KS.asg[j]==i);if(!m.length)return c;const n=[avg(m.map(p=>p[0])),avg(m.map(p=>p[1]))];mv+=dist(n,c);return n});KS.it++;KS.phase=0;if(mv\u003c1e-4)KS.done=1}}\nconst K1=mk('#k1');\nfunction dK(){const F=fr2(K1,R,R),x=K1.x;$('#kv').textContent=KS.cent.length;\nKD.forEach((p,j)=>dotc(x,F.X(p[0]),F.Y(p[1]),KS.asg[j]\u003c0?C('--mut'):PAL[KS.asg[j]],5));KS.cent.forEach((c,i)=>star(x,F.X(c[0]),F.Y(c[1]),PAL[i]));\nconst inr=KS.asg[0]\u003c0?null:KD.reduce((s,p,j)=>s+dist(p,KS.cent[KS.asg[j]])**2,0);\n$('#ko').innerHTML=`K = ${KS.cent.length} | iteration ${KS.it} | ${KS.done?'\u003cb>converged: nothing moves anymore ✔\u003c/b>':'next step: \u003cb>'+(KS.phase==0?'ASSIGN points to nearest centroid':'UPDATE centroids to cluster means')+'\u003c/b>'} | inertia = \u003cb>${inr===null?'-':inr.toFixed(1)}\u003c/b>`}\n$('#kk').oninput=()=>{kInit();dK()};$('#kn').onclick=()=>{kInit();dK()};$('#ks').onclick=()=>{kStep();dK()};$('#kr').onclick=()=>{for(let i=0;i\u003c100&&!KS.done;i++)kStep();dK()};\n/* ---- elbow + silhouette ---- */\nfunction silh(pts,asg,K){let tot=0;pts.forEach((p,i)=>{const sm=Array(K).fill(0),cn=Array(K).fill(0);pts.forEach((q,j)=>{if(i!=j){sm[asg[j]]+=dist(p,q);cn[asg[j]]++}});\nconst a=cn[asg[i]]?sm[asg[i]]/cn[asg[i]]:0;let b=1e9;for(let k=0;k\u003cK;k++)if(k!=asg[i]&&cn[k])b=Math.min(b,sm[k]/cn[k]);tot+=cn[asg[i]]?(b-a)/Math.max(a,b):0});return tot/pts.length}\nconst KE=[];for(let K=2;K\u003c=8;K++){let best=null;for(let t=0;t\u003c6;t++){const r=kmFull(KD,K);if(!best||r.inertia\u003cbest.inertia)best=r}best.sil=silh(KD,best.asg,K);KE[K]=best}\nconst K2=mk('#k2'),K3=mk('#k3');\nfunction dQ(){const K=KS.cent.length,mx=KE[2].inertia*1.05,F=fr(K2,[2,8],[0,mx],'K (number of clusters)','inertia'),F3=fr(K3,[2,8],[0,1],'K (number of clusters)','silhouette score');\n[[K2,F,'--acc',o=>o.inertia],[K3,F3,'--acc2',o=>o.sil]].forEach(([p,f,c,g])=>{path(p.x,f,KE.slice(2).map((o,i)=>[i+2,g(o)]),c);KE.slice(2).forEach((o,i)=>dotc(p.x,f.X(i+2),f.Y(g(o)),C(c),4));\nconst o=KE[K];p.x.fillStyle=C('--fg');p.x.strokeStyle=C(c);p.x.lineWidth=3;p.x.beginPath();p.x.arc(f.X(K),f.Y(g(o)),9,0,7);p.x.fill();p.x.stroke()});\nlet bk=2;for(let k=3;k\u003c=8;k++)if(KE[k].sil>KE[bk].sil)bk=k;$('#kq').innerHTML=`K = ${K}: inertia ${KE[K].inertia.toFixed(1)}, silhouette \u003cb>${KE[K].sil.toFixed(2)}\u003c/b> | best silhouette is at K = \u003cb>${bk}\u003c/b> (this data was made from 3 blobs)`}\n/* ---- hierarchical ---- */\nconst HP=Array.from({length:17},(_,i)=>KD[i*7]),HA=mk('#hc1'),HB=mk('#hc2');\nfunction agg(link){const n=HP.length;let cl=HP.map((_,i)=>({id:i,m:[i],h:0})),nid=n;\nconst cd=(a,b)=>{const ds=[];a.m.forEach(i=>b.m.forEach(j=>ds.push(dist(HP[i],HP[j]))));return link=='single'?Math.min(...ds):link=='complete'?Math.max(...ds):avg(ds)};\nwhile(cl.length>1){let bi=0,bj=1,bd=1e9;for(let i=0;i\u003ccl.length;i++)for(let j=i+1;j\u003ccl.length;j++){const d=cd(cl[i],cl[j]);if(d\u003cbd){bd=d;bi=i;bj=j}}\nconst a=cl[bi],b=cl[bj],nc={id:nid++,m:[...a.m,...b.m],l:a,r:b,h:bd};cl=cl.filter((_,k)=>k!=bi&&k!=bj);cl.push(nc)}return cl[0]}\nfunction dHc(){const root=agg($('#hl').value),cut=+$('#hcut').value/100*root.h,n=HP.length,lab=Array(n).fill(0);let nc=0;\nconst asg=nd=>{if(!nd.l||nd.h\u003c=cut){nd.m.forEach(i=>lab[i]=nc);nc++}else{asg(nd.l);asg(nd.r)}};asg(root);\nconst F=fr2(HA,R,R),x=HA.x;HP.forEach((p,i)=>dotc(x,F.X(p[0]),F.Y(p[1]),PAL[lab[i]%6],8));\nconst W=HB.W,H=HB.H,y=HB.x;y.clearRect(0,0,W,H);let pos=0;const xp={};\nconst lay=nd=>{if(!nd.l){xp[nd.id]=30+pos++*(W-50)/(n-1);return}lay(nd.l);lay(nd.r);xp[nd.id]=(xp[nd.l.id]+xp[nd.r.id])/2};lay(root);\nconst Y=h=>H-25-h/root.h*(H-50),line=(x1,y1,x2,y2,c)=>{y.strokeStyle=c;y.lineWidth=2.5;y.beginPath();y.moveTo(x1,y1);y.lineTo(x2,y2);y.stroke()};\nconst col=nd=>nd.h\u003c=cut?PAL[lab[nd.m[0]]%6]:C('--mut');\nconst draw=nd=>{if(!nd.l)return;[nd.l,nd.r].forEach(c=>{line(xp[c.id],Y(c.h),xp[c.id],Y(nd.h),col(nd));draw(c)});line(xp[nd.l.id],Y(nd.h),xp[nd.r.id],Y(nd.h),col(nd))};draw(root);\nHP.forEach((p,i)=>dotc(y,xp[i],H-18,PAL[lab[i]%6],5));\ny.setLineDash([7,5]);y.strokeStyle=C('--fg');y.lineWidth=2;y.beginPath();y.moveTo(20,Y(cut));y.lineTo(W-10,Y(cut));y.stroke();y.setLineDash([]);y.fillStyle=C('--fg');y.font='13px sans-serif';y.fillText('cut',W-34,Y(cut)-6);\n$('#hco').innerHTML=`cut height ${cut.toFixed(2)} → \u003cb>${nc}\u003c/b> clusters (coloured). Raise the cut: fewer, bigger clusters. Lower it: more, smaller ones.`}\n$('#hl').onchange=$('#hcut').oninput=dHc;\n/* ---- DBSCAN ---- */\nconst MD=[];for(let i=0;i\u003c40;i++){const t=Math.PI*i/39;MD.push([Math.cos(t)+gn()*.07,Math.sin(t)+gn()*.07]);MD.push([1-Math.cos(t)+gn()*.07,.45-Math.sin(t)+gn()*.07])}\nfor(let i=0;i\u003c8;i++)MD.push([rnd()*4-1.5,rnd()*3-1.2]);\nconst MKM=kmFull(MD,2).asg,DB=mk('#db');\nfunction dbscan(Pt,eps,mp){const n=Pt.length,lab=Array(n).fill(-2),nb=i=>{const r=[];for(let j=0;j\u003cn;j++)if(dist(Pt[i],Pt[j])\u003c=eps)r.push(j);return r},core=Pt.map((_,i)=>nb(i).length>=mp);let c=-1;\nfor(let i=0;i\u003cn;i++){if(lab[i]!=-2||!core[i])continue;c++;lab[i]=c;const q=[i];while(q.length){const u=q.pop();nb(u).forEach(v=>{if(lab[v]==-2){lab[v]=c;if(core[v])q.push(v)}})}}\nreturn{lab:lab.map(v=>v==-2?-1:v),core,c:c+1}}\nfunction dDb(){const eps=+$('#de').value,mp=+$('#dm').value,km=$('#da').value=='km';$('#dev').textContent=eps.toFixed(2);$('#dmv').textContent=mp;\nconst r=km?{lab:MKM,core:MD.map(()=>false),c:2}:dbscan(MD,eps,mp),F=fr(DB,[-1.5,2.5],[-1.2,1.7],'feature 1','feature 2'),x=DB.x;let noise=0;\nMD.forEach((p,i)=>{const X=F.X(p[0]),Y=F.Y(p[1]);if(r.lab[i]\u003c0){noise++;x.strokeStyle=C('--mut');x.lineWidth=2.5;x.beginPath();x.moveTo(X-5,Y-5);x.lineTo(X+5,Y+5);x.moveTo(X+5,Y-5);x.lineTo(X-5,Y+5);x.stroke()}else dotc(x,X,Y,PAL[r.lab[i]%6],r.core[i]?7:4.5)});\nif(km)r.cent=null;$('#dbo').innerHTML=km?'K-Means (K=2) splits the data with a straight boundary: \u003cb>wrong shapes\u003c/b>.':`eps ${eps.toFixed(2)}, minPts ${mp} → \u003cb>${r.c}\u003c/b> clusters, \u003cb>${noise}\u003c/b> noise points`}\n$('#de').oninput=$('#dm').oninput=$('#da').onchange=dDb;\nfunction redraw(){dH();dK();dQ();dHc();dDb()}\nkInit();setTheme('galaxy');\n\u003c/script>\u003c/body>\u003c/html>", "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>ML from Zero: PCA and a Complete Project (Day 28-29)\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*{box-sizing:border-box}\nbody{margin:0;font:16px/1.65 'Space Grotesk',system-ui,sans-serif;color:var(--fg);background:var(--bg) fixed;transition:color .4s}\nbody[data-theme=galaxy]{--bg:linear-gradient(160deg,#0b0620,#1a1050 60%,#0a2050);--fg:#eeeaff;--mut:#b4acd9;--card:rgba(20,12,60,.66);--acc:#b388ff;--acc2:#5ec8ff;--line:rgba(200,190,255,.35)}\nbody[data-theme=blackhole]{--bg:radial-gradient(circle at 72% 30%,#1a0c04,#000 60%);--fg:#fff3e6;--mut:#d8b79a;--card:rgba(15,8,4,.72);--acc:#ff9a2e;--acc2:#fff1b0;--line:rgba(255,170,90,.35)}\nbody[data-theme=supernova]{--bg:radial-gradient(circle at 50% 40%,#4a0d05,#16030a 70%);--fg:#fff1e0;--mut:#f2b98f;--card:rgba(40,6,4,.7);--acc:#ff5a2a;--acc2:#ffd23f;--line:rgba(255,150,80,.4)}\nbody[data-theme=aurora]{--bg:linear-gradient(180deg,#02121a,#06302f 70%,#0a3a3a);--fg:#e8fff6;--mut:#9fd9c6;--card:rgba(2,28,30,.68);--acc:#4dffa6;--acc2:#4de1ff;--line:rgba(120,255,200,.35)}\nbody[data-theme=neon]{--bg:linear-gradient(180deg,#0a0016,#1a0033);--fg:#f4f0ff;--mut:#c5a8ee;--card:rgba(14,2,32,.74);--acc:#ff2fa8;--acc2:#2ff3ff;--line:rgba(255,80,200,.45)}\nbody[data-theme=ocean]{--bg:linear-gradient(180deg,#02142e,#012a5a 60%,#00162b);--fg:#e6f6ff;--mut:#9cc8e6;--card:rgba(2,24,56,.7);--acc:#35e0d0;--acc2:#7fb8ff;--line:rgba(120,210,255,.38)}\nbody[data-theme=sunset]{--bg:linear-gradient(180deg,#2a0b4d,#a1275f 55%,#ff9152);--fg:#fff7f0;--mut:#ffd9c2;--card:rgba(50,10,60,.68);--acc:#ffc24d;--acc2:#7ff0ff;--line:rgba(255,220,190,.45)}\nbody[data-theme=paper]{--bg:#fdfdfe;--fg:#1c2230;--mut:#5a6478;--card:rgba(255,255,255,.92);--acc:#2457d6;--acc2:#d6245e;--line:rgba(30,40,70,.25)}\n#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}\nheader.top{position:sticky;top:0;z-index:5;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--card);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}\nheader.top b{margin-right:6px}\nheader.top button{font:inherit;font-size:13px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer}\nheader.top button.on{background:var(--acc);color:#000;border-color:var(--acc);font-weight:700}\nmain{max-width:980px;margin:0 auto;padding:18px 14px 80px}\nh1{font-size:clamp(30px,6vw,54px);line-height:1.1;margin:30px 0 8px}\nh2{font-size:clamp(24px,4vw,34px);margin:50px 0 6px;color:var(--acc)}\nh3{font-size:19px;margin:0 0 6px}\np{margin:6px 0}.mut{color:var(--mut)}\nsection.c{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:16px 0}\n.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n@media(max-width:760px){.g2{grid-template-columns:1fr}}\ncanvas.s{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px}\n.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:8px 0}\n.ctl label{font-size:14px;display:flex;gap:8px;align-items:center}\ninput[type=range]{accent-color:var(--acc);width:150px}\nbutton.b{font:inherit;font-size:14px;padding:6px 14px;border-radius:8px;border:1px solid var(--acc);background:transparent;color:var(--fg);cursor:pointer}\nbutton.b:hover{background:var(--acc);color:#000}\n.out{font-size:15px;padding:6px 10px;border-left:3px solid var(--acc2);background:rgba(127,127,127,.12);border-radius:4px;margin-top:6px}\n.eq{font-size:22px;text-align:center;padding:10px;border:1px dashed var(--line);border-radius:10px;margin:10px 0}\n.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0}\n.flow span.n{padding:8px 12px;border:1px solid var(--line);border-radius:10px;transition:.3s;text-align:center;font-size:14px}\n.flow span.n.hi{background:var(--acc);color:#000;transform:scale(1.08);border-color:var(--acc)}\n.flow i{color:var(--acc2);font-style:normal}\npre{background:rgba(0,0,0,.45);color:#e8ecff;padding:12px;border-radius:10px;overflow-x:auto;font-size:13px;line-height:1.5;margin:8px 0}\nbody[data-theme=paper] pre{background:#f0f3fa;color:#1c2230}\n.bar{height:22px;border-radius:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .25s;min-width:2px}\n.row{display:flex;align-items:center;gap:10px;margin:5px 0;font-size:14px}.row b{width:48px}\n.tip{border-left:4px solid var(--acc);padding:6px 12px;margin:8px 0;background:rgba(127,127,127,.12);border-radius:4px}\ntable{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid var(--line);padding:6px 8px;text-align:left}\na{color:var(--acc2)}code{background:rgba(127,127,127,.2);padding:1px 5px;border-radius:4px}select{font:inherit;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:3px}html{scroll-behavior:smooth}\u003c/style>\u003c/head>\n\u003cbody data-theme=\"galaxy\">\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cheader class=\"top\">\u003cb>Theme\u003c/b>\u003cspan id=\"th\" style=\"display:contents\">\u003c/span>\u003c/header>\n\u003cmain>\n\u003ch1>Days 28 and 29: Shrink the Data, Then Build a Whole Project\u003c/h1>\n\u003cp class=\"mut\">Zero-level notes. Day 28: PCA and dimensionality reduction. Day 29: a complete ML project on \u003cb>network intrusion detection\u003c/b>. Jump to:\n\u003ca href=\"#d28\">Day 28 PCA\u003c/a> &nbsp; \u003ca href=\"#d29\">Day 29 Complete ML Project\u003c/a>\u003c/p>\n\n\u003ch2 id=\"d28\">Day 28: PCA and Dimensionality Reduction\u003c/h2>\n\u003csection class=\"c\">\u003ch3>1. Dimensionality and the curse of dimensionality\u003c/h3>\n\u003cp>\u003cb>Dimensionality\u003c/b> = number of features (columns). 2 features = a flat plane, 100 features = a 100-dimensional space we cannot picture. Problem: as dimensions grow, data becomes \u003cb>sparse\u003c/b> and all points look equally far apart, so distance-based models (KNN, K-Means) lose meaning.\u003c/p>\n\u003ccanvas class=\"s\" id=\"c1\" width=\"640\" height=\"300\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>number of features \u003cinput type=\"range\" id=\"cd\" min=\"1\" max=\"200\" value=\"2\"> \u003cb id=\"cdv\">2\u003c/b>\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"co\">\u003c/div>\n\u003cp class=\"tip\">Each bar counts pairs of random points at that distance (distance ÷ the average). With 1 or 2 features the distances are spread out. With 200 features they squeeze into one narrow spike: nearest and farthest points look almost the same. Fix: reduce the dimensions.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>2. PCA idea: find the direction with the most spread\u003c/h3>\n\u003cp>PCA looks for a new axis along which the data varies \u003cb>most\u003c/b> (maximum \u003cb>variance\u003c/b>). Project every point onto that axis and you keep the most information with the fewest numbers. Rotate the line and watch.\u003c/p>\n\u003ccanvas class=\"s\" id=\"p1\" width=\"640\" height=\"400\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>line angle \u003cinput type=\"range\" id=\"pa\" min=\"0\" max=\"180\" value=\"20\"> \u003cb id=\"pav\">\u003c/b>\u003c/label>\u003cbutton class=\"b\" id=\"pb\">Find PC1\u003c/button>\u003cbutton class=\"b\" id=\"pr\">Auto-rotate\u003c/button>\u003c/div>\n\u003cdiv class=\"out\" id=\"po\">\u003c/div>\n\u003cp class=\"tip\">Dots = data. Coloured dots on the line = the projections (we throw away the distance from the line). Dashed segments = information lost. The best line (PC1) has the \u003cb>largest variance kept\u003c/b> and the \u003cb>smallest loss\u003c/b>. Press \"Find PC1\".\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>3. Principal components, eigenvectors and eigenvalues\u003c/h3>\n\u003cdiv class=\"g2\">\u003cdiv class=\"eq\" style=\"font-size:16px\">Covariance matrix Σ (how features vary together)\u003c/div>\u003cdiv class=\"eq\" style=\"font-size:16px\">Σ · v = λ · v\u003cbr>\u003cspan class=\"mut\" style=\"font-size:13px\">v = eigenvector (a direction), λ = eigenvalue (variance along it)\u003c/span>\u003c/div>\u003c/div>\n\u003ccanvas class=\"s\" id=\"p2\" width=\"640\" height=\"400\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>rotate into principal axes \u003cinput type=\"range\" id=\"pm\" min=\"0\" max=\"100\" value=\"0\">\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"pe\">\u003c/div>\n\u003cp class=\"tip\">PC1 and PC2 are the eigenvectors of the covariance matrix, and they are always perpendicular. A bigger eigenvalue = more variance on that axis. Slide right: the whole cloud rotates so PC1 becomes the horizontal axis. \u003cb>Dimensionality reduction = keep PC1, drop PC2.\u003c/b>\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>4. How many components to keep? (scree plot)\u003c/h3>\n\u003cp>6 features generated from 2 hidden factors, then standardized. PCA is computed live in your browser (eigenvalues of the correlation matrix).\u003c/p>\n\u003ccanvas class=\"s\" id=\"p3\" width=\"640\" height=\"320\">\u003c/canvas>\n\u003cdiv class=\"ctl\">\u003clabel>components kept \u003cinput type=\"range\" id=\"pk\" min=\"1\" max=\"6\" value=\"2\"> \u003cb id=\"pkv\">\u003c/b>\u003c/label>\u003c/div>\n\u003cdiv class=\"out\" id=\"pq\">\u003c/div>\n\u003cp class=\"tip\">Bars = variance explained by each component. Line = cumulative. Pick the elbow, or enough components to reach about 95%. Here 2 components hold most of the information of 6 features.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>5. Code: PCA with NumPy and sklearn\u003c/h3>\n\u003cpre>import numpy as np\nfrom sklearn.datasets import load_breast_cancer\nfrom sklearn.preprocessing import StandardScaler\nfrom sklearn.decomposition import PCA\n\nX = StandardScaler().fit_transform(load_breast_cancer().data)      # ALWAYS scale before PCA\n\n# ---- NumPy, step by step ----\nXc = X - X.mean(axis=0)                       # 1 centre the data\ncov = np.cov(Xc, rowvar=False)                # 2 covariance matrix (30 x 30)\nvals, vecs = np.linalg.eigh(cov)              # 3 eigenvalues and eigenvectors\norder = np.argsort(vals)[::-1]                # 4 sort biggest variance first\nvals, vecs = vals[order], vecs[:, order]\nratio = vals / vals.sum()                     # variance explained per component\nZ_np = Xc @ vecs[:, :2]                       # 5 project onto the top 2 components\n\n# ---- sklearn ----\npca = PCA(n_components=2).fit(X)\nZ_sk = pca.transform(X)\nprint(pca.explained_variance_ratio_, ratio[:2])\nprint(np.allclose(np.abs(Z_np), np.abs(Z_sk)))   # same result (signs may flip)\n\n# keep enough components for 95% of the variance\npca95 = PCA(n_components=0.95).fit(X)\nprint(\"components for 95%:\", pca95.n_components_)\u003c/pre>\n\u003ctable>\u003ctr>\u003cth>Use PCA to\u003c/th>\u003cth>Careful\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>speed up models, fight the curse, remove multicollinearity, visualize in 2D\u003c/td>\u003ctd>scale first; components are harder to interpret; only captures linear structure; fit on train data only\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\n\u003ch2 id=\"d29\">Day 29: Complete ML Project: Intrusion Detection\u003c/h2>\n\u003csection class=\"c\">\u003ch3>The roadmap (click a step)\u003c/h3>\n\u003cdiv class=\"flow\" id=\"rm\">\u003c/div>\n\u003cdiv class=\"out\" id=\"rmc\" style=\"min-height:48px\">\u003c/div>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>1. Problem definition\u003c/h3>\n\u003ctable>\u003ctr>\u003cth>Question\u003c/th>\u003cth>Answer for intrusion detection\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>What are we predicting?\u003c/td>\u003ctd>Is a network connection \u003cb>normal\u003c/b> or an \u003cb>attack\u003c/b>? (binary classification)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Features\u003c/td>\u003ctd>duration, bytes sent, failed logins, connections to the same host, protocol…\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Costly mistake\u003c/td>\u003ctd>\u003cb>Missed attack (FN)\u003c/b> = a breach. False alarm (FP) = wasted analyst time. So we care most about \u003cb>recall\u003c/b>, with decent precision, F1 and PR-AUC.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Trap\u003c/td>\u003ctd>Attacks are rare, so \u003cb>accuracy is misleading\u003c/b> (Day 24).\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>2. EDA: look before you model\u003c/h3>\n\u003cp>The data below is a \u003cb>synthetic\u003c/b> stand-in built for this page: 800 connections, about 20% attacks (DoS floods, brute-force logins, port probes) mixed with normal traffic.\u003c/p>\n\u003cdiv id=\"eb\" style=\"margin:6px 0\">\u003c/div>\n\u003cdiv class=\"ctl\">\u003clabel>feature \u003cselect id=\"ef\">\u003coption value=\"3\">conn_count (connections to same host)\u003c/option>\u003coption value=\"1\">log10 src_bytes\u003c/option>\u003coption value=\"0\">duration (s, capped at 20)\u003c/option>\u003coption value=\"2\">failed_logins\u003c/option>\u003c/select>\u003c/label>\u003c/div>\n\u003ccanvas class=\"s\" id=\"e1\" width=\"640\" height=\"300\">\u003c/canvas>\n\u003cp class=\"tip\">Overlapping histograms: where the two colours separate, the feature is useful. Normal traffic has few connections to a host, attacks (DoS) have hundreds. Failed logins separate brute-force attacks. No single feature separates everything, so we need a model.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>3. Cleaning\u003c/h3>\n\u003cdiv id=\"ei\">\u003c/div>\n\u003cp class=\"tip\">Rule: duplicates → drop. Missing numbers → fill with the median (computed on training data in a real pipeline). Check for impossible values too (negative bytes, duration of years).\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>4. Feature engineering, split, scaling\u003c/h3>\n\u003cdiv class=\"g2\">\u003cdiv>\u003cp>\u003cb>New features:\u003c/b>\u003c/p>\u003cp>• \u003ccode>log10 bytes_per_sec\u003c/code> = bytes ÷ (duration+1)\u003cbr>• \u003ccode>many_conn\u003c/code> = conn_count &gt; 100\u003cbr>• protocol → one-hot (tcp, udp, icmp)\u003cbr>• log of src_bytes (tames huge values)\u003c/p>\u003c/div>\n\u003cdiv>\u003cp>\u003cb>Split and scale (order matters):\u003c/b>\u003c/p>\u003cdiv class=\"flow\" style=\"justify-content:flex-start\">\u003cspan class=\"n\">stratified split 70/30\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">fit scaler on TRAIN only\u003c/span>\u003ci>→\u003c/i>\u003cspan class=\"n\">apply to train and test\u003c/span>\u003c/div>\u003cp class=\"mut\" style=\"font-size:14px\">Scaling matters for Logistic Regression. Trees, Random Forest and XGBoost don't need it.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>5. Train 4 models and compare\u003c/h3>\n\u003cp>This runs \u003cb>real training in your browser\u003c/b> on the synthetic data: Logistic Regression, Decision Tree (depth 5), Random Forest (25 trees), and Gradient Boosting (40 small trees, the idea behind XGBoost). All are scored on the held-out 30% test set.\u003c/p>\n\u003cdiv class=\"ctl\">\u003clabel>\u003cinput type=\"checkbox\" id=\"fe\"> add engineered features\u003c/label>\u003cbutton class=\"b\" id=\"tr\">Train all 4 models\u003c/button>\u003cspan id=\"ms\" class=\"mut\">\u003c/span>\u003c/div>\n\u003cdiv id=\"mr\" style=\"overflow-x:auto\">\u003c/div>\n\u003cdiv class=\"g2\" style=\"margin-top:10px\">\u003cdiv>\u003ccanvas class=\"s\" id=\"m1\" width=\"440\" height=\"340\">\u003c/canvas>\u003c/div>\u003cdiv>\u003cb>Random Forest: which features mattered?\u003c/b>\u003cdiv id=\"mi\" style=\"margin-top:6px\">\u003c/div>\u003c/div>\u003c/div>\n\u003cp class=\"tip\">Compare \u003cb>recall\u003c/b> and \u003cb>FN (missed attacks)\u003c/b>, not only accuracy. Tick the engineered-features box and train again to see whether the new features helped. Results come from this one random split; in a real project use cross-validation and tune hyperparameters (Day 26). Pick the model that best fits the problem's costs, then lock the test set.\u003c/p>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>6. Code: the full project (KDD Cup 99 network data)\u003c/h3>\n\u003cpre>import numpy as np, pandas as pd\nfrom sklearn.datasets import fetch_kddcup99\nfrom sklearn.model_selection import train_test_split\nfrom sklearn.compose import ColumnTransformer\nfrom sklearn.pipeline import Pipeline\nfrom sklearn.preprocessing import StandardScaler, OneHotEncoder\nfrom sklearn.linear_model import LogisticRegression\nfrom sklearn.tree import DecisionTreeClassifier\nfrom sklearn.ensemble import RandomForestClassifier\nfrom sklearn.metrics import classification_report, roc_auc_score, average_precision_score, confusion_matrix\nfrom xgboost import XGBClassifier\n\n# 1) problem + load: 0 = normal, 1 = attack\nraw = fetch_kddcup99(subset=\"SA\", as_frame=True).frame        # mostly normal traffic, few attacks\ny = (~raw[\"labels\"].astype(str).str.contains(\"normal\")).astype(int)\nX = raw.drop(columns=[\"labels\"])\ncat_cols = [\"protocol_type\", \"service\", \"flag\"]\nnum_cols = [c for c in X.columns if c not in cat_cols]\nX[num_cols] = X[num_cols].apply(pd.to_numeric)\n\n# 2) EDA\nprint(y.value_counts(normalize=True)); print(X.describe().T.head(10))\n\n# 3) cleaning\nkeep = ~X.duplicated(); X, y = X[keep], y[keep]\nprint(\"missing values:\", X.isna().sum().sum())\n\n# 4) feature engineering\nX[\"log_src_bytes\"] = np.log1p(X[\"src_bytes\"])\nX[\"bytes_ratio\"] = X[\"src_bytes\"] / (X[\"dst_bytes\"] + 1)\nX[\"many_conn\"] = (X[\"count\"] > 100).astype(int)\nnum_cols += [\"log_src_bytes\", \"bytes_ratio\", \"many_conn\"]\n\n# 5) split first, then scale/encode inside the pipeline (no leakage)\nXtr, Xte, ytr, yte = train_test_split(X, y, test_size=0.2, stratify=y, random_state=1)\nprep = ColumnTransformer([(\"num\", StandardScaler(), num_cols),\n                          (\"cat\", OneHotEncoder(handle_unknown=\"ignore\"), cat_cols)])\n\n# 6) train + 7) evaluate + 8) compare\npos_weight = (ytr == 0).sum() / (ytr == 1).sum()\nmodels = {\"Logistic Regression\": LogisticRegression(max_iter=1000, class_weight=\"balanced\"),\n          \"Decision Tree\":       DecisionTreeClassifier(max_depth=8, class_weight=\"balanced\", random_state=1),\n          \"Random Forest\":       RandomForestClassifier(n_estimators=200, class_weight=\"balanced\", n_jobs=-1, random_state=1),\n          \"XGBoost\":             XGBClassifier(n_estimators=300, learning_rate=0.1, max_depth=5,\n                                               scale_pos_weight=pos_weight, eval_metric=\"logloss\", random_state=1)}\nfor name, m in models.items():\n    pipe = Pipeline([(\"prep\", prep), (\"model\", m)]).fit(Xtr, ytr)\n    proba = pipe.predict_proba(Xte)[:, 1]\n    print(\"=====\", name, \"| ROC-AUC\", round(roc_auc_score(yte, proba), 4),\n          \"| PR-AUC\", round(average_precision_score(yte, proba), 4))\n    print(confusion_matrix(yte, pipe.predict(Xte)))\n    print(classification_report(yte, pipe.predict(Xte), digits=3))\n\n# 9) save the best (example)\n# import joblib; joblib.dump(best_pipe, \"ids_model.joblib\")\u003c/pre>\u003c/section>\n\n\u003csection class=\"c\">\u003ch3>Final checklist\u003c/h3>\n\u003ctable>\u003ctr>\u003cth>Stage\u003c/th>\u003cth>Did you…\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Problem\u003c/td>\u003ctd>choose a metric that matches the cost of mistakes?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>EDA + cleaning\u003c/td>\u003ctd>check balance, missing values, duplicates, outliers?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Features\u003c/td>\u003ctd>add useful features and avoid leakage (split before scaling)?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Models\u003c/td>\u003ctd>start with a simple baseline, then try stronger ones?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Evaluation\u003c/td>\u003ctd>use cross-validation, look at recall, FN and PR-AUC, and touch the test set once?\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>After\u003c/td>\u003ctd>tune, choose a threshold by cost, save the pipeline, monitor for drift (new attack types)?\u003c/td>\u003c/tr>\u003c/table>\u003c/section>\n\u003c/main>\n\u003cscript>\nconst $=s=>document.querySelector(s),C=n=>getComputedStyle(document.body).getPropertyValue(n).trim();\nconst P=id=>{const c=$(id);return{x:c.getContext('2d'),W:c.width,H:c.height}};\nfunction fr(p,xr,yr,xl,yl){const{x,W,H}=p,m=38;x.clearRect(0,0,W,H);\nconst X=v=>m+(v-xr[0])/(xr[1]-xr[0])*(W-m-12),Y=v=>H-m-(v-yr[0])/(yr[1]-yr[0])*(H-m-12);\nx.strokeStyle=C('--line');x.fillStyle=C('--mut');x.lineWidth=1;x.font='12px sans-serif';x.setLineDash([]);\nx.beginPath();x.moveTo(m,8);x.lineTo(m,H-m);x.lineTo(W-8,H-m);x.stroke();\nx.fillText(xl,W/2-30,H-10);x.save();x.translate(13,H/2+20);x.rotate(-Math.PI/2);x.fillText(yl,0,0);x.restore();\nreturn{X,Y,m}}\nconst clip=(p,m)=>{p.x.save();p.x.beginPath();p.x.rect(m,8,p.W-m-8,p.H-m-8);p.x.clip()};\n/* ---- themes + background ---- */\nconst TH=[['galaxy','Galaxy'],['blackhole','Black Hole'],['supernova','Supernova'],['aurora','Aurora'],['neon','Cyberpunk Neon'],['ocean','Deep Ocean'],['sunset','Sunset Retro'],['paper','Light Paper']];\nfunction setTheme(k){document.body.dataset.theme=k; ;\ncand.forEach(t=>{let nl=0,sl=0;S.forEach(d=>{if(d.x[f]\u003ct){nl++;sl+=T(d)}});const nr=n-nl;if(nl\u003c2||nr\u003c2)return;const sr=st-sl,\ncost=g?nl*2*(sl/nl)*(1-sl/nl)+nr*2*(sr/nr)*(1-sr/nr):-(sl*sl/nl+sr*sr/nr);if(!best||cost\u003cbest.c)best={c:cost,f,t}})});\nif(!best)return{v:o.leaf(S)};const L=S.filter(d=>d.x[best.f]\u003cbest.t),Rr=S.filter(d=>d.x[best.f]>=best.t);\nif(o.imp&&g){const gs=a=>{const p=avg(a.map(d=>d.y));return a.length*2*p*(1-p)};o.imp[best.f]+=gs(S)-gs(L)-gs(Rr)}\nreturn{f:best.f,t:best.t,l:build(L,dp-1,o),r:build(Rr,dp-1,o)}}\nconst pred=(T,x)=>{while(T.v===undefined)T=x[T.f]\u003cT.t?T.l:T.r;return T.v},sig=z=>1/(1+Math.exp(-z)),pr1=S=>avg(S.map(d=>d.y));\nfunction logreg(tr,te){const nf=tr[0].x.length,mu=[],sg=[];for(let f=0;f\u003cnf;f++){const c=tr.map(d=>d.x[f]);mu.push(avg(c));sg.push(Math.sqrt(avg(c.map(v=>(v-mu[f])**2)))+1e-9)}\nconst z=d=>d.x.map((v,f)=>(v-mu[f])/sg[f]),A=tr.map(z),w=Array(nf).fill(0);let b=0;\nfor(let it=0;it\u003c400;it++){const gw=Array(nf).fill(0);let gb=0;A.forEach((a,i)=>{let s=b;a.forEach((v,f)=>s+=w[f]*v);const e=sig(s)-tr[i].y;a.forEach((v,f)=>gw[f]+=e*v);gb+=e});w.forEach((_,f)=>w[f]-=.3*(gw[f]/A.length+.001*w[f]));b-=.3*gb/A.length}\nreturn te.map(d=>{const a=z(d);let s=b;a.forEach((v,f)=>s+=w[f]*v);return sig(s)})}\nfunction forest(tr,te,imp){const nf=tr[0].x.length,Ts=[];for(let k=0;k\u003c25;k++){const bs=tr.map(()=>tr[Math.floor(rnd()*tr.length)]);Ts.push(build(bs,7,{crit:'gini',leaf:pr1,mf:Math.max(2,Math.round(Math.sqrt(nf))),imp}))}return te.map(d=>avg(Ts.map(T=>pred(T,d.x))))}\nfunction boost(tr,te){const r0=pr1(tr),F0=Math.log(r0/(1-r0));const Ft=tr.map(()=>F0),Fe=te.map(()=>F0);\nfor(let m=0;m\u003c40;m++){const S=tr.map((d,i)=>{const p=sig(Ft[i]);return{x:d.x,i,r:d.y-p,h:p*(1-p)+1e-6}});\nconst T=build(S,3,{crit:'sse',leaf:A=>A.reduce((s,d)=>s+d.r,0)/A.reduce((s,d)=>s+d.h,0)});S.forEach(d=>Ft[d.i]+=.3*pred(T,d.x));te.forEach((d,i)=>Fe[i]+=.3*pred(T,d.x))}return Fe.map(sig)}\nfunction met(p,Y){let tp=0,fp=0,fn=0,tn=0;p.forEach((s,i)=>{const q=s>=.5;Y[i]?(q?tp++:fn++):(q?fp++:tn++)});const pre=tp+fp?tp/(tp+fp):0,rec=tp/(tp+fn),f1=pre+rec?2*pre*rec/(pre+rec):0,P=tp+fn,N=tn+fp;\nconst o=p.map((s,i)=>[s,Y[i]]).sort((a,b)=>b[0]-a[0]),roc=[[0,0]];let a=0,b=0,auc=0;o.forEach((q,i)=>{q[1]?a++:b++;if(i==o.length-1||o[i+1][0]!=q[0]){const pt=[b/N,a/P],l=roc[roc.length-1];auc+=(pt[0]-l[0])*(pt[1]+l[1])/2;roc.push(pt)}});\nreturn{acc:(tp+tn)/Y.length,pre,rec,f1,auc,roc,fn,fp}}\n/* ---- run models ---- */\nlet RES=null;const MN=['Logistic Regression','Decision Tree','Random Forest','Gradient Boosting (XGBoost-style)'];\nfunction run(){const eng=$('#fe').checked,mkd=I=>I.map(i=>({x:fv(CL[i],eng),y:CL[i].y})),tr=mkd(TRI),te=mkd(TEI),Y=te.map(d=>d.y),nf=tr[0].x.length,imp=Array(nf).fill(0);\nconst dt=build(tr,5,{crit:'gini',leaf:pr1});\nconst ps=[logreg(tr,te),te.map(d=>pred(dt,d.x)),forest(tr,te,imp),boost(tr,te)];\nconst it=imp.reduce((a,b)=>a+b)||1;RES={m:ps.map(p=>met(p,Y)),imp:imp.map(v=>v/it),names:eng?[...FB,...FE]:FB};dM()}\nfunction dM(){if(!RES)return;const M=RES.m,cols=[['Accuracy','acc'],['Precision','pre'],['Recall','rec'],['F1','f1'],['ROC-AUC','auc']];\nconst best=k=>Math.max(...M.map(m=>m[k])),low=k=>Math.min(...M.map(m=>m[k])),bar=v=>`background:linear-gradient(90deg,color-mix(in srgb,var(--acc2) 45%,transparent) ${v*100}%,transparent ${v*100}%)`;\n$('#mr').innerHTML='\u003ctable>\u003ctr>\u003cth>Model\u003c/th>'+cols.map(c=>`\u003cth>${c[0]}\u003c/th>`).join('')+'\u003cth>Missed attacks (FN)\u003c/th>\u003cth>False alarms (FP)\u003c/th>\u003c/tr>'+M.map((m,i)=>`\u003ctr>\u003ctd>\u003cspan style=\"color:${PAL[i]}\">■\u003c/span> ${MN[i]}\u003c/td>`+cols.map(([n,k])=>`\u003ctd style=\"${bar(m[k])}\">${m[k]==best(k)?'\u003cb>':''}${(m[k]*100).toFixed(1)}%${m[k]==best(k)?'\u003c/b>':''}\u003c/td>`).join('')+`\u003ctd>${m.fn==low('fn')?'\u003cb>'+m.fn+'\u003c/b>':m.fn}\u003c/td>\u003ctd>${m.fp==low('fp')?'\u003cb>'+m.fp+'\u003c/b>':m.fp}\u003c/td>\u003c/tr>`).join('')+`\u003c/table>\u003cp class=\"mut\" style=\"font-size:13px;margin:4px 0\">Test set: ${TEI.length} connections, ${CL.filter((r,i)=>r.y&&TEI.includes(i)).length} attacks. Bold = best in column.\u003c/p>`;\nconst F=fr(MR,[0,1],[0,1],'False Positive Rate','True Positive Rate'),x=MR.x;x.setLineDash([6,5]);path(x,F,[[0,0],[1,1]],'--mut',1.5);x.setLineDash([]);\nM.forEach((m,i)=>{path(x,F,m.roc,PAL[i],2.5);x.fillStyle=PAL[i];x.font='12px sans-serif';x.fillText('■ '+MN[i].split(' (')[0],F.X(.38),F.Y(.27-.07*i))});\nconst ord=RES.names.map((n,i)=>[n,RES.imp[i]]).sort((a,b)=>b[1]-a[1]);$('#mi').innerHTML=ord.map(([n,v])=>`\u003cdiv class=\"row\">\u003cb style=\"width:150px;font-size:13px\">${n}\u003c/b>\u003cdiv style=\"flex:1\">\u003cdiv class=\"bar\" style=\"width:${v*100/ord[0][1]}%\">\u003c/div>\u003c/div>\u003cspan style=\"width:44px\">${(v*100).toFixed(0)}%\u003c/span>\u003c/div>`).join('')}\nconst MR=mk('#m1');\n$('#tr').onclick=()=>{$('#ms').textContent='training…';setTimeout(()=>{run();$('#ms').textContent='done'},30)};\nfunction redraw(){dCu();dPr();dMo();dSc();dRm();dEb();dHi();dIss();dM()}\nsetTheme('galaxy');setTimeout(()=>$('#tr').onclick(),150);\n\u003c/script>\u003c/body>\u003c/html>", "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>ML from Zero: Day 30 Final Integration and Revision\u003c/title>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n*{box-sizing:border-box}\nbody{margin:0;font:16px/1.65 'Space Grotesk',system-ui,sans-serif;color:var(--fg);background:var(--bg) fixed;transition:color .4s}\nbody[data-theme=galaxy]{--bg:linear-gradient(160deg,#0b0620,#1a1050 60%,#0a2050);--fg:#eeea
