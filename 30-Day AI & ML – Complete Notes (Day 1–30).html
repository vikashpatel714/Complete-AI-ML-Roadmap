ths on existing columns, for every row at once.\"]};\n$('#ops').innerHTML=['head','info','describe','filter','sort','groupby','new column'].map(k=>`\u003cbutton>${k}\u003c/button>`).join('');\nconst KS=Object.keys(OP);\ndocument.querySelectorAll('#ops button').forEach((b,i)=>b.onclick=()=>{document.querySelectorAll('#ops button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const r=OP[KS[i]]();$('#code').textContent=KS[i];const o=$('#out');o.innerHTML=r[0];o.classList.remove('an');void o.offsetWidth;o.classList.add('an');$('#note').textContent=r[1]});\ndocument.querySelector('#ops button').click();\n\n/* statistics lab */\nfunction run(){\n const a=$('#inp').value.split(/[,\\s]+/).filter(x=>x!=='').map(Number).filter(Number.isFinite).slice(0,15);\n if(a.length\u003c2){$('#kk').innerHTML='\u003cp>Enter at least 2 numbers.\u003c/p>';return}\n const n=a.length,s=[...a].sort((x,y)=>x-y),m=sum(a)/n,med=qt(s,.5),cnt={};a.forEach(v=>cnt[v]=(cnt[v]||0)+1);\n const mx=Math.max(...Object.values(cnt)),mode=mx==1?'none':Object.keys(cnt).filter(k=>cnt[k]==mx).join(', '),ss=sum(a.map(x=>(x-m)**2)),vp=ss/n,sdp=Math.sqrt(vp),sds=Math.sqrt(ss/(n-1)),q1=qt(s,.25),q3=qt(s,.75),iq=q3-q1,p=+$('#pc').value,pv=qt(s,p/100);\n $('#pv').textContent=p;\n const mi=n%2?[(n-1)/2]:[n/2-1,n/2];\n $('#chips').innerHTML=s.map((v,i)=>`\u003cspan class=\"${mi.includes(i)?'mid':''}\">${v}\u003c/span>`).join('');\n const K=[[\"Mean\",\"Σx ÷ n\",f(m),\"balance point\"],[\"Median\",\"middle of sorted list\",f(med),\"ignores extremes\"],[\"Mode\",\"most frequent\",mode,\"most popular\"],[\"Range\",\"max − min\",f(s[n-1]-s[0]),\"total spread\"],[\"Variance\",\"Σ(x−mean)² ÷ n\",f(vp),\"avg squared distance\"],[\"Std dev\",\"√variance\",f(sdp),\"typical distance\"],[\"Q1\",\"25% below\",f(q1),\"lower quarter\"],[\"Q3\",\"75% below\",f(q3),\"upper quarter\"],[\"IQR\",\"Q3 − Q1\",f(iq),\"middle 50% spread\"],[\"P\"+p,p+\"% below\",f(pv),\"percentile\"]];\n $('#kk').innerHTML=K.map(k=>`\u003cdiv class=\"k\">\u003csmall>${k[0]}\u003c/small>\u003cb>${k[2]}\u003c/b>\u003csmall>${k[1]}\u003c/small>\u003csmall>${k[3]}\u003c/small>\u003c/div>`).join('');\n $('#smp').textContent=`Sample versions (divide by n−1, what pandas gives): variance ${f(ss/(n-1))}, std dev ${f(sds)}.`;\n /* svg */\n const lo=s[0],sp=(s[n-1]-lo)||1,X=v=>30+(v-lo)/sp*580,lf=q1-1.5*iq,hf=q3+1.5*iq,wl=s.find(v=>v>=lf),wh=[...s].reverse().find(v=>v\u003c=hf),lv={};\n let g=`\u003crect class=\"sd\" x=\"${X(Math.max(lo,m-sdp))}\" y=\"8\" width=\"${X(Math.min(s[n-1],m+sdp))-X(Math.max(lo,m-sdp))}\" height=\"82\"/>\u003cline class=\"ax\" x1=\"20\" y1=\"90\" x2=\"620\" y2=\"90\"/>`;\n s.forEach(v=>{const l=lv[v]=(lv[v]||0)+1;g+=`\u003ccircle class=\"d\" cx=\"${X(v)}\" cy=\"${Math.max(12,84-l*13)}\" r=\"5.5\" style=\"animation-delay:${l*.1}s\"/>`});\n const u=[...new Set(s)];(u.length>12?[s[0],s[n-1]]:u).forEach(v=>g+=`\u003ctext class=\"t\" x=\"${X(v)}\" y=\"116\" text-anchor=\"middle\">${v}\u003c/text>`);\n const lab=(v,tx,c,left)=>`\u003ctext class=\"t\" x=\"${X(v)+(left?-4:4)}\" y=\"10\" text-anchor=\"${left?'end':'start'}\">${tx}\u003c/text>`;\n g+=`\u003cline class=\"ma\" x1=\"${X(m)}\" y1=\"14\" x2=\"${X(m)}\" y2=\"90\"/>\u003cline class=\"me\" x1=\"${X(med)}\" y1=\"14\" x2=\"${X(med)}\" y2=\"90\"/>`+lab(m,'mean '+f(m),'',m\u003c=med)+lab(med,'median '+f(med),'',m>med);\n g+=`\u003cpath d=\"M${X(pv)} 92 l-6 10 h12z\" fill=\"var(--ac2)\"/>`;\n g+=`\u003cline class=\"ax\" x1=\"${X(wl)}\" y1=\"145\" x2=\"${X(q1)}\" y2=\"145\"/>\u003cline class=\"ax\" x1=\"${X(q3)}\" y1=\"145\" x2=\"${X(wh)}\" y2=\"145\"/>\u003cline class=\"ax\" x1=\"${X(wl)}\" y1=\"135\" x2=\"${X(wl)}\" y2=\"155\"/>\u003cline class=\"ax\" x1=\"${X(wh)}\" y1=\"135\" x2=\"${X(wh)}\" y2=\"155\"/>\u003crect class=\"bx\" x=\"${X(q1)}\" y=\"128\" width=\"${Math.max(1,X(q3)-X(q1))}\" height=\"34\"/>\u003cline class=\"me\" x1=\"${X(med)}\" y1=\"128\" x2=\"${X(med)}\" y2=\"162\"/>`;\n s.filter(v=>v\u003clf||v>hf).forEach(v=>g+=`\u003ccircle cx=\"${X(v)}\" cy=\"145\" r=\"5\" fill=\"none\" stroke=\"var(--ac2)\" stroke-width=\"2\"/>`);\n g+=`\u003ctext class=\"t\" x=\"${X(q1)}\" y=\"176\" text-anchor=\"middle\">Q1 ${f(q1)}\u003c/text>\u003ctext class=\"t\" x=\"${X(q3)}\" y=\"176\" text-anchor=\"middle\">Q3 ${f(q3)}\u003c/text>\u003cline class=\"ax\" x1=\"${X(q1)}\" y1=\"184\" x2=\"${X(q3)}\" y2=\"184\"/>\u003ctext class=\"t\" x=\"${(X(q1)+X(q3))/2}\" y=\"198\" text-anchor=\"middle\">IQR = ${f(iq)}\u003c/text>`;\n $('#svg').innerHTML=`\u003csvg viewBox=\"0 0 640 204\" role=\"img\" aria-label=\"Dot plot and box plot\">${g}\u003c/svg>`;\n /* manual */\n $('#man').innerHTML=`\u003cp>\u003cb>Step 1, mean:\u003c/b> (${a.join(' + ')}) ÷ ${n} = ${f(sum(a))} ÷ ${n} = \u003cb>${f(m)}\u003c/b>\u003c/p>\u003ctable>\u003ctr>\u003cth>x\u003c/th>\u003cth>x − mean\u003c/th>\u003cth>(x − mean)²\u003c/th>\u003c/tr>${a.map(x=>`\u003ctr>\u003ctd>${x}\u003c/td>\u003ctd>${f(x-m)}\u003c/td>\u003ctd>${f((x-m)**2)}\u003c/td>\u003c/tr>`).join('')}\u003ctr>\u003ctd>\u003cb>Σ\u003c/b>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003cb>${f(ss)}\u003c/b>\u003c/td>\u003c/tr>\u003c/table>\u003cp>\u003cb>Step 2, variance:\u003c/b> ${f(ss)} ÷ ${n} = \u003cb>${f(vp)}\u003c/b> (sample: ÷ ${n-1} = ${f(ss/(n-1))})\u003c/p>\u003cp>\u003cb>Step 3, std dev:\u003c/b> √${f(vp)} = \u003cb>${f(sdp)}\u003c/b>\u003c/p>\u003cp>\u003cb>Step 4, median:\u003c/b> sorted list has ${n} values, so the ${n%2?'middle one (position '+((n+1)/2)+')':'average of the two middle ones (positions '+n/2+' and '+(n/2+1)+')'} = \u003cb>${f(med)}\u003c/b>\u003c/p>\u003cp>\u003cb>Step 5, quartiles:\u003c/b> position = (n−1) × p. For Q1: ${n-1} × 0.25 = ${f((n-1)*.25)}, so Q1 = \u003cb>${f(q1)}\u003c/b>. For Q3: ${n-1} × 0.75 = ${f((n-1)*.75)}, so Q3 = \u003cb>${f(q3)}\u003c/b>. IQR = ${f(q3)} − ${f(q1)} = \u003cb>${f(iq)}\u003c/b>. Outlier fences: ${f(lf)} and ${f(hf)}.\u003c/p>`;\n}\nfunction rnd(){const a=Array.from({length:8},()=>1+Math.floor(Math.random()*20));$('#inp').value=a.join(', ');run()}\nfunction add(){$('#inp').value=$('#inp').value.trim().replace(/,\\s*$/,'')+', 40';run()}\n$('#inp').addEventListener('keydown',e=>e.key=='Enter'&&run());\nrun();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Day 9-10: Probability, Bayes & Distributions\u003c/title>\n\u003cstyle>\n:root{--bg:#0b0620;--card:rgba(28,16,66,.78);--tx:#f1edff;--mut:#b8b0e8;--a:#a78bfa;--b:#60a5fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml{scroll-padding-top:90px;scroll-behavior:smooth}\nbody{margin:0;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--tx);background:var(--bg);transition:color .4s}\n#bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%}\nheader{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);backdrop-filter:blur(10px);padding:8px 10px;border-bottom:1px solid var(--a)}\n.ths{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}\n.ths button{flex:none;border:1px solid var(--a);background:transparent;color:var(--tx);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:13px}\n.ths button.on{background:var(--a);color:#000;font-weight:700}\nmain{max-width:860px;margin:auto;padding:12px 14px 60px}\nh1{font-size:clamp(26px,6vw,42px);margin:18px 0 4px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}\nh2{margin:34px 0 4px;color:var(--a)}h3{margin:0 0 6px;color:var(--b)}\n.c{background:var(--card);border:1px solid color-mix(in srgb,var(--a) 40%,transparent);border-radius:16px;padding:16px;margin:14px 0;backdrop-filter:blur(8px);opacity:0;transform:translateY(24px);transition:.7s}\n.c.in{opacity:1;transform:none}\n.k{border-left:4px solid var(--b);padding:6px 12px;margin:8px 0;background:color-mix(in srgb,var(--b) 14%,transparent);border-radius:0 10px 10px 0}\n.m{color:var(--mut);font-size:14px}\ncanvas.ch{width:100%;max-width:100%;background:rgba(127,127,127,.08);border-radius:10px}\nbutton.b,select{background:var(--a);color:#000;border:0;border-radius:10px;padding:7px 12px;margin:3px 2px;cursor:pointer;font-weight:600;font-size:14px}\nbutton.b.o{background:transparent;color:var(--tx);border:1px solid var(--a)}\nbutton.b.on{background:var(--b)}\ninput[type=range]{width:min(100%,260px);accent-color:var(--a);vertical-align:middle}\n.row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:6px 0}\n.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}\n.chip{width:44px;height:44px;border-radius:10px;border:2px solid var(--a);display:grid;place-items:center;font-size:22px;font-weight:700;transition:.3s}\n.chip.hit{background:var(--b);color:#000;transform:scale(1.15);box-shadow:0 0 14px var(--b)}\n#die{font-size:64px;line-height:1;display:inline-block}\n.grid10{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;max-width:340px}\n.cell{aspect-ratio:1;border-radius:4px;transition:.4s}\n.big{font-size:22px;font-weight:700;color:var(--b)}\n.sv{width:100%;max-width:520px}.sv text{fill:var(--tx);font-size:15px}.sv line{stroke:var(--a);stroke-width:2}.sv rect{fill:none;stroke:var(--b);stroke-width:2}\ndetails{margin:6px 0;border:1px dashed var(--a);border-radius:10px;padding:6px 10px}summary{cursor:pointer}\ntable{border-collapse:collapse;width:100%;font-size:14px}td,th{border:1px solid color-mix(in srgb,var(--a) 40%,transparent);padding:5px 8px;text-align:left}\ncode{background:rgba(127,127,127,.2);padding:1px 6px;border-radius:5px}\n.lg span{display:inline-block;margin-right:12px;font-size:13px}.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:middle}\n\u003c/style>\u003c/head>\u003cbody>\n\u003ccanvas id=\"bg\">\u003c/canvas>\n\u003cheader>\u003cdiv class=\"ths\" id=\"ths\">\u003c/div>\u003c/header>\n\u003cmain>\n\u003ch1>Day 9 &amp; 10: Probability, Bayes, Distributions\u003c/h1>\n\u003cp class=\"m\">Zero to clear. Play with every widget: tap, slide, simulate. Jump: \u003ca href=\"#d9\" style=\"color:var(--b)\">Day 9\u003c/a> · \u003ca href=\"#d10\" style=\"color:var(--b)\">Day 10\u003c/a> · \u003ca href=\"#cheat\" style=\"color:var(--b)\">Cheat sheet\u003c/a>\u003c/p>\n\n\u003ch2 id=\"d9\">DAY 9: Probability + Bayes\u003c/h2>\n\n\u003cdiv class=\"c\">\u003ch3>1. Probability = chance, as a number 0 to 1\u003c/h3>\n\u003cdiv class=\"k\">\u003cb>P(event) = favourable outcomes ÷ total outcomes\u003c/b> (when all outcomes are equally likely)\u003c/div>\n\u003cp>\u003cb>Sample space\u003c/b> = list of ALL possible outcomes. \u003cb>Event\u003c/b> = any chosen part of it. Pick an event on a die:\u003c/p>\n\u003cdiv class=\"chips\" id=\"sp\">\u003c/div>\n\u003cdiv class=\"row\" id=\"evb\">\u003c/div>\n\u003cdiv id=\"evt\" class=\"big\">\u003c/div>\n\u003cp>Now roll a virtual die and watch the observed bars approach the theory line (Law of Large Numbers):\u003c/p>\n\u003cdiv>\u003cspan id=\"die\">⚀\u003c/span> \u003cspan id=\"rolln\" class=\"m\">\u003c/span>\u003c/div>\n\u003cbutton class=\"b\" onclick=\"roll(1)\">Roll ×1\u003c/button>\u003cbutton class=\"b\" onclick=\"roll(100)\">×100\u003c/button>\u003cbutton class=\"b\" onclick=\"roll(2000)\">×2000\u003c/button>\u003cbutton class=\"b o\" onclick=\"roll(0)\">Reset\u003c/button>\n\u003ccanvas class=\"ch\" id=\"cDice\" width=\"640\" height=\"220\">\u003c/canvas>\n\u003cdiv id=\"obs\" class=\"m\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>2. Independent vs Dependent events\u003c/h3>\n\u003cp>Bag: 🔴🔴🔴🔵🔵 (3 red, 2 blue). Draw two balls. Want P(both red).\u003c/p>\n\u003cdiv class=\"k\">\u003cb>Independent\u003c/b>: first draw does NOT change the second (put the ball back). P(A and B) = P(A)×P(B)\u003cbr>\u003cb>Dependent\u003c/b>: first draw changes the bag (keep the ball out). P(A and B) = P(A)×P(B|A)\u003c/div>\n\u003cbutton class=\"b on\" id=\"rep1\" onclick=\"sim2(true)\">With replacement\u003c/button>\u003cbutton class=\"b\" id=\"rep0\" onclick=\"sim2(false)\">Without replacement\u003c/button>\n\u003cdiv id=\"s2\" class=\"big\">\u003c/div>\u003ccanvas class=\"ch\" id=\"cRep\" width=\"640\" height=\"110\">\u003c/canvas>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>3. Conditional probability: \"given that…\"\u003c/h3>\n\u003cp>100 students. 🟣 Cricket (A) 40, 🟡 Music (B) 30, both 12. Tap a condition to shrink the world:\u003c/p>\n\u003cdiv class=\"row\">\u003cbutton class=\"b on\" onclick=\"cond(0,this)\">Everyone\u003c/button>\u003cbutton class=\"b o\" onclick=\"cond(1,this)\">Given Music (B)\u003c/button>\u003cbutton class=\"b o\" onclick=\"cond(2,this)\">Given Cricket (A)\u003c/button>\u003c/div>\n\u003cdiv class=\"grid10\" id=\"g100\">\u003c/div>\n\u003cdiv class=\"lg\">\u003cspan>\u003ci style=\"background:#22c55e\">\u003c/i>both\u003c/span>\u003cspan>\u003ci style=\"background:#a855f7\">\u003c/i>A only\u003c/span>\u003cspan>\u003ci style=\"background:#eab308\">\u003c/i>B only\u003c/span>\u003cspan>\u003ci style=\"background:#64748b\">\u003c/i>neither\u003c/span>\u003c/div>\n\u003cdiv id=\"ct\" class=\"big\">\u003c/div>\n\u003cdiv class=\"k\">\u003cb>P(A|B) = P(A∩B) ÷ P(B)\u003c/b>: \"among B people only, how many are A?\"\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>4. Bayes theorem: the medical test surprise\u003c/h3>\n\u003cdiv class=\"k\">\u003cb>P(Sick | +) = P(+|Sick)·P(Sick) ÷ P(+)\u003c/b>\u003cbr>Flip a condition around: from \"test is + ⇒ chance of sick\".\u003c/div>\n\u003cp>1000 people. Move sliders, press Run test:\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>Sick people: \u003cb id=\"v1\">1\u003c/b>%\u003cbr>\u003cinput type=\"range\" id=\"pv\" min=\"1\" max=\"30\" value=\"1\">\u003c/label>\n\u003clabel>Sensitivity (sick → +): \u003cb id=\"v2\">99\u003c/b>%\u003cbr>\u003cinput type=\"range\" id=\"se\" min=\"50\" max=\"100\" value=\"99\">\u003c/label>\n\u003clabel>False alarm (healthy → +): \u003cb id=\"v3\">5\u003c/b>%\u003cbr>\u003cinput type=\"range\" id=\"fp\" min=\"0\" max=\"30\" value=\"5\">\u003c/label>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cB\" width=\"600\" height=\"240\">\u003c/canvas>\n\u003cdiv class=\"lg\">\u003cspan>\u003ci style=\"background:#ef4444\">\u003c/i>sick &amp; +\u003c/span>\u003cspan>\u003ci style=\"background:#f59e0b\">\u003c/i>sick &amp; −\u003c/span>\u003cspan>\u003ci style=\"background:#facc15\">\u003c/i>healthy &amp; + (false alarm)\u003c/span>\u003cspan>\u003ci style=\"background:#64748b\">\u003c/i>healthy &amp; −\u003c/span>\u003c/div>\n\u003cbutton class=\"b\" onclick=\"runB()\">▶ Run test\u003c/button>\n\u003cdiv id=\"bt\" class=\"big\">\u003c/div>\n\u003cp class=\"m\">Even with a 99% accurate test, if the disease is rare, most positives are false alarms. Raise \"Sick people\" and watch the answer climb.\u003c/p>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>✍ Day 9: solve 5 questions manually (tap to check)\u003c/h3>\n\u003cdetails>\u003csummary>Q1. Two dice rolled. P(sum = 7)?\u003c/summary>Favourable: (1,6)(2,5)(3,4)(4,3)(5,2)(6,1) = 6. Total = 36. \u003cb>P = 6/36 = 1/6\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q2. One card from 52. P(King or Heart)?\u003c/summary>Kings 4 + Hearts 13 − King of Hearts counted twice 1 = 16. \u003cb>P = 16/52 = 4/13\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q3. Independent A, B. P(A)=0.5, P(B)=0.4. Find P(A∩B) and P(A∪B).\u003c/summary>P(A∩B)=0.5×0.4=\u003cb>0.2\u003c/b>. P(A∪B)=0.5+0.4−0.2=\u003cb>0.7\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q4. Bag 4 red, 6 blue. Draw 2 without replacement. P(both blue)?\u003c/summary>6/10 × 5/9 = 30/90 = \u003cb>1/3\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q5. Machine A makes 60% items (2% defective), B makes 40% (5% defective). A defective item: P(from A)?\u003c/summary>P(D)=0.6×0.02+0.4×0.05=0.012+0.020=0.032. Bayes: 0.012/0.032 = \u003cb>0.375\u003c/b>\u003c/details>\u003c/div>\n\n\u003ch2 id=\"d10\">DAY 10: Distributions\u003c/h2>\n\n\u003cdiv class=\"c\">\u003ch3>5. Random variable (RV) = a number from a random outcome\u003c/h3>\n\u003cp>Flip 2 coins. Let \u003cb>X = number of heads\u003c/b>. It maps outcomes to numbers:\u003c/p>\n\u003csvg class=\"sv\" viewBox=\"0 0 520 190\">\u003ctext x=\"20\" y=\"20\">Outcome\u003c/text>\u003ctext x=\"400\" y=\"20\">X\u003c/text>\n\u003ctext x=\"30\" y=\"55\">HH\u003c/text>\u003ctext x=\"30\" y=\"95\">HT\u003c/text>\u003ctext x=\"30\" y=\"135\">TH\u003c/text>\u003ctext x=\"30\" y=\"175\">TT\u003c/text>\n\u003cline x1=\"80\" y1=\"50\" x2=\"390\" y2=\"170\"/>\u003cline x1=\"80\" y1=\"90\" x2=\"390\" y2=\"105\"/>\u003cline x1=\"80\" y1=\"130\" x2=\"390\" y2=\"105\"/>\u003cline x1=\"80\" y1=\"170\" x2=\"390\" y2=\"45\"/>\n\u003crect x=\"385\" y=\"30\" width=\"40\" height=\"30\" rx=\"6\"/>\u003crect x=\"385\" y=\"90\" width=\"40\" height=\"30\" rx=\"6\"/>\u003crect x=\"385\" y=\"155\" width=\"40\" height=\"30\" rx=\"6\"/>\n\u003ctext x=\"400\" y=\"52\">2\u003c/text>\u003ctext x=\"400\" y=\"112\">1\u003c/text>\u003ctext x=\"400\" y=\"177\">0\u003c/text>\u003c/svg>\n\u003cdiv class=\"k\">\u003cb>Discrete RV\u003c/b>: countable values (0,1,2…) → uses \u003cb>PMF\u003c/b>. \u003cb>Continuous RV\u003c/b>: any value in a range (height, time) → uses \u003cb>PDF\u003c/b>.\u003c/div>\n\u003ctable>\u003ctr>\u003cth>Name\u003c/th>\u003cth>Meaning\u003c/th>\u003cth>Picture\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>PMF\u003c/b>\u003c/td>\u003ctd>P(X = x) exactly, for discrete\u003c/td>\u003ctd>bars; heights add to 1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>PDF\u003c/b>\u003c/td>\u003ctd>density, for continuous. P(a&lt;X&lt;b) = AREA\u003c/td>\u003ctd>smooth curve; total area 1\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cb>CDF\u003c/b>\u003c/td>\u003ctd>P(X ≤ x): running total\u003c/td>\u003ctd>staircase / S-curve, rises 0→1\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>6. Bernoulli: one try, two results\u003c/h3>\n\u003cp>Success (1) with probability p, failure (0) with 1−p. One coin flip, one free-throw.\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>p = \u003cb id=\"bp\">0.6\u003c/b> \u003cinput type=\"range\" id=\"bps\" min=\"0\" max=\"1\" step=\"0.05\" value=\"0.6\">\u003c/label>\n\u003cbutton class=\"b\" onclick=\"flipB(1000)\">Flip ×1000\u003c/button>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cBe\" width=\"640\" height=\"170\">\u003c/canvas>\n\u003cdiv class=\"k\">Mean = \u003cb>p\u003c/b> · Variance = \u003cb>p(1−p)\u003c/b>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>7. Binomial: n Bernoulli tries, count the successes\u003c/h3>\n\u003cp>P(X = k) = C(n,k)·p\u003csup>k\u003c/sup>·(1−p)\u003csup>n−k\u003c/sup>. Example: 10 coin flips, how many heads?\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>n = \u003cb id=\"bn\">10\u003c/b> \u003cinput type=\"range\" id=\"nS\" min=\"1\" max=\"40\" value=\"10\">\u003c/label>\n\u003clabel>p = \u003cb id=\"bpp\">0.5\u003c/b> \u003cinput type=\"range\" id=\"pS\" min=\"0.05\" max=\"0.95\" step=\"0.05\" value=\"0.5\">\u003c/label>\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"b on\" id=\"mP\" onclick=\"bm('pmf')\">PMF\u003c/button>\u003cbutton class=\"b o\" id=\"mC\" onclick=\"bm('cdf')\">CDF\u003c/button>\u003cbutton class=\"b\" onclick=\"simBin()\">Simulate 1000 experiments\u003c/button>\u003cbutton class=\"b o\" onclick=\"sb=null;drawBin()\">Clear\u003c/button>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cBin\" width=\"640\" height=\"250\">\u003c/canvas>\n\u003cdiv id=\"binT\" class=\"m\">\u003c/div>\n\u003cdiv class=\"k\">Mean = \u003cb>np\u003c/b> · Variance = \u003cb>np(1−p)\u003c/b>\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>8. Normal distribution: the bell curve\u003c/h3>\n\u003cp>Heights, marks, errors. Centre = mean μ, width = std. deviation σ. Total area = 1.\u003c/p>\n\u003cdiv class=\"row\">\u003clabel>μ = \u003cb id=\"nm\">50\u003c/b> \u003cinput type=\"range\" id=\"mS\" min=\"20\" max=\"80\" value=\"50\">\u003c/label>\n\u003clabel>σ = \u003cb id=\"ns\">10\u003c/b> \u003cinput type=\"range\" id=\"sS\" min=\"5\" max=\"20\" value=\"10\">\u003c/label>\u003c/div>\n\u003cdiv class=\"row\">\u003clabel>x = \u003cb id=\"nx\">60\u003c/b> \u003cinput type=\"range\" id=\"xS\" min=\"0\" max=\"100\" value=\"60\">\u003c/label>\u003c/div>\n\u003cdiv class=\"row\">\u003cbutton class=\"b o\" onclick=\"nk(1)\">±1σ\u003c/button>\u003cbutton class=\"b o\" onclick=\"nk(2)\">±2σ\u003c/button>\u003cbutton class=\"b o\" onclick=\"nk(3)\">±3σ\u003c/button>\u003c/div>\n\u003ccanvas class=\"ch\" id=\"cN\" width=\"640\" height=\"250\">\u003c/canvas>\n\u003cdiv id=\"nT\" class=\"big\">\u003c/div>\n\u003cdiv class=\"k\">68–95–99.7 rule: about 68% within ±1σ, 95% within ±2σ, 99.7% within ±3σ.\u003cbr>The shaded area up to x is the \u003cb>CDF\u003c/b> value Φ(x).\u003c/div>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>9. Mean &amp; Variance\u003c/h3>\n\u003cdiv class=\"k\">\u003cb>Mean E[X] = Σ x·P(x)\u003c/b> (balance point) · \u003cb>Var = Σ (x−μ)²·P(x) = E[X²] − μ²\u003c/b> (spread) · \u003cb>σ = √Var\u003c/b>\u003c/div>\n\u003cp>Fair die: E = (1+2+3+4+5+6)/6 = \u003cb>3.5\u003c/b>. E[X²] = 91/6. Var = 91/6 − 12.25 = \u003cb>35/12 ≈ 2.92\u003c/b>.\u003c/p>\n\u003ctable>\u003ctr>\u003cth>Dist.\u003c/th>\u003cth>Mean\u003c/th>\u003cth>Variance\u003c/th>\u003c/tr>\u003ctr>\u003ctd>Bernoulli(p)\u003c/td>\u003ctd>p\u003c/td>\u003ctd>p(1−p)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Binomial(n,p)\u003c/td>\u003ctd>np\u003c/td>\u003ctd>np(1−p)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Normal(μ,σ²)\u003c/td>\u003ctd>μ\u003c/td>\u003ctd>σ²\u003c/td>\u003c/tr>\u003c/table>\u003c/div>\n\n\u003cdiv class=\"c\">\u003ch3>✍ Day 10: practice (tap to check)\u003c/h3>\n\u003cdetails>\u003csummary>Q1. Bernoulli p = 0.3. Mean and variance?\u003c/summary>Mean 0.3. Var 0.3×0.7 = \u003cb>0.21\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q2. Binomial n=5, p=0.5. P(X=2)?\u003c/summary>C(5,2)=10. 10×0.5²×0.5³ = 10/32 = \u003cb>0.3125\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q3. Binomial n=10, p=0.1. Mean, variance?\u003c/summary>np = \u003cb>1\u003c/b>. np(1−p) = \u003cb>0.9\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q4. Normal μ=50, σ=10. P(40 &lt; X &lt; 60)?\u003c/summary>That is μ±1σ → \u003cb>≈ 0.68\u003c/b>\u003c/details>\n\u003cdetails>\u003csummary>Q5. PMF: P(1)=0.2, P(2)=k, P(3)=0.5. Find k and E[X].\u003c/summary>Sum=1 → k=\u003cb>0.3\u003c/b>. E = 1(0.2)+2(0.3)+3(0.5) = \u003cb>2.3\u003c/b>\u003c/details>\u003c/div>\n\n\u003cdiv class=\"c\" id=\"cheat\">\u003ch3>⚡ Quick revision cheat sheet\u003c/h3>\n\u003ctable>\u003ctr>\u003ctd>P(A)\u003c/td>\u003ctd>favourable / total\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Complement\u003c/td>\u003ctd>P(not A) = 1 − P(A)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Union\u003c/td>\u003ctd>P(A∪B) = P(A)+P(B)−P(A∩B)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Independent\u003c/td>\u003ctd>P(A∩B) = P(A)P(B)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Conditional\u003c/td>\u003ctd>P(A|B) = P(A∩B)/P(B)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Bayes\u003c/td>\u003ctd>P(A|B) = P(B|A)P(A)/P(B)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Discrete / Continuous\u003c/td>\u003ctd>PMF bars / PDF area; CDF = P(X ≤ x)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Binomial\u003c/td>\u003ctd>C(n,k)p\u003csup>k\u003c/sup>(1−p)\u003csup>n−k\u003c/sup>; mean np; var np(1−p)\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Normal\u003c/td>\u003ctd>68–95–99.7 rule\u003c/td>\u003c/tr>\u003c/table>\n\u003cp class=\"m\">Python next: \u003ccode>scipy.stats.binom.pmf(k,n,p)\u003c/code>, \u003ccode>norm.cdf(x,mu,sigma)\u003c/code>, \u003ccode>np.random.binomial\u003c/code>.\u003c/p>\u003c/div>\n\u003c/main>\n\u003cscript>\nconst $=i=>document.getElementById(i),col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();\n/* THEMES */\nconst T={galaxy:['🌌 Galaxy','#0b0620','rgba(28,16,66,.78)','#f1edff','#b8b0e8','#a78bfa','#60a5fa'],\nhole:['🕳 Black Hole','#050505','rgba(22,12,6,.82)','#fff3e6','#d9b99a','#ff9a3c','#ffe2b0'],\nnova:['💥 Supernova','#1a0505','rgba(54,12,8,.8)','#fff0e0','#f0b8a0','#ff5a2c','#ffd23c'],\naurora:['🌿 Aurora','#03130f','rgba(6,44,38,.78)','#eafff8','#9fd8c8','#2ee6a6','#2cc6d8'],\nneon:['🌆 Cyberpunk','#0a0612','rgba(22,10,40,.82)','#f6eaff','#c4a3e6','#ff2bd6','#18f0ff'],\nocean:['🌊 Deep Ocean','#021426','rgba(4,38,70,.78)','#e6f6ff','#9cc8e6','#38bdf8','#2dd4bf'],\nsunset:['🌇 Sunset Retro','#2a0f3a','rgba(70,22,60,.78)','#fff1e6','#f5c6b8','#ff8a3d','#ff5fa2'],\npaper:['📄 Light Paper','#f6f3ea','rgba(255,255,255,.9)','#1f2430','#555b6b','#4f46e5','#0d9488']};\nlet mode='galaxy';\nObject.keys(T).forEach(k=>{const b=document.createElement('button');b.textContent=T[k][0];b.onclick=()=>setT(k);b.id='t_'+k;$('ths').appendChild(b)});\nfunction setT(k){mode=k;const v=T[k],s=document.documentElement.style;['bg','card','tx','mut','a','b'].forEach((n,i)=>s.setProperty('--'+n,v[i+1]));\ndocument.querySelectorAll('.ths button').forEach(b=>b.classList.toggle('on',b.id=='t_'+k));initP();redraw()}\n/* BACKGROUND */\nconst bg=$('bg'),g=bg.getContext('2d');let W,H,P=[],t=0;\nfunction initP(){P=[];const n={stars:150,hole:260,nova:170,bubbles:50}[mode]||60;for(let i=0;i\u003cn;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random(),a:Math.random()*6.28,d:70+Math.random()*Math.min(W,H)*.5})}\nfunction rs(){W=bg.width=innerWidth;H=bg.height=innerHeight;initP()}addEventListener('resize',rs);\nfunction lg(y0,y1,st){const q=g.createLinearGradient(0,y0,0,y1);st.forEach((c,i)=>q.addColorStop(i/(st.length-1),c));return q}\nfunction loop(){t+=.016;const cx=W/2,cy=H/2;g.globalCompositeOperation='source-over';\nif(mode=='galaxy'){const q=g.createRadialGradient(W*.3,H*.3,0,W*.5,H*.5,W);q.addColorStop(0,'#3a1a7a');q.addColorStop(.5,'#0f0a3a');q.addColorStop(1,'#050314');g.fillStyle=q;g.fillRect(0,0,W,H);\nP.forEach(p=>{g.globalAlpha=.4+.6*Math.abs(Math.sin(t*2+p.a));g.fillStyle='#fff';g.fillRect(p.x,p.y,p.r*2+.5,p.r*2+.5)})}\nelse if(mode=='hole'){g.fillStyle='#030303';g.fillRect(0,0,W,H);const q=g.createRadialGradient(cx,cy,30,cx,cy,260);q.addColorStop(0,'rgba(255,200,120,.5)');q.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=q;g.fillRect(0,0,W,H);\nP.forEach(p=>{const a=p.a+t*90/p.d,x=cx+Math.cos(a)*p.d*1.2,y=cy+Math.sin(a)*p.d*.3;g.globalAlpha=.8;g.fillStyle=`hsl(${25+Math.min(30,2000/p.d)},100%,${60+20*Math.sin(a)}%)`;g.fillRect(x,y,2.2,2.2)});\ng.globalAlpha=1;g.fillStyle='#000';g.beginPath();g.arc(cx,cy,42,0,7);g.fill();g.strokeStyle='#ffd9a0';g.lineWidth=2;g.stroke()}\nelse if(mode=='nova'){g.fillStyle='#1a0505';g.fillRect(0,0,W,H);const M=Math.max(W,H)*.6;P.forEach(p=>{const r=(t*60*(.3+p.r)+p.d)%M,x=cx+Math.cos(p.a)*r,y=cy+Math.sin(p.a)*r;g.globalAlpha=1-r/M;g.fillStyle=`hsl(${55-r/M*55},100%,55%)`;g.beginPath();g.arc(x,y,1+p.r*3,0,7);g.fill()})}\nelse if(mode=='aurora'){g.fillStyle='#03130f';g.fillRect(0,0,W,H);g.globalCompositeOperation='lighter';g.globalAlpha=1;\nfor(let k=0;k\u003c3;k++){const y0=H*.15+k*50;g.fillStyle=lg(y0,y0+260,['rgba(0,0,0,0)',k%2?'rgba(44,198,216,.28)':'rgba(46,230,166,.3)','rgba(0,0,0,0)']);g.beginPath();g.moveTo(0,y0);\nfor(let x=0;x\u003c=W;x+=14)g.lineTo(x,y0+Math.sin(x*.004+t*.6+k*2)*60);for(let x=W;x>=0;x-=14)g.lineTo(x,y0+200+Math.sin(x*.007+t*.8+k)*50);g.fill()}\ng.globalCompositeOperation='source-over';g.fillStyle='#fff';P.forEach(p=>{g.globalAlpha=.3+.3*Math.sin(t+p.a);g.fillRect(p.x,p.y*.5,1.5,1.5)})}\nelse if(mode=='neon'){g.fillStyle='#0a0612';g.fillRect(0,0,W,H);const hz=H*.55;g.globalAlpha=1;const q=g.createRadialGradient(cx,hz,0,cx,hz,130);q.addColorStop(0,'#ff2bd6');q.addColorStop(1,'rgba(255,43,214,0)');g.fillStyle=q;g.fillRect(0,hz-140,W,140);\ng.lineWidth=1.2;g.strokeStyle='#18f0ff';g.globalAlpha=.55;for(let i=-24;i\u003c=24;i++){g.beginPath();g.moveTo(cx+i*14,hz);g.lineTo(cx+i*W*.1,H);g.stroke()}\ng.strokeStyle='#ff2bd6';for(let j=0;j\u003c12;j++){const y=hz+(((j+t*.6)%12)/12)**2*(H-hz);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}}\nelse if(mode=='ocean'){g.fillStyle=lg(0,H,['#04406a','#021426','#010a14']);g.fillRect(0,0,W,H);P.forEach(p=>{const y=((p.y-t*(15+p.r*40))%H+H)%H,x=p.x+Math.sin(t+p.a)*15,r=3+p.r*14;g.globalAlpha=.5;g.strokeStyle='#5eead4';g.lineWidth=1.3;g.beginPath();g.arc(x,y,r,0,7);g.stroke();g.globalAlpha=.1;g.fillStyle='#38bdf8';g.fill()})}\nelse if(mode=='sunset'){g.fillStyle=lg(0,H,['#2a0f3a','#c2306b','#ff8a3d']);g.fillRect(0,0,W,H);const q=g.createRadialGradient(cx,H*.68,10,cx,H*.68,180);q.addColorStop(0,'rgba(255,230,150,.95)');q.addColorStop(.4,'rgba(255,140,60,.5)');q.addColorStop(1,'rgba(255,100,100,0)');g.fillStyle=q;g.fillRect(0,0,W,H);P.forEach(p=>{g.globalAlpha=.5;g.fillStyle='#fff';g.fillRect((p.x+t*10*p.r)%W,p.y*.5,2,2)})}\nelse{g.fillStyle='#f6f3ea';g.fillRect(0,0,W,H);P.forEach(p=>{g.globalAlpha=.12;g.fillStyle='#4f46e5';g.beginPath();g.arc((p.x+t*8*p.r)%W,(p.y+Math.sin(t+p.a)*10),2+p.r*4,0,7);g.fill()})}\ng.globalAlpha=1;requestAnimationFrame(loop)}\n/* HELPERS */\nfunction C(id){const c=$(id),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);return[x,c.width,c.height]}\nfunction bars(id,v,o={}){const[x,w,h]=C(id),n=v.length,m=Math.max(...v,o.max||0,1e-9),pw=w-50,bw=pw/n;x.font='13px system-ui';\nv.forEach((y,i)=>{const bh=(h-45)*y/m,bx=40+i*bw+bw*.1,by=h-28-bh;x.fillStyle=o.hl&&o.hl(i)?col('--b'):col('--a');x.globalAlpha=.9;x.fillRect(bx,by,bw*.8,bh);x.globalAlpha=1;x.fillStyle=col('--tx');x.textAlign='center';\nif(n\u003c=21)x.fillText(o.lab?o.lab[i]:i,bx+bw*.4,h-10);if(n\u003c=12)x.fillText(y.toFixed(2),bx+bw*.4,by-4)});\nif(o.line){const ly=h-28-(h-45)*o.line/m;x.strokeStyle=col('--tx');x.setLineDash([6,5]);x.beginPath();x.moveTo(40,ly);x.lineTo(w-8,ly);x.stroke();x.setLineDash([])}\nif(o.dots)o.dots.forEach((y,i)=>{x.strokeStyle=col('--tx');x.lineWidth=2;x.beginPath();x.arc(40+i*bw+bw*.5,h-28-(h-45)*y/m,Math.min(7,bw*.3),0,7);x.stroke()});\nreturn[x,w,h]}\nconst erf=z=>{const s=Math.sign(z);z=Math.abs(z);const t=1/(1+.3275911*z);return s*(1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-z*z))};\nconst Phi=z=>.5*(1+erf(z/Math.SQRT2));\n/* 1 DICE */\nconst ev={'Even':[2,4,6],'Odd':[1,3,5],'> 4':[5,6],'Prime':[2,3,5],'≤ 2':[1,2]};let cur='Even',cnt=[0,0,0,0,0,0],N=0;\nfor(let i=1;i\u003c=6;i++)$('sp').insertAdjacentHTML('beforeend',`\u003cdiv class=\"chip\" id=\"ch${i}\">${i}\u003c/div>`);\nObject.keys(ev).forEach(k=>{const b=document.createElement('button');b.className='b o';b.textContent=k;b.onclick=()=>{cur=k;dice()};$('evb').appendChild(b)});\nfunction dice(){[...$('evb').children].forEach(b=>b.classList.toggle('on',b.textContent==cur));const e=ev[cur];for(let i=1;i\u003c=6;i++)$('ch'+i).classList.toggle('hit',e.includes(i));\n$('evt').textContent=`P(${cur}) = ${e.length}/6 = ${(e.length/6).toFixed(3)}`;const f=cnt.map(c=>N?c/N:0);bars('cDice',f,{max:.34,line:1/6,lab:[1,2,3,4,5,6],hl:i=>e.includes(i+1)});\n$('rolln').textContent=N?`rolls: ${N}`:'';const hit=cnt.reduce((s,c,i)=>s+(e.includes(i+1)?c:0),0);$('obs').textContent=N?`Observed P(${cur}) = ${(hit/N).toFixed(3)} vs theory ${(e.length/6).toFixed(3)}. Dashed line = 1/6.`:'Press Roll. Dashed line = theory (1/6 each).'}\nfunction roll(n){if(!n){cnt=[0,0,0,0,0,0];N=0;return dice()}let r;for(let i=0;i\u003cn;i++){r=Math.floor(Math.random()*6);cnt[r]++;N++}$('die').textContent='⚀⚁⚂⚃⚄⚅'[r];dice()}\n/* 2 REPLACEMENT */\nfunction sim2(rep){$('rep1').classList.toggle('on',rep);$('rep0').classList.toggle('on',!rep);let h=0;const T=5000;\nfor(let i=0;i\u003cT;i++){const a=Math.floor(Math.random()*5);let b=Math.floor(Math.random()*5);if(!rep)while(b==a)b=Math.floor(Math.random()*5);if(a\u003c3&&b\u003c3)h++}\nconst th=rep?9/25:6/20;$('s2').textContent=`${rep?'3/5 × 3/5':'3/5 × 2/4'} = ${th.toFixed(2)}  |  simulated: ${(h/T).toFixed(3)}`;\nconst[x,w,hh]=C('cRep');x.fillStyle=col('--a');x.fillRect(0,40,w*th,30);x.strokeStyle=col('--tx');x.strokeRect(0,40,w,30);x.fillStyle=col('--b');x.fillRect(0,80,w*h/T,16);x.fillStyle=col('--tx');x.font='13px system-ui';x.fillText('theory',4,32);x.fillText('simulation of 5000 draws',4,108)}\n/* 3 CONDITIONAL */\nconst g100=$('g100');for(let i=0;i\u003c100;i++){const d=document.createElement('div');d.className='cell';d.style.background=i\u003c12?'#22c55e':i\u003c40?'#a855f7':i\u003c58?'#eab308':'#64748b';g100.appendChild(d)}\nconst inA=i=>i\u003c40,inB=i=>i\u003c12||(i>=40&&i\u003c58);\nfunction cond(m,b){document.querySelectorAll('#g100~.row,.c .row button').forEach(()=>{});b.parentNode.querySelectorAll('button').forEach(x=>x.className='b o');b.className='b on';\n[...g100.children].forEach((c,i)=>c.style.opacity=m==0||(m==1&&inB(i))||(m==2&&inA(i))?1:.12);\n$('ct').textContent=m==0?'P(A) = 40/100 = 0.40':m==1?'P(A|B) = 12/30 = 0.40 (B has 30 people)':'P(B|A) = 12/40 = 0.30 (A has 40 people)'}\n/* 4 BAYES */\nlet rv=1;function bayes(){const pv=+$('pv').value,se=+$('se').value,fp=+$('fp').value;$('v1').textContent=pv;$('v2').textContent=se;$('v3').textContent=fp;\nconst S=Math.round(10*pv),TP=Math.round(S*se/100),FN=S-TP,Hh=1000-S,FP=Math.round(Hh*fp/100),TN=Hh-FP;const cs=['#ef4444','#f59e0b','#facc15','#64748b'],ar=[TP,FN,FP,TN];\nconst[x]=C('cB');let k=0,lim=Math.round(rv*1000);ar.forEach((n,j)=>{for(let q=0;q\u003cn;q++,k++){x.fillStyle=k\u003clim?cs[j]:'rgba(127,127,127,.2)';x.fillRect(5+(k%50)*11.8,4+Math.floor(k/50)*11.8,9.6,9.6)}});\n$('bt').innerHTML=`Positives: ${TP}+${FP} = ${TP+FP} → P(sick|+) = ${TP}/${TP+FP} = ${TP+FP?(100*TP/(TP+FP)).toFixed(1):0}%`}\n['pv','se','fp'].forEach(i=>$(i).oninput=()=>{rv=1;bayes()});\nfunction runB(){rv=0;const f=()=>{rv+=.03;bayes();if(rv\u003c1)requestAnimationFrame(f);else rv=1};f()}\n/* 6 BERNOULLI */\nlet bc=null;function bern(){const p=+$('bps').value;$('bp').textContent=p.toFixed(2);const[x,w,h]=bars('cBe',[1-p,p],{max:1,lab:['0 (fail)','1 (success)']});\nif(bc){x.fillStyle=col('--tx');x.font='13px system-ui';x.textAlign='left';x.fillText(`1000 flips: ${bc} successes = ${(bc/1000).toFixed(3)} (theory p)`,50,16)}}\nfunction flipB(n){const p=+$('bps').value;bc=0;for(let i=0;i\u003cn;i++)if(Math.random()\u003cp)bc++;bern()}$('bps').oninput=()=>{bc=null;bern()};\n/* 7 BINOMIAL */\nlet bmode='pmf',sb=null;const pm=(n,k,p)=>{let c=1;for(let i=1;i\u003c=k;i++)c*=(n-k+i)/i;return c*p**k*(1-p)**(n-k)};\nfunction bm(m){bmode=m;$('mP').className='b '+(m=='pmf'?'on':'o');$('mC').className='b '+(m=='cdf'?'on':'o');drawBin()}\nfunction drawBin(){const n=+$('nS').value,p=+$('pS').value;$('bn').textContent=n;$('bpp').textContent=p.toFixed(2);let v=[];for(let k=0;k\u003c=n;k++)v.push(pm(n,k,p));\nif(bmode=='cdf'){let s=0;v=v.map(y=>s+=y)}const d=sb?(bmode=='cdf'?sb.map((_,i)=>sb.slice(0,i+1).reduce((a,b)=>a+b,0)):sb):null;\nbars('cBin',v,{dots:d,max:bmode=='cdf'?1:0});$('binT').textContent=`Bars = ${bmode.toUpperCase()} theory${sb?', circles = 1000 simulated experiments':''}. Mean np = ${(n*p).toFixed(2)}, Var = ${(n*p*(1-p)).toFixed(2)}`}\nfunction simBin(){const n=+$('nS').value,p=+$('pS').value,c=new Array(n+1).fill(0);for(let i=0;i\u003c1000;i++){let k=0;for(let j=0;j\u003cn;j++)if(Math.random()\u003cp)k++;c[k]++}sb=c.map(x=>x/1000);drawBin()}\n$('nS').oninput=()=>{sb=null;drawBin()};$('pS').oninput=()=>{sb=null;drawBin()};\n/* 8 NORMAL */\nlet kmode=0;function nk(k){kmode=k;drawN()}\nfunction drawN(){const mu=+$('mS').value,sg=+$('sS').value,xv=+$('xS').value;$('nm').textContent=mu;$('ns').textContent=sg;$('nx').textContent=xv;\nconst lo=kmode?mu-kmode*sg:-1e9,hi=kmode?mu+kmode*sg:xv,[x,w,h]=C('cN'),X=v=>20+v/100*(w-40),Y=v=>h-28-v/.082*(h-50),f=v=>Math.exp(-((v-mu)**2)/(2*sg*sg))/(sg*Math.sqrt(2*Math.PI));\nx.beginPath();x.moveTo(X(Math.max(0,lo)),Y(0));for(let v=Math.max(0,lo);v\u003c=Math.min(100,hi);v+=.5)x.lineTo(X(v),Y(f(v)));x.lineTo(X(Math.min(100,hi)),Y(0));x.closePath();x.fillStyle=col('--b');x.globalAlpha=.55;x.fill();x.globalAlpha=1;\nx.beginPath();for(let v=0;v\u003c=100;v+=.5)v?x.lineTo(X(v),Y(f(v))):x.moveTo(X(v),Y(f(v)));x.strokeStyle=col('--a');x.lineWidth=3;x.stroke();\nx.fillStyle=col('--tx');x.font='12px system-ui';x.textAlign='center';for(let v=0;v\u003c=100;v+=10)x.fillText(v,X(v),h-10);\nx.strokeStyle=col('--tx');x.setLineDash([5,4]);x.lineWidth=1;x.beginPath();x.moveTo(X(mu),Y(0));x.lineTo(X(mu),Y(f(mu)));x.stroke();x.setLineDash([]);\nconst a=Phi((hi-mu)/sg)-Phi((lo-mu)/sg);$('nT').textContent=kmode?`Area within ±${kmode}σ = ${(a*100).toFixed(1)}%`:`CDF: P(X ≤ ${xv}) = ${(a*100).toFixed(1)}%`}\n['mS','sS'].forEach(i=>$(i).oninput=drawN);$('xS').oninput=()=>{kmode=0;drawN()};\nfunction redraw(){dice();bayes();bern();drawBin();drawN();if($('s2').textContent)sim2($('rep1').classList.contains('on'))}\n/* INIT */\nnew IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')),{threshold:.08}).observe&&document.querySelectorAll('.c').forEach(c=>{new IntersectionObserver((es,o)=>{if(es[0].isIntersecting){c.classList.add('in');o.disconnect()}},{threshold:.05}).observe(c)});\nrs();setT('galaxy');sim2(true);cond(0,document.querySelector('#g100').previousElementSibling.firstElementChild);loop();\n\u003c/script>\u003c/body>\u003c/html>\n", "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Day 11-12: Linear Algebra for ML\u003c/title>\n\u003cstyle>\n:root{--bg:#0b0620;--card:rgba(28,16,66,.78);--tx:#f1edff;--mut:#b8b0e8;--a:#a78bfa;--b:#60a5fa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\nhtml{scroll-padding-top:90px;scroll-behavior:smooth}\nbody{margin:0;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--tx);background:var(--bg)}\n#bg{position:fixed;inset:0;z-index:-1;width:100%;height:100%}\nheader{position:sticky;top:env(safe-a
